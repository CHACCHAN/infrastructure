# k3s VM群を宣言から一気通貫でKubernetesクラスタへ収束させるPlaybook。
# 実行例: ansible-playbook playbooks/vm/k3s.yml
---
# 0. AWXのSurveyなど、鍵を本文で受け取った場合に一時ファイルへ書き出す
- name: 接続用の秘密鍵を用意する
  ansible.builtin.import_playbook: ssh_key.yml

# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../pve/provision.yml
  vars:
    target: k8s
    profile_expected: k8s

# 2. VM内部: SSHでコントロールプレーンから順にセットアップ
- name: k3sをセットアップする
  hosts: "{{ target | default('k8s', true) }}"
  gather_facts: false
  # ワーカーは先行するコントロールプレーンから参加トークンを取得する。
  # inventory/hosts.ymlの記載順を維持し、必ず1台ずつ処理する。
  order: inventory
  serial: 1
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey_resolved }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    # 明示役割を優先し、役割の指定が無いインベントリでは「先頭=server」へフォールバックする。
    # k8sグループが無い実行(手動インベントリ等)ではフォールバック材料が無いため、
    # -e k3s_role= の明示を前提にする(下のpre-flight検証で不足を知らせる)。
    kubernetes_node_role: >-
      {{ k3s_role
         | default('server' if ('k8s' in groups and groups['k8s'] | length > 0
                                and inventory_hostname == groups['k8s'][0])
                   else 'agent') }}
    # トークン取得用SSHは管理ネットワーク、k3s APIは占有ネットワークを使う。
    kubernetes_node_ip: "{{ cluster_ip | regex_replace('/.*$', '') }}"
    kubernetes_server_ssh_user: "{{ hostvars[kubernetes_server_inventory_host].pve_ssh_user }}"
    # コントロールプレーンへの接続鍵。k8sグループが届かない実行では自分の接続鍵を使う。
    kubernetes_server_ssh_prikey: >-
      {{ hostvars[kubernetes_server_inventory_host].pve_ssh_prikey_resolved
         if kubernetes_server_inventory_host is defined
         else pve_ssh_prikey_resolved }}
  pre_tasks:
    # kubernetes_server_* は inventory/group_vars/k8s.yml が groups/hostvars から
    # 導出する。k8sグループが届かない実行では解決できないが、同じ変数名を
    # -e/Survey で渡せば extra vars が優先され、未解決のhostvars参照は評価
    # されない(実行方式で実装を分岐させないための前提)。どちらも無い場合は
    # 接続段階の難解なundefinedエラーになる前に、不足する名前を列挙して止める。
    - name: コントロールプレーン接続情報が解決できることを確認する
      ansible.builtin.assert:
        that:
          - kubernetes_node_role in ['server', 'agent']
          - kubernetes_preflight_missing_vars | length == 0
        fail_msg: >-
          {{ inventory_hostname }}:
          {{ kubernetes_preflight_missing_vars | join(' / ') }} が解決できません。
          インベントリ実行では inventory/hosts.yml のk8sグループと
          inventory/group_vars/k8s.yml を確認してください。インベントリの
          k8sグループが無い実行では -e k3s_role=server|agent に加えて
          -e kubernetes_server_ip=(コントロールプレーンの管理IP)
          -e kubernetes_server_ssh_user= を指定し、クラスタ網は -e ip2=<CIDR> で渡します。
          秘密鍵は接続に使う鍵と同じものを使い、別の鍵のときだけ
          -e kubernetes_server_ssh_prikey=(実行環境上の鍵ファイルパス)を指定します(docs/vm/k3s.md)。
        quiet: true
      vars:
        kubernetes_preflight_required_vars:
          kubernetes_server_ip: "{{ kubernetes_server_ip | default('', true) }}"
          kubernetes_server_ssh_user: "{{ kubernetes_server_ssh_user | default('', true) }}"
          kubernetes_server_ssh_prikey: "{{ kubernetes_server_ssh_prikey | default('', true) }}"
          cluster_ip: "{{ cluster_ip | default('', true) }}"
        kubernetes_preflight_missing_vars: >-
          {{ kubernetes_preflight_required_vars | dict2items
             | selectattr('value', 'eq', '')
             | map(attribute='key') | list }}

    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走ってしまうため、
    # SSH到達を待ってから明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:

    # vm_k3sはdelegate_toで管理IPを直接参照するため、その名前でも接続情報を登録する。
    # このplayの vars(ansible_user 等)は委譲先にも適用され、そこでは pve_ssh_user /
    # pve_ssh_prikey_resolved が解決できないため、同名の変数も委譲先ホストへ持たせる。
    - name: コントロールプレーンを参加先グループへ登録する
      ansible.builtin.add_host:
        name: "{{ kubernetes_server_ip }}"
        groups: kubernetes_servers
        ansible_host: "{{ kubernetes_server_ip }}"
        ansible_user: "{{ kubernetes_server_ssh_user }}"
        ansible_ssh_private_key_file: "{{ kubernetes_server_ssh_prikey }}"
        ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        pve_ssh_user: "{{ kubernetes_server_ssh_user }}"
        pve_ssh_prikey_resolved: "{{ kubernetes_server_ssh_prikey }}"
      changed_when: false

  roles:
    - vm_k3s
  post_tasks:
    # カーネル更新とswap無効化を反映し、k3sの自動復帰まで確認する。
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

    - name: 再起動後にk3sサービスが復帰することを確認する
      ansible.builtin.systemd:
        name: "{{ kubernetes_service_name }}"
      become: true
      register: kubernetes_service_after_reboot
      retries: 30
      delay: 10
      until: kubernetes_service_after_reboot.status.ActiveState == 'active'
      when: vm_reboot_after_setup | default(true) | bool

    - name: 実行元の端末からAPIサーバーに接続できることを確認する
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ kubernetes_server_port }}"
        timeout: 300
        state: started
      delegate_to: localhost
      become: false
      when: kubernetes_role_resolved == 'server'

    - name: 構築結果と次の手順を表示する
      ansible.builtin.debug:
        msg: "{{ kubernetes_summary_server if kubernetes_role_resolved == 'server' else kubernetes_summary_agent }}"
      vars:
        kubernetes_summary_server:
          - "コントロールプレーン {{ kubernetes_node_name_resolved }} ({{ ansible_host }}) を構築しました"
          - "VM内での操作: ssh -i <秘密鍵> {{ ansible_user }}@{{ ansible_host }} 'kubectl get nodes -o wide'"
          - "手元にkubeconfigを持ってくる:
             scp -i <秘密鍵> {{ ansible_user }}@{{ ansible_host }}:.kube/config ~/.kube/config-{{ kubernetes_node_name_resolved }}"
          - "ワーカーはinventory/hosts.ymlのk8sグループへコントロールプレーンより後に追加し、
             ansible-playbook playbooks/vm/k3s.yml を再実行します"
        kubernetes_summary_agent:
          - "ワーカー {{ kubernetes_node_name_resolved }} ({{ ansible_host }}) を
             https://{{ kubernetes_server_url_host }}:{{ kubernetes_server_port }} のクラスタに参加させました"
          - "確認: コントロールプレーン {{ kubernetes_server_ip }} で kubectl get nodes -o wide"

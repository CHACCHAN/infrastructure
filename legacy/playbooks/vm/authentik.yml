# Authentik VMを宣言から一気通貫で構築するPlaybook。
# 実行例: ansible-playbook playbooks/vm/authentik.yml
---
# 0. AWXのSurveyなど、鍵を本文で受け取った場合に一時ファイルへ書き出す
- name: 接続用の秘密鍵を用意する
  ansible.builtin.import_playbook: ssh_key.yml

# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../pve/provision.yml
  vars:
    target: authentik
    profile_expected: authentik

# 2. VM内部: SSHでサービスをセットアップ
- name: Authentikをセットアップする
  hosts: "{{ target | default('authentik', true) }}"
  gather_facts: false
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey_resolved }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  pre_tasks:
    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走ってしまうため、
    # SSH到達を待ってから明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:
  roles:
    - vm_authentik
  post_tasks:
    # カーネル更新などの再起動要求があるときだけ再起動し、その後に外部疎通を確認する。
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

    - name: 実行元の端末からWebUIに接続できることを確認する
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ authentik_http_port | default(9000) }}/-/health/ready/"
        status_code: [200, 204]
      delegate_to: localhost
      become: false
      register: authentik_remote_health
      retries: 30
      delay: 10
      until: authentik_remote_health is succeeded
      changed_when: false

    # 公開経路(k8s_external_routes)のホスト名で案内する。TLSはメインクラスタのTraefikが終端する。
    - name: 接続先を表示する
      ansible.builtin.debug:
        msg:
          - "初期セットアップ(初回のみ): https://auth.{{ k8s_domain }}/if/flow/initial-setup/"
          - "ログイン画面: https://auth.{{ k8s_domain }}/"

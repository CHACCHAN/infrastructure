# AWX定義ファイルの雛形。awx/ の各ファイル(job_templates.yml / credentials.yml /
# inventory.yml / project.yml / execution_environment.yml)はこの形に従う。
#
# 決まりごと:
# - playbooks/utils/awx/configure.yml がこれらを読み、AWXへ収束させる
# - Surveyの任意項目は required: false かつ default を持たせない(既定値は default() 側で決める)
# - 秘密情報は type: password。値そのものはここに書かず、Vault credentialで渡す
# - 絞り込みは Limit ではなく target 変数で行う
# - survey_enabled / ask_variables_on_launch / ask_limit_on_launch は configure.yml が固定する
# - choices には Jinja式も書ける(configure.yml 実行時のインベントリで解決される)
# - コメントは説明だけを書く。判断の経緯・変更の過程は書かない
---
awx_job_templates:
  - name: <ドメイン>-<名前>
    description: <このJob Templateが何をするか>
    playbook: playbooks/<ドメイン>/<名前>.yml
    # VM構築系(provision.ymlをimportするplaybook)は共通Surveyを使う
    use_common_survey: true
    # Vault以外に紐づけるCredential名(不要なら省略)
    extra_credentials:
      - <Credential名>
    # このJob Template固有の質問(共通Surveyの後ろに並ぶ。不要なら省略)
    survey_extra:
      - question_name: <質問名>(<変数名>)
        question_description: <未回答時の挙動を含む説明>
        variable: <変数名>
        type: text
        required: false

# AWXのProject(このリポジトリのGit同期)定義。
# playbooks/utils/awx/configure.yml が読み込み、awx.awx.project へ渡す。
---
awx_organization: Default

awx_project_name: infrastructure
awx_project_description: Proxmox/VM/Kubernetesの宣言的構成管理(このリポジトリ)
# SSH経由で同期する。認証は vault/awx_api.yml の vault_awx_scm_prikey を
# configure.yml が Source Control credential(下の名前)として登録して使う。
awx_project_scm_url: git@github.com:CHACCHAN/infrastructure.git
awx_project_scm_branch: main
# 実行のたびに最新のplaybookを使う(Git側を単一の真実にする)。
awx_project_scm_update_on_launch: true
awx_project_scm_credential_name: infrastructure SCM

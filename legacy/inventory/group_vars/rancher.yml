# Rancher管理サーバーVMの役割プロファイル。
# 単体k3s(server・Traefik無効)の上へHelmでRancherを載せる(docs/vm/rancher.md)。
---
# --- ① VMプロファイル(pveドメインが使う) ---
pve_vm_cores: 8
pve_vm_memory: 8192
pve_vm_disk_size: 64

# --- ② SSH接続(cloud-initが作るユーザーと鍵) ---
pve_ssh_user: rancher
pve_ssh_pubkey_file: ~/.ssh/id_ed25519_rancher.pub
pve_ssh_prikey_file: ~/.ssh/id_ed25519_rancher

# --- ③ サービス設定(vm_k3s / vm_rancherロールが使う) ---
# Rancher 2.14系のサポート上限はKubernetes v1.35のため、メインクラスタ(k8sグループ)とは
# 別に固定する。Rancherを上げるときはサポートマトリクスを確認してから併せて上げる。
# https://www.suse.com/suse-rancher/support-matrix/
kubernetes_version: v1.35.8+k3s1
# TLS終端はメインクラスタのTraefikに一本化するため、このVMにTraefikは入れない。
# 公開はRancherのService(type: LoadBalancer)をk3s同梱のServiceLBが:80へ直接束ねる
kubernetes_disable: ["traefik"]
# APIサーバー証明書に公開FQDNを足す(VM自身のIPはroleが自動で追加する)
kubernetes_tls_san: ["rancher.{{ k8s_domain }}"]

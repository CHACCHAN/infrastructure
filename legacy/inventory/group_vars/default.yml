# <役割>グループのプロファイル(役割ごとの宣言)。
#
# 宣言は3層に分ける。この層には「既定値との差分」だけを書く。
#   roles/*/defaults/main.yml   … 変数の既定値(単一の真実)
#   inventory/group_vars/<役割>.yml … 役割プロファイル(このファイル)
#   inventory/hosts.yml         … 1VM固有の値(vmid / node / ansible_host)
#
# ファイル名は役割グループ名と一致させる。既定値と同じ値は書かない。
# コメントは説明だけを書く(旧値の維持や移行日などの経緯は書かない)。
---
# --- ① VMプロファイル(pveドメインが使う) ---
pve_storage: <ストレージ名>
pve_vm_cores: <コア数>
pve_vm_memory: <MiB>
pve_vm_disk_size: <GiB>

# --- ② SSH接続(cloud-initが作るユーザーと鍵) ---
pve_ssh_user: <ユーザー名>
pve_ssh_pubkey_file: ~/.ssh/id_ed25519_<名前>.pub
pve_ssh_prikey_file: ~/.ssh/id_ed25519_<名前>

# --- ③ サービス設定(vm_<サービス>ロールが使う) ---
# 既定値の正は roles/vm_<サービス>/defaults/main.yml。差分だけをここに書く
<サービス>_version: "<版>"

# Coolify VMの役割プロファイル。
---
# --- ① VMプロファイル(pveドメインが使う) ---
pve_storage: ssd02
pve_vm_cores: 12
pve_vm_cpu_type: x86-64-v3
pve_vm_memory: 8192
pve_vm_disk_size: 400

# --- ② SSH接続(cloud-initが作るユーザーと鍵) ---
pve_ssh_user: coolify
pve_ssh_pubkey_file: ~/.ssh/id_ed25519_coolify.pub
pve_ssh_prikey_file: ~/.ssh/id_ed25519_coolify

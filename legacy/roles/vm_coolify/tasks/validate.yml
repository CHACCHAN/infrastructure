# 以降のタスクが参照する値をここで検証する。
---
- name: 必須変数が正しく渡されているか検証する
  ansible.builtin.assert:
    that:
      - ansible_user is defined
      - (ansible_user | default('', true)) | length > 0
    fail_msg: >-
      ansible_user が指定されていません。
      -e "ansible_user=<ユーザ名>" で指定してください。
    quiet: true

# 値をログに出さないよう、判定は変数名だけを残す形で行う。
- name: 初期root管理者の指定を集める
  ansible.builtin.set_fact:
    coolify_root_given: >-
      {{ {'coolify_root_username': coolify_root_username | default('', true),
          'coolify_root_user_email': coolify_root_user_email | default('', true),
          'coolify_root_user_password': coolify_root_user_password | default('', true)}
         | dict2items | rejectattr('value', 'equalto', '')
         | map(attribute='key') | list }}
  no_log: true

# 一部だけ指定すると上流スクリプトが中途半端な管理者を作りうるため、実行前に止める。
- name: 初期root管理者の指定が揃っていることを検証する
  ansible.builtin.assert:
    that:
      - coolify_root_given | length in [0, 3]
    fail_msg: >-
      初期root管理者は coolify_root_username / coolify_root_user_email /
      coolify_root_user_password の3つセットで指定してください
      (指定済み: {{ coolify_root_given | join('、') }})。
      未指定ならWeb UIの初回アクセスで作成できます。
    quiet: true

- name: 構築する内容を表示する
  ansible.builtin.debug:
    msg: >-
      {{ ansible_host }} に Coolify {{ coolify_version | default('(最新)', true) }} を構築します
      / UI :{{ coolify_ui_port }} / 内蔵プロキシ :{{ coolify_proxy_http_port }}
      / 初期管理者 {{ '事前作成(変数指定)' if coolify_root_given | length == 3
                     else 'Web UIの初回アクセスで作成' }}

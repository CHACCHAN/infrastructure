# 上流チャートの固定バージョンと values。
---
k8s_nfs_provisioner_helm_version: "4.0.18"
k8s_nfs_provisioner_values:
  nfs:
    server: 10.10.20.10
    path: /mnt/Storage/Kubernetes

  storageClass:
    create: true
    name: truenas-nfs

    # 既定 StorageClass は k3s 同梱の local-path のままにする
    defaultClass: false

    # PVC を消しても PV と NFS 上のディレクトリを残す。
    # Retain では provisioner の削除処理が走らないため archiveOnDelete は効かない
    # (チャート既定と同値なので指定を残している)。
    reclaimPolicy: Retain
    archiveOnDelete: true

    # allowVolumeExpansion はチャート既定の true のまま。ただし作られるのは NFS 共有
    # 配下のサブディレクトリで PVC のサイズは強制されず、実際の上限は
    # TrueNAS 側のデータセットの空き容量になる(拡張操作は要らない)。

# Docker ComposeでLiveKit Serverを構築する。Debian専用。
# 全VM共通の処理は vm / vm_docker ロールと共有している。
---
- name: 対象OSを確認する
  ansible.builtin.import_role:
    name: vm
    tasks_from: assert_debian

- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

# パッケージ更新やイメージ取得の途中で容量が尽きると原因が分かりにくいため先に確認する
- name: ディスクの空き容量を確認する
  ansible.builtin.import_role:
    name: vm
    tasks_from: check_disk_space
  vars:
    svc_name: LiveKit
    svc_min_free_gb: "{{ livekit_min_free_disk_gb }}"
    svc_min_free_var: livekit_min_free_disk_gb

- name: VM共通の初期セットアップを実行する
  ansible.builtin.import_role:
    name: vm

- name: Dockerをインストールする
  ansible.builtin.import_role:
    name: vm_docker

- name: LiveKit用のディレクトリを準備する
  ansible.builtin.import_tasks: prepare_directories.yml

- name: LiveKitの設定を配置する
  ansible.builtin.import_tasks: configure_livekit.yml

- name: Firewallを設定する
  ansible.builtin.import_tasks: configure_firewall.yml

- name: LiveKitのコンテナを起動する
  ansible.builtin.import_tasks: ../../vm_docker/tasks/deploy_compose.yml
  vars:
    svc_name: LiveKit
    svc_install_dir: "{{ livekit_install_dir }}"
    svc_config_changed: "{{ livekit_config is changed }}"

- name: サービスの起動を確認する
  ansible.builtin.import_tasks: verify_service.yml

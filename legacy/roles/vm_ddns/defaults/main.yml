# タイムゾーン(vm_timezone)・ロケール(vm_locale)・zram(vm_zram_percent)の
# 既定値は roles/vm/defaults/main.yml にある。
#
# APIトークン・ゾーンID・更新するレコードには既定値を置かない
# (playbooks/vm/ddns.yml が vault/cloudflare.yml の値を変数で渡す)。
---
ddns_install_dir: /opt/cloudflare-ddns-ui
ddns_container_name: cloudflare-ddns-ui

ddns_image: docker.io/martijnf/cloudflare-ddns-ui
ddns_version: v1.0.2

# イメージ取得前に必要とする空き容量(GiB)
ddns_min_free_disk_gb: 2

# --- Web UI(コンテナ内は8080で固定。VM側のポートだけを変えられる) ---
ddns_http_port: 8080
# 待ち受けアドレス。⚠ このダッシュボードには認証が無く、レコードの削除まで
# できてしまうため、外に見せたくない場合は 127.0.0.1 にする
ddns_http_bind: 0.0.0.0

# --- Cloudflareの認証情報 ---
# Zone → DNS → Edit 権限のAPIトークン(対象ゾーンのみに絞れる)
ddns_api_token: ""

# --- 更新するレコード ---
# 更新するレコード名(FQDN)。リストでもカンマ区切りの文字列でも指定できる。
# 例: ["auth.example.com", "wg.example.com"] / "auth.example.com,wg.example.com"
# ⚠ Cloudflare側に既にAレコードがある必要がある(無い場合はWeb UIから作成する)
ddns_records: []

# ゾーン(登録可能ドメイン)とゾーンIDの対応。1ゾーンならこの2つで指定する
ddns_zone_domain: ""
ddns_zone_id: ""
# 複数ゾーンを扱う場合はこちらに直接書く(上の2つより優先される)。
# 例: {"example.com": "<ゾーンID>", "example.net": "<ゾーンID>"}
ddns_zones: {}

# --- 動作設定 ---
# 公開IPを確認してレコードを更新する間隔(秒)
ddns_interval: 300
# ダッシュボードの自動リロード間隔(秒)
ddns_refresh: 30

# コンテナに渡す環境変数を追加する場合に使う(TZはVMのタイムゾーンから自動設定)。
# 例: {"LOG_LEVEL": "debug"}
ddns_extra_env: {}

# Web UIの起動待ち(リトライ回数 / 間隔(秒))
ddns_ready_retries: 30
ddns_ready_delay: 5
# 初回のレコード確認がログに出るまでの待ち
ddns_check_retries: 12
ddns_check_delay: 5
# 再起動を繰り返していないかを判定するために2回の観測を空ける時間(秒)
ddns_restart_check_delay: 10

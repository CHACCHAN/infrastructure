---
# locale_genは /usr/share/i18n と locale-gen を使うため、localesパッケージが必要
- name: ロケール生成に必要なlocalesパッケージをインストールする
  ansible.builtin.apt:
    name: locales
    state: present
  become: true

- name: "ロケールを生成する({{ vm_locale }})"
  community.general.locale_gen:
    name: "{{ vm_locale }}"
    state: present
  become: true

- name: デフォルトロケールを設定する
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: "LANG={{ vm_locale }}"
    create: true
    mode: "0644"
  become: true

# VM内から見た確認。初回はイメージ取得とDBマイグレーションのため数分かかる。
# VM外から見えるかどうかは、再起動後にplaybook側で行う。
---
- name: WebUIのポートが待ち受けるまで待機する
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ authentik_http_port }}"
    timeout: 300
    state: started

- name: WebUIが準備完了になるまで待機する
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/-/health/ready/"
    status_code: [200, 204]
  register: authentik_health
  retries: "{{ authentik_ready_retries }}"
  delay: "{{ authentik_ready_delay }}"
  until: authentik_health is succeeded
  changed_when: false

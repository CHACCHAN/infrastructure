# タイムゾーン(vm_timezone)・ロケール(vm_locale)・zram(vm_zram_percent)の
# 既定値は roles/vm/defaults/main.yml にある。
---
authentik_install_dir: /opt/authentik

# 2026.x系はRedis不要の構成。docker-compose.ymlもそれ前提なので下げないこと
authentik_image: ghcr.io/goauthentik/server
authentik_version: "2026.5.6"
authentik_postgres_image: docker.io/library/postgres:16-alpine

authentik_http_port: 9000
authentik_https_port: 9443

authentik_pg_db: authentik
authentik_pg_user: authentik

authentik_error_reporting: false

# 公式イメージのauthentikユーザー(UID/GID 1000固定)。マウント先の所有者に使う
authentik_container_uid: 1000
authentik_container_gid: 1000

# イメージ取得前に必要とする空き容量(GiB)
authentik_min_free_disk_gb: 5

# WebUIの起動待ち(初回はイメージ取得とDBマイグレーションで数分かかる)
authentik_ready_retries: 60
authentik_ready_delay: 10

# 上記以外の環境変数を .env に追記する場合に使う。
# 例: {"AUTHENTIK_EMAIL__HOST": "smtp.example.com", "AUTHENTIK_EMAIL__PORT": "587"}
# 指定できる項目: https://docs.goauthentik.io/install-config/configuration/
authentik_extra_env: {}

# 既定値なし: authentik_pg_password / authentik_secret_key(未指定なら自動生成)、
#             authentik_bootstrap_password / _email / _token(未指定なら設定しない)

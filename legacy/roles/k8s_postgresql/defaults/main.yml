# 上流チャートの固定バージョンと values。
---
k8s_postgresql_helm_version: "1.6.8"
k8s_postgresql_values:
  fullnameOverride: postgresql

  image:
    # **公式 postgres ではなく pgvector 入りイメージを使う。**
    # OpenWebUI の RAG ベクトルストアを pgvector に寄せていて (roles/k8s_open_webui)、
    # vector 拡張が無いイメージだと OpenWebUI 起動時の CREATE EXTENSION で落ちる。
    # 中身は公式 postgres の debian 版 + 拡張。
    #
    # **alpine 系は使わない。** alpine 版の postgres ユーザは uid 70 で、
    # チャート既定の securityContext (runAsUser: 999) と食い違って起動しない。
    # このイメージは debian ベースで 999 なのでそのまま噛み合う。
    registry: "docker.io"
    repository: "pgvector/pgvector"
    # タグは <pgvector版>-pg<PostgreSQLメジャー>。
    #
    # **16 系から動かさないのは AWX の都合。** AWX 24.6.1 が同梱する PostgreSQL は
    # 15 で、上流が動作確認しているのもそのバージョンだけ。外部 DB として
    # 使う分には新しいものでも動くとされているが、18 は検証範囲外。
    #
    # **-trixie を外さない。** 既存データの照合順序バージョンは trixie の glibc に
    # 対応しており、bookworm ベースのタグでは collation version mismatch になる
    # (照合順序が変わるとテキスト索引の並びが崩れる)。
    #
    # 0.8.6-pg16-trixie の中身は PostgreSQL 16.15。
    tag: "0.8.6-pg16-trixie"

  settings:
    # superuser のパスワードを読む Secret。実値は vault/k8s_secrets.yml。
    existingSecret: postgresql-superuser
    superuserPassword:
      secretKey: postgres-password

    # PGDATA は settings.dataDir + settings.pgDir になる。
    # マウントポイント (dataDir) と PGDATA を分けているのは、
    # PostgreSQL がデータディレクトリのパーミッションを 0700 でないと
    # 受け付けないため。NFS プロビジョナが作るディレクトリは 0777 なので、
    # その 1 つ下に initdb 自身に作らせる。**既定のまま触らない。**
    dataDir: "/var/lib/postgresql/data"
    pgDir: "pg"

  # 初回起動時 (データディレクトリが空のとき) だけ実行されるスクリプト。
  # 空の DB を 6 つ作り、openwebui にだけ vector 拡張を入れる。
  #
  # ロールは作らない。アプリは postgres ユーザで自分の DB に繋ぐ。
  # アプリごとにロールを分けると、同じパスワードを「PostgreSQL 側」と
  # 「アプリ側の接続情報」の 2 か所に書くことになり、事故のほうが大きい。
  #
  # **2 回目以降は実行されない。** DB や拡張を後から足す場合は
  # psql で手動で作ること (docs/k8s/README.md)。
  customScripts:
    10-create-databases.sh: |
      #!/bin/sh
      set -e
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<'EOSQL'
      CREATE DATABASE homarr;
      CREATE DATABASE awx;
      CREATE DATABASE pgadmin;
      CREATE DATABASE nextcloud;
      CREATE DATABASE guacamole;
      CREATE DATABASE openwebui;
      EOSQL

      # OpenWebUI の RAG ベクトルストア (VECTOR_DB=pgvector) 用。
      # 拡張は DB 単位なので openwebui DB の中で作る。
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname openwebui <<'EOSQL'
      CREATE EXTENSION IF NOT EXISTS vector;
      EOSQL

  storage:
    # TrueNAS の NFS 共有。既定クラス (local-path) はノードローカルなので使わない。
    className: truenas-nfs
    # StorageClass truenas-nfs は reclaimPolicy: Retain / allowVolumeExpansion: true。
    # NFS 共有配下のサブディレクトリなのでこのサイズは強制されず、
    # 実際の上限は TrueNAS 側のデータセットの空き容量。
    requestedSize: 200Gi
    # StatefulSet を消しても PVC を残す。
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  env:
    - name: TZ
      value: Asia/Tokyo

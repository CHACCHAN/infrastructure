# vm_k3s がSSHユーザー用に配置したkubeconfig(接続先はVMの実IPへ書き換え済み・
# そのIPはAPIサーバー証明書のSANに含まれる)を、実行元の一時ファイルへ取得する。
# クラスタの管理者権限そのもののため内容は一切ログへ出さず、ファイルは
# tasks/main.yml の always で必ず削除する(リポジトリ内には置かない)。
---
- name: VM上のkubeconfigを確認する
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.kube/config"
  register: rancher_kubeconfig_stat

- name: Kubeconfigが配置済みであることを検証する
  ansible.builtin.assert:
    that:
      - rancher_kubeconfig_stat.stat.exists
    fail_msg: >-
      /home/{{ ansible_user }}/.kube/config がありません。
      先に vm_k3s ロールでk3s(server)を構築してください
      (playbooks/vm/rancher.yml は正しい順序で実行します)。
    quiet: true

- name: VM上のkubeconfigを読み込む
  ansible.builtin.slurp:
    src: "/home/{{ ansible_user }}/.kube/config"
  register: rancher_kubeconfig_raw
  no_log: true

# 一時ファイル操作は収束対象ではないため、changed表示から除外する(roles/k8sと同じ扱い)
- name: 実行元に一時ファイルを作成する
  ansible.builtin.tempfile:
    state: file
    suffix: .kubeconfig.yaml
  register: rancher_kubeconfig_tempfile
  delegate_to: localhost
  become: false
  changed_when: false

- name: Kubeconfigを一時ファイルへ書き出す
  ansible.builtin.copy:
    content: "{{ rancher_kubeconfig_raw.content | b64decode }}"
    dest: "{{ rancher_kubeconfig_tempfile.path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false

- name: 以降のタスクが使うkubeconfigパスを確定する
  ansible.builtin.set_fact:
    rancher_kubeconfig_path: "{{ rancher_kubeconfig_tempfile.path }}"
    rancher_kubeconfig_fetched: true

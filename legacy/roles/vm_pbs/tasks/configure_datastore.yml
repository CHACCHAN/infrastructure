# バックアップの実データを置くデータストアを作成する。
# `datastore create` は指定パスに .chunks などの構造を初期化するため、
# 既に同名のデータストアがあれば何もしない(パスの付け替えもしない)。
---
- name: 既存のデータストア一覧を取得する
  ansible.builtin.command:
    cmd: proxmox-backup-manager datastore list --output-format json
  become: true
  changed_when: false
  register: pbs_datastore_list

- name: データストアの有無を判定する
  ansible.builtin.set_fact:
    pbs_datastore_exists: >-
      {{ pbs_datastore_name in
         ((pbs_datastore_list.stdout | from_json) | map(attribute='name') | list) }}

# PBSのサービスは backup ユーザーで動き、データストア直下に .lock を作る。
# データ用ディスクを使う場合はマウント先(ディスクの最上位)がここで backup 所有になる。
- name: データストア用ディレクトリを用意する
  ansible.builtin.file:
    path: "{{ pbs_datastore_path }}"
    state: directory
    owner: backup
    group: backup
    mode: "0755"
  become: true

# 既存のデータ用ディスクを付け替えた場合、パスにはチャンクストアが残っている。
# `datastore create` は空でないパスを拒否するため、再利用指定が必要になる。
- name: チャンクストアが既にあるか確認する
  ansible.builtin.stat:
    path: "{{ pbs_datastore_path }}/.chunks"
  become: true
  register: pbs_datastore_chunks

# チャンクストアの初期化を含むため、ディスクが大きいと少し時間がかかる
- name: データストアを作成する
  ansible.builtin.command:
    argv: >-
      {{ ['proxmox-backup-manager', 'datastore', 'create',
          pbs_datastore_name, pbs_datastore_path]
         + (['--reuse-datastore', 'true']
            if (pbs_datastore_chunks.stat.exists | default(false)) else []) }}
  become: true
  register: pbs_datastore_create
  changed_when: pbs_datastore_create.rc == 0
  when: not pbs_datastore_exists

- name: データストアの作成方法を表示する
  ansible.builtin.debug:
    msg: >-
      {{ pbs_datastore_path }} には既存のチャンクストアがあるため、
      データストア {{ pbs_datastore_name }} は既存データを再利用して作成しました。
  when:
    - not pbs_datastore_exists
    - pbs_datastore_chunks.stat.exists | default(false)

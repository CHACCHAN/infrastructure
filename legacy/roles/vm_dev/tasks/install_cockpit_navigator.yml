# Debian公式リポジトリに無いため、45DrivesのGitHubリリースから.debを取得する
# (45Drivesのaptリポジトリ repo.45drives.com はDebian 13を想定していないため使わない)。
# 版は dev_cockpit_navigator_version で固定し、sha256で検証してから入れる。
---
- name: Cockpit Navigatorの.debをチェックサム検証付きでダウンロードする
  ansible.builtin.get_url:
    url: >-
      https://github.com/45Drives/cockpit-navigator/releases/download/{{ dev_cockpit_navigator_version }}/{{ dev_cockpit_navigator_deb }}
    checksum: "sha256:{{ dev_cockpit_navigator_deb_sha256 }}"
    dest: "/usr/local/src/{{ dev_cockpit_navigator_deb }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 60
  become: true
  register: dev_navigator_download
  retries: 3
  delay: 5
  until: dev_navigator_download is succeeded

- name: "Cockpit Navigatorをインストールする({{ dev_cockpit_navigator_deb }})"
  ansible.builtin.apt:
    deb: "/usr/local/src/{{ dev_cockpit_navigator_deb }}"
    state: present
  become: true

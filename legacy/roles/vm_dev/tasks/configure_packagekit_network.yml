# PackageKit(Cockpitの「ソフトウェア更新」)はNetworkManagerの接続状態でオンライン判定する。
# eth0はifupdown管理で対象外のため、判定用のダミー接続を1つ持たせる
# (実通信には使わない。route-metric を大きくしてeth0側の既定経路を奪わない)。
---
- name: NetworkManagerをインストールする
  ansible.builtin.apt:
    name: network-manager
    state: present
  become: true

- name: NetworkManagerを有効化・起動する
  ansible.builtin.systemd:
    name: NetworkManager.service
    enabled: true
    state: started
  become: true

- name: PackageKitのオンライン判定用ダミー接続を作成する
  community.general.nmcli:
    conn_name: "{{ dev_packagekit_dummy_conn_name }}"
    ifname: "{{ dev_packagekit_dummy_ifname }}"
    type: dummy
    ip4: "{{ dev_packagekit_dummy_ip4 }}"
    gw4: "{{ dev_packagekit_dummy_gw4 }}"
    route_metric4: "{{ dev_packagekit_dummy_route_metric }}"
    method6: disabled
    autoconnect: true
    state: present
  become: true

- name: ダミー接続の有効状態を確認する
  ansible.builtin.command:
    cmd: nmcli --terse --fields NAME connection show --active
  register: dev_packagekit_active_conn
  changed_when: false

- name: ダミー接続を有効化する
  ansible.builtin.command:
    cmd: nmcli connection up "{{ dev_packagekit_dummy_conn_name }}"
  become: true
  when: dev_packagekit_dummy_conn_name not in dev_packagekit_active_conn.stdout_lines
  changed_when: true

# このplaybookは既存VMを削除します(元に戻せません)。
---
- name: 接続先のProxmoxホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vault/proxmox.yml"

  tasks:
    - name: Proxmoxというグループでホストを追加
      ansible.builtin.import_role:
        name: proxmox_connect

- name: Proxmox VMを削除する
  hosts: proxmox
  gather_facts: false

  roles:
    - proxmox_vm_delete

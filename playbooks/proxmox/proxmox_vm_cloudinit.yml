# 既存VMのcloud-init設定(ログインユーザー・パスワード・SSH公開鍵・IPアドレス)を
# 変更します。指定した項目だけを変更し、未指定の項目には手を触れません。
# ゲスト内で有効になるのはcloud-initが再実行される次回起動時です。
---
- name: 接続先のProxmoxホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vault/proxmox.yml"

  tasks:
    - name: Proxmoxというグループでホストを追加
      ansible.builtin.import_role:
        name: proxmox_connect

- name: Proxmox VMのcloud-init設定を変更する
  hosts: proxmox
  gather_facts: false

  roles:
    - proxmox_vm_cloudinit

# Gravitee Access Management を Helm で入れる。
---
- name: Gravitee Access Management を適用する
  hosts: "k3s[0]"
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    helm_api_token: "{{ vault_k3s_api_token }}"
    helm_ca_cert: "{{ vault_k3s_ca_cert }}"
    gravitee_am_db_password: "{{ vault_gravitee_am_db_password }}"
    gravitee_am_admin_password: "{{ vault_gravitee_am_admin_password }}"
    gravitee_am_jwt_secret: "{{ vault_gravitee_am_jwt_secret }}"
    gravitee_am_csrf_secret: "{{ vault_gravitee_am_csrf_secret }}"
    gravitee_am_technical_password: "{{ vault_gravitee_am_technical_password }}"
    gravitee_am_certificate_key_password: "{{ vault_gravitee_am_certificate_key_password }}"
    gravitee_am_certificate_store_password: "{{ vault_gravitee_am_certificate_store_password }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/k3s.yml"
    - "{{ playbook_dir }}/../../vault/gravitee_am.yml"
  roles:
    - k3s_gravitee_am

# CLIProxyAPI を k3s に置く。
# 実行例: ansible-playbook playbooks/k3s/cliproxy.yml [--check --diff] 2>&1 | cat
---
- name: CLIProxyAPI を適用する
  hosts: "k3s[0]"
  connection: local
  gather_facts: false
  vars:
    # connection: local は kubernetes ライブラリを持たないシステムの Python を選ぶため、ansible 本体の Python に固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    helm_api_token: "{{ vault_k3s_api_token }}"
    helm_ca_cert: "{{ vault_k3s_ca_cert }}"
    cliproxy_management_password: "{{ vault_cliproxy_management_password }}"
    cliproxy_api_keys: "{{ vault_cliproxy_api_keys }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/k3s.yml"
    - "{{ playbook_dir }}/../../vault/cliproxy.yml"
  roles:
    - k3s_cliproxy

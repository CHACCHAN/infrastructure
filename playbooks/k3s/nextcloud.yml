# Nextcloud Hub を Helm で入れ、Authentik の OIDC でログインできるようにする。
# 実行例: ansible-playbook playbooks/k3s/nextcloud.yml [--check --diff] 2>&1 | cat
---
- name: Nextcloud Hub を適用する
  hosts: "k3s[0]"
  connection: local
  gather_facts: false
  vars:
    # Kubernetes ライブラリを持つ、Ansible 本体の Python を使う
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    helm_api_token: "{{ vault_k3s_api_token }}"
    helm_ca_cert: "{{ vault_k3s_ca_cert }}"
    nextcloud_db_password: "{{ vault_nextcloud_db_password }}"
    nextcloud_oidc_client_secret: "{{ vault_nextcloud_oidc_client_secret }}"
    nextcloud_admin_password: "{{ vault_nextcloud_admin_password }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/k3s.yml"
    - "{{ playbook_dir }}/../../vault/nextcloud.yml"
  roles:
    - k3s_nextcloud

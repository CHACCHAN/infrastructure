# cloudflared(Cloudflare Tunnel のコネクタ)を Helm で入れる。
# 実行例: ansible-playbook playbooks/k3s/cloudflared.yml [--check --diff] 2>&1 | cat
---
- name: cloudflared を適用する
  hosts: "k3s[0]"
  connection: local
  gather_facts: false
  vars:
    # connection: local は kubernetes ライブラリを持たないシステムの Python を選ぶため、ansible 本体の Python に固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    helm_api_token: "{{ vault_k3s_api_token }}"
    helm_ca_cert: "{{ vault_k3s_ca_cert }}"
    cloudflared_tunnel_token: "{{ vault_cloudflared_tunnel_token }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/k3s.yml"
    - "{{ playbook_dir }}/../../vault/cloudflared.yml"
  roles:
    - k3s_cloudflared

# LiteLLM Proxy を Helm で入れる。
# 実行例: ansible-playbook playbooks/k3s/litellm.yml [--check --diff] 2>&1 | cat
---
- name: LiteLLM を適用する
  hosts: "k3s[0]"
  connection: local
  gather_facts: false
  vars:
    # connection: local は kubernetes ライブラリを持たないシステムの Python を選ぶため、ansible 本体の Python に固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    helm_api_token: "{{ vault_k3s_api_token }}"
    helm_ca_cert: "{{ vault_k3s_ca_cert }}"
    litellm_db_password: "{{ vault_litellm_db_password }}"
    litellm_master_key: "{{ vault_litellm_master_key }}"
    litellm_salt_key: "{{ vault_litellm_salt_key }}"
    litellm_ui_password: "{{ vault_litellm_ui_password }}"
    litellm_oidc_client_secret: "{{ vault_litellm_oidc_client_secret }}"
    litellm_provider_keys: "{{ vault_litellm_provider_keys | default({}) }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/k3s.yml"
    - "{{ playbook_dir }}/../../vault/litellm.yml"
  roles:
    - k3s_litellm

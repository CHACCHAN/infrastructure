# Authentik を Helm で入れ、アプリの OIDC クライアントと認証プロキシを Blueprint で宣言する。
# 実行例: ansible-playbook playbooks/k3s/authentik.yml [--check --diff] 2>&1 | cat
---
- name: Authentik を適用する
  hosts: "k3s[0]"
  connection: local
  gather_facts: false
  vars:
    # connection: local は kubernetes ライブラリを持たないシステムの Python を選ぶため、ansible 本体の Python に固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    helm_api_token: "{{ vault_k3s_api_token }}"
    helm_ca_cert: "{{ vault_k3s_ca_cert }}"
    authentik_db_password: "{{ vault_authentik_db_password }}"
    authentik_secret_key: "{{ vault_authentik_secret_key }}"
    authentik_bootstrap_password: "{{ vault_authentik_bootstrap_password }}"
    authentik_bootstrap_token: "{{ vault_authentik_bootstrap_token }}"
    authentik_google_client_id: "{{ vault_authentik_google_client_id }}"
    authentik_google_client_secret: "{{ vault_authentik_google_client_secret }}"
    authentik_oidc_client_secrets:
      openwebui: "{{ vault_openwebui_oidc_client_secret }}"
      nextcloud: "{{ vault_nextcloud_oidc_client_secret }}"
      litellm: "{{ vault_litellm_oidc_client_secret }}"
      hermes: "{{ vault_hermes_oidc_client_secret }}"
      opnsense: "{{ vault_opnsense_oidc_client_secret }}"
      proxmox: "{{ vault_proxmox_oidc_client_secret }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/k3s.yml"
    - "{{ playbook_dir }}/../../vault/authentik.yml"
    - "{{ playbook_dir }}/../../vault/openwebui.yml"
    - "{{ playbook_dir }}/../../vault/nextcloud.yml"
    - "{{ playbook_dir }}/../../vault/litellm.yml"
    - "{{ playbook_dir }}/../../vault/hermes.yml"
    - "{{ playbook_dir }}/../../vault/opnsense.yml"
    - "{{ playbook_dir }}/../../vault/proxmox_oidc.yml"
  roles:
    - k3s_authentik

# Gravitee APIM と専用の PostgreSQL を入れる。
# 実行例: ansible-playbook playbooks/k3s/gravitee.yml [--check --diff] 2>&1 | cat
---
- name: Gravitee APIM を適用する
  hosts: "k3s[0]"
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    helm_api_token: "{{ vault_k3s_api_token }}"
    helm_ca_cert: "{{ vault_k3s_ca_cert }}"
    gravitee_db_password: "{{ vault_gravitee_db_password }}"
    gravitee_admin_password: "{{ vault_gravitee_admin_password }}"
    gravitee_jwt_secret: "{{ vault_gravitee_jwt_secret }}"
    gravitee_properties_encryption_secret: "{{ vault_gravitee_properties_encryption_secret }}"
    gravitee_user_reference_secret: "{{ vault_gravitee_user_reference_secret }}"
    gravitee_oidc_client_secret: "{{ vault_gravitee_oidc_client_secret }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/k3s.yml"
    - "{{ playbook_dir }}/../../vault/gravitee.yml"
  roles:
    - k3s_gravitee

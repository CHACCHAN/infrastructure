# 開発VMのログインパスワード(Cockpit・xrdpのPAM認証で使う)を収束させるPlaybook。
# Ansible自身のSSHは公開鍵で入るためパスワードを使わないが、CockpitとxrdpはPAM認証のため必要。
# -e pve_ssh_password= を指定したときだけ動く(未指定なら何もしない)。
# 実行例: ansible-playbook playbooks/vm/dev/password.yml -e target=yuya-dev -e pve_ssh_password=<パスワード>
# 対象の絞り込みは -l ではなく -e target= で行う(-l は先頭のlocalhostプレイまで除外するため)。
#
# cloud-initのドライブはPVEがVMの「起動時」に作り直すため、ゲスト内からのrebootでは
# 古い内容のまま反映されない。そのため電源を入れ直して読み直させる。
#
# **前提: 対象VMにQEMUゲストエージェントが入っていること。** VM設定は pve_vm_agent: 1
# なのでPVEは下の停止要求をエージェント経由で出す。エージェントは roles/vm の
# install_qemu_guest_agent.yml が入れるため、まだ中身を構築していない新規VMへ単体実行すると
# 正常シャットダウンが応答せずタイムアウトする。その場合は先に setup.yml を流すか、
# -e pve_power_force=true を付ける(猶予時間の経過後に強制停止する)。
# setup.ymlはこの前提を満たす順序(VM内部の構築 → パスワード)で呼んでいる。
# 各タスクの `# noqa: args[module]` は誤検知の抑止。api_host/api_user等は
# Playbookの module_defaults (group/community.proxmox.proxmox) で供給しているが、
# ansible-lintのargsルールはaction groupを解決せず未指定と判定するため。
---
# 0. 前処理: 鍵を本文で受け取った場合の一時ファイル書き出しと、
#    インベントリ外VM(profile指定時)の一時登録。単体実行でもAWXでも同じに動く。
- name: 接続用の秘密鍵を用意する
  ansible.builtin.import_playbook: ../ssh_key.yml

- name: インベントリ外のVMを一時ホストとして宣言する
  ansible.builtin.import_playbook: ../../pve/adhoc.yml
  vars:
    profile_expected: dev

- name: cloud-initのログインパスワードを設定する
  hosts: "{{ target | default('dev', true) }}"
  connection: local
  gather_facts: false
  vars:
    # connection: localでproxmoxerを利用できるコントローラ側Pythonへ固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
    - "{{ playbook_dir }}/../../../vault/proxmox_api.yml"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ vault_proxmox_api_host }}"
      api_user: "{{ vault_proxmox_api_user }}"
      api_token_id: "{{ vault_proxmox_api_token_id }}"
      api_token_secret: "{{ vault_proxmox_api_token_secret }}"
      validate_certs: false

  tasks:
    - name: ログインパスワードをcloud-initへ書き込んで反映する
      # AWXのSurveyは未回答の質問を空文字で渡すことがあるため、is defined ではなく中身で判定する。
      when: pve_ssh_password | default('', true) | length > 0
      block:
        # 1つのパスワードを複数VMへ配らないための歯止め。-e target=all のような
        # 広い指定で全VMを電源再投入してしまう事故も同時に防ぐ。
        - name: 対象が1台に絞られていることを確認する
          ansible.builtin.assert:
            that:
              - ansible_play_hosts_all | length == 1
            fail_msg: >-
              パスワードの設定は1台ずつ行ってください。
              現在の対象は {{ ansible_play_hosts_all | length }}台
              ({{ ansible_play_hosts_all | join(', ') }})です。
              -e target=<ホスト名> で1台に絞ってください。
            quiet: true

        # 値をログに出さないよう、判定は真偽値だけを残す形で行う
        # (assertにno_logを付けるとfail_msgごと隠れてしまう)。
        - name: 指定されたパスワードの形式を判定する
          ansible.builtin.set_fact:
            pve_ssh_password_valid: >-
              {{ (pve_ssh_password | default('', true)) is match('^\S{8,}$') }}
          no_log: true

        - name: 指定されたパスワードの形式を検証する
          ansible.builtin.assert:
            that:
              - pve_ssh_password_valid | bool
            fail_msg: >-
              pve_ssh_password の形式が不正です。
              空白を含まない8文字以上で指定してください。
            quiet: true

        # VMIDの取り違えで別VMのパスワードを書き換えないよう、実体の名前と配置先も照合する。
        - name: 対象VMを検索する
          ansible.builtin.import_role:
            name: pve
            tasks_from: find_vm
          vars:
            pve_vmid: "{{ vmid }}"
            pve_expected_name: "{{ pve_vm_name | default(inventory_hostname) }}"
            pve_expected_node: "{{ node }}"

        # PVEはcipasswordを伏字で返し現在値と比較できないため、指定されたら必ず書き込む
        # (「パスワードを渡した=変えたい」が指定の意味。渡さなければこのblockごと動かない)。
        - name: cloud-initへログインパスワードを書き込む  # noqa: args[module]
          community.proxmox.proxmox_kvm:
            vmid: "{{ vmid }}"
            node: "{{ node }}"
            cipassword: "{{ pve_ssh_password }}"
            update: true
          no_log: true

        # 停止はゲストOSへの正常シャットダウン要求(エージェント経由。冒頭の前提を参照)。
        # 応答しない場合は -e pve_power_force=true で猶予後の強制停止に切り替える。
        - name: cloud-initを作り直すためVMを停止する  # noqa: args[module]
          community.proxmox.proxmox_kvm:
            vmid: "{{ vmid }}"
            state: stopped
            timeout: "{{ pve_power_timeout | default(300) }}"
            force: "{{ pve_power_force | default(false) | bool }}"

        - name: 新しいcloud-initでVMを起動する  # noqa: args[module]
          community.proxmox.proxmox_kvm:
            vmid: "{{ vmid }}"
            state: started

- name: パスワードが反映されたことを確認する
  hosts: "{{ target | default('dev', true) }}"
  gather_facts: false
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey_resolved }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

  tasks:
    # SSHの鍵が無い実行(公開鍵をVMに入れていない一時VMなど)では接続確認ができない。
    # パスワード自体はcloud-initが設定済みなので、確認方法だけ案内して正常終了する。
    - name: SSH鍵が無いため反映確認をスキップする
      ansible.builtin.debug:
        msg: >-
          秘密鍵(pve_ssh_prikey_file または pve_ssh_prikey_value)が無いため、
          SSHでの反映確認は行いません。Cockpit(https://{{ ansible_host }}:9090/)や
          PVEコンソールに {{ pve_ssh_user | default('(未定義)') }} でログインできれば反映されています。
      when:
        - pve_ssh_password | default('', true) | length > 0
        - pve_ssh_prikey_value | default('', true) | length == 0
        - pve_ssh_prikey_file | default('', true) | length == 0

    - name: 起動後のVMでパスワードの状態を確認する
      when:
        - pve_ssh_password | default('', true) | length > 0
        - >-
          pve_ssh_prikey_value | default('', true) | length > 0
          or pve_ssh_prikey_file | default('', true) | length > 0
      block:
        - name: 起動後のSSH接続を待つ
          ansible.builtin.wait_for_connection:
            timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

        # 値は照合できないため、状態(P=パスワードあり)だけで確かめる。L(ロック)や
        # NP(パスワードなし)のままならPAM認証で入れない。指定した値まで入ったかは
        # 出力の最終変更日(本日になっていること)で確認する。
        - name: PAMで使えるパスワードが設定されたことを確認する
          ansible.builtin.command:
            cmd: passwd --status {{ ansible_user }}
          become: true
          changed_when: false
          register: development_password_status
          retries: 10
          delay: 10
          until: (development_password_status.stdout.split() | length > 1)
                 and (development_password_status.stdout.split()[1] == 'P')

        - name: 接続先を表示する
          ansible.builtin.debug:
            msg:
              - "{{ ansible_user }} のログインパスワードを更新しました"
              - "passwd --status: {{ development_password_status.stdout | trim }}
                 (2列目Pが「PAMで使える」、3列目が最終変更日)"
              - "Cockpit: https://{{ ansible_host }}:9090/(自己署名証明書のため警告が出ます)"
              - "xrdp: {{ ansible_host }}:3389(vm_gui_required=true で構築した場合のみ)"
              - "SSHは公開鍵のままで、このパスワードは使いません"

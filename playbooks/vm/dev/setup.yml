# 開発VMを宣言から一気通貫で構築するPlaybook。
# 実行例: ansible-playbook playbooks/vm/dev/setup.yml
# 実行例: ansible-playbook playbooks/vm/dev/setup.yml -l yuya-dev
# パスワード(Cockpit・xrdp用)も同時に設定する場合:
#   ansible-playbook playbooks/vm/dev/setup.yml -e pve_ssh_password=<パスワード>
---
# 0. AWXのSurveyなど、鍵を本文で受け取った場合に一時ファイルへ書き出す
- name: 接続用の秘密鍵を用意する
  ansible.builtin.import_playbook: ../ssh_key.yml

# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../../pve/provision.yml
  vars:
    target: dev
    profile_expected: dev

# 2. VM内部: SSHでサービスをセットアップ
- name: 開発環境をセットアップする
  hosts: "{{ target | default('dev', true) }}"
  gather_facts: false
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey_resolved }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  pre_tasks:
    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走ってしまうため、
    # SSH到達を待ってから明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:
  roles:
    - vm_dev
  post_tasks:
    # カーネル更新などの再起動要求があるときだけ再起動する。
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

# 3. ログインパスワード(Cockpit・xrdpのPAM認証用。-e pve_ssh_password= 指定時のみ動く)
# password.ymlはQEMUゲストエージェント経由でVMを停止するため、
# エージェントを入れるVM内部のセットアップより後に置く。
- name: ログインパスワードを設定する
  ansible.builtin.import_playbook: password.yml

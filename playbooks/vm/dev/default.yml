# 開発VMに対する<何をするか>のPlaybook。
# 実行例: ansible-playbook playbooks/vm/dev/<名前>.yml
# 実行例: ansible-playbook playbooks/vm/dev/<名前>.yml -l <ホスト名>
#
# このディレクトリ(開発VM向け)のplaybookはこの雛形に従う。
# - VMごと構築するものは 0.鍵 → 1.pve provision → 2.SSHセットアップ の3段
# - 稼働中VMの一部だけを変えるものはプレイ2だけにし、provisionをimportしない
# - ロールへ渡す値は inventory/group_vars/dev.yml の宣言が正
# - コメントは説明だけを書く。判断の経緯・変更の過程は書かない
---
# 0. AWXのSurveyなど、鍵を本文で受け取った場合に一時ファイルへ書き出す
- name: 接続用の秘密鍵を用意する
  ansible.builtin.import_playbook: ../ssh_key.yml

# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../../pve/provision.yml
  vars:
    target: dev
    profile_expected: dev

# 2. VM内部: SSHでセットアップ
- name: <何を>セットアップする
  hosts: "{{ target | default('dev', true) }}"
  gather_facts: false
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey_resolved }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  pre_tasks:
    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走るため、SSH到達後に明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:
  roles:
    - vm_dev
  post_tasks:
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

    - name: 構築結果と次の手順を表示する
      ansible.builtin.debug:
        msg:
          - "<結果>"

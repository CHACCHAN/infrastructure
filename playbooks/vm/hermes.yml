# Hermes Agent(Nous Researchのセルフホストな自己改善型AIエージェント)VMを
# 宣言から一気通貫で構築するPlaybook。専用VM上へ公式インストーラで導入し、
# web dashboardをsystemdで常駐させる。
#
# LLM推論はこのVMで行わない(外部のOpenAI互換API・Gemini等へ接続する前提)。
# モデル・チャネル・スキル等の実運用設定は構築後にdashboardまたはCLIで行う。
# Ansibleは基盤と初期状態までを管理し、それらを再実行で初期化しない(docs/vm/hermes.md)。
# 実行例: ansible-playbook playbooks/vm/hermes.yml
---
# 0. AWXのSurveyなど、鍵を本文で受け取った場合に一時ファイルへ書き出す
- name: 接続用の秘密鍵を用意する
  ansible.builtin.import_playbook: ssh_key.yml

# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../pve/provision.yml
  vars:
    target: hermes
    profile_expected: hermes

# 2. VM内部: SSHでHermes本体→dashboard(systemd)の順にセットアップ
- name: Hermes Agentをセットアップする
  hosts: "{{ target | default('hermes', true) }}"
  gather_facts: false
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey_resolved }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    # dashboardの認証情報はVaultが単一の真実。VM上では環境ファイル経由で渡る
    hermes_dashboard_password: "{{ vault_hermes_dashboard_password | default('') }}"
    hermes_dashboard_secret: "{{ vault_hermes_dashboard_secret | default('') }}"
    # SSOのclient secretはconfidential clientのときだけ使う
    # (public clientはPKCEのみのため、Vaultに鍵が無くてもよい)
    hermes_oidc_client_secret: "{{ vault_hermes_oidc_client_secret | default('') }}"
  vars_files:
    # 解決基準を明示するためリポジトリ全体で {{ playbook_dir }} 形式に統一している。
    - "{{ playbook_dir }}/../../vault/hermes.yml"
  pre_tasks:
    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走ってしまうため、
    # SSH到達を待ってから明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:
  roles:
    - vm_hermes
  post_tasks:
    # カーネル更新などの再起動要求があるときだけ再起動する。
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

    - name: 再起動後にdashboardのサービスが復帰することを確認する
      ansible.builtin.systemd:
        name: "{{ hermes_dashboard_service_name }}"
      become: true
      register: hermes_after_reboot
      retries: 30
      delay: 10
      until: hermes_after_reboot.status.ActiveState == 'active'
      when: vm_reboot_after_setup | default(true) | bool

    - name: 実行元の端末からdashboardに接続できることを確認する
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ hermes_dashboard_port }}"
        timeout: 300
        state: started
      delegate_to: localhost
      become: false

    - name: 構築結果と次の手順を表示する
      ansible.builtin.debug:
        msg:
          - "Hermes Agent {{ hermes_version }} を構築しました:
             {{ hermes_public_url | default('http://' ~ ansible_host ~ ':'
                                            ~ hermes_dashboard_port, true) }}/
             (web dashboard・LAN内限定。IP直打ちは
             http://{{ ansible_host }}:{{ hermes_dashboard_port }}/)"
          - "ログイン: {{ 'Sign in with Self-Hosted OIDC(Authentik)、または '
                            if hermes_oidc_enabled else '' }}ユーザー
             {{ hermes_dashboard_username }} / パスワードは
             vault_hermes_dashboard_password
             (ansible-vault view vault/hermes.yml)"
          - "{{ 'SSOはIdP側にリダイレクトURI ' ~ hermes_public_url ~ '/auth/callback
             の登録が必要(未登録だとAuthentikの画面でエラーになる)'
             if hermes_oidc_enabled else 'SSOは未設定(hermes_oidc_issuer /
             hermes_oidc_client_id を宣言すると有効になる)' }}"
          - "初回セットアップ: 外部LLMの認証情報はdashboard、またはSSHして
             `hermes setup --portal`(Nous Portal)や `hermes model` で設定する"
          - "サービス操作: sudo systemctl status|restart {{ hermes_dashboard_service_name }}
             / ログ: sudo journalctl -u {{ hermes_dashboard_service_name }} -f"
          - "メッセージング(Telegram/Discord等)を使う場合: SSHして `hermes gateway setup`
             で設定 → inventory/group_vars/hermes.yml で hermes_enable_gateway: true
             にして再実行する"
          - "版を上げるとき: roles/vm_hermes/defaults/main.yml の hermes_version を
             変更してこのplaybookを再実行する(-e hermes_version=<タグ> でも可)"
          - "経路の反映(メインクラスタ側。未反映なら):
             ansible-playbook playbooks/k8s/deploy.yml -e app=external"

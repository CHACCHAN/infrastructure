# Rancher(Kubernetes管理サーバー)VMを宣言から一気通貫で構築するPlaybook。
# 公式推奨に従い専用の単体k3s(server 1台・Traefik無効)を建て、その上へHelmで
# Rancherを載せる(メインクラスタとは分離し、循環依存を避ける)。
# 公開はメインクラスタのTraefikがTLS終端し、HTTPでVMの:80へ転送する
# (経路は inventory/group_vars/all/k8s.yml の k8s_external_routes。docs/vm/rancher.md)。
# 実行例: ansible-playbook playbooks/vm/rancher.yml
---
# 0. AWXのSurveyなど、鍵を本文で受け取った場合に一時ファイルへ書き出す
- name: 接続用の秘密鍵を用意する
  ansible.builtin.import_playbook: ssh_key.yml

# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../pve/provision.yml
  vars:
    target: rancher
    profile_expected: rancher

# 2. VM内部: k3s(server単体)→Rancher(Helm)の順にセットアップ
- name: Rancherをセットアップする
  hosts: "{{ target | default('rancher', true) }}"
  gather_facts: false
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey_resolved }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない(旧実装踏襲)
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    # このplaybookはコントロールプレーン単体の構築専用(ワーカー参加は扱わない)
    kubernetes_node_role: server
    # 「自分自身=クラスタの1台目」の明示(roles/vm_k3s/tasks/validate.ymlの規約)。
    # 空のままだとansible-core 2.21ではfetch_tokenのdelegate_to解決がwhen評価より
    # 先に走り、スキップされるべきタスクが「委譲先が空」のfatal→rescueになる
    kubernetes_server_ip: "{{ ansible_host }}"
    # 公開FQDN。メインクラスタのTraefikがこのHostでTLS終端して転送してくる
    rancher_hostname: "rancher.{{ k8s_domain }}"
    rancher_bootstrap_password: "{{ vault_rancher_bootstrap_password | default('') }}"
  vars_files:
    # 解決基準を明示するためリポジトリ全体で {{ playbook_dir }} 形式に統一している。
    - "{{ playbook_dir }}/../../vault/rancher.yml"
  pre_tasks:
    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走ってしまうため、
    # SSH到達を待ってから明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:
  roles:
    - vm_k3s
  post_tasks:
    # カーネル更新とswap無効化を反映し、k3sの自動復帰を確認してからRancherを載せる。
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

    - name: 再起動後にk3sサービスが復帰することを確認する
      ansible.builtin.systemd:
        name: "{{ kubernetes_service_name }}"
      become: true
      register: rancher_k3s_after_reboot
      retries: 30
      delay: 10
      until: rancher_k3s_after_reboot.status.ActiveState == 'active'
      when: vm_reboot_after_setup | default(true) | bool

    # Helmは実行元からAPIサーバーへ接続するため、経路が開いていることを先に確認する
    - name: 実行元の端末からAPIサーバーに接続できることを確認する
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ kubernetes_server_port }}"
        timeout: 300
        state: started
      delegate_to: localhost
      become: false

    - name: Rancherをインストールする
      ansible.builtin.import_role:
        name: vm_rancher

    - name: 構築結果と次の手順を表示する
      ansible.builtin.debug:
        msg:
          - "Rancher {{ rancher_version }} を構築しました: https://{{ rancher_hostname }}/"
          - "初回ログイン: ユーザー admin / パスワードは vault_rancher_bootstrap_password
             (ansible-vault view vault/rancher.yml)"
          - "経路の反映(メインクラスタ側。未反映なら):
             ansible-playbook playbooks/k8s/deploy.yml -e app=external"
          - "このVMのkubeconfigを手元へ:
             scp -i <秘密鍵> {{ ansible_user }}@{{ ansible_host }}:.kube/config ~/.kube/config-rancher01"

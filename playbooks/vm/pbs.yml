# Proxmox Backup Server VMを宣言から一気通貫で構築するPlaybook。
# 実行例: ansible-playbook playbooks/vm/pbs.yml
---
# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../pve/provision.yml
  vars:
    target: pbs

# 2. VM内部: SSHでサービスをセットアップ
- name: Proxmox Backup Serverをセットアップする
  hosts: pbs
  gather_facts: false
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない(旧実装踏襲)
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    # PVEからのバックアップ通信は2枚目のNICへ寄せる。
    pbs_cluster_ip: "{{ cluster_ip | regex_replace('/.*$', '') }}"
  pre_tasks:
    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走ってしまうため、
    # SSH到達を待ってから明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:
  roles:
    - vm_pbs
  post_tasks:
    # カーネル更新を反映し、データディスクとWeb UIの復帰まで確認する。
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

    # fstabの不備で空ディレクトリをデータストアにしないよう再起動後にも確認する。
    - name: 再起動後もデータ用ディスクがマウントされていることを確認する
      ansible.builtin.command:
        cmd: >-
          findmnt --noheadings --output SOURCE,SIZE
          --mountpoint {{ pbs_datastore_path | default('/mnt/datastore/backup') }}
      become: true
      changed_when: false
      register: pbs_datastore_mount_after_reboot
      when: pbs_data_disk_enabled | default(true) | bool

    - name: 実行元の端末からWeb UIに接続できることを確認する
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ pbs_web_port | default(8007) }}/"
        validate_certs: false
        status_code: [200]
      delegate_to: localhost
      become: false
      register: pbs_remote_web_ui
      retries: 30
      delay: 10
      until: pbs_remote_web_ui is succeeded
      changed_when: false

    - name: 接続先を表示する
      ansible.builtin.debug:
        msg:
          - "Web UI: https://{{ ansible_host }}:{{ pbs_web_port | default(8007) }}/"
          - "ログイン: {{ pbs_admin_user | default('admin') }}@pbs
             (パスワードはVM内の /root/.pbs_admin_password)"
          - "データストア: {{ pbs_datastore_name | default('backup') }}
             ({{ pbs_datastore_path | default('/mnt/datastore/backup') }})
             {{ '→ ' ~ (pbs_datastore_mount_after_reboot.stdout | default('') | trim)
                if (pbs_data_disk_enabled | default(true) | bool) else '(OS用ディスク上)' }}"
          - "PVEへの登録: データセンター → ストレージ → 追加 → Proxmox Backup Server
             (サーバー {{ pbs_cluster_ip | default(ansible_host, true) }}
             / データストア {{ pbs_datastore_name | default('backup') }})"

# Cloudflare DDNS UI VMを宣言から一気通貫で構築するPlaybook。
# 実行例: ansible-playbook playbooks/vm/ddns.yml --ask-vault-pass
---
# 0. AWXのSurveyなど、鍵を本文で受け取った場合に一時ファイルへ書き出す
- name: 接続用の秘密鍵を用意する
  ansible.builtin.import_playbook: ssh_key.yml

# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../pve/provision.yml
  vars:
    target: ddns
    profile_expected: ddns

# 2. VM内部: SSHでサービスをセットアップ
- name: Cloudflare DDNS UIをセットアップする
  hosts: "{{ target | default('ddns', true) }}"
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../vault/cloudflare.yml"
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey_resolved }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    # 別play間のset_factを廃し、vault値をロールの公開変数へ直接渡す。
    cloudflare_ddns_ui_zone_id: "{{ vault_cloudflare_zone_id }}"
    cloudflare_ddns_ui_api_token: "{{ vault_cloudflare_api_token }}"
  pre_tasks:
    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走ってしまうため、
    # SSH到達を待ってから明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:
  roles:
    - vm_ddns
  post_tasks:
    # dockerグループへの追加とカーネル更新を反映してから外部疎通を確認する。
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

    # 待ち受けを絞っている場合はVMの外から見えないのが正しいため確認しない。
    - name: 実行元の端末からWeb UIに接続できることを確認する
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ cloudflare_ddns_ui_http_port | default(8080) }}/"
        status_code: [200]
      delegate_to: localhost
      become: false
      register: cloudflare_ddns_ui_remote_web
      retries: 30
      delay: 10
      until: cloudflare_ddns_ui_remote_web is succeeded
      changed_when: false
      when: cloudflare_ddns_ui_published | bool

    - name: 接続先を表示する
      ansible.builtin.debug:
        msg:
          - "{{ 'Web UI: http://' ~ ansible_host ~ ':' ~ (cloudflare_ddns_ui_http_port | default(8080))
                ~ '/(⚠ 認証がありません。レコードの削除まで行える画面です)'
                if (cloudflare_ddns_ui_published | bool)
                else 'Web UI: 待ち受けを ' ~ (cloudflare_ddns_ui_http_bind | default('0.0.0.0'))
                     ~ ' に絞っています(VMの外からは見えません)' }}"
          - "更新対象: {{ cloudflare_ddns_ui_records_resolved | join(', ') }}(A レコードのみ)"
          - "設定の変更: group_varsまたは-eの指定を変えて再実行してください
             (直接編集する場合は
             {{ cloudflare_ddns_ui_install_dir | default('/opt/cloudflare-ddns-ui') }}/config/config.json。
             Web UIでの変更も次回実行で上書きされます)"
          - "ログ: ssh -i <秘密鍵> {{ ansible_user }}@{{ ansible_host }}
             'sudo tail -f {{ cloudflare_ddns_ui_install_dir | default('/opt/cloudflare-ddns-ui') }}/logs/ddns.log'"

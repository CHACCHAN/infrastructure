# 本文で渡された接続用の秘密鍵を、一時ファイルへ書き出すPlaybook。
# playbooks/vm/*.yml が先頭でimportし、-e pve_ssh_prikey_value= を指定したときだけ動く
# (未指定なら何もしないため、ファイルパス(pve_ssh_prikey_file)での通常運用には影響しない)。
# SSHは秘密鍵を「ファイル」でしか受け取れないため、AWXのSurveyのように本文しか
# 渡せない経路ではここで実体化する。公開鍵は本文のままcloud-initへ渡せるため扱わない。
# 書き出し先は group_vars/all/pve.yml の pve_ssh_prikey_tmpfile。詳細は docs/vm/ssh_key.md
---
- name: 本文で渡された秘密鍵を一時ファイルへ書き出す
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    # localhostはinventoryのall配下に入らない実行環境(AWX等)があるため、
    # 書き出し先(pve_ssh_prikey_tmpfile)を持つクラスタ共通値を明示的に読む。
    - "{{ playbook_dir }}/../../inventory/group_vars/all/pve.yml"

  tasks:
    - name: 秘密鍵の本文を一時ファイルへ書き出す
      when: pve_ssh_prikey_value | default('') | trim | length > 0
      vars:
        pve_ssh_prikey_raw: "{{ pve_ssh_prikey_value | trim }}"
        # AWXのSurvey(Password型)は1行入力欄のため、貼り付けた鍵の改行が
        # 失われて届くことがある(そのまま書き出すとsshが invalid format で拒否)。
        # ヘッダ/フッタとbase64本体を取り出してPEM構造へ復元する。
        # 改行が保たれている鍵は無変換で通るため、通常経路には影響しない。
        pve_ssh_prikey_header: "{{ pve_ssh_prikey_raw | regex_search('-----BEGIN [A-Z0-9 ]+ KEY-----') }}"
        pve_ssh_prikey_footer: "{{ pve_ssh_prikey_raw | regex_search('-----END [A-Z0-9 ]+ KEY-----') }}"
        pve_ssh_prikey_body: >-
          {{ pve_ssh_prikey_raw
             | regex_replace('-----BEGIN [A-Z0-9 ]+ KEY-----', '')
             | regex_replace('-----END [A-Z0-9 ]+ KEY-----', '')
             | regex_replace('\s+', '') }}
        # Jinja式の中の '\n' リテラルは改行にならない(バックスラッシュ+nの
        # 2文字になる)ため、改行はYAMLの二重引用符で定義した変数を使う。
        pve_ssh_prikey_newline: "\n"
        pve_ssh_prikey_content: >-
          {{ pve_ssh_prikey_raw
             if pve_ssh_prikey_raw.splitlines() | length >= 3
             else (pve_ssh_prikey_header ~ pve_ssh_prikey_newline
                   ~ (pve_ssh_prikey_body | list | batch(70) | map('join')
                      | join(pve_ssh_prikey_newline))
                   ~ pve_ssh_prikey_newline ~ pve_ssh_prikey_footer) }}
      block:
        - name: 秘密鍵の本文が鍵の形式であることを確認する
          ansible.builtin.assert:
            that:
              - pve_ssh_prikey_raw is search('-----BEGIN [A-Z0-9 ]+ KEY-----')
              - pve_ssh_prikey_raw is search('-----END [A-Z0-9 ]+ KEY-----')
            fail_msg: >-
              pve_ssh_prikey_value が鍵の形式ではありません。
              -----BEGIN ...----- から -----END ...----- までの全体を貼り付けてください
              (パスフレーズ付きの鍵は使えません)。
            quiet: true

        - name: 一時鍵の置き場を用意する
          ansible.builtin.file:
            path: "{{ pve_ssh_prikey_tmpfile | dirname }}"
            state: directory
            mode: "0700"

        - name: 秘密鍵を本人だけが読める権限で書き出す
          ansible.builtin.copy:
            # 末尾に改行が無い鍵をsshが拒否するため、必ず1つ付ける。
            content: "{{ pve_ssh_prikey_content }}\n"
            dest: "{{ pve_ssh_prikey_tmpfile }}"
            mode: "0600"
          # 鍵本文が差分・ログに出ないようにする(失敗しても詳細は出ない)。
          no_log: true

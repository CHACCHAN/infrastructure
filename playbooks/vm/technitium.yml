# Technitium DNS VMを宣言から一気通貫で構築するPlaybook。
# 実行例: ansible-playbook playbooks/vm/technitium.yml
---
# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../pve/provision.yml
  vars:
    target: technitium

# 2. VM内部: SSHでサービスをセットアップ
- name: Technitium DNSをセットアップする
  hosts: technitium
  gather_facts: false
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない(旧実装踏襲)
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    # 旧ロール群はvm_ssh_user変数名を参照するため橋渡しする(N7以降で正規化)
    vm_ssh_user: "{{ pve_ssh_user }}"
    vm_ip: "{{ ansible_host }}"
  pre_tasks:
    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走ってしまうため、
    # SSH到達を待ってから明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:
  roles:
    - vm_technitium
  post_tasks:
    # dockerグループへの追加とカーネル更新を反映してから外部疎通を確認する。
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

    - name: 実行元の端末からDNSポートに接続できることを確認する
      ansible.builtin.wait_for:
        host: "{{ vm_ip }}"
        port: "{{ technitium_dns_port | default(53) }}"
        timeout: 300
        state: started
      delegate_to: localhost
      become: false

    - name: 実行元の端末からWebコンソールに接続できることを確認する
      ansible.builtin.uri:
        url: "http://{{ vm_ip }}:{{ technitium_http_port | default(5380) }}/"
        status_code: [200]
      delegate_to: localhost
      become: false
      register: technitium_remote_console
      retries: 30
      delay: 10
      until: technitium_remote_console is succeeded
      changed_when: false

    - name: 接続先を表示する
      ansible.builtin.debug:
        msg:
          - "Webコンソール: http://{{ vm_ip }}:{{ technitium_http_port | default(5380) }}/"
          - "ログイン: admin(パスワードは {{ technitium_install_dir | default('/opt/technitium-dns') }}/.env)"
          - "DNSサーバー: {{ vm_ip }}(クライアントやルーターのDNS設定にこのIPを指定します)"

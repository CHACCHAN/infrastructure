# Coolify VMを宣言から一気通貫で構築するPlaybook。supabase01(vmid 402)の完全置き換え。
# 実行例: ansible-playbook playbooks/vm/coolify.yml
# 初期root管理者を事前作成する場合(3つセット。未指定ならWeb UI初回アクセスで作成):
#   ansible-playbook playbooks/vm/coolify.yml \
#     -e coolify_root_username=admin -e coolify_root_user_email=admin@example.com \
#     -e coolify_root_user_password=<パスワード>
---
# 0. AWXのSurveyなど、鍵を本文で受け取った場合に一時ファイルへ書き出す
- name: 接続用の秘密鍵を用意する
  ansible.builtin.import_playbook: ssh_key.yml

# 1. Proxmox側: テンプレート→クローン→設定→cloud-init→起動まで収束
- name: VMを収束させる
  ansible.builtin.import_playbook: ../pve/provision.yml
  vars:
    target: coolify
    profile_expected: coolify

# 2. VM内部: SSHでサービスをセットアップ
- name: Coolifyをセットアップする
  hosts: "{{ target | default('coolify', true) }}"
  gather_facts: false
  vars:
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_prikey_resolved }}"
    # cloud-init直後はホスト鍵が毎回変わるため検証しない(旧実装踏襲)
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  pre_tasks:
    - name: SSH接続を待つ
      ansible.builtin.wait_for_connection:
        timeout: "{{ vm_ssh_wait_timeout | default(600) }}"

    # play冒頭の自動ファクト収集はpre_tasksより先に走ってしまうため、
    # SSH到達を待ってから明示的に収集する
    - name: ファクトを収集する
      ansible.builtin.setup:
  roles:
    - vm_coolify
  post_tasks:
    # dockerグループへの追加とカーネル更新を反映してから外部疎通を確認する。
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: vm
        tasks_from: reboot_vm

    - name: 実行元の端末からWeb UIに接続できることを確認する
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ coolify_ui_port | default(8000) }}/api/health"
        status_code: [200]
      delegate_to: localhost
      become: false
      register: coolify_remote_health
      retries: 30
      delay: 10
      until: coolify_remote_health is succeeded

    - name: 構築結果と次の手順を表示する
      ansible.builtin.debug:
        msg:
          - "Coolify {{ coolify_version }} を構築しました: http://{{ ansible_host }}:{{ coolify_ui_port | default(8000) }}/"
          - "初回アクセスで管理者を作成してください(変数で事前作成した場合はそのままログイン)"
          - "UIをドメインで使う: Settings → URL へ https://coolify.{{ k8s_domain | default('cc-chacchan.com') }} を設定し、Redirect HTTP to HTTPS は必ずDisabledにする"
          - "(TLSは手前のk3s Traefikが終端し:80へHTTPで届くため、Enabledだと無限リダイレクトループになる。docs/vm/coolify.md)"
          - "デプロイ公開用ドメイン: Servers → localhost → Wildcard Domain へ http://web.{{ k8s_domain | default('cc-chacchan.com') }} を設定すると、新規アプリへ <名前>.web.{{ k8s_domain | default('cc-chacchan.com') }} が自動割当される"
          - "経路の反映: ansible-playbook playbooks/k8s/deploy.yml -e app=certificates && ansible-playbook playbooks/k8s/deploy.yml -e app=external (証明書とTraefikルート)"

# Authentik 管理 API の取得記録だけを暗号化して保存する。
---
- name: Authentik のアプリ設定を保存する
  hosts: "k3s[0]"
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_pipelining: true
    ansible_remote_tmp: /dev/shm/ansible-authentik
    authentik_api_token: "{{ vault_authentik_bootstrap_token }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/authentik.yml"
  tasks:
    - name: 管理 API の取得記録を保存する
      ansible.builtin.include_role:
        name: k3s_authentik
        tasks_from: export

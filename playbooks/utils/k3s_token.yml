# k3s の ServiceAccount と長期トークンを作り、API のトークンと認証局の証明書を vault/k3s.yml に保存する。
# 初回の1回だけ行う。vault/k3s.yml に vault_k3s_api_token があれば何もしない(作り直すときは、その値を消してから実行する)。
# vault/k3s.yml の、ほかの値(クラスタのトークンなど)は保つ。
# 実行例: ansible-playbook playbooks/utils/k3s_token.yml 2>&1 | cat
---
- name: k3s の ServiceAccount のトークンを vault に保存する
  hosts: "k3s[0]"
  gather_facts: false
  become: true
  vars_files:
    - "{{ playbook_dir }}/../../vault/ssh.yml"
  vars:
    k3s_vault_file: "{{ playbook_dir }}/../../vault/k3s.yml"
    k3s_token_account: ansible
    k3s_token_namespace: kube-system
  tasks:
    - name: vault/k3s.yml があるか確認する
      ansible.builtin.stat:
        path: "{{ k3s_vault_file }}"
      delegate_to: localhost
      become: false
      register: __k3s_token_vault

    - name: vault/k3s.yml の既存の値を読む
      ansible.builtin.include_vars:
        file: "{{ k3s_vault_file }}"
      register: __k3s_vault_loaded
      when: __k3s_token_vault.stat.exists
      no_log: true

    - name: トークンを作って保存する
      when: vault_k3s_api_token is not defined
      block:
        - name: SSH 秘密鍵を用意する
          ansible.builtin.include_role:
            name: vm
            tasks_from: ssh_key_open

        - name: ServiceAccount・権限・長期トークンの Secret を作る
          ansible.builtin.command:
            cmd: k3s kubectl apply -f -
            stdin: |
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: {{ k3s_token_account }}
                namespace: {{ k3s_token_namespace }}
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: {{ k3s_token_account }}-cluster-admin
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: cluster-admin
              subjects:
                - kind: ServiceAccount
                  name: {{ k3s_token_account }}
                  namespace: {{ k3s_token_namespace }}
              ---
              apiVersion: v1
              kind: Secret
              type: kubernetes.io/service-account-token
              metadata:
                name: {{ k3s_token_account }}-token
                namespace: {{ k3s_token_namespace }}
                annotations:
                  kubernetes.io/service-account.name: {{ k3s_token_account }}
          register: __k3s_token_apply
          changed_when: "'created' in __k3s_token_apply.stdout or 'configured' in __k3s_token_apply.stdout"

        - name: トークンが発行されるまで待つ
          ansible.builtin.command: >-
            k3s kubectl -n {{ k3s_token_namespace }} get secret {{ k3s_token_account }}-token
            -o jsonpath='{.data.token}'
          register: __k3s_token_b64
          until: __k3s_token_b64.stdout | length > 0
          retries: 12
          delay: 5
          changed_when: false
          no_log: true

        - name: 認証局の証明書を取得する
          ansible.builtin.command: >-
            k3s kubectl -n {{ k3s_token_namespace }} get secret {{ k3s_token_account }}-token
            -o jsonpath='{.data.ca\.crt}'
          register: __k3s_ca_b64
          changed_when: false
          no_log: true

        - name: vault/k3s.yml へ書き足す
          ansible.builtin.include_tasks: tasks/vault_k3s_write.yml
          vars:
            k3s_vault_values:
              vault_k3s_api_token: "{{ __k3s_token_b64.stdout | b64decode }}"
              vault_k3s_ca_cert: "{{ __k3s_ca_b64.stdout | b64decode }}"
      always:
        - name: SSH 秘密鍵を消す
          ansible.builtin.include_role:
            name: vm
            tasks_from: ssh_key_close

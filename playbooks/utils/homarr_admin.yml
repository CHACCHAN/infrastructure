# Homarr の緊急用の管理者(credentials)を、vault のパスワードに合わせる。無ければ作る。
# Homarr はユーザーを宣言で作れないため、Pod の中で Homarr の CLI を実行する。
# 実行のたびにパスワードを設定し直し、そのユーザーのセッションを切る。
# 実行例: ansible-playbook playbooks/utils/homarr_admin.yml 2>&1 | cat
---
- name: Homarr の緊急用の管理者を整える
  hosts: "k3s[0]"
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../vault/k3s.yml"
    - "{{ playbook_dir }}/../../vault/homarr.yml"
  vars:
    # connection: local は kubernetes ライブラリを持たないシステムの Python を選ぶため、ansible 本体の Python に固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    homarr_admin_api_host: "https://172.20.{{ vlan }}.{{ k3s_api_vip_id }}:6443"
    homarr_admin_namespace: homarr
    homarr_admin_pod_selector: app.kubernetes.io/name=homarr
    homarr_admin_username: admin
    # CLI は、処理が終わっても DB の接続を持ったまま終了しない。時間で打ち切り、成否は出力で判定する
    homarr_admin_cli:
      - timeout
      - "30"
      - node
      - /app/apps/cli/cli.cjs
    __homarr_admin_exec: >-
      {{ ['kubectl',
          '--server', homarr_admin_api_host,
          '--certificate-authority', __homarr_admin_ca_file.path,
          '--token', vault_k3s_api_token,
          '--namespace', homarr_admin_namespace,
          'exec', '--stdin', __homarr_admin_ready[0].metadata.name, '--'] }}
    # 終了中の Pod と、Ready でないコンテナを持つ Pod を除く
    __homarr_admin_alive: >-
      {{ __homarr_admin_pods.resources | rejectattr('metadata.deletionTimestamp', 'defined') | list }}
    __homarr_admin_ready: >-
      {{ __homarr_admin_alive
         | zip(__homarr_admin_alive
               | map(attribute='status.containerStatuses', default=[{'ready': false}])
               | map('map', attribute='ready') | map('min'))
         | selectattr('1') | map(attribute='0') | list }}
  tasks:
    - name: Pod の中で CLI を実行する
      block:
        - name: 認証局の証明書の置き場を作る
          ansible.builtin.tempfile:
            state: file
            path: /dev/shm
            prefix: ansible-k3s-ca-
          register: __homarr_admin_ca_file
          changed_when: false

        - name: 認証局の証明書を書き出す
          ansible.builtin.copy:
            content: "{{ vault_k3s_ca_cert }}"
            dest: "{{ __homarr_admin_ca_file.path }}"
            mode: "0600"
          changed_when: false
          no_log: true

        - name: CLI でユーザーを確認し、パスワードを設定する
          module_defaults:
            group/kubernetes.core.k8s:
              host: "{{ homarr_admin_api_host }}"
              api_key: "{{ vault_k3s_api_token }}"
              ca_cert: "{{ __homarr_admin_ca_file.path }}"
              validate_certs: true
          block:
            - name: Homarr の Pod を探す
              kubernetes.core.k8s_info:
                kind: Pod
                namespace: "{{ homarr_admin_namespace }}"
                label_selectors:
                  - "{{ homarr_admin_pod_selector }}"
                field_selectors:
                  - status.phase=Running
              register: __homarr_admin_pods

            - name: Pod が動いていることを確かめる
              ansible.builtin.assert:
                that: __homarr_admin_ready | length > 0
                fail_msg: "Homarr の Pod が動いていない(playbooks/k3s/homarr.yml を先に適用する)"
                quiet: true

            # kubernetes.core.k8s_exec は、kubernetes ライブラリ 37 で動かないため、kubectl を使う
            - name: ユーザーの一覧を取得する
              ansible.builtin.command:
                argv: "{{ __homarr_admin_exec + homarr_admin_cli + ['users', 'list'] }}"
              register: __homarr_admin_users
              changed_when: false
              failed_when: >-
                'Username' not in __homarr_admin_users.stdout
                and 'No users found' not in __homarr_admin_users.stdout
              no_log: true

            # 作成時に CLI が仮のパスワードを出力するため、ログに出さない
            - name: 緊急用の管理者が無ければ作る
              ansible.builtin.command:
                argv: "{{ __homarr_admin_exec + homarr_admin_cli + ['recreate-admin', '--username', homarr_admin_username] }}"
              when: >-
                __homarr_admin_users.stdout_lines
                | map('split', '\t') | selectattr('1', 'defined')
                | selectattr('1', 'equalto', homarr_admin_username) | list | length == 0
              register: __homarr_admin_create
              changed_when: true
              failed_when: "'We created a new admin user' not in __homarr_admin_create.stdout"
              no_log: true

            # パスワードは、手元の引数に載せず、標準入力で Pod へ渡す
            - name: パスワードを vault の値に設定する
              ansible.builtin.command:
                argv: >-
                  {{ __homarr_admin_exec + ['sh', '-c',
                     'IFS= read -r p; exec ' ~ (homarr_admin_cli | join(' '))
                     ~ ' users update-password --username "$1" --password "$p"',
                     'sh', homarr_admin_username] }}
                stdin: "{{ vault_homarr_admin_password }}"
              register: __homarr_admin_password
              changed_when: true
              failed_when: "'Password updated successfully' not in __homarr_admin_password.stdout"
              no_log: true
      always:
        - name: 認証局の証明書を消す
          ansible.builtin.file:
            path: "{{ __homarr_admin_ca_file.path }}"
            state: absent
          changed_when: false
          when: __homarr_admin_ca_file is defined and __homarr_admin_ca_file.path is defined

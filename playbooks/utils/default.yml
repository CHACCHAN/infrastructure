# <対象>に対する<何をするか>の単発実行ツール(utils)。
# 実行例: ansible-playbook playbooks/utils/<パス>/<名前>.yml -e <変数>=<値>
#
# 冪等性:
# - <再実行したときに何が起きるか>
#
# このディレクトリ(単発ツールドメイン)のplaybookはこの雛形に従う。
# - playbookは playbooks/utils/<サービス>/ に置く(雛形は playbooks/utils/ に1つだけ)。vars_files の相対パスはその深さで書く
# - 接続はAPIのみ(hosts: localhost / connection: local)
# - APIトークンは vault/<名前>.yml。認証ヘッダは module_defaults で供給し、
#   API呼び出しは no_log にして直後のassertで成否だけを判定する
# - --check に対応しないものは先頭で明示的に止める
# - コメントは説明だけを書く。判断の経緯・変更の過程は書かない
---
- name: <何を>収束させる
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    <サービス>_api_base: >-
      {{ (vault_<サービス>_host | regex_replace('/+$', '')) ~ '/api' }}
  vars_files:
    - "{{ playbook_dir }}/../../../vault/<名前>.yml"
  module_defaults:
    ansible.builtin.uri:
      headers:
        Authorization: "Bearer {{ vault_<サービス>_api_token }}"
        Content-Type: application/json
      return_content: true

  tasks:
    - name: チェックモードに対応していないことを通知する
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: このplaybookはAPI呼び出しのみのため --check には対応していません。
        quiet: true

    - name: 対象が指定されていることを確認する
      ansible.builtin.assert:
        that:
          - <変数> is defined
        fail_msg: <指定方法>
        quiet: true

    - name: <APIの操作>
      ansible.builtin.uri:
        url: "{{ <サービス>_api_base }}/<パス>"
        method: POST
        body_format: json
        body: {}
        status_code: [200, 201]
      no_log: true
      register: <サービス>_result

    - name: 結果を確認する
      ansible.builtin.assert:
        that:
          - <サービス>_result.status in [200, 201]
        fail_msg: <失敗時の確認先>
        quiet: true

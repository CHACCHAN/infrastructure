# Proxmox Backup Server(PBS)のVMを、テンプレート構築からVM内部のセットアップまで
# 一気通貫で構築します。
# 処理は自前で持たず、共通フロー(provisionロールと _provision_vm.yml)を通じて
# playbooks/proxmox/ と playbooks/vms/ のplaybookを順番に呼ぶだけです。
#
# 対象の決め方は2通り(以降の処理は共通で、対象は pv_targets に集約されます):
#   インベントリ版(既定)  : inventories/lab/proxmox-backup-server.yml のホスト。--limit で選択
#   手動指定版(manual=true): -e で指定した1台のみ(インベントリが空なら自動でこちら)
#
# 共通フローで使う変数は pv_ 接頭辞(provision)にしています。PBS本体の設定は
# pbs_ 接頭辞でそのまま最後の手順へ渡るため、名前が混ざらないよう分けています。
---
- name: インベントリから構築対象を選ぶ
  # グループ名にはハイフンを使えないため、ここだけ proxmox_backup_server(アンダースコア)です
  hosts: proxmox_backup_server
  gather_facts: false
  connection: local

  vars:
    pv_group: proxmox_backup_server

  tasks:
    - name: インベントリのホストを構築対象に加える
      ansible.builtin.import_role:
        name: provision
        tasks_from: select_inventory_targets

- name: 手動指定の構築対象を追加する
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    pv_group: proxmox_backup_server

  tasks:
    - name: 手動指定されたVMを構築対象に加える
      ansible.builtin.import_role:
        name: provision
        tasks_from: select_manual_target

- name: 構築対象を確認する
  hosts: pv_targets
  gather_facts: false
  connection: local

  # 登録するホストにProxmoxへの接続情報を持たせるため、呼び出し先と同じvaultを読む
  vars_files:
    - ../../vault/proxmox.yml

  vars:
    pv_service_summary: >-
      Web UI https://{{ pv_vm_ip }}:{{ pbs_web_port | default(8007) }}/
      / 占有回線 {{ pv_vm_cluster_ipv4 | default('(なし。PVEからの接続もnet0)', true) }}
      / データストア {{ pbs_datastore_name | default('backup') }}
      ({{ pbs_datastore_path | default('/mnt/datastore/backup') }})
    pv_resize_hint_reason: >-
      OS用ディスクが小さいままになります(バックアップの実データは
      vm_hardware の disks で追加した2本目のディスクに置かれます)。
    pv_resize_example: >-
      vm_hardware={"cpu":{"cores":2,"type":"x86-64-v2-AES"},"memory":{"size":4096},"resize":[{"bus":"scsi","index":0,"size":32}],"disks":[{"bus":"scsi","index":1,"storage":"hdd01","size":512}]}

  tasks:
    - name: インベントリと-eの値から構築内容を決定する
      ansible.builtin.import_role:
        name: provision
        tasks_from: resolve_target_vars

    # バックアップの実データはOS用ディスクとは別のディスクに置く。
    # 2本目が無いと、PBSのデータストア作成前にVM内のチェックで止まる
    # (先に気付けるよう、Proxmox操作を始める前にここで確認する)。
    - name: バックアップ用ディスクの指定漏れで停止する
      ansible.builtin.assert:
        that:
          - ((vm_hardware | default({})).disks | default([])) | length > 0
        fail_msg: >-
          vm_hardware に2本目のディスク(disks)がありません。
          バックアップの実データを置くディスクを
          vm_hardware={"disks":[{"bus":"scsi","index":1,"storage":"<ストレージ名>","size":512}]}
          のように追加してください(OS用のscsi0はresizeで拡張します)。
          OS用ディスクにデータストアを作る場合は
          -e "pbs_data_disk_enabled=false" を指定してください。
        quiet: true
      when: pbs_data_disk_enabled | default(true) | bool

    # 占有回線のIPを指定していても、NICが1枚しか無ければ付ける先が無い。
    # テンプレートは net0 だけを持つため、net1 は vm_hardware で足す必要がある
    - name: 占有回線用NICの指定漏れで停止する
      ansible.builtin.assert:
        that:
          - 1 in ((vm_hardware | default({})).network | default([]) | map(attribute='index') | map('int'))
        fail_msg: >-
          vm_cluster_ipv4({{ pv_vm_cluster_ipv4 }})を指定していますが、
          vm_hardware に2枚目のNIC(network の index: 1)がありません。
          テンプレートは net0 の1枚しか持たないため、占有回線に繋ぐNICを
          vm_hardware={"network":[{"index":0,"model":"virtio","bridge":"vmbr0"},
          {"index":1,"model":"virtio","bridge":"vmbr3"}]} のように追加してください。
        quiet: true
      when: pv_vm_cluster_ipv4 | length > 0

    - name: 構築内容を表示してProxmox操作用に登録する
      ansible.builtin.import_role:
        name: provision
        tasks_from: finalize_targets

# テンプレート構築 → VM作成 → ハードウェア調整 → 動作設定 → cloud-init → 起動 → SSH待ち
- name: VMを構築して起動する
  ansible.builtin.import_playbook: _provision_vm.yml

# VM内部のセットアップ。
# PBS本体の設定(pbs_datastore_path等)はインベントリや-eの値がそのまま渡る。
- name: VM内部をセットアップする
  ansible.builtin.import_playbook: ../vms/proxmox-backup-server.yml
  vars:
    # 呼び出し先のlocalhostプレイでも参照されるため、
    # 各VMでは自分の値、localhostでは登録済みホストの先頭の値を使う
    vm_ip: "{{ pv_vm_ip | default(hostvars[groups['vms'] | first].pv_vm_ip) }}"
    vm_ssh_user: >-
      {{ pv_vm_ssh_user | default(hostvars[groups['vms'] | first].pv_vm_ssh_user) }}
    vm_ssh_prikey: >-
      {{ pv_vm_ssh_prikey | default(hostvars[groups['vms'] | first].pv_vm_ssh_prikey) }}
    # PVEにストレージとして登録するときの接続先(占有回線側のIP)。
    # SSHとWeb UIはnet0側のまま変わらず、この値は案内の表示にだけ使う
    pbs_cluster_ip: >-
      {{ pv_vm_cluster_ip | default(hostvars[groups['vms'] | first].pv_vm_cluster_ip) }}

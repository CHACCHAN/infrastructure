# 全アプリの差分確認: ansible-playbook playbooks/k8s/deploy.yml --check --diff
# 単一アプリの収束: ansible-playbook playbooks/k8s/deploy.yml -e app=homarr
# 所有権衝突の初回移行のみ: ansible-playbook playbooks/k8s/deploy.yml -e force=true
---
- name: Kubernetesアプリを宣言順に収束させる
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Kubernetesライブラリを持つAnsible自身のPythonをモジュールにも使う。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
    # 解決基準を明示するためリポジトリ全体で {{ playbook_dir }} 形式に統一している。
    - "{{ playbook_dir }}/../../inventory/group_vars/all/k8s.yml"
    - "{{ playbook_dir }}/../../vault/k8s_secrets.yml"

  tasks:
    # 誤ったkubeconfig/contextのまま別クラスタへ適用する事故を防ぐ。
    # 接続先APIサーバーが宣言(k8s_api_server)と一致しない限り一切書き込まない。
    - name: 接続先クラスタが宣言と一致することを確認する
      kubernetes.core.k8s_cluster_info:
      register: k8s_preflight_info

    - name: 接続先APIサーバーを検証する
      ansible.builtin.assert:
        that:
          - k8s_preflight_info.connection.host == k8s_api_server
        fail_msg: >-
          接続先 {{ k8s_preflight_info.connection.host }} が宣言
          {{ k8s_api_server }} と一致しません。kubeconfigのcurrent-contextを確認してください。
        quiet: true

    # app指定時は1ロールだけ、未指定時は登録簿の順序ですべてを実行する。
    - name: Kubernetesアプリロールを実行する
      ansible.builtin.include_role:
        name: "k8s_{{ item }}"
      loop: "{{ [app] if app is defined else k8s_apps }}"

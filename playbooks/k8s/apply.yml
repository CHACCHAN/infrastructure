# リポジトリ管理下のKustomizeマニフェストをKubernetesへ適用するPlaybook。
# 差分確認: ansible-playbook playbooks/k8s/apply.yml --check --diff
# 適用: ansible-playbook playbooks/k8s/apply.yml
# kubectl apply -k . --server-side 相当。--check --diff は変更を行わず、
# kubectl diff -k . 相当の差分確認として使う。
#
# -e force=true: フィールド所有権の衝突を強制取得する。過去にクライアントサイド
# kubectl applyで作られたリソース(kubectl-client-side-apply所有)を初めて
# Server-Side Applyへ移行するときだけ必要。通常運用では指定しない。
---
- name: Kubernetesルートマニフェストを適用する
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # ローカル接続の自動検出先ではなく、Kubernetesライブラリを持つ
    # Ansible自身のPythonをモジュール実行にも使う。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # 実行時のカレントディレクトリに依存させず、リポジトリ内の入口を固定する。
    k8s_kustomize_dir: "{{ playbook_dir }}/../../kubernetes"

  tasks:
    # kubectlとの併用期間にフィールド所有権が分裂しないようmanager名を揃える。
    - name: ルートKustomizeマニフェストをServer-Side Applyする
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: kubectl
          force_conflicts: "{{ force | default(false) | bool }}"
        definition: >-
          {{ lookup('kubernetes.core.kustomize', dir=k8s_kustomize_dir) }}

# 宣言済みVMの電源状態を冪等に収束させるPlaybook。
# 実行例: ansible-playbook playbooks/pve/power.yml -l k3s-worker03 -e state=started
# 実行例: ansible-playbook playbooks/pve/power.yml -l k8s -e state=stopped
# stopped はゲストOSへの正常シャットダウン要求。ゲストが応答できない間は失敗するため、
# 強制停止は -e pve_power_force=true で行う。
---
# -e profile= を指定したときだけ、インベントリ外のVMを一時ホストとして宣言する。
- name: インベントリ外のVMを一時ホストとして宣言する
  ansible.builtin.import_playbook: adhoc.yml

- name: Proxmox VMの電源状態を収束させる
  hosts: "{{ target | default('lab', true) }}"
  connection: local
  gather_facts: false
  vars:
    # connection: localでproxmoxerを利用できるコントローラ側Pythonへ固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/proxmox_api.yml"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ vault_proxmox_api_host }}"
      api_user: "{{ vault_proxmox_api_user }}"
      api_token_id: "{{ vault_proxmox_api_token_id }}"
      api_token_secret: "{{ vault_proxmox_api_token_secret }}"
      validate_certs: false

  tasks:
    - name: 電源状態の指定を確認する
      ansible.builtin.assert:
        that:
          - state is defined and state in ['started', 'stopped']
        fail_msg: >-
          state が未指定または不正です。
          -e state=started または -e state=stopped を指定してください。
        quiet: true

    - name: ホスト固有の必須変数が届いていることを確認する
      ansible.builtin.assert:
        that:
          - pve_power_missing_host_vars | length == 0
        fail_msg: >-
          {{ inventory_hostname }}: {{ pve_power_missing_host_vars | join(' / ') }}
          が未定義または空です。インベントリ実行では inventory/hosts.yml のホスト定義を、
          インベントリ外のVMでは -e profile= とあわせて -e vmid= -e node= -e ip= の指定を
          確認してください(docs/pve/adhoc.md)。
        quiet: true
      vars:
        pve_power_required_host_vars:
          vmid: "{{ vmid | default('', true) }}"
          node: "{{ node | default('', true) }}"
        pve_power_missing_host_vars: >-
          {{ pve_power_required_host_vars | dict2items
             | selectattr('value', 'eq', '')
             | map(attribute='key') | list }}

    - name: 対象VMを検索する
      ansible.builtin.import_role:
        name: pve
        tasks_from: find_vm
      vars:
        pve_vmid: "{{ vmid }}"
        # pve_vm_nameを上書きした既存VMでは、解決後のPVE上の実名を照合する。
        pve_expected_name: "{{ pve_vm_name | default(inventory_hostname) }}"
        pve_expected_node: "{{ node }}"

    # 停止には猶予時間と強制停止方針が必要だが、起動時はモジュール既定値を使う。
    - name: VMの電源状態を収束させる  # noqa: args[module]
      community.proxmox.proxmox_kvm:
        vmid: "{{ vmid }}"
        state: "{{ state }}"
        timeout: >-
          {{ (state == 'stopped')
             | ternary(pve_power_timeout | default(300), omit) }}
        force: >-
          {{ (state == 'stopped')
             | ternary(pve_power_force | default(false) | bool, omit) }}

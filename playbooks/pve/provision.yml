# VM を、テンプレートから作って宣言どおりにする(API だけを使い、VM へ SSH しない)。
# 先に template.yml で、VM を置くノードにテンプレートを作っておく。
# 実行例: ansible-playbook playbooks/pve/provision.yml -e target=k3s [-l k3s01]
---
# target を渡し忘れると、どのホストにも一致せず何もしない。
- name: VM を宣言どおりにする
  hosts: "{{ target | default('none') }}"
  connection: local
  gather_facts: false
  vars:
    # connection: local は proxmoxer を持たないシステムの Python を選ぶため、ansible 本体の Python に固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/proxmox.yml"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ hostvars[node | default(inventory_hostname)].ansible_host }}"
      api_user: "{{ vault_proxmox_token_id.split('!')[0] }}"
      api_token_id: "{{ vault_proxmox_token_id.split('!')[1] }}"
      api_token_secret: "{{ vault_proxmox_token_secret }}"
      validate_certs: "{{ pve_validate_certs | default(true) }}"
  roles:
    - pve_vm

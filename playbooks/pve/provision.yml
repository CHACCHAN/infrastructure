# テンプレート準備→クローン→設定→cloud-init→電源まで宣言どおりに収束させるPlaybook。
# 実行例: ansible-playbook playbooks/pve/provision.yml -l k8s
# 実行例: ansible-playbook playbooks/pve/provision.yml -l k3s-worker03
# 実行例: ansible-playbook playbooks/pve/provision.yml
# インベントリに無いVMを-eだけで構築する場合は docs/adhoc.md
---
# -e profile= を指定したときだけ、インベントリ外のVMを一時ホストとして宣言する。
- name: インベントリ外のVMを一時ホストとして宣言する
  ansible.builtin.import_playbook: adhoc.yml

- name: 未作成VMに必要なProxmoxテンプレートを収束させる
  hosts: "{{ target | default('lab') }}"
  connection: local
  gather_facts: false
  # 同一(OS,ノード)テンプレートを複数ホストが同時作成する競合を防ぐ。
  serial: 1
  vars:
    # connection: localでproxmoxerを利用できるコントローラ側Pythonへ固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/proxmox_api.yml"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ vault_proxmox_api_host }}"
      api_user: "{{ vault_proxmox_api_user }}"
      api_token_id: "{{ vault_proxmox_api_token_id }}"
      api_token_secret: "{{ vault_proxmox_api_token_secret }}"
      validate_certs: false

  tasks:
    - name: 対象VMを検索する
      ansible.builtin.import_role:
        name: pve
        tasks_from: find_vm
      vars:
        pve_vmid: "{{ vmid }}"
        pve_require_vm: false
        # pve_vm_nameを上書きした既存VMでは、解決後のPVE上の実名を照合する。
        pve_expected_name: "{{ pve_vm_name | default(inventory_hostname) }}"
        pve_expected_node: "{{ node }}"

    - name: 未作成VM用のテンプレートを収束させる
      ansible.builtin.include_role:
        name: pve_template
        apply:
          throttle: 1
      vars:
        pve_os: "{{ hostvars[inventory_hostname].pve_os | default('debian') }}"
        pve_os_version: >-
          {{ hostvars[inventory_hostname].pve_os_version | default('13') | string }}
        node: "{{ hostvars[inventory_hostname].node }}"
      when: pve_found_vm is none

- name: Proxmox VMを宣言どおりに収束させる
  hosts: "{{ target | default('lab') }}"
  connection: local
  gather_facts: false
  vars:
    # connection: localでproxmoxerを利用できるコントローラ側Pythonへ固定する。
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
    - "{{ playbook_dir }}/../../vault/proxmox_api.yml"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ vault_proxmox_api_host }}"
      api_user: "{{ vault_proxmox_api_user }}"
      api_token_id: "{{ vault_proxmox_api_token_id }}"
      api_token_secret: "{{ vault_proxmox_api_token_secret }}"
      validate_certs: false

  roles:
    - pve_vm

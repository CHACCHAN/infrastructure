# 起動済みのDebian VMにSSH接続し、Docker Composeでwg-easy(WireGuard + Web UI)を
# 構築します。VM内部の設定のみを行い、Proxmoxホスト側の操作は一切行いません。
#
# 認証は既定でOIDCを使います(パスワード認証も残ります)。
#   -e "wg_easy_init_host=vpn.example.com \
#       wg_easy_oauth_oidc_server=https://auth.example.com \
#       wg_easy_oauth_oidc_client_id=<ID> wg_easy_oauth_oidc_client_secret=<シークレット>"
---
- name: 接続先のVMホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: 対象VMをインベントリに登録して疎通を確認する
      ansible.builtin.import_role:
        name: vm_connect

- name: VPN(wg-easy)用VMを構築する
  hosts: vms
  gather_facts: true

  roles:
    - wg_easy

  # dockerグループへの追加とカーネル更新の反映に再起動が必要。
  # 再起動後はrestart: unless-stoppedでコンテナが復帰するので、
  # 最後に「実行元の端末から」Web UIが見えることまで確認する。
  post_tasks:
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: common
        tasks_from: reboot_vm

    # 待ち受けを絞っている場合はVMの外から見えないのが正しいため確認しない
    - name: 実行元の端末からWeb UIに接続できることを確認する
      ansible.builtin.uri:
        url: "http://{{ vm_ip }}:{{ wg_easy_ui_port | default(51821) }}/"
        status_code: [200, 302, 303]
        follow_redirects: none
      delegate_to: localhost
      become: false
      register: wg_easy_remote_web
      retries: 30
      delay: 10
      until: wg_easy_remote_web is succeeded
      changed_when: false
      when: wg_easy_published | bool

    - name: 構築結果と次の手順を表示する
      ansible.builtin.debug:
        msg:
          - "{{ 'Web UI: http://' ~ vm_ip ~ ':' ~ (wg_easy_ui_port | default(51821)) ~ '/'
                if (wg_easy_published | bool)
                else 'Web UI: 待ち受けを ' ~ (wg_easy_ui_bind | default('0.0.0.0'))
                     ~ ' に絞っています(VMの外からは見えません)' }}"
          - "{{ 'ログイン: ' ~ wg_easy_init_username ~ ' / パスワードは VM内の '
                 ~ (wg_easy_install_dir | default('/opt/wg-easy')) ~ '/.env(INIT_PASSWORD)'
                 if (wg_easy_init_enabled | bool)
                 else 'ログイン: ブラウザのセットアップウィザードで作成してください' }}"
          - "クライアントの接続先: {{ wg_easy_init_host | default('(ウィザードで設定)', true) }}:{{ wg_easy_wg_port | default(51820) }}/udp
             (ルーターでこのUDPポートをVMへ転送してください)"
          - "{{ 'OIDCのリダイレクトURI(プロバイダ側に登録): https://<公開URL>/api/auth/oidc/callback と /api/auth/oidc/link'
                if ('oidc' in (wg_easy_oauth_providers_resolved | default([]))) else '外部認証: 未設定' }}"
          - "ログ: ssh -i <秘密鍵> {{ vm_ssh_user }}@{{ vm_ip }}
             'sudo docker logs -f {{ wg_easy_container_name | default('wg-easy') }}'"

# 起動済みのDebian VMにSSH接続し、Docker Composeでcloudflare-ddns-uiを構築します。
# VM内部の設定のみを行い、Proxmoxホスト側の操作は一切行いません。
#
# 更新するレコードとCloudflareの認証情報は -e で指定します。
#   -e "cloudflare_ddns_ui_api_token=<トークン>
#       cloudflare_ddns_ui_zone_domain=<ゾーン> cloudflare_ddns_ui_zone_id=<ゾーンID>
#       cloudflare_ddns_ui_records=<FQDN>,<FQDN>"
---
- name: 接続先のVMホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: 対象VMをインベントリに登録して疎通を確認する
      ansible.builtin.import_role:
        name: vm_connect

- name: DDNS更新用VMを構築する
  hosts: vms
  gather_facts: true

  roles:
    - cloudflare_ddns_ui

  # dockerグループへの追加とカーネル更新の反映に再起動が必要。
  # 再起動後はrestart: unless-stoppedでコンテナが復帰するので、
  # 最後に「実行元の端末から」Web UIが見えることまで確認する。
  post_tasks:
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: common
        tasks_from: reboot_vm

    # 待ち受けを絞っている場合はVMの外から見えないのが正しいため確認しない
    - name: 実行元の端末からWeb UIに接続できることを確認する
      ansible.builtin.uri:
        url: "http://{{ vm_ip }}:{{ cloudflare_ddns_ui_http_port | default(8080) }}/"
        status_code: [200]
      delegate_to: localhost
      become: false
      register: cloudflare_ddns_ui_remote_web
      retries: 30
      delay: 10
      until: cloudflare_ddns_ui_remote_web is succeeded
      changed_when: false
      when: cloudflare_ddns_ui_published | bool

    - name: 接続先を表示する
      ansible.builtin.debug:
        msg:
          - "{{ 'Web UI: http://' ~ vm_ip ~ ':' ~ (cloudflare_ddns_ui_http_port | default(8080))
                ~ '/(⚠ 認証がありません。レコードの削除まで行える画面です)'
                if (cloudflare_ddns_ui_published | bool)
                else 'Web UI: 待ち受けを ' ~ (cloudflare_ddns_ui_http_bind | default('0.0.0.0'))
                     ~ ' に絞っています(VMの外からは見えません)' }}"
          - "更新対象: {{ cloudflare_ddns_ui_records_resolved | join(', ') }}(A レコードのみ)"
          - "設定の変更: -e の指定を変えて再実行してください
             (直接編集する場合は
             {{ cloudflare_ddns_ui_install_dir | default('/opt/cloudflare-ddns-ui') }}/config/config.json。
             Web UIでの変更も次回実行で上書きされます)"
          - "ログ: ssh -i <秘密鍵> {{ vm_ssh_user }}@{{ vm_ip }}
             'sudo tail -f {{ cloudflare_ddns_ui_install_dir | default('/opt/cloudflare-ddns-ui') }}/logs/ddns.log'"

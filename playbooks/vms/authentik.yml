# 起動済みのDebian VMにSSH接続し、Docker ComposeでAuthentikを構築します。
# VM内部の設定のみを行い、Proxmoxホスト側の操作は一切行いません。
---
- name: 接続先のVMホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: 対象VMをインベントリに登録して疎通を確認する
      ansible.builtin.import_role:
        name: vm_connect

- name: Authentik専用VMを構築する
  hosts: vms
  gather_facts: true

  roles:
    - authentik

  # dockerグループへの追加とカーネル更新の反映に再起動が必要。
  # 再起動後はrestart: unless-stoppedでコンテナが復帰するので、
  # 最後に「実行元の端末から」WebUIが見えることまで確認する。
  post_tasks:
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: common
        tasks_from: reboot_vm

    - name: 実行元の端末からWebUIに接続できることを確認する
      ansible.builtin.uri:
        url: "http://{{ vm_ip }}:{{ authentik_http_port | default(9000) }}/-/health/ready/"
        status_code: [200, 204]
      delegate_to: localhost
      become: false
      register: authentik_remote_health
      retries: 30
      delay: 10
      until: authentik_remote_health is succeeded
      changed_when: false

    - name: 接続先を表示する
      ansible.builtin.debug:
        msg:
          - "初期セットアップ(初回のみ): http://{{ vm_ip }}:{{ authentik_http_port | default(9000) }}/if/flow/initial-setup/"
          - "ログイン画面: http://{{ vm_ip }}:{{ authentik_http_port | default(9000) }}/"
          - "HTTPS: https://{{ vm_ip }}:{{ authentik_https_port | default(9443) }}/ (自己署名証明書のため警告が出ます)"

# 品質ゲート(レビューQA-01)。秘密検査とlintをPR必須チェックにする。
# syntax-checkはvault復号が必要なため、リポジトリシークレット ANSIBLE_VAULT_PASSWORD
# を設定した場合のみ実行される。
---
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: 秘密情報スキャン(作業ツリー+履歴)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: YAML / Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lintツールを導入する
        run: pip install yamllint ansible-lint
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        # 初期導入のため警告扱い。指摘を消化したらブロッキングへ昇格する
        run: ansible-lint || true

  syntax:
    name: 全playbookのsyntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ansibleとコレクションを導入する
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r collections/requirements.yml
      - name: Vaultパスワードを配置する(未設定ならskip)
        id: vault
        run: |
          if [ -n "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" ]; then
            install -m 600 /dev/null ~/.vault_pass
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.vault_pass
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: syntax-check
        if: steps.vault.outputs.available == 'true'
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ~/.vault_pass
        run: |
          for f in playbooks/pve/*.yml playbooks/vm/*.yml playbooks/k8s/*.yml; do
            ansible-playbook --syntax-check "$f"
          done

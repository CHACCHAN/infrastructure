# 全タスクは接続先のProxmoxホスト(-e proxmox_ip)上で直接実行される。
#
# 既存VMIDの状態ごとの挙動:
#   not_found       : 接続先ノードで新規構築する
#   found_on_target : 既に接続先ノードにあるので何もしない
#   found_on_other  : 別ノードの既存テンプレートを削除し、接続先ノードで新規構築する
---
- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

- name: 接続先のノード名を取得する
  ansible.builtin.import_role:
    name: proxmox_common
    tasks_from: detect_proxmox_node

- name: Cloud imageをダウンロードする
  ansible.builtin.import_tasks: download_image.yml

- name: 既存VMの状態を確認する
  ansible.builtin.import_tasks: check_existing.yml

- name: 別ノードに存在する場合、そちらの既存テンプレートを削除する
  ansible.builtin.import_tasks: remove_existing_on_other_node.yml
  when: proxmox_template_build_existing_state == 'found_on_other'

- name: 接続先ノードに存在しない場合、新規にテンプレートを構築する
  ansible.builtin.import_tasks: build_template.yml
  when: >-
    proxmox_template_build_existing_state == 'not_found' or
    proxmox_template_build_existing_state == 'found_on_other'

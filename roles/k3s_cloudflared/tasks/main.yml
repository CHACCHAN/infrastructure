---
- name: cloudflared を適用する
  ansible.builtin.include_role:
    name: k3s
  vars:
    helm_release_name: "{{ cloudflared_release_name }}"
    helm_chart: cloudflare-tunnel-remote
    helm_chart_repo_url: "{{ cloudflared_chart_repo_url }}"
    helm_chart_version: "{{ cloudflared_chart_version }}"
    helm_namespace: "{{ cloudflared_namespace }}"
    helm_values: "{{ __cloudflared_values | combine(cloudflared_values, recursive=True) }}"
    helm_no_log: true
    helm_network_policy: true
    helm_manifests:
      - "{{ __cloudflared_egress_policy }}"

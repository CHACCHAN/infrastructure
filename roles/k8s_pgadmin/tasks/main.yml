# 上流Helmチャート、公開経路、任意のSecretを順に収束させる。
---
# Secretを先に収束させる(これを参照するワークロードが待たずに起動できるように)

- name: pgadmin-admin Secretを描画する
  ansible.builtin.set_fact:
    k8s_pgadmin_pgadmin_admin_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: pgadmin-admin
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_pgadmin_admin }}"
  when: k8s_secret_pgadmin_admin is defined
  no_log: true

- name: pgadmin-admin SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_pgadmin_pgadmin_admin_secret_definition }}"
    k8s_apply_no_log: true
  when: k8s_secret_pgadmin_admin is defined

- name: pgadmin-oidc Secretを描画する
  ansible.builtin.set_fact:
    k8s_pgadmin_pgadmin_oidc_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: pgadmin-oidc
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_pgadmin_oidc }}"
  when: k8s_secret_pgadmin_oidc is defined
  no_log: true

- name: pgadmin-oidc SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_pgadmin_pgadmin_oidc_secret_definition }}"
    k8s_apply_no_log: true
  when: k8s_secret_pgadmin_oidc is defined

- name: pgadmin-db Secretを描画する
  ansible.builtin.set_fact:
    k8s_pgadmin_pgadmin_db_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: pgadmin-db
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_pgadmin_db }}"
  when: k8s_secret_pgadmin_db is defined
  no_log: true

- name: pgadmin-db SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_pgadmin_pgadmin_db_secret_definition }}"
    k8s_apply_no_log: true
  when: k8s_secret_pgadmin_db is defined
- name: pgadmin Helmチャートを描画して適用する
  ansible.builtin.import_role:
    name: k8s
    tasks_from: helm
  vars:
    k8s_helm_release: pgadmin
    k8s_helm_chart: pgadmin4
    k8s_helm_repo_url: https://helm.runix.net
    k8s_helm_version: "{{ k8s_pgadmin_helm_version }}"
    k8s_helm_namespace: platform
    k8s_helm_values: "{{ k8s_pgadmin_values }}"
    k8s_helm_no_hooks: true
    k8s_helm_include_crds: false
    k8s_helm_inject_namespace: false

- name: 公開Ingressを描画する
  ansible.builtin.set_fact:
    k8s_pgadmin_ingress_definition: "{{ lookup('ansible.builtin.template', 'ingress.yaml.j2') }}"

- name: 公開IngressをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_pgadmin_ingress_definition }}"

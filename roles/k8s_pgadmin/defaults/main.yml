# 上流チャートの固定バージョンと values。
---
k8s_pgadmin_helm_version: "1.66.0"
k8s_pgadmin_values:
  fullnameOverride: pgadmin

  # 設定 DB は PostgreSQL 側にあるので、Pod は付け替え可能。
  # それでも 1 のままにしているのは、/var/lib/pgadmin (セッション・
  # ストレージマネージャの作業領域) が RWO の PVC だから。
  replicaCount: 1

  ## 初期管理者
  #
  # パスワードは values に書かない。Secret から読ませる。
  # 既定値のまま (env.password) にすると平文が Deployment に埋まる。
  existingSecret: "pgadmin-admin"
  secretKeys:
    pgadminPasswordKey: "password"

  env:
    email: "{{ k8s_admin_email }}"

    ## Traefik の裏にいるので、クライアント IP でセッションを縛らない。
    ## True にすると Cloudflare Tunnel 経由と LAN 直の間でセッションが切れる。
    enhanced_cookie_protection: "False"

  ## config_local.py の中で参照する値を Secret から環境変数として流し込む。
  ##
  ##   pgadmin-oidc : PGADMIN_OAUTH2_CLIENT_ID / PGADMIN_OAUTH2_CLIENT_SECRET
  ##   pgadmin-db   : PGADMIN_DB_URI (設定 DB の接続 URL。パスワードを含む)
  ##
  ## envFrom なので、Secret のキー名がそのまま環境変数名になる。
  ## 実値は vault/k8s_secrets.yml。
  envVarsFromSecrets:
    - pgadmin-oidc
    - pgadmin-db

  ## config_local.py を /pgadmin4/config_local.py にマウントする。
  ##
  ## pgAdmin の設定の優先順位は
  ##   config_local.py > PGADMIN_CONFIG_* 環境変数 > config_distro.py > config.py
  ## なので、ここが最終的に勝つ。
  ##
  ## ConfigMap の中身は下の extraDeploy にある。
  extraConfigmapMounts:
    - name: config-local
      configMap: pgadmin-config-local
      mountPath: /pgadmin4/config_local.py
      subPath: config_local.py
      readOnly: true
      # 既定の 256 (0400) だと root しか読めず、pgAdmin は uid 5050 で
      # 動いているので読めない。0444 にする。
      defaultMode: 292

  ## 上流チャートには OIDC 用の値も設定 DB 用の値も無い。
  ## pgAdmin 側が「config.py の項目は config_local.py で上書きできる」
  ## という作りなので、ファイルを 1 枚書いて食わせている。
  ##
  ## extraDeploy はチャートがそのまま出力する追加マニフェスト。
  ## ここに置くことで、このアプリの設定が values に閉じる。
  ##
  ## **秘密情報はここに書かない。** クライアントシークレットと DB の
  ## パスワードは Secret から環境変数で渡し、os.environ で読む
  ## (上の envVarsFromSecrets)。
  extraDeploy:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: pgadmin-config-local
        namespace: platform
        labels:
          app.kubernetes.io/name: pgadmin4
          app.kubernetes.io/component: config
      data:
        config_local.py: |
          import os

          # --- 設定 DB -------------------------------------------------------
          # 既定では /var/lib/pgadmin/pgadmin4.db (SQLite)。
          # platform 共用の PostgreSQL に置き換える。
          # 接続 URL はパスワードを含むので Secret pgadmin-db から受け取る。
          #   postgresql://postgres:<pw>@postgresql.platform.svc.cluster.local:5432/pgadmin
          CONFIG_DATABASE_URI = os.environ['PGADMIN_DB_URI']

          # --- 認証 ----------------------------------------------------------
          # oauth2 と internal を両方有効にしている。
          # Authentik はクラスタ外 (172.16.11.2) で動いているので、
          # そちらが落ちたときの退避経路としてローカルログインを残す。
          # OIDC だけにするなら ['oauth2'] にする。
          AUTHENTICATION_SOURCES = ['oauth2', 'internal']

          # OIDC で入ってきた未知のユーザを自動で作る。
          # False だと、先に pgAdmin 側で同じメールアドレスのユーザを
          # 作っておかないとログインできない。
          OAUTH2_AUTO_CREATE_USER = True

          # 自動作成されたユーザのロールは 'User' (自分のサーバ定義だけ触れる)。
          # 管理者にしたい場合は、ログイン後に internal の管理者アカウントから
          # Administrator へ昇格させる。
          #
          # なお、サーバ接続のパスワードを保存する機能は OIDC ログインだと
          # そのままでは使えない。pgAdmin は「ログインパスワード」を鍵にして
          # 暗号化するが、OIDC にはそれが無いため。
          # 保存したい場合は MASTER_PASSWORD_HOOK に鍵を返すスクリプトを渡す。
          # 設定していないので、接続のたびにパスワードを入力することになる。

          OAUTH2_CONFIG = [
              {
                  'OAUTH2_NAME': 'authentik',
                  'OAUTH2_DISPLAY_NAME': 'Authentik',

                  # Secret pgadmin-oidc から環境変数で受け取る。
                  'OAUTH2_CLIENT_ID': os.environ['PGADMIN_OAUTH2_CLIENT_ID'],
                  'OAUTH2_CLIENT_SECRET': os.environ['PGADMIN_OAUTH2_CLIENT_SECRET'],

                  # discovery を引ければ authorize / token / userinfo は自動で決まる。
                  # <slug> は Authentik の Application の Slug。ここでは pgadmin。
                  'OAUTH2_SERVER_METADATA_URL':
                      'https://auth.{{ k8s_domain }}/application/o/pga/.well-known/openid-configuration',

                  # discovery が使えないときのために個別にも書いておく
                  # (両方あるときは metadata URL が優先される)。
                  'OAUTH2_API_BASE_URL': 'https://auth.{{ k8s_domain }}/',
                  'OAUTH2_AUTHORIZATION_URL': 'https://auth.{{ k8s_domain }}/application/o/authorize/',
                  'OAUTH2_TOKEN_URL': 'https://auth.{{ k8s_domain }}/application/o/token/',
                  'OAUTH2_USERINFO_ENDPOINT': 'https://auth.{{ k8s_domain }}/application/o/userinfo/',

                  'OAUTH2_SCOPE': 'openid email profile',

                  # pgAdmin のユーザ名として使うクレーム。
                  # pgAdmin はユーザをメールアドレスで識別するので email にする。
                  'OAUTH2_USERNAME_CLAIM': 'email',

                  # ログイン画面のボタンの見た目。
                  'OAUTH2_ICON': 'fa-key',
                  'OAUTH2_BUTTON_COLOR': '#fd4b2d',

                  # Authentik の証明書は Let's Encrypt なので検証する。
                  'OAUTH2_SSL_CERT_VERIFICATION': True,
              },
          ]

  ## 設定 DB は PostgreSQL に置いているので、ここに残るのは
  ## セッションとストレージマネージャの作業領域だけ。既定の 10Gi は要らない。
  persistentVolume:
    enabled: true
    storageClass: truenas-nfs
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  ## 経路の書き方をリポジトリ全体で 1 箇所に揃えるため、上流の ingress は使わない。
  ## 実体は同ディレクトリの ingress.yaml。
  ingress:
    enabled: false

  ## Gateway API も Istio も使っていない。
  httpRoute:
    enabled: false
  istioIngress:
    enabled: false

  ## helm test 用の Pod。helm リリースを作らない運用なので出力させない
  ## (--no-hooks でも除外されるが、二重に止めておく)。
  test:
    enabled: false

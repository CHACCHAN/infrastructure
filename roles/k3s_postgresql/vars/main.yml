# DB とその所有者のロール、ロールのパスワードの Secret。
---
# 所有者のロールのパスワード。初期化(initdb)と、パスワードの更新(managed roles)の両方が読む
__postgresql_owner_secret: "{{ postgresql_release_name }}-owner"
__postgresql_secrets:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: "{{ __postgresql_owner_secret }}"
      namespace: "{{ postgresql_namespace }}"
      labels:
        cnpg.io/reload: "true"
    type: kubernetes.io/basic-auth
    data:
      username: "{{ postgresql_database | b64encode }}"
      password: "{{ postgresql_password | b64encode }}"
__postgresql_values:
  fullnameOverride: "{{ postgresql_release_name }}"
  cluster:
    instances: "{{ postgresql_instances }}"
    imageName: "{{ postgresql_image }}:{{ postgresql_version }}"
    enableSuperuserAccess: false
    # インスタンスが1つのとき、PodDisruptionBudget はノードの退避(drain)を止めてしまう
    enablePDB: "{{ postgresql_instances | int > 1 }}"
    storage:
      size: "{{ postgresql_storage_size }}"
    # 最初の DB は、所有者のロールと一緒に初期化で作る(既定の app の DB とロールを作らない)
    initdb:
      database: "{{ postgresql_database }}"
      owner: "{{ postgresql_database }}"
      secret:
        name: "{{ __postgresql_owner_secret }}"
    roles:
      - name: "{{ postgresql_database }}"
        ensure: present
        login: true
        passwordSecret:
          name: "{{ __postgresql_owner_secret }}"
  databases:
    - name: "{{ postgresql_database }}"
      owner: "{{ postgresql_database }}"
      extensions: "{{ postgresql_extensions | map('community.general.dict_kv', 'name') | list }}"

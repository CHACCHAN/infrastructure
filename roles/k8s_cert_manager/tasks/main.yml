# 上流Helmチャート、公開経路、任意のSecretを順に収束させる。
---
- name: cert-manager Helmチャートを描画して適用する
  ansible.builtin.import_role:
    name: k8s
    tasks_from: helm
  vars:
    k8s_helm_release: cert-manager
    k8s_helm_chart: cert-manager
    k8s_helm_repo_url: https://charts.jetstack.io
    k8s_helm_version: "{{ k8s_cert_manager_helm_version }}"
    k8s_helm_namespace: cert-manager
    k8s_helm_values: "{{ k8s_cert_manager_values }}"
    k8s_helm_no_hooks: true
    k8s_helm_include_crds: false
    k8s_helm_inject_namespace: false

- name: cert-manager webhook Deploymentを取得する
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager-webhook
    namespace: cert-manager
  register: k8s_cert_manager_webhook
  until: >-
    k8s_cert_manager_webhook.resources | length > 0 and
    (k8s_cert_manager_webhook.resources[0].status.conditions | default([])
    | selectattr('type', 'equalto', 'Available')
    | selectattr('status', 'equalto', 'True') | list | length > 0)
  retries: 36
  delay: 5
  when: not ansible_check_mode

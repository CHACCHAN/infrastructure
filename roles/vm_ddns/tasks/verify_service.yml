# VM内から見た確認。VM外から見えるかどうかは、再起動後にplaybook側で行う。
#
# このアプリにはヘルスチェックが無いため、起動直後に走る1回目のレコード確認の
# 結果を動作ログ(logs/ddns.log)から拾って判定する。
---
# 設定に誤りがあるとコンテナは起動直後に落ちて再起動を繰り返す。この状態でも
# 公開ポートはDocker側が掴んだままなので、ポートやHTTPの確認では
# 「接続を拒否されました」としか分からない。先にコンテナ自体の状態を見る。
- name: コンテナが起動し続けていることを確認する
  block:
    - name: コンテナの状態を問い合わせる
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          # Config.Env(秘密情報)を取り込まないよう、必要な項目だけを取り出す
          - >-
            {% raw %}{"status": "{{.State.Status}}",
            "restarts": {{.RestartCount}}}{% endraw %}
          - "{{ ddns_container_name }}"
      become: true
      changed_when: false
      register: ddns_state_first
      retries: 6
      delay: 5
      until: >-
        ((ddns_state_first.stdout | default('') | trim | length) > 0)
        and (((ddns_state_first.stdout | default('{}', true) | from_json).status
              | default('')) == 'running')

    # 起動直後に落ちて再起動を繰り返す状態は、一定時間おいて再起動回数が
    # 増えるかどうかで判定する(過去の再起動回数そのものは異常ではない)。
    - name: 再起動が続いていないか確かめるため待機する
      ansible.builtin.pause:
        seconds: "{{ ddns_restart_check_delay }}"

    - name: 待機後のコンテナの状態を問い合わせる
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - >-
            {% raw %}{"status": "{{.State.Status}}",
            "restarts": {{.RestartCount}}}{% endraw %}
          - "{{ ddns_container_name }}"
      become: true
      changed_when: false
      register: ddns_state_second

    - name: 待機中に再起動していないことを確認する
      ansible.builtin.assert:
        that:
          - >-
            ((ddns_state_second.stdout | default('{}', true) | from_json).status
             | default('')) == 'running'
          - >-
            ((ddns_state_second.stdout | default('{}', true) | from_json).restarts
             | default(0) | int)
            <= ((ddns_state_first.stdout | default('{}', true) | from_json).restarts
                | default(0) | int)
        fail_msg: >-
          コンテナ {{ ddns_container_name }} の再起動回数が
          {{ ddns_restart_check_delay }}秒の間に増えました。
        quiet: true

  rescue:
    - name: コンテナのログを取得する
      ansible.builtin.command:
        cmd: docker logs --tail 30 {{ ddns_container_name }}
      become: true
      changed_when: false
      failed_when: false
      register: ddns_docker_logs

    - name: 起動に失敗したことを通知する
      ansible.builtin.fail:
        msg: >-
          コンテナ {{ ddns_container_name }} が起動し続けられていません
          (再起動を繰り返している可能性があります)。直近のログ:
          {{ ((ddns_docker_logs.stdout_lines | default([]))
              + (ddns_docker_logs.stderr_lines | default([])))[-15:] | join(' / ') }}

- name: Web UIのポートが待ち受けるまで待機する
  ansible.builtin.wait_for:
    host: "{{ ddns_check_host }}"
    port: "{{ ddns_http_port }}"
    timeout: 180
    state: started

- name: Web UIが応答するまで待機する
  ansible.builtin.uri:
    url: "http://{{ ddns_check_host }}:{{ ddns_http_port }}/"
    status_code: [200]
  register: ddns_web
  retries: "{{ ddns_ready_retries }}"
  delay: "{{ ddns_ready_delay }}"
  until: ddns_web is succeeded
  changed_when: false

# 起動直後に1回目の確認が走る(以降は ddns_interval ごと)。
# 全レコードがログに現れるまで待ってから、成功したかどうかを判定する。
- name: 1回目のレコード確認が終わるまで待機する
  block:
    - name: 動作ログを読む
      ansible.builtin.command:
        cmd: tail -n 500 {{ ddns_install_dir }}/logs/ddns.log
      become: true
      changed_when: false
      failed_when: false
      register: ddns_log_tail
      retries: "{{ ddns_check_retries }}"
      delay: "{{ ddns_check_delay }}"
      until: >-
        (ddns_records_resolved
         | reject('in', ddns_log_tail.stdout | default(''))
         | list | length) == 0

  rescue:
    - name: 確認できなかったことを記録する
      ansible.builtin.debug:
        msg: >-
          【注意】
          {{ (ddns_check_retries | int) * (ddns_check_delay | int) }}秒待っても
          全レコードの確認結果がログに出ませんでした。構築自体は完了しています。

- name: レコードごとの結果を判定する
  ansible.builtin.set_fact:
    ddns_failed_records: >-
      {{ ddns_records_resolved
         | reject('in', ddns_success_text) | list }}
  vars:
    # 「更新済み」「更新した」と読める行だけを集めて、レコード名で突き合わせる
    ddns_success_text: >-
      {{ (ddns_log_tail.stdout_lines | default([]))
         | select('search', '(is already up to date|Successfully updated)')
         | list | join(' ') }}

- name: レコードの更新結果を表示する
  ansible.builtin.debug:
    msg: >-
      {{
        '全レコードが公開IPを指しています('
        ~ (ddns_records_resolved | join(', ')) ~ ')。'
        if ((ddns_failed_records | length) == 0)
        else
        '【注意】更新を確認できないレコードがあります('
        ~ (ddns_failed_records | join(', ')) ~ ')。構築自体は完了しています。'
        ~ 'Cloudflare側にそのAレコードが存在するか、APIトークンに対象ゾーンの'
        ~ 'DNS編集権限があるかを確認してください。詳しくは '
        ~ 'sudo tail -50 ' ~ ddns_install_dir ~ '/logs/ddns.log をご覧ください。'
      }}

- name: Web UIの案内を表示する
  ansible.builtin.debug:
    msg:
      - "{{ ddns_web_hint }}"
      - "更新対象: {{ ddns_records_resolved | join(', ') }}(A レコードのみ)"
      - "動作ログ: {{ ddns_install_dir }}/logs/ddns.log"
  vars:
    ddns_vm_address: "{{ ansible_host | default(inventory_hostname) }}"
    ddns_web_hint: >-
      {{
        'Web UI: http://' ~ ddns_vm_address ~ ':'
        ~ ddns_http_port ~ '/(⚠ 認証はありません)'
        if (ddns_published | bool)
        else
        'Web UI: 待ち受けを ' ~ ddns_http_bind
        ~ ' に絞っているためVMの外からは見えません(手元から見る場合: ssh -L '
        ~ ddns_http_port ~ ':' ~ ddns_check_host ~ ':'
        ~ ddns_http_port ~ ' <SSHユーザ名>@' ~ ddns_vm_address
        ~ ' → http://127.0.0.1:' ~ ddns_http_port ~ '/)'
      }}

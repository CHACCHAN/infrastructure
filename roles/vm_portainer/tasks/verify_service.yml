# VM内から見た確認(死活エンドポイント /api/status は認証不要)。
# VM外から見えるかどうかは、再起動後にplaybook側で行う。
---
- name: Web UIの疎通を確認する
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ portainer_http_port }}/api/status"
    status_code: [200]
  register: portainer_status
  retries: "{{ portainer_ready_retries }}"
  delay: "{{ portainer_ready_delay }}"
  until: portainer_status is succeeded
  changed_when: false

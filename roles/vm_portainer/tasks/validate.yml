# 以降のタスクが参照する値をここで検証する。
---
- name: 必須変数が正しく渡されているか検証する
  ansible.builtin.assert:
    that:
      - ansible_user is defined
      - (ansible_user | default('', true)) | length > 0
    fail_msg: >-
      ansible_user が指定されていません。
      -e "ansible_user=<ユーザ名>" で指定してください。
    quiet: true

- name: 設置ディレクトリが絶対パスであることを検証する
  ansible.builtin.assert:
    that:
      - portainer_install_dir is match('^/.+')
    fail_msg: >-
      portainer_install_dir は絶対パスで指定してください
      (指定値: {{ portainer_install_dir }})。
    quiet: true

- name: 公開ポートの範囲を検証する
  ansible.builtin.assert:
    that:
      - portainer_http_port | int > 0
      - portainer_http_port | int < 65536
    fail_msg: >-
      portainer_http_port は1〜65535の範囲で指定してください
      (指定値: {{ portainer_http_port }})。
    quiet: true

- name: 構築する内容を表示する
  ansible.builtin.debug:
    msg: >-
      {{ ansible_host }} に Portainer Business Edition {{ portainer_version }} を構築します
      / Web UI(HTTP) :{{ portainer_http_port }}
      / 初回セットアップ(管理者作成とライセンスキー入力)はWeb UIで行います

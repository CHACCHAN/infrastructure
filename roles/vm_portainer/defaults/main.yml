# タイムゾーン(vm_timezone)・ロケール(vm_locale)・zram(vm_zram_percent)の
# 既定値は roles/vm/defaults/main.yml にある。
---
portainer_install_dir: /opt/portainer
portainer_container_name: portainer

# Business Edition(3ノードまで無料。初回セットアップでライセンスキーの入力が必要)。
# バージョンはLTS系を固定する(2.44系はSTS)。更新はこの値を上げて再実行するだけ
portainer_image: portainer/portainer-ee
portainer_version: "2.39.7"

# Web UI(HTTP)。TLSはメインクラスタのTraefikで終端するため、--http-enabled で
# HTTP待受(:9000)を有効化して使う。既定のHTTPS(:9443)は公開しない
portainer_http_port: 9000

# イメージ取得前に必要とする空き容量(GiB)
portainer_min_free_disk_gb: 3

# Web UIの起動待ち(リトライ回数 / 間隔(秒))
portainer_ready_retries: 30
portainer_ready_delay: 5

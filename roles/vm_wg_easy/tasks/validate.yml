# wg-easyは環境変数の組み合わせに決まりがある(まとめて指定しないと初期セットアップが
# 行われない、OIDCは3つセット、など)。誤った組み合わせのまま起動すると
# 「ウィザードが出たまま」「ログインできない」といった分かりにくい状態になるため、
# コンテナを動かす前にここで弾く。
#
# パスワードやクライアントシークレットを含むため、値そのものはメッセージに出さない。
---
- name: 必須変数が正しく渡されているか検証する
  ansible.builtin.assert:
    that:
      - vm_ssh_user is defined
      - (vm_ssh_user | default('', true)) | length > 0
    fail_msg: >-
      vm_ssh_user が指定されていません。
      -e "vm_ssh_user=<ユーザ名>" で指定してください。
    quiet: true

- name: 設置ディレクトリが絶対パスであることを検証する
  ansible.builtin.assert:
    that:
      - wg_easy_install_dir is match('^/.+')
    fail_msg: >-
      wg_easy_install_dir は絶対パスで指定してください
      (指定値: {{ wg_easy_install_dir }})。
    quiet: true

- name: 公開ポートの範囲を検証する
  ansible.builtin.assert:
    that:
      - item.value | int > 0
      - item.value | int < 65536
    fail_msg: >-
      {{ item.name }} は1〜65535の範囲で指定してください(指定値: {{ item.value }})。
    quiet: true
  loop:
    - {name: wg_easy_wg_port, value: "{{ wg_easy_wg_port }}"}
    - {name: wg_easy_ui_port, value: "{{ wg_easy_ui_port }}"}
  loop_control:
    label: "{{ item.name }}"

- name: 初期セットアップの指定を決定する
  ansible.builtin.set_fact:
    # クライアントの接続先ポートは、未指定ならWireGuardの公開ポートと同じにする
    wg_easy_init_port_resolved: "{{ wg_easy_init_port | default(wg_easy_wg_port, true) }}"
    wg_easy_oauth_providers_resolved: >-
      {{ (wg_easy_oauth_providers | default('', true)).split(',')
         | map('trim') | reject('equalto', '') | list }}

# INIT_USERNAME / INIT_PASSWORD / INIT_HOST / INIT_PORT は「グループ1」で、
# 1つでも欠けるとセットアップが飛ばされない(wg-easyの仕様)。
# パスワードは未指定なら自動生成するため、ここではホスト名だけを求める。
- name: 初期セットアップに必要な接続先が指定されていることを検証する
  ansible.builtin.assert:
    that:
      - (wg_easy_init_host | default('', true)) | length > 0
      - (wg_easy_init_username | default('', true)) | length > 0
      - (wg_easy_init_port_resolved | int) > 0
    fail_msg: >-
      初期セットアップ(wg_easy_init_enabled=true)には、クライアントの接続先が必要です。
      -e "wg_easy_init_host=vpn.example.com" のように、**クライアントから見た**
      FQDNまたはグローバルIPを指定してください
      (VMのLAN内IPではありません)。
      ブラウザのウィザードで設定する場合は -e "wg_easy_init_enabled=false" にしてください。
    quiet: true
  when: wg_easy_init_enabled | bool

# INIT_IPV4_CIDR と INIT_IPV6_CIDR は「グループ3」でセット指定が必要
- name: VPNのアドレス範囲がセットで指定されていることを検証する
  ansible.builtin.assert:
    that:
      - ((wg_easy_init_ipv4_cidr | default('', true)) | length > 0)
        == ((wg_easy_init_ipv6_cidr | default('', true)) | length > 0)
    fail_msg: >-
      wg_easy_init_ipv4_cidr と wg_easy_init_ipv6_cidr は、wg-easyの仕様により
      両方セットで指定する必要があります(片方だけの指定は無視されます)。
      既定のまま(未指定)にするか、両方を指定してください。
    quiet: true
  when: wg_easy_init_enabled | bool

- name: 認証プロバイダの指定を検証する
  ansible.builtin.assert:
    that:
      - (wg_easy_oauth_providers_resolved | reject('in', ['oidc', 'google', 'github'])
         | list | length) == 0
    fail_msg: >-
      wg_easy_oauth_providers には oidc / google / github をカンマ区切りで指定してください
      (指定値: {{ wg_easy_oauth_providers }})。
      外部認証を使わない場合は空文字にしてください。
    quiet: true

- name: OIDCの設定が揃っていることを検証する
  ansible.builtin.assert:
    that:
      - (wg_easy_oauth_oidc_server | default('', true)) | length > 0
      - (wg_easy_oauth_oidc_client_id | default('', true)) | length > 0
      - (wg_easy_oauth_oidc_client_secret | default('', true)) | length > 0
    fail_msg: >-
      OIDCを使うには、サーバー・クライアントID・クライアントシークレットの3つが必要です。
      -e "wg_easy_oauth_oidc_server=https://auth.example.com
      wg_easy_oauth_oidc_client_id=<ID> wg_easy_oauth_oidc_client_secret=<シークレット>"
      のように指定してください
      (プロバイダ側にはリダイレクトURIの登録も必要です。docs/vms/wg-easy.md を参照)。
      OIDCを使わない場合は -e "wg_easy_oauth_providers=" にしてください。
    quiet: true
  when: "'oidc' in wg_easy_oauth_providers_resolved"

- name: Googleの設定が揃っていることを検証する
  ansible.builtin.assert:
    that:
      - (wg_easy_oauth_google_client_id | default('', true)) | length > 0
      - (wg_easy_oauth_google_client_secret | default('', true)) | length > 0
    fail_msg: >-
      Googleを使うには wg_easy_oauth_google_client_id と
      wg_easy_oauth_google_client_secret の両方が必要です。
    quiet: true
  when: "'google' in wg_easy_oauth_providers_resolved"

- name: GitHubの設定が揃っていることを検証する
  ansible.builtin.assert:
    that:
      - (wg_easy_oauth_github_client_id | default('', true)) | length > 0
      - (wg_easy_oauth_github_client_secret | default('', true)) | length > 0
    fail_msg: >-
      GitHubを使うには wg_easy_oauth_github_client_id と
      wg_easy_oauth_github_client_secret の両方が必要です。
    quiet: true
  when: "'github' in wg_easy_oauth_providers_resolved"

# 外部認証が無い状態でパスワード認証を切ると、誰もログインできなくなる
- name: パスワード認証を無効にできる状態か検証する
  ansible.builtin.assert:
    that:
      - (wg_easy_oauth_providers_resolved | length) > 0
    fail_msg: >-
      wg_easy_disable_password_auth を有効にするには、外部認証プロバイダの設定が必要です
      (どちらも無いとログイン手段が無くなります)。
    quiet: true
  when: wg_easy_disable_password_auth | bool

# OIDCの紐付けが済む前にパスワード認証を切ると締め出されるため、警告だけ出す
- name: パスワード認証の無効化に注意を促す
  ansible.builtin.debug:
    msg: >-
      【注意】パスワード認証を無効化します。管理者アカウントと
      {{ wg_easy_oauth_providers_resolved | join(', ') }} の紐付けが済んでいない場合、
      この構築後はログインできなくなります。先に一度パスワードでログインして
      アカウントを紐付けてから有効にしてください。
  when: wg_easy_disable_password_auth | bool

# Web UIの疎通確認先。待ち受けアドレスを絞っている場合はそのアドレスに問い合わせる
- name: 動作確認に使うアドレスを決定する
  ansible.builtin.set_fact:
    wg_easy_check_host: >-
      {{ '127.0.0.1'
         if (wg_easy_ui_bind in ['0.0.0.0', '::', ''])
         else wg_easy_ui_bind }}
    # 待ち受けを絞っている場合、VMの外(実行元の端末)からは確認できない
    wg_easy_published: >-
      {{ wg_easy_ui_bind in ['0.0.0.0', '::', ''] }}

- name: 構築する内容を表示する
  ansible.builtin.debug:
    msg: >-
      {{ vm_ip }} に wg-easy {{ wg_easy_version }} を構築します
      / VPN {{ wg_easy_init_host | default('(ウィザードで設定)', true) }}:{{ wg_easy_wg_port }}/udp
      / Web UI {{ wg_easy_ui_bind }}:{{ wg_easy_ui_port }}
      / 認証 {{ (wg_easy_oauth_providers_resolved | join(', ')) | default('パスワードのみ', true) }}
      {{ '(パスワード認証は無効)' if (wg_easy_disable_password_auth | bool) else '' }}
      / IPv6 {{ '無効' if (wg_easy_disable_ipv6 | bool) else '有効' }}
      / 初期セットアップ {{ '自動' if (wg_easy_init_enabled | bool) else 'ブラウザのウィザード' }}

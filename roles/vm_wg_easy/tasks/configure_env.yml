# 管理者パスワードは「-e の指定 > 既存の.env > 自動生成」の順で決める。
# INIT_* が実際に効くのは初回起動時だけなので、再実行で.envを書き換えても
# 管理者パスワードは変わらない。手元の.envと実際のパスワードがずれないよう、
# 再実行時は既存の値を引き継ぐ。
#
# .env にはOIDCのクライアントシークレットも入るため、
# dockerグループのみ読み取り可(0640)にしてno_logで出力も抑止する。
---
- name: 既存の.envファイルを読み込む
  ansible.builtin.import_role:
    name: vm
    tasks_from: load_existing_env
  vars:
    svc_env_path: "{{ wg_easy_install_dir }}/.env"

- name: 既存の.envから引き継ぐ値を取り出す
  ansible.builtin.set_fact:
    wg_easy_env_password: >-
      {{ (vm_existing_env
          | regex_search('^INIT_PASSWORD=(.*)$', '\1', multiline=True)
          | default([], true)) | join('') }}
  no_log: true

# .env は KEY=VALUE 形式で読まれるため、記号を含むパスワードは扱いにくい。
# 自動生成では英数字だけを使い、長さで強度を確保する
- name: 使用する管理者パスワードを決定する
  ansible.builtin.set_fact:
    wg_easy_init_password_resolved: >-
      {{ wg_easy_init_password | default(wg_easy_env_password, true)
         | default(lookup('ansible.builtin.password', '/dev/null',
                          length=32, chars=['ascii_letters', 'digits']), true) }}
  no_log: true

- name: 環境変数(.env)を配置する
  ansible.builtin.template:
    src: env.j2
    dest: "{{ wg_easy_install_dir }}/.env"
    owner: root
    group: docker
    mode: "0640"
  become: true
  no_log: true
  register: wg_easy_env_file

- name: 管理者パスワードの保存先を表示する
  ansible.builtin.debug:
    msg: >-
      管理者({{ wg_easy_init_username }})のパスワードは
      {{ wg_easy_install_dir }}/.env にあります
      (sudo grep INIT_PASSWORD {{ wg_easy_install_dir }}/.env)。
      パスワードの変更はWeb UI側で行ってください(.envを書き換えても反映されません)。
  when: wg_easy_init_enabled | bool

---
- name: 管理 UI に掛けるミドルウェアがあることを確認する
  ansible.builtin.assert:
    that: longhorn_ingress_middleware is match('.+@kubernetescrd$')
    fail_msg: "管理 UI は認証を持たないため、longhorn_ingress_middleware には認証プロキシのミドルウェア(<namespace>-<名前>@kubernetescrd)を渡す"
    quiet: true

- name: Longhorn を適用する
  ansible.builtin.include_role:
    name: k3s
  vars:
    helm_release_name: "{{ longhorn_release_name }}"
    helm_chart: longhorn
    helm_chart_repo_url: "{{ longhorn_chart_repo_url }}"
    helm_chart_version: "{{ longhorn_chart_version }}"
    helm_namespace: "{{ longhorn_namespace }}"
    helm_timeout: "{{ longhorn_timeout }}"
    helm_values: "{{ __longhorn_values | combine(longhorn_values, recursive=True) }}"
    helm_ingress:
      host: "{{ longhorn_host }}"
      service_name: longhorn-frontend
      service_port: 80
      middlewares:
        - "{{ longhorn_ingress_middleware }}"
    # 管理 UI の Pod へ届く経路を、Traefik(認証プロキシを通る)に限る
    helm_network_policy: true
    helm_network_policy_pod_labels:
      app: longhorn-ui

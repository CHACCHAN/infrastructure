# Longhorn(分散ブロックストレージ)を Helm で入れ、既定の StorageClass にするロールの既定値。
# ノードの前提パッケージ・カーネルモジュールは vm_k3s が用意する。管理 UI の公開ホスト名(longhorn_host)は、既定値を持たない。
---
# チャートのバージョン
longhorn_chart_version: "1.13.0"
longhorn_chart_repo_url: https://charts.longhorn.io
longhorn_release_name: longhorn
longhorn_namespace: longhorn-system
# ボリュームの複製数。ノードが1台の間は1にし、2台目が参加したら2に上げる(docs/design/k3s.md)
longhorn_replica_count: 1
# CSI・マネージャー・UI の Pod の数。ノードの数に合わせる
longhorn_control_replicas: 1
# ノード停止時に、ボリュームを持つ Pod を削除して別ノードで復帰させる方針
longhorn_node_down_pod_deletion_policy: delete-both-statefulset-and-deployment-pod
# ノードあたりの同時リビルド数(リビルド中の帯域の圧迫を抑える)
longhorn_concurrent_rebuild_limit: 1
# 管理 UI の Ingress に掛ける、Authentik の認証プロキシのミドルウェア(管理 UI は認証を持たないため、必ず掛ける)
longhorn_ingress_middleware: authentik-forward-auth@kubernetescrd
# Ready を待つ時間
longhorn_timeout: 15m
# Helm values の上書き(基本値へ再帰的に合成する)
longhorn_values: {}

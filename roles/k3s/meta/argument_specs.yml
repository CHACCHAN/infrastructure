---
argument_specs:
  main:
    short_description: k3s のクラスタへ Helm のリリースを適用する
    description:
      - kubeconfig を使わず、ServiceAccount のトークンで Kubernetes API に接続する。
      - 認証局の証明書は、実行の間だけ tmpfs に書き出す。
      - 各 k3s_<app> ロールが include_role で呼び、チャートとバージョンと values を渡す。
    options:
      helm_api_host:
        type: str
        description: "Kubernetes API の URL"
      helm_api_token:
        type: str
        required: true
        no_log: true
        description: "ServiceAccount のトークン(vault/k3s.yml の vault_k3s_api_token)"
      helm_ca_cert:
        type: str
        required: true
        no_log: true
        description: "API の認証局の証明書(PEM。vault/k3s.yml の vault_k3s_ca_cert)"
      helm_release_name:
        type: str
        required: true
        description: "Helm のリリース名"
      helm_chart:
        type: str
        description: "チャートの名前(helm_chart_repo_url があるときはリポジトリ内の名前)。空なら Helm のリリースを作らず、helm_manifests などのマニフェストだけを適用する"
      helm_chart_repo_url:
        type: str
        description: "チャートの配布元の URL。使わないときは空"
      helm_chart_version:
        type: str
        description: "チャートのバージョン(各 k3s_<app> の defaults にだけ書く)。helm_chart があるときは必ず渡す"
      helm_namespace:
        type: str
        required: true
        description: "リリースの namespace"
      helm_create_namespace:
        type: bool
        description: "namespace が無ければ作る"
      helm_values:
        type: dict
        description: "チャートの values"
      helm_secrets:
        type: list
        elements: dict
        no_log: true
        description: "リリースの適用前に適用する Secret(data に base64 で書く)。各 Secret を宣言どおりに置き換えるため、ラベル・すべてのキー・type(Opaque 以外のとき)を含む完全な定義が必要。定義にないキー・ラベル・アノテーションは削除される"
      helm_manifests:
        type: list
        elements: dict
        description: "リリースの適用後に続けて適用する Kubernetes のマニフェスト"
      helm_no_log:
        type: bool
        description: "Helm の実行結果(values を含む)をログに出さない"
      helm_ingress:
        type: dict
        description: "公開する Ingress(Traefik)。空なら作らない。host と、単一経路の service_port または routes が要る"
        options:
          host:
            type: str
            description: "ホスト名(routes の経路が host を省略したときのホスト名)"
          routes:
            type: list
            elements: dict
            description: "公開する重複しない経路(パスはホストが違っても重ねない)。1つ以上指定する"
            options:
              host:
                type: str
                description: "この経路のホスト名。省略時は helm_ingress.host"
              path:
                type: str
                required: true
                description: "Prefix のパス。/ 以外は末尾の / を付けない"
              service_name:
                type: str
                required: true
                description: "Service の名前"
              service_port:
                type: int
                required: true
                description: "Service のポート番号"
              strip_prefix:
                type: bool
                default: false
                description: "転送前にパスの接頭辞を除く。/ には指定できない"
              middlewares:
                type: list
                elements: str
                description: "Ingress に掛けるミドルウェア(<namespace>-<名前>@kubernetescrd)"
              tunnel:
                type: bool
                default: false
                description: "Tunnel 専用の入口にも経路を作る。middlewares と同時に指定できない"
              tunnel_deny_paths:
                type: list
                elements: str
                description: "Tunnel で拒否する元のパス(大文字・小文字を区別しない前方一致)"
              tunnel_deny_post_paths:
                type: list
                elements: str
                description: "Tunnel で POST を拒否する元のパス(大文字・小文字を区別しない完全一致、末尾の / は任意)"
              tunnel_deny_headers:
                type: list
                elements: str
                description: "Tunnel で拒否する要求のヘッダーの名前(英数字と -)。値によらず、そのヘッダーがあれば通さない"
          service_port:
            type: int
            description: "Service のポート番号"
          service_name:
            type: str
            description: "Service の名前(省略時はリリース名)"
          middlewares:
            type: list
            elements: str
            description: "ルーターに掛ける Traefik のミドルウェア(<namespace>-<名前>@kubernetescrd)"
          tunnel:
            type: bool
            description: "Traefik の Tunnel 専用の入口(Cloudflare Tunnel を通る外部からの通信)にも経路を作る"
          tunnel_deny_paths:
            type: list
            elements: str
            description: "Tunnel 専用の入口でだけ通さないパス(前方一致。大文字・小文字を区別しない)"
          tunnel_deny_post_paths:
            type: list
            elements: str
            description: "Tunnel 専用の入口でだけ POST を通さないパス(完全一致。大文字・小文字を区別せず、末尾のスラッシュは任意。指定値には末尾のスラッシュを付けない)"
      helm_network_policy:
        type: bool
        description: "Pod が受ける通信を絞る NetworkPolicy を置く(同じ namespace、Traefik、helm_network_policies の namespace だけを通す)。false なら消す"
      helm_network_policies:
        type: dict
        description: "NetworkPolicy を置く namespace と、追加で通信を通す namespace のリストの表(インベントリで宣言する)"
      helm_network_policy_pod_labels:
        type: dict
        description: "絞る対象の Pod のラベル。空なら namespace のすべての Pod"
      helm_min_ready_nodes:
        type: int
        description: "適用の前に、Ready のノードがこの数以上あることを確かめる。0 なら確かめない"
      helm_wait:
        type: bool
        description: "リソースが Ready になるまで待つ"
      helm_timeout:
        type: str
        description: "Ready を待つ時間(Go の期間の形。例: 10m)"

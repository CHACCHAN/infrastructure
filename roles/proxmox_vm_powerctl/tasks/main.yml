# 全タスクは接続先のProxmoxホスト(-e proxmox_ip)上で直接実行される。
# 既に目的の電源状態なら何もしない。
---
- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

- name: 接続先のノード名を取得する
  ansible.builtin.import_role:
    name: proxmox_common
    tasks_from: detect_proxmox_node

- name: VMの存在を確認する
  ansible.builtin.import_tasks: check_vm_exists.yml

- name: 電源状態を変更する
  ansible.builtin.import_tasks: change_power.yml

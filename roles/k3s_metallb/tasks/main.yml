---
- name: MetalLB とアドレスのプールを適用する
  ansible.builtin.include_role:
    name: k3s
  vars:
    helm_release_name: "{{ metallb_release_name }}"
    helm_chart: metallb
    helm_chart_repo_url: "{{ metallb_chart_repo_url }}"
    helm_chart_version: "{{ metallb_chart_version }}"
    helm_namespace: "{{ metallb_namespace }}"
    helm_manifests:
      - apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: "{{ metallb_pool_name }}"
          namespace: "{{ metallb_namespace }}"
        spec:
          addresses:
            - "{{ metallb_pool_address }}"
      - apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: "{{ metallb_pool_name }}"
          namespace: "{{ metallb_namespace }}"
        spec:
          ipAddressPools:
            - "{{ metallb_pool_name }}"
      # k3s 内蔵の Traefik を全ノードに置き、VIP を持つノードの Traefik が直接受ける(クライアントの IP が保たれる)
      - apiVersion: helm.cattle.io/v1
        kind: HelmChartConfig
        metadata:
          name: traefik
          namespace: kube-system
        spec:
          valuesContent: "{{ __metallb_traefik_values | to_nice_yaml }}"

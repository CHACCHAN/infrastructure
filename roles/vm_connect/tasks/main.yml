# -e で渡された接続情報から vms グループを組み立てる(インベントリは使わない)。
# VMが未起動でも起動はしない(このディレクトリはVM内部の設定のみを行うため)。
---
- name: SSH変数を検証する
  ansible.builtin.assert:
    that:
      - vm_ip is defined
      - (vm_ip | default('', true)) | length > 0
      - vm_ssh_user is defined
      - (vm_ssh_user | default('', true)) | length > 0
      - vm_ssh_prikey is defined
      - (vm_ssh_prikey | default('', true)) | length > 0
    fail_msg: >-
      vm_ssh_user、vm_ssh_prikey、またはvm_ip変数がない、または不正な値です。
    quiet: true

- name: 構築するVMをインベントリにIPで登録する
  ansible.builtin.add_host:
    name: "{{ vm_ip }}"
    groups: vms
    ansible_user: "{{ vm_ssh_user }}"
    ansible_ssh_private_key_file: "{{ vm_ssh_prikey }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  changed_when: false

- name: VMが起動していることを確認する
  block:
    - name: SSHポート(22)の疎通を確認する
      ansible.builtin.wait_for:
        host: "{{ vm_ip }}"
        port: 22
        timeout: 10
        state: started
  rescue:
    - name: VM未起動として処理を終了する
      ansible.builtin.fail:
        msg: >-
          {{ vm_ip }}:22 に接続できませんでした。VMが起動していない可能性があります。
          先にVMを起動してから再実行してください(VMの起動は playbooks/proxmox/ 側の管轄です)。

# ディスクの既定値。disks(新規作成)と disk_options(既存ディスクの設定変更)の
# 両方に適用され、各ディスクで明示した値が常に優先される。
#
# どちらも既定はオン。ただしバスが対応していない組み合わせには付けない
# (PVEの仕様。SSDエミュレーションはvirtio-blk非対応、
#  IOスレッドはvirtio-blkかSCSI(virtio-scsi-single)のみ)。
---
# IOスレッド: ディスクI/Oを専用スレッドに分離する。
# SCSIで使うには scsihw を virtio-scsi-single にする必要がある
# (テンプレートはその設定で構築され、各インベントリでも明示している)。
proxmox_vm_hardware_default_iothread: 1

# SSDエミュレーション: ゲストに「非回転メディア」として見せる。
# ⚠ HDD上のディスクには 0 を指定すること(ゲストのI/Oスケジューラの判断が変わる)。
proxmox_vm_hardware_default_ssd: 1

# discard(TRIM/UNMAP): ゲストで削除した分の領域をストレージへ返す。
# 全バスで指定でき、シンプロビジョニング(LVM-thin/qcow2/ZFS等)でなければ効果が無いだけ。
# YAMLでは on が真偽値になってしまうため、必ず引用符付きで書くこと。
proxmox_vm_hardware_default_discard: "on"

# SCSIコントローラ。SCSIディスクでIOスレッドを使うには virtio-scsi-single が必要。
# vm_hardware の options で scsihw を指定した場合はそちらが優先される。
proxmox_vm_hardware_default_scsihw: virtio-scsi-single

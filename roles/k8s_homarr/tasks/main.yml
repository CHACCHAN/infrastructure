# 上流Helmチャート、公開経路、任意のSecretを順に収束させる。
---
# Secretを先に収束させる(これを参照するワークロードが待たずに起動できるように)

- name: 必須Secret変数が定義されていることを確認する
  ansible.builtin.assert:
    that:
      - vars[item] is defined
    fail_msg: >-
      {{ item }} が未定義です。
      ansible-vault edit vault/k8s_secrets.yml で実値を設定してください。
    quiet: true
  loop:
    - k8s_secret_homarr_db
    - k8s_secret_homarr_db_encryption
    - k8s_secret_homarr_oidc

- name: homarr-db Secretを描画する
  ansible.builtin.set_fact:
    k8s_homarr_homarr_db_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: homarr-db
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_homarr_db }}"
  no_log: true

- name: homarr-db SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_homarr_homarr_db_secret_definition }}"
    k8s_apply_no_log: true

- name: homarr-db-encryption Secretを描画する
  ansible.builtin.set_fact:
    k8s_homarr_homarr_db_encryption_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: homarr-db-encryption
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_homarr_db_encryption }}"
  no_log: true

- name: homarr-db-encryption SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_homarr_homarr_db_encryption_secret_definition }}"
    k8s_apply_no_log: true

- name: homarr-oidc Secretを描画する
  ansible.builtin.set_fact:
    k8s_homarr_homarr_oidc_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: homarr-oidc
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_homarr_oidc }}"
  no_log: true

- name: homarr-oidc SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_homarr_homarr_oidc_secret_definition }}"
    k8s_apply_no_log: true

- name: homarr Helmチャートを描画して適用する
  ansible.builtin.import_role:
    name: k8s
    tasks_from: helm
  vars:
    k8s_helm_release: homarr
    k8s_helm_chart: homarr
    k8s_helm_repo_url: https://homarr-labs.github.io/charts/
    k8s_helm_version: "{{ k8s_homarr_helm_version }}"
    k8s_helm_namespace: platform
    k8s_helm_values: "{{ k8s_homarr_values }}"
    k8s_helm_no_hooks: false
    k8s_helm_include_crds: false
    k8s_helm_inject_namespace: true

- name: 公開Ingressを描画する
  ansible.builtin.set_fact:
    k8s_homarr_ingress_definition: "{{ lookup('ansible.builtin.template', 'ingress.yaml.j2') }}"

- name: 公開IngressをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_homarr_ingress_definition }}"

- name: homarr Deploymentのrolloutを待つ
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: homarr
    namespace: platform
  register: k8s_homarr_rollout
  until: >-
    k8s_homarr_rollout.resources | length > 0
    and (k8s_homarr_rollout.resources[0].status.readyReplicas | default(0) | int)
        >= (k8s_homarr_rollout.resources[0].spec.replicas | default(1) | int)
  retries: 60
  delay: 5
  when: not ansible_check_mode

# クラスタ全体のSecretまで読める広域RBAC(rbac.enabled: true のとき作られる)が
# 残っていれば削除する。SSAは宣言から消えたリソースを削除しないため明示的に消す。
- name: 旧Kubernetes連携RBACの残骸を削除する
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: "{{ item }}"
    name: "homarr-cluster-role{{ 'binding' if item == 'ClusterRoleBinding' else '' }}"
  loop:
    - ClusterRole
    - ClusterRoleBinding

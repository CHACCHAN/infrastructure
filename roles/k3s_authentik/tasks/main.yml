---
- name: OIDC クライアントの client_secret があることを確認する
  ansible.builtin.assert:
    that:
      - authentik_oidc_client_secrets[item.slug] is defined
      - authentik_oidc_client_secrets[item.slug] | length > 0
    fail_msg: "{{ item.slug }} の client_secret がありません"
    quiet: true
  loop: "{{ authentik_oidc_clients }}"
  loop_control:
    label: "{{ item.slug }}"
  no_log: true

- name: Google の client_secret があることを確認する
  ansible.builtin.assert:
    that: authentik_google_client_secret | length > 0
    fail_msg: "authentik_google_client_id を渡すときは、authentik_google_client_secret も渡す"
    quiet: true
  when: authentik_google_client_id | length > 0
  no_log: true

- name: Blueprint を組み立てる
  ansible.builtin.set_fact:
    __authentik_blueprint: "{{ lookup('ansible.builtin.template', 'oidc-blueprint.yaml.j2') }}"
    __authentik_forward_auth_blueprint: "{{ lookup('ansible.builtin.template', 'forward-auth-blueprint.yaml.j2') }}"

- name: Authentik を適用する
  ansible.builtin.include_role:
    name: k3s
  vars:
    helm_release_name: "{{ authentik_release_name }}"
    helm_chart: authentik
    helm_chart_repo_url: "{{ authentik_chart_repo_url }}"
    helm_chart_version: "{{ authentik_chart_version }}"
    helm_namespace: "{{ authentik_namespace }}"
    helm_timeout: 15m
    helm_values: "{{ __authentik_values | combine(authentik_values, recursive=True) }}"
    helm_secrets:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: authentik-config
          namespace: "{{ authentik_namespace }}"
        type: Opaque
        data: "{{ __authentik_secret_data }}"
    helm_ingress:
      host: "{{ authentik_host }}"
      service_name: "{{ authentik_release_name }}-server"
      service_port: 80
    helm_network_policy: true
    helm_manifests:
      # 認証プロキシ。Traefik が、リクエストを通す前に Authentik の埋め込みアウトポストへ問い合わせる
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: "{{ authentik_forward_auth_middleware }}"
          namespace: "{{ authentik_namespace }}"
        spec:
          forwardAuth:
            address: "http://{{ authentik_release_name }}-server.{{ authentik_namespace }}.svc.cluster.local/outpost.goauthentik.io/auth/traefik"
            # 転送ヘッダーは、クライアントが送った値を使わず、Traefik が実際のリクエストから作る
            trustForwardHeader: false

# Authentik(IdP)を Helm で入れ、アプリの OIDC クライアントと認証プロキシを Blueprint で宣言するロールの既定値。
# 秘密情報(authentik_secret_key など)と、公開ホスト名(authentik_host など)は、既定値を持たない。
---
# チャートのバージョン
authentik_chart_version: "2026.8.5"
authentik_chart_repo_url: https://charts.goauthentik.io
authentik_release_name: authentik
authentik_namespace: authentik
# 専用の PostgreSQL(k3s_postgresql が、この namespace に作る)。DB の所有者のロールは、DB と同じ名前
authentik_db_namespace: authentik-db
authentik_db_host: "{{ authentik_db_namespace }}-rw.{{ authentik_db_namespace }}.svc.cluster.local"
authentik_db_name: authentik
# OIDC クライアント。client_secret は authentik_oidc_client_secrets[slug] で渡す
authentik_oidc_clients: []
# 認証プロキシ(forward auth)で守るアプリケーション。自前のログインを持たない画面(と、ログインが共有の鍵だけの画面)を、Traefik のミドルウェア(authentik_forward_auth_middleware)で守る
authentik_proxy_apps: []
# 認証プロキシで守る画面を使える Authentik のグループ(グループ自体と所属は、Authentik の画面で作る)
authentik_proxy_access_group: admins
# 認証プロキシのミドルウェアの名前。Ingress からは <namespace>-<名前>@kubernetescrd で参照する
authentik_forward_auth_middleware: forward-auth
# IP ごとに、ログインの失敗が成功をこの回数だけ上回ると、その IP からのログインを拒否する。0 なら制限しない
authentik_login_failure_limit: 10
# ログインの失敗の制限を掛けない送信元(Pod のネットワーク。Cloudflare Tunnel を通るログインは、cloudflared の Pod の IP に見える)。
# k3s の既定の cluster-cidr に合わせている。vm_k3s で cluster-cidr を変えるときは、ここも変える
authentik_login_failure_exempt_networks:
  - 10.42.0.0/16
# 失敗と成功の記録を保つ秒数(最初の記録からこの時間が過ぎると、拒否が解ける)
authentik_login_failure_expiry: 3600
# MFA を登録していないユーザーに、ログインの途中で登録させる
authentik_mfa_required: true
# Google でのログインに使う OAuth クライアント(vault/authentik.yml)。client_id が空なら、Google でのログインを置かない
authentik_google_client_id: ""
authentik_google_client_secret: ""
# Helm values の上書き(基本値へ再帰的に合成する)
authentik_values: {}
# 管理 API は LAN 向けワイルドカード DNS と TLS を使い、Host は既存の Ingress に合わせる
authentik_management_url: "https://{{ authentik_api_host }}"
authentik_managed_applications: []
authentik_managed_application_fields:
  - name
  - open_in_new_tab
  - meta_launch_url
  - meta_description
  - meta_publisher
  - group
  - meta_hide
authentik_export_file: "{{ role_path }}/../../vault/authentik_snapshot.yml"
authentik_export_overwrite: false

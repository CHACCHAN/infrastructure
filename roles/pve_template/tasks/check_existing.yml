# 同じ VMID の VM を調べ、完成済みのテンプレートか、衝突かを判定する。
---
- name: テンプレートの VMID を検索する
  community.proxmox.proxmox_vm_info:
    vmid: "{{ template_vmid }}"
  register: template_info

- name: 既存の VM と完成状態を記録する
  ansible.builtin.set_fact:
    template_existing: "{{ template_info.proxmox_vms | first | default({}) }}"
    template_complete: >-
      {{ (template_info.proxmox_vms | first | default({})).template | default(false) | bool }}

- name: テンプレートではない既存の VM との衝突を拒否する
  ansible.builtin.fail:
    msg: >-
      VMID {{ template_vmid }} は存在しますがテンプレートではありません。
      中断された構築か別の VM の可能性があるため、Proxmox 上で確認してください。
  when:
    - template_existing | length > 0
    - not template_complete

- name: 既存のテンプレートが期待する名前とノードであることを確認する
  ansible.builtin.assert:
    that:
      - template_existing.name | default('') == template_name
      - template_existing.node | default('') == template_node
    fail_msg: >-
      VMID {{ template_vmid }} のテンプレートが、期待(name={{ template_name }}、node={{ template_node }})と
      一致しません。実体は name={{ template_existing.name | default('不明') }}、
      node={{ template_existing.node | default('不明') }} です。
    quiet: true
  when: template_existing | length > 0

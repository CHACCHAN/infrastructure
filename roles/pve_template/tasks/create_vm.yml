# 取り込んだイメージを起動ディスクにした VM を作り、テンプレートへ変換する。
# NIC は持たない。個体の NIC はクローン後に pve_vm が設定する。
---
- name: テンプレート元の空の VM を作る
  community.proxmox.proxmox_kvm:
    vmid: "{{ template_vmid }}"
    name: "{{ template_name }}"
    node: "{{ template_node }}"
    memory: "{{ template_memory }}"
    cores: "{{ template_cores }}"
    scsihw: virtio-scsi-single
    ostype: l26
    serial:
      serial0: socket
    vga: serial0
    boot: "order=scsi0"
    ide:
      ide2: "{{ template_storage }}:cloudinit"
    state: present

- name: cloud イメージから起動ディスクを作る
  community.proxmox.proxmox_disk:
    vmid: "{{ template_vmid }}"
    disk: scsi0
    storage: "{{ template_storage }}"
    import_from: "{{ template_image_storage }}:import/{{ template_image_filename }}"
    ssd: "{{ template_disk_ssd }}"
    iothread: "{{ template_disk_iothread }}"
    discard: "{{ template_disk_discard }}"
    create: regular
    state: present
    timeout: "{{ template_import_timeout }}"

- name: VM をテンプレートへ変換する
  community.proxmox.proxmox_kvm:
    vmid: "{{ template_vmid }}"
    node: "{{ template_node }}"
    state: template

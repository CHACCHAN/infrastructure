# 配布元のチェックサムを検証して、ノードの import 領域へ cloud イメージを置く。
---
- name: チェックサムのファイルを取得する
  ansible.builtin.uri:
    url: "{{ template_checksum_url }}"
    return_content: true
    timeout: 30
  register: template_checksum_file
  retries: 3
  delay: 5
  until: template_checksum_file is succeeded

- name: 対象イメージのチェックサムを取り出す
  ansible.builtin.set_fact:
    template_checksum: >-
      {{ (template_checksum_file.content.splitlines()
          | select('match', '^[a-fA-F0-9]+\s+\*?' ~ (template_image_filename | regex_escape) ~ '$')
          | first | default('', true)).split() | first | default('', true) | lower }}

- name: チェックサムを取り出せたことを確認する
  ansible.builtin.assert:
    that: template_checksum | length > 0
    fail_msg: "{{ template_checksum_url }} に {{ template_image_filename }} の行がありません。"
    quiet: true

- name: cloud イメージをノードの import 領域へ置く
  community.proxmox.proxmox_template:
    node: "{{ template_node }}"
    storage: "{{ template_image_storage }}"
    content_type: import
    template: "{{ template_image_filename }}"
    url: "{{ template_image_url }}"
    checksum: "{{ template_checksum }}"
    checksum_algorithm: "{{ template_checksum_algorithm }}"
    force: false
    state: present
    timeout: "{{ template_download_timeout }}"

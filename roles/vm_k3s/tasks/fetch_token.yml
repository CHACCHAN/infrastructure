# 参加用トークンをコントロールプレーンから自動取得する。
# 接続情報(ユーザー・秘密鍵)は呼び出し元のplaybook(playbooks/vm/k3s.yml)が参加先を
# インベントリへ登録済みで、delegate_to でその接続設定が使われる。
# workerへserver tokenを配らないためagent-tokenを優先し、無ければnode-tokenを使う
# (https://docs.k3s.io/cli/token)。トークンは秘密情報のため no_log にする。
---
- name: コントロールプレーンからトークンを取得する
  block:
    - name: agent専用トークンの有無を確認する
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/agent-token
        follow: true
      delegate_to: "{{ kubernetes_server_ip }}"
      become: true
      register: kubernetes_agent_token_stat

    - name: agent専用トークンを優先して参加トークンを読み取る
      ansible.builtin.slurp:
        src: >-
          {{ '/var/lib/rancher/k3s/server/agent-token'
             if kubernetes_agent_token_stat.stat.exists
             else '/var/lib/rancher/k3s/server/node-token' }}
      delegate_to: "{{ kubernetes_server_ip }}"
      become: true
      register: kubernetes_join_token_raw
      no_log: true

  rescue:
    - name: トークンを取得できなかったことを通知する
      ansible.builtin.fail:
        msg: >-
          {{ kubernetes_server_ip }} の
          /var/lib/rancher/k3s/server/agent-token または node-token を読み取れませんでした。
          そのVMがコントロールプレーン(kubernetes_node_role=server)として構築済みか、
          SSHでログインしてsudoが使えるかを確認してください
          (ユーザー・鍵が対象VMと違う場合は
          -e "kubernetes_server_ssh_user=<ユーザ名> kubernetes_server_ssh_prikey=~/.ssh/<秘密鍵>" で指定します)。
          トークンが分かっている場合は -e "kubernetes_token=<トークン>" で直接渡すこともできます。

- name: 使用するトークンを決定する
  ansible.builtin.set_fact:
    kubernetes_token_resolved: "{{ (kubernetes_join_token_raw.content | b64decode) | trim }}"
  no_log: true

# k3sが作る /etc/rancher/k3s/k3s.yaml はroot専用(0600)のまま触らず、
# SSHユーザー用の複製を ~/.kube/config に置く。
# 接続先は127.0.0.1のままだとVM外に持ち出したときに使えないため、VMのIPに書き換える
# (このIPは validate.yml が tls-san に必ず含めるため、証明書の検証がそのまま通る。
#  kubernetes_node_ip で node-ip を占有ネットワーク側に寄せた場合、k3sが自動で
#  SANに入れるのはそちらのIPだけになるので、明示的に足す必要がある)。
#
# kubeconfigはクラスタの管理者権限そのものなので no_log で出力を抑止している。
---
- name: Kubeconfigの置き場所を作成する
  ansible.builtin.file:
    path: "/home/{{ vm_ssh_user }}/.kube"
    state: directory
    owner: "{{ vm_ssh_user }}"
    group: "{{ vm_ssh_user }}"
    mode: "0700"
  become: true

- name: K3sが生成したkubeconfigを読み込む
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  become: true
  register: kubernetes_kubeconfig_raw
  no_log: true

- name: SSHユーザーのkubeconfigとして配置する
  ansible.builtin.copy:
    content: >-
      {{ (kubernetes_kubeconfig_raw.content | b64decode)
         | regex_replace('https://127\.0\.0\.1:6443',
                         'https://' ~ vm_ip ~ ':' ~ kubernetes_server_port) }}
    dest: "/home/{{ vm_ssh_user }}/.kube/config"
    owner: "{{ vm_ssh_user }}"
    group: "{{ vm_ssh_user }}"
    mode: "0600"
  become: true
  no_log: true

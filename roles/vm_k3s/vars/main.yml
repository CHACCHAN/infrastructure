---
__k3s_api_vip: "172.16.{{ vlan }}.{{ k3s_api_vip_id }}"
# グループの先頭のホストがクラスタを作り(cluster-init)、ほかは API の VIP へ参加する
__k3s_is_init: "{{ inventory_hostname == groups['k3s'][0] }}"
__k3s_token_file: /etc/rancher/k3s/cluster-token
# 参加するホストは、認証局のハッシュつきのトークンで、参加先の認証局を確かめる。クラスタを作るホストは、秘密の部分だけを使う(認証局を作り直しても使えるため)
__k3s_token_value: "{{ k3s_cluster_token | regex_replace('^.*::server:', '') if __k3s_is_init | bool else k3s_cluster_token }}"
# トークン K10<認証局のハッシュ>::server:<秘密> の、認証局のハッシュ
__k3s_token_ca_hash: "{{ k3s_cluster_token.split('::')[0][3:] }}"
__k3s_data_dir: /var/lib/rancher/k3s/server/db
__k3s_release_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}"
__k3s_manifests_dir: /var/lib/rancher/k3s/server/manifests
__k3s_kubelet_dropin_dir: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d

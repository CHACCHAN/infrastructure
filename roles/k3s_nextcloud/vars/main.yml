# Nextcloud Hub の Helm values の基本値。
---
__nextcloud_values:
  fullnameOverride: "{{ nextcloud_release_name }}"
  replicaCount: 1
  ingress:
    enabled: false
  internalDatabase:
    enabled: false
  mariadb:
    enabled: false
  postgresql:
    enabled: false
  redis:
    enabled: false
  externalRedis:
    enabled: false
  externalDatabase:
    enabled: true
    type: postgresql
    host: "{{ nextcloud_db_host }}"
    database: "{{ nextcloud_db_name }}"
    existingSecret:
      enabled: true
      secretName: nextcloud-db
      usernameKey: username
      passwordKey: password
  persistence:
    enabled: true
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: "{{ nextcloud_storage_size }}"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi
  cronjob:
    enabled: true
    type: sidecar
    sidecar:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 768Mi
  # 初期化とアプリの取得が済むまで、liveness probe による再起動を待つ
  startupProbe:
    enabled: true
    failureThreshold: 180
  # Secret が変わったら、Pod を入れ替えて環境変数を読み直す
  podAnnotations:
    checksum/secrets: "{{ [nextcloud_db_password, nextcloud_oidc_client_secret, nextcloud_admin_password] | to_json | hash('sha256') }}"
  nextcloud:
    host: "{{ nextcloud_host }}"
    # 指標(/metrics)は、Nextcloud の既定どおりループバックからだけ読める。Tunnel を通る通信は Pod の IP に見えるため、
    # Pod のネットワークを許すチャートの既定では、外から読めてしまう
    openmetrics:
      allowedClients: []
    existingSecret:
      enabled: true
      secretName: nextcloud-admin
      usernameKey: username
      passwordKey: password
    extraEnv:
      # 転送ヘッダーと送信元の IP は、Nextcloud だけで評価する
      - name: APACHE_DISABLE_REWRITE_IP
        value: "1"
      # イメージの更新で .htaccess が置き換わっても、pretty URL の書き換えを戻す
      - name: NEXTCLOUD_INIT_HTACCESS
        value: "true"
      - name: NEXTCLOUD_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: nextcloud-oidc
            key: client-secret
    configs:
      lab.config.php: |
        <?php
        // Ansible(roles/k3s_nextcloud)が生成。手動編集は次回実行で上書きされる。
        $CONFIG = [
          'appstoreenabled' => false,
          'token_auth_enforced' => true,
          // クラスタ内の Authentik(プライベートの IP に解決する)へ、OIDC の問い合わせを届ける
          'allow_local_remote_servers' => true,
          'trusted_domains' => {{ [nextcloud_host] | to_json }},
          'trusted_proxies' => {{ nextcloud_trusted_proxies | to_json }},
          'forwarded_for_headers' => ['HTTP_X_FORWARDED_FOR'],
          'overwriteprotocol' => 'https',
          'overwrite.cli.url' => {{ ('https://' ~ nextcloud_host) | to_json }},
          'files.chunked_upload.max_size' => 20971520,
        ];
    hooks:
      before-starting: "{{ lookup('ansible.builtin.template', 'before-starting.sh.j2') }}"

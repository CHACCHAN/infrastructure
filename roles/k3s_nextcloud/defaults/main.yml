    sha256: 6aef84674527393edbfc2915d58014e4ef72bfb27f3ca606b7c1faf985ae0879
  - name: calendar
    version: "6.6.3"
    url: https://github.com/nextcloud-releases/calendar/releases/download/v6.6.3/calendar-v6.6.3.tar.gz
    sha256: bda8f38c609b2182533887f67eacb543edf437066d0356912ac6324c94743080
  - name: contacts
    version: "8.9.2"

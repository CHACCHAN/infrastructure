# Nextcloud Hub と専用の DB を入れるロールの既定値。
# 秘密情報と、公開ホスト名(nextcloud_host)は、既定値を持たない。
---
nextcloud_chart_version: "9.4.1"
nextcloud_chart_repo_url: https://nextcloud.github.io/helm/
nextcloud_release_name: nextcloud
nextcloud_namespace: nextcloud
nextcloud_db_namespace: nextcloud-db
nextcloud_db_host: "{{ nextcloud_db_namespace }}-rw.{{ nextcloud_db_namespace }}.svc.cluster.local"
nextcloud_db_name: nextcloud
nextcloud_storage_size: 50Gi
nextcloud_admin_user: admin
# ユーザーごとの既定の容量の上限。最初のインストールでだけ適用する
nextcloud_default_quota: "10 GB"
# ログインの失敗の制限を掛けない送信元(Pod のネットワーク。Cloudflare Tunnel を通るログインは、cloudflared の Pod の IP に見える)。
# k3s の既定の cluster-cidr に合わせている。vm_k3s で cluster-cidr を変えるときは、ここも変える
nextcloud_trusted_proxies:
  - 10.42.0.0/16
nextcloud_values: {}

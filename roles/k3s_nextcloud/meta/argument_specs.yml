---
argument_specs:
  main:
    short_description: Nextcloud Hub と専用の DB を入れる
    options:
      nextcloud_chart_version:
        type: str
        description: チャートのバージョン
      nextcloud_chart_repo_url:
        type: str
        description: チャートの配布元の URL
      nextcloud_release_name:
        type: str
        description: Helm のリリース名
      nextcloud_namespace:
        type: str
        description: アプリの namespace
      nextcloud_host:
        type: str
        required: true
        description: Nextcloud の公開ホスト名
      nextcloud_db_namespace:
        type: str
        description: 専用の PostgreSQL の namespace
      nextcloud_db_host:
        type: str
        description: PostgreSQL のホスト名
      nextcloud_db_name:
        type: str
        description: DB と所有者のロールの名前
      nextcloud_db_password:
        type: str
        required: true
        no_log: true
        description: DB のパスワード(vault/nextcloud.yml)
      nextcloud_admin_user:
        type: str
        description: 初回の起動で作る緊急用の管理者
      nextcloud_admin_password:
        type: str
        required: true
        no_log: true
        description: 緊急用の管理者の初期パスワード(vault/nextcloud.yml)
      nextcloud_storage_size:
        type: str
        description: Longhorn のボリュームの大きさ
      nextcloud_default_quota:
        type: str
        description: ユーザーごとの既定の容量の上限。最初のインストールでだけ適用する
      nextcloud_trusted_proxies:
        type: list
        elements: str
        description: 信頼するプロキシとログインの失敗の制限から除くネットワーク
      nextcloud_values:
        type: dict
        description: Helm values の上書き(基本値へ再帰的に合成する)

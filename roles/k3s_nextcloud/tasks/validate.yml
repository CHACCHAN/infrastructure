---
- name: 配置するアプリの名前とチェックサムを確認する
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9_]*$')
      - item.version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - item.url is match('^https://')
      - item.sha256 is match('^[a-f0-9]{64}$')
    quiet: true
  loop: "{{ nextcloud_apps }}"
  loop_control:
    label: "{{ item.name }}"

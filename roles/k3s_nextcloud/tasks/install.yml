---
- name: 専用の PostgreSQL を適用する
  ansible.builtin.include_role:
    name: k3s_postgresql
  vars:
    postgresql_namespace: "{{ nextcloud_db_namespace }}"
    postgresql_database: "{{ nextcloud_db_name }}"
    postgresql_password: "{{ nextcloud_db_password }}"

- name: Nextcloud Hub を適用する
  ansible.builtin.include_role:
    name: k3s
  vars:
    helm_release_name: "{{ nextcloud_release_name }}"
    helm_chart: nextcloud
    helm_chart_repo_url: "{{ nextcloud_chart_repo_url }}"
    helm_chart_version: "{{ nextcloud_chart_version }}"
    helm_namespace: "{{ nextcloud_namespace }}"
    helm_timeout: 15m
    helm_values: "{{ __nextcloud_values | combine(nextcloud_values, recursive=True) }}"
    helm_secrets:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: nextcloud-admin
          namespace: "{{ nextcloud_namespace }}"
        data:
          username: "{{ nextcloud_admin_user | b64encode }}"
          password: "{{ nextcloud_admin_password | b64encode }}"
      - apiVersion: v1
        kind: Secret
        metadata:
          name: nextcloud-db
          namespace: "{{ nextcloud_namespace }}"
        data:
          username: "{{ nextcloud_db_name | b64encode }}"
          password: "{{ nextcloud_db_password | b64encode }}"
      - apiVersion: v1
        kind: Secret
        metadata:
          name: nextcloud-oidc
          namespace: "{{ nextcloud_namespace }}"
        data:
          client-secret: "{{ nextcloud_oidc_client_secret | b64encode }}"
    helm_ingress:
      host: "{{ nextcloud_host }}"
      service_port: 8080
      tunnel: "{{ nextcloud_host in cloudflared_hosts | default([]) }}"
      # Login Flow v2 と OIDC は通し、パスワードのログインだけを止める
      tunnel_deny_post_paths:
        - /login
        - /index.php/login
    helm_network_policy: true

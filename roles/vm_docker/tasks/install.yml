---
- name: Docker のパッケージを入れる
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: __docker_package

# check モードでは、パッケージがまだ無いと操作できない。
- name: Docker のデーモンを有効にして起動する
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  when: not (ansible_check_mode and __docker_package is changed)

---
- name: OpenWebUI を適用する
  ansible.builtin.include_role:
    name: k3s
  vars:
    helm_release_name: "{{ openwebui_release_name }}"
    helm_chart: open-webui
    helm_chart_repo_url: "{{ openwebui_chart_repo_url }}"
    helm_chart_version: "{{ openwebui_chart_version }}"
    helm_namespace: "{{ openwebui_namespace }}"
    helm_timeout: 15m
    helm_values: "{{ __openwebui_values | combine(openwebui_values, recursive=True) }}"
    helm_secrets:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: open-webui-app
          namespace: "{{ openwebui_namespace }}"
        data:
          webui-secret-key: "{{ openwebui_secret_key | b64encode }}"
      - apiVersion: v1
        kind: Secret
        metadata:
          name: open-webui-oidc
          namespace: "{{ openwebui_namespace }}"
        data:
          oidc-client-id: "{{ openwebui_oidc_client_id | b64encode }}"
          oidc-client-secret: "{{ openwebui_oidc_client_secret | b64encode }}"
      - apiVersion: v1
        kind: Secret
        metadata:
          name: open-webui-admin
          namespace: "{{ openwebui_namespace }}"
        data:
          admin-password: "{{ openwebui_admin_password | b64encode }}"
      - apiVersion: v1
        kind: Secret
        metadata:
          name: open-webui-db
          namespace: "{{ openwebui_namespace }}"
        data:
          db-url: "{{ __openwebui_db_url | b64encode }}"
    helm_ingress:
      host: "{{ openwebui_host }}"
      service_name: open-webui
      service_port: 80
    helm_network_policy: true

# 開発専用VMを構築する。Debian専用。
# 全VM共通の処理は common / docker ロール(roles/common, roles/docker)と共有している。
# vm_gui_required=true のときだけ末尾のGUI関連3つが実行される(既定falseでは入らない)。
---
- name: 対象OSを確認する
  ansible.builtin.import_role:
    name: common
    tasks_from: assert_debian

- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

- name: VM共通の初期セットアップを実行する
  ansible.builtin.import_role:
    name: common

- name: Cockpitを設定する
  ansible.builtin.import_tasks: configure_cockpit.yml

- name: Cockpit Navigatorをインストールする
  ansible.builtin.import_tasks: install_cockpit_navigator.yml

- name: Cockpit Machinesをインストールする
  ansible.builtin.import_tasks: install_cockpit_machines.yml

- name: Dockerをインストールする
  ansible.builtin.import_role:
    name: docker

- name: Cockpit Docker Managerを設定する
  ansible.builtin.import_tasks: configure_cockpit_dockermanager.yml

- name: PackageKitのオフライン誤検知を回避する
  ansible.builtin.import_tasks: configure_packagekit_network.yml

- name: Kubernetes CLI(kubectl)をインストールする
  ansible.builtin.import_tasks: install_kubectl.yml

- name: Helmをインストールする
  ansible.builtin.import_tasks: install_helm.yml

- name: VSCode Serverの定期クリーンアップを設定する
  ansible.builtin.import_tasks: configure_vscode_cleanup.yml

- name: デスクトップ環境・xrdp関連パッケージをインストールする
  ansible.builtin.import_tasks: install_desktop_packages.yml
  when: vm_gui_required | default(false) | bool

- name: RDPサーバー(xrdp)を設定する
  ansible.builtin.import_tasks: configure_xrdp.yml
  when: vm_gui_required | default(false) | bool

- name: ブラウザをインストールする
  ansible.builtin.import_tasks: install_browsers.yml
  when: vm_gui_required | default(false) | bool

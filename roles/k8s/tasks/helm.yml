# 上流Helmチャートを固定条件で描画し、リリースを作らずSSAで収束させる。
#
# チャート参照は2形態を受け付ける:
#   HTTPリポジトリ  k8s_helm_chart: <チャート名> + k8s_helm_repo_url: <リポジトリURL>
#   OCIレジストリ   k8s_helm_chart: oci://<レジストリ>/<パス>(k8s_helm_repo_url は不要)
# k8s_helm_repo_url が未定義・空、またはチャートが oci:// の場合は --repo を渡さない。
---
# 一時ファイル操作は収束対象ではないため、changed表示から除外する
# (--checkの結果が「クラスタとの差分」だけを意味するように保つ)
- name: Helm values用の一時ファイルを作成する
  ansible.builtin.tempfile:
    state: file
    suffix: .yaml
  register: k8s_helm_values_file
  check_mode: false
  changed_when: false

- name: Helmチャートを描画して収束させる
  block:
    - name: Helm valuesを一時ファイルへ書き出す
      ansible.builtin.copy:
        dest: "{{ k8s_helm_values_file.path }}"
        content: "{{ k8s_helm_values | to_nice_yaml(indent=2, sort_keys=false) }}"
        mode: "0600"
      check_mode: false
      changed_when: false
      # values経由で秘密値を渡すロールはk8s_helm_no_log=trueで全経路の出力を抑止する
      no_log: "{{ k8s_helm_no_log | default(false) }}"

    # --kube-version を明示し、描画結果がhelmバイナリ側の想定APIバージョンに
    # 左右されないようにする(値は k8s_kube_version)。
    - name: Helmチャートを描画する
      ansible.builtin.command:
        argv: >-
          {{
            ['helm', 'template', k8s_helm_release, k8s_helm_chart]
            + (
                ['--repo', k8s_helm_repo_url]
                if (k8s_helm_chart is not match('oci://')
                    and k8s_helm_repo_url | default('', true) | length > 0)
                else []
              )
            + [
              '--version', k8s_helm_version,
              '--namespace', k8s_helm_namespace,
              '--kube-version', k8s_kube_version,
              '--values', k8s_helm_values_file.path
            ]
            + (['--no-hooks'] if k8s_helm_no_hooks | default(false) | bool else [])
            + (['--include-crds'] if k8s_helm_include_crds | default(false) | bool else [])
          }}
      register: k8s_helm_template
      changed_when: false
      check_mode: false
      no_log: "{{ k8s_helm_no_log | default(false) }}"

    # PyYAML(YAML 1.1)はYAML 1.2の8進表記「0oNNN」を文字列として読み、数値を要求する
    # フィールドで型エラーになる(実例: nextcloudチャートの defaultMode: 0o755)。
    # 「: 0oNNN」で終わる行の
    # 値を10進へ変換してから適用する(どの8進値が来ても変換できるよう汎用化している)。
    - name: チャート出力のYAML 1.2 8進表記を10進へ正規化する
      ansible.builtin.set_fact:
        k8s_helm_manifest: >-
          {%- set k8s_helm_lines = [] -%}
          {%- for k8s_helm_line in k8s_helm_template.stdout.splitlines() -%}
          {#-   OCIチャートではhelmが取得結果(Pulled: / Digest:)を標準出力へ出すため取り除く -#}
          {%-   if k8s_helm_line is match('^(Pulled|Digest): ') -%}
          {%-   elif k8s_helm_line is match('^.*: 0o[0-7]+\s*$') -%}
          {#-   後方参照('\1')はJinja文字列リテラルのエスケープ処理でchr(1)になり
                使えないため、regex_searchで値を取り出す。int(base=8)は
                Python仕様により 0o プレフィックス付きのまま10進へ変換できる。 -#}
          {%-     set k8s_helm_octal = k8s_helm_line | regex_search('0o[0-7]+\s*$') | trim -%}
          {%-     set _ = k8s_helm_lines.append(
                    k8s_helm_line
                    | regex_replace('0o[0-7]+\s*$',
                                    k8s_helm_octal | int(base=8) | string)) -%}
          {%-   else -%}
          {%-     set _ = k8s_helm_lines.append(k8s_helm_line) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ k8s_helm_lines | join(k8s_helm_newline) }}
      no_log: "{{ k8s_helm_no_log | default(false) }}"
      vars:
        # Jinja式の中の '\n' リテラルは改行にならない(バックスラッシュ+nの2文字になる)
        # ため、改行はYAMLの二重引用符で定義した変数を使う(ssh_key.ymlと同じイディオム)。
        k8s_helm_newline: "\n"

    - name: Helm描画結果をServer-Side Applyする
      ansible.builtin.import_role:
        name: k8s
        tasks_from: apply
      vars:
        k8s_definition: "{{ k8s_helm_manifest }}"
        k8s_namespace: >-
          {{ k8s_helm_namespace if k8s_helm_inject_namespace | default(false) | bool else omit }}
        k8s_apply_no_log: "{{ k8s_helm_no_log | default(false) }}"

  # 描画・適用が失敗した場合もvaluesの平文を残さない
  always:
    - name: Helm values用の一時ファイルを削除する
      ansible.builtin.file:
        path: "{{ k8s_helm_values_file.path }}"
        state: absent
      check_mode: false
      changed_when: false

# compose定義は公式のものをそのまま使う(Ansibleは .env だけを管理する)。
# バインドマウントが相対パスのため、必ず docker/ ディレクトリで実行する。
---
# COMPOSE_FILE(.env)で使う定義を切り替えるため、環境変数としても渡す
- name: Supabaseのコンテナを起動する
  community.docker.docker_compose_v2:
    project_src: "{{ supabase_project_dir }}"
    files: "{{ supabase_compose_files }}"
    state: present
    pull: missing
    remove_orphans: true
    # .env の変更はcomposeが再作成の理由として扱わないため、明示的に作り直す
    recreate: >-
      {{ 'always'
         if ((supabase_env_file is changed)
             or ((supabase_env_file_asym is defined) and (supabase_env_file_asym is changed)))
         else 'auto' }}
  become: true
  register: supabase_compose_up

- name: 起動したコンテナを表示する
  ansible.builtin.debug:
    msg: >-
      {{ supabase_compose_up.containers
         | default([]) | map(attribute='Service', default='?') | list | sort | join(', ') }}
      のコンテナを起動しました({{ supabase_project_dir }})。

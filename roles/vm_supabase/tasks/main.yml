# Docker ComposeでSupabase(セルフホスト)を構築する。Debian専用。
# 全VM共通の処理は vm / vm_docker ロールと共有している。
#
# compose定義・Kongの設定・DBの初期化SQLは公式リポジトリの docker/ をそのまま使い、
# Ansibleは .env(環境変数)だけを管理する。
---
- name: 対象OSを確認する
  ansible.builtin.import_role:
    name: vm
    tasks_from: assert_debian

- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

# イメージが大きいため、取得を始める前に空き容量を確認する
- name: ディスクの空き容量を確認する
  ansible.builtin.import_role:
    name: vm
    tasks_from: check_disk_space
  vars:
    svc_name: Supabase
    svc_min_free_gb: "{{ supabase_min_free_disk_gb }}"
    svc_min_free_var: supabase_min_free_disk_gb

- name: VM共通の初期セットアップを実行する
  ansible.builtin.import_role:
    name: vm

- name: Dockerをインストールする
  ansible.builtin.import_role:
    name: vm_docker

- name: Supabase用のディレクトリを準備する
  ansible.builtin.import_tasks: prepare_directories.yml

- name: 公式のセルフホスト構成を取得する
  ansible.builtin.import_tasks: fetch_source.yml

- name: 環境変数(.env)を配置する
  ansible.builtin.import_tasks: configure_env.yml

# compose定義は公式のものをそのまま使う(テンプレート配置が無い)ため、
# 共有の deploy_compose ではなくロール専用の起動処理を使う
- name: Supabaseのコンテナを起動する
  ansible.builtin.import_tasks: deploy_compose.yml

- name: APIゲートウェイとDBのポートを開放する
  ansible.builtin.import_role:
    name: vm
    tasks_from: configure_ufw_ports
  vars:
    svc_ufw_ports:
      - { port: "{{ supabase_kong_http_port }}", proto: tcp }
      - { port: "{{ supabase_kong_https_port }}", proto: tcp }
      - { port: "{{ supabase_postgres_port }}", proto: tcp }
      - { port: "{{ supabase_pooler_proxy_port_transaction }}", proto: tcp }

- name: すべてのコンテナとAPIが応答することを確認する
  ansible.builtin.import_tasks: verify_service.yml

# タイムゾーン(vm_timezone)・ロケール(vm_locale)・zram(vm_zram_percent)の
# 既定値は roles/vm・roles/vm_docker の共通タスク側にある。
#
# ここの変数は .env の環境変数と1対1で対応させている。
# 秘密情報(パスワード・鍵)は空にしておくと公式スクリプトで自動生成し、.env に保存する。
# 再実行時は .env の値をそのまま引き継ぐため、勝手に変わることはない。
---
supabase_install_dir: /opt/supabase

# --- 取得するソース(公式のdocker/ディレクトリ) ---
# セルフホスト構成は supabase/supabase の docker/ 配下で配布されている。
# イメージのタグはその中の docker-compose.yml に固定されているため、
# ここを更新しない限りバージョンは上がらない。
# master にすると実行のたびに最新を取りに行く(=意図しない更新が起きうる)
supabase_repo_url: https://github.com/supabase/supabase.git
supabase_ref: 9be46e674a50af59f6f8d83ee4e8f84fa7d8317c

# 使うcompose定義(環境変数COMPOSE_FILE)。上書き用の定義を足す場合はここに並べる。
# 例: [docker-compose.yml, docker-compose.logs.yml]  ← ログ収集(vector/analytics)を足す
#     docker-compose.s3.yml(MinIO) / docker-compose.pg15.yml / docker-compose.caddy.yml など
supabase_compose_files:
  - docker-compose.yml

# --- 秘密情報(空なら自動生成して .env に保存) ---
supabase_postgres_password: ""
supabase_jwt_secret: ""
supabase_anon_key: ""
supabase_service_role_key: ""
supabase_dashboard_username: supabase
supabase_dashboard_password: ""
supabase_secret_key_base: ""
supabase_realtime_db_enc_key: ""
supabase_vault_enc_key: ""
supabase_pg_meta_crypto_key: ""
supabase_logflare_public_access_token: ""
supabase_logflare_private_access_token: ""
supabase_s3_protocol_access_key_id: ""
supabase_s3_protocol_access_key_secret: ""
supabase_minio_root_password: ""

# --- 新しい非対称鍵(ES256)方式のAPIキー ---
# trueにすると公式スクリプト(add-new-auth-keys.sh)で鍵を生成する。
# 従来のHS256キー(ANON_KEY / SERVICE_ROLE_KEY)は生成後もそのまま使える
supabase_enable_asymmetric_keys: false
supabase_publishable_key: ""
supabase_secret_key: ""
supabase_jwt_keys: ""
supabase_jwt_jwks: ""
supabase_anon_key_asymmetric: ""
supabase_service_role_key_asymmetric: ""

# --- 公開URL ---
# ⚠ ブラウザやクライアントから見たURL。既定はVMのIPとKongのポートから組み立てる
supabase_public_url: ""
# 認証のコールバックやメールのリンクに使う。未指定なら公開URL + /auth/v1
supabase_api_external_url: ""
# アプリ側のURL(ログイン後の戻り先)
supabase_site_url: http://localhost:3000
supabase_additional_redirect_urls: ""

# --- データベース ---
supabase_postgres_host: db
supabase_postgres_db: postgres
# ⚠ コンテナ内の待ち受けとVMからの公開の両方に使われる
supabase_postgres_port: 5432

# --- Supavisor(コネクションプーラー) ---
supabase_pooler_proxy_port_transaction: 6543
supabase_pooler_default_pool_size: 20
supabase_pooler_max_client_conn: 100
# 空なら自動生成(テナントを識別する文字列)
supabase_pooler_tenant_id: ""
supabase_pooler_db_pool_size: 5

# --- Studio(ダッシュボード) ---
supabase_studio_default_organization: Default Organization
supabase_studio_default_project: Default Project
# AIアシスタントを使う場合のみ
supabase_openai_api_key: ""

# --- Auth(GoTrue) ---
supabase_jwt_expiry: 3600
supabase_disable_signup: false
supabase_mailer_urlpaths_confirmation: /auth/v1/verify
supabase_mailer_urlpaths_invite: /auth/v1/verify
supabase_mailer_urlpaths_recovery: /auth/v1/verify
supabase_mailer_urlpaths_email_change: /auth/v1/verify
supabase_enable_email_signup: true
# ⚠ メールを送れない環境ではtrueにしないとユーザーが確認できない
supabase_enable_email_autoconfirm: false
supabase_smtp_admin_email: admin@example.com
supabase_smtp_host: supabase-mail
supabase_smtp_port: 2500
supabase_smtp_user: fake_mail_user
supabase_smtp_pass: fake_mail_password
supabase_smtp_sender_name: fake_sender
supabase_enable_anonymous_users: false
supabase_enable_phone_signup: true
supabase_enable_phone_autoconfirm: true

# --- API(PostgREST) ---
supabase_pgrst_db_schemas: public,graphql_public
supabase_pgrst_db_max_rows: 1000
supabase_pgrst_db_extra_search_path: public

# --- Storage ---
supabase_global_s3_bucket: stub
supabase_region: stub
supabase_minio_root_user: supa-storage
supabase_storage_tenant_id: stub

# --- Edge Functions ---
supabase_functions_verify_jwt: false

# --- ログ・分析(docker-compose.logs.yml を足したときに使われる) ---
supabase_docker_socket_location: /var/run/docker.sock
supabase_google_project_id: GOOGLE_PROJECT_ID
supabase_google_project_number: GOOGLE_PROJECT_NUMBER

# --- APIゲートウェイ(Kong) ---
supabase_kong_http_port: 8000
supabase_kong_https_port: 8443

# --- imgproxy ---
supabase_imgproxy_auto_webp: true

# --- TLSプロキシ(docker-compose.caddy.yml / nginx.yml を足したときに使われる) ---
supabase_proxy_domain: ""
supabase_certbot_email: ""

# 上に無い環境変数を足す場合に使う。例: {"GOTRUE_MFA_MAX_ENROLLED_FACTORS": "5"}
supabase_extra_env: {}

# コンテナ起動待ち(全サービスがhealthyになるまで。初回はイメージ取得で時間がかかる)
supabase_ready_retries: 60
supabase_ready_delay: 10
# イメージ取得前に必要とする空き容量(GiB)
supabase_min_free_disk_gb: 15

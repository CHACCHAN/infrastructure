# OS用ディスク(scsi0)とは別のディスクをGPTで初期化し、データストアのパスへ
# マウントする。バックアップの実データはこのディスクだけに置かれ、
# OS用ディスクは消費しない。
#
# 初期化の内容: GPTのパーティションテーブル + ディスク全体を使うパーティション1つ
#              + ファイルシステム(ラベル付き)
#
# 再実行しても作り直さない。次の順に「既にあるもの」を探し、
# どれも無いときだけ初期化する:
#   1. データストアのパスに既にマウントされているデバイス
#   2. 同じラベルのファイルシステム(前回の実行が途中で終わった場合もここで拾う)
#   3. パーティションを1つも持たないディスク(= 追加したばかりの空ディスク)
---
- name: OSが載っているブロックデバイスを特定する
  ansible.builtin.set_fact:
    # /dev/sda1 → sda、/dev/nvme0n1p1 → nvme0n1
    pbs_os_device: >-
      {{ ((ansible_mounts | selectattr('mount', 'equalto', '/')
           | map(attribute='device') | first) | default('', true))
         | regex_replace('^/dev/', '') | regex_replace('p?[0-9]+$', '') }}

- name: データストアのパスに既にマウントされているデバイスを調べる
  ansible.builtin.set_fact:
    pbs_datastore_mounted_device: >-
      {{ (ansible_mounts | selectattr('mount', 'equalto', pbs_datastore_path)
          | map(attribute='device') | first) | default('', true) }}

# 前回の実行が「初期化したがマウント前」で終わっていた場合や、
# パーティションを作らずに構築した古い環境を引き継ぐ場合にここで見つかる
- name: 同じラベルのファイルシステムを探す
  ansible.builtin.command:
    cmd: blkid -L {{ pbs_data_disk_label }}
  become: true
  changed_when: false
  failed_when: false
  register: pbs_data_disk_by_label

- name: 既に使えるファイルシステムがあるかを判定する
  ansible.builtin.set_fact:
    pbs_data_disk_existing: >-
      {{ pbs_datastore_mounted_device
         if ((pbs_datastore_mounted_device | length) > 0)
         else (pbs_data_disk_by_label.stdout | trim) }}

# パーティションを1つも持たないディスク = 追加したばかりの空ディスク。
# OS用ディスクも、初期化済みのデータ用ディスクもパーティションを持つため候補から外れる。
- name: 初期化していないディスクの候補を洗い出す
  ansible.builtin.set_fact:
    pbs_data_disk_candidates: >-
      {{ (ansible_devices | default({})) | dict2items
         | selectattr('key', 'match', '^(sd|vd|xvd|nvme)')
         | rejectattr('key', 'equalto', pbs_os_device)
         | selectattr('value.partitions', 'falsy')
         | map(attribute='key') | list }}

- name: データ用ディスクを特定できることを確認する
  ansible.builtin.assert:
    that:
      - ((pbs_data_disk_existing | length) > 0)
        or ((pbs_data_disk_device | length) > 0)
        or ((pbs_data_disk_candidates | length) == 1)
    fail_msg: >-
      データ用ディスクを自動判別できませんでした
      (初期化していないディスクの候補: {{ pbs_data_disk_candidates | join(', ') | default('なし', true) }})。
      VMに2本目のディスクがあるか確認してください
      (vm_hardware の disks で scsi1 を追加します)。
      候補が複数ある場合は -e "pbs_data_disk_device=/dev/sdb" のように明示してください。
      OS用ディスクにデータストアを作る場合は -e "pbs_data_disk_enabled=false" を指定します。
    quiet: true

# 明示指定 > 自動判別。既に使えるものがある場合はそちらを優先するため、ここは使われない
- name: 初期化するディスクを決定する
  ansible.builtin.set_fact:
    pbs_data_disk_target: >-
      {{
        pbs_data_disk_device
        if ((pbs_data_disk_device | length) > 0)
        else '/dev/' ~ pbs_data_disk_candidates[0]
      }}
  when: (pbs_data_disk_existing | length) == 0

# ディスク全体(/dev/sdb)を指しているならGPTで初期化する。
# パーティション(/dev/sdb1)を直接指定された場合はそのまま使う。
- name: 初期化の要否を判定する
  ansible.builtin.set_fact:
    pbs_data_disk_needs_init: >-
      {{ ((pbs_data_disk_existing | length) == 0)
         and (pbs_data_disk_partition | bool)
         and ((pbs_data_disk_target | basename) in (ansible_devices | default({}))) }}

- name: GPTのパーティションテーブルとパーティションを作成する
  community.general.parted:
    device: "{{ pbs_data_disk_target }}"
    label: gpt
    number: 1
    part_start: 1MiB
    part_end: 100%
    name: "{{ pbs_data_disk_label }}"
    state: present
  become: true
  when: pbs_data_disk_needs_init | bool

# nvme0n1 → nvme0n1p1、sdb → sdb1
- name: 使用するデバイスを決定する
  ansible.builtin.set_fact:
    pbs_data_disk_resolved: >-
      {{
        pbs_data_disk_existing
        if ((pbs_data_disk_existing | length) > 0)
        else (pbs_data_disk_target ~ ('p1' if (pbs_data_disk_target is match('.*[0-9]$')) else '1')
              if (pbs_data_disk_needs_init | bool)
              else pbs_data_disk_target)
      }}

# パーティション作成の直後はデバイスファイルがまだ現れていないことがある
- name: デバイスファイルが現れるまで待つ
  ansible.builtin.command:
    cmd: udevadm settle --timeout=30
  become: true
  changed_when: false
  when: pbs_data_disk_needs_init | bool

- name: データ用ディスクの状態を取得する
  ansible.builtin.stat:
    path: "{{ pbs_data_disk_resolved }}"
  register: pbs_data_disk_stat

- name: データ用ディスクがブロックデバイスであることを確認する
  ansible.builtin.assert:
    that:
      - pbs_data_disk_stat.stat.exists
      - pbs_data_disk_stat.stat.isblk | default(false)
    fail_msg: >-
      {{ pbs_data_disk_resolved }} はブロックデバイスではありません。
      pbs_data_disk_device には /dev/sdb のようなデバイスファイルを指定してください。
    quiet: true

- name: 使用するデータ用ディスクを表示する
  ansible.builtin.debug:
    msg: >-
      データストア用に {{ pbs_data_disk_resolved }} を使います
      ({{ 'GPTで初期化しました'
          if (pbs_data_disk_needs_init | bool)
          else '既にあるものをそのまま使います' }})。

# 既に同じ種類のファイルシステムがあれば何もしない。
# 別の種類のファイルシステムがある場合は「データが入っているかもしれない
# ディスク」なので、上書きせずに失敗する(forceは指定しない)。
- name: データ用ディスクにファイルシステムを作成する
  community.general.filesystem:
    dev: "{{ pbs_data_disk_resolved }}"
    fstype: "{{ pbs_data_disk_fstype }}"
    opts: "-L {{ pbs_data_disk_label }}"
  become: true

# デバイス名(/dev/sdb1)は接続順で変わることがあるため、fstabにはUUIDで書く
- name: ファイルシステムのUUIDを取得する
  ansible.builtin.command:
    cmd: blkid -s UUID -o value {{ pbs_data_disk_resolved }}
  become: true
  changed_when: false
  register: pbs_data_disk_uuid

- name: データストアのパスへマウントする
  ansible.posix.mount:
    path: "{{ pbs_datastore_path }}"
    src: "UUID={{ pbs_data_disk_uuid.stdout | trim }}"
    fstype: "{{ pbs_data_disk_fstype }}"
    opts: "{{ pbs_data_disk_mount_opts }}"
    dump: "0"
    passno: "2"
    state: mounted
  become: true

# マウントに失敗したままデータストアを作ると、バックアップがOS用ディスクへ
# 書き込まれてしまう。データストアを作る前にここで止める。
- name: データストアのパスがデータ用ディスクであることを確認する
  ansible.builtin.command:
    cmd: findmnt --noheadings --output SOURCE --mountpoint {{ pbs_datastore_path }}
  become: true
  changed_when: false
  register: pbs_datastore_mount_check
  failed_when: pbs_datastore_mount_check.rc != 0

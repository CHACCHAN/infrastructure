# LiteLLM Proxy(LLM API のゲートウェイ)を Helm で入れるロールの既定値。
# 秘密情報と、公開ホスト名(litellm_host、authentik_host)は、既定値を持たない。
---
# チャートのバージョン(OCI)。イメージのタグは、チャートの appVersion
litellm_chart_version: "1.108.2"
litellm_chart_url: oci://ghcr.io/berriai/litellm-helm
litellm_release_name: litellm
litellm_namespace: litellm
# 専用の PostgreSQL(k3s_postgresql が、この namespace に作る)。DB の所有者のロールは、DB と同じ名前
litellm_db_namespace: litellm-db
litellm_db_host: "{{ litellm_db_namespace }}-rw.{{ litellm_db_namespace }}.svc.cluster.local"
litellm_db_name: litellm
# 管理者(proxy_admin)にする Authentik のグループの名前(グループ自体は Authentik の画面で作る)
litellm_admin_group: admins
# OIDC の client_id(Authentik の OIDC クライアントの slug と同じ)
litellm_oidc_client_id: litellm
# 緊急用の管理者(管理画面のパスワードでのログイン。パスワードは vault)
litellm_ui_username: admin
# 宣言で持つモデル(model_list)。空なら、管理画面で登録したものだけを使う
litellm_models: []
# モデルのプロバイダーの API キー。環境変数名をキーにした辞書(例: ANTHROPIC_API_KEY)
litellm_provider_keys: {}
# Helm values の上書き(基本値へ再帰的に合成する)
litellm_values: {}
# 管理 API は LAN/VPN 用のホスト名で TLS を検証する
litellm_management_url: "https://{{ litellm_host }}"
litellm_managed_models: []
# 既存のルーティンググループ(router 設定の routing_groups)。グループ名で識別し、宣言したグループだけを置き換える
litellm_managed_routing_groups: []
# ルーティンググループのフォールバック(router 設定の fallbacks)。グループ名をキーにし、宣言したものだけを置き換える
litellm_managed_fallbacks: []
litellm_managed_keys: []
# キーの識別子と秘密値。通常の設定宣言とは分けて playbook が渡す
litellm_key_material: {}
# 使用量や期限の相対指定は管理せず、予算カウンターを保つ
litellm_managed_key_fields:
  - key_alias
  - models
  - max_budget
  - tpm_limit
  - rpm_limit
  - max_parallel_requests
  - metadata
litellm_export_file: "{{ role_path }}/../../vault/litellm_snapshot.yml"
litellm_export_overwrite: false
# 認証情報・ヘッダー・プロバイダー固有の秘密を更新対象へ混ぜない
litellm_managed_model_fields:
  - model
  - api_base
  - custom_llm_provider
  - timeout
  - request_timeout
  - stream_timeout
  - max_retries
  - rpm
  - tpm
  - weight
  - tags
  - guardrails
  - allowed_openai_params
  - allow_client_keepalive_override
  - use_in_pass_through
  - use_litellm_proxy
  - use_xai_oauth
  - merge_reasoning_content_in_choices
  - reasoning_effort
  - additional_drop_params
  - complexity_router_config
  - complexity_router_default_model
# ルーティンググループで更新を許可するフィールド
litellm_managed_routing_group_fields:
  - group_name
  - models
  - routing_strategy
  - routing_strategy_args
  - model_priorities
# ライフサイクル操作では「論理名/操作」を確認値に指定する
litellm_key_confirm: ""
litellm_key_file: "{{ role_path }}/../../vault/litellm_keys.yml"

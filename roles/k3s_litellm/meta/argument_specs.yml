---
argument_specs:
  main:
    short_description: LiteLLM Proxy を Helm で入れる
    description:
      - 接続とリリースの適用は k3s ロール(helm_*)に任せる。
      - 設定ファイルのモデルのほか、管理画面から足したモデルも DB に保存される。
    options:
      litellm_chart_version:
        type: str
        description: "チャートのバージョン"
      litellm_chart_url:
        type: str
        description: "チャートの OCI の URL"
      litellm_release_name:
        type: str
        description: "Helm のリリース名"
      litellm_namespace:
        type: str
        description: "リリースの namespace"
      litellm_host:
        type: str
        required: true
        description: "LiteLLM の公開ホスト名(インベントリで宣言する)"
      litellm_models:
        type: list
        elements: dict
        description: "宣言で持つ model_list(model_name、litellm_params)。空なら、管理画面で登録したものだけを使う"
      litellm_db_namespace:
        type: str
        description: "専用の PostgreSQL を置く namespace(インベントリの helm_network_policies にも宣言する)"
      litellm_db_host:
        type: str
        description: "PostgreSQL のホスト"
      litellm_db_name:
        type: str
        description: "DB 名(所有者のロールも同じ名前)"
      litellm_db_password:
        type: str
        required: true
        no_log: true
        description: "DB の所有者のロールのパスワード(vault/litellm.yml)"
      litellm_master_key:
        type: str
        required: true
        no_log: true
        description: "マスターキー(vault/litellm.yml。sk- で始める)。API の鍵で、管理画面のログインには使わない"
      litellm_ui_username:
        type: str
        description: "緊急用の管理者のユーザー名(管理画面のパスワードでのログイン)"
      litellm_ui_password:
        type: str
        required: true
        no_log: true
        description: "緊急用の管理者のパスワード(vault/litellm.yml)"
      litellm_salt_key:
        type: str
        required: true
        no_log: true
        description: "DB に保存する認証情報の暗号化キー(vault/litellm.yml。モデルを登録したあとは変えない)"
      authentik_host:
        type: str
        required: true
        description: "Authentik の公開ホスト名(インベントリで宣言する)"
      litellm_oidc_client_id:
        type: str
        description: "OIDC の client_id(Authentik の OIDC クライアントの slug と同じ)"
      litellm_oidc_client_secret:
        type: str
        required: true
        no_log: true
        description: "OIDC の client_secret(vault/litellm.yml。Authentik にも同じ値を渡す)"
      litellm_admin_group:
        type: str
        description: "管理者(proxy_admin)にする Authentik のグループの名前(グループ自体は Authentik の画面で作る)"
      litellm_provider_keys:
        type: dict
        no_log: true
        description: "プロバイダーの API キー(環境変数名をキーにした辞書。vault/litellm.yml)"
      litellm_values:
        type: dict
        description: "LiteLLM の Helm values の上書き(基本値へ再帰的に合成する。例: resources、TZ)"
  manage:
    short_description: 管理 API で既存モデルと仮想キーの設定を更新する
    options:
      litellm_management_url:
        type: str
        description: 管理 API の URL
      litellm_master_key:
        type: str
        required: true
        no_log: true
        description: 管理 API のマスターキー
      litellm_managed_models:
        type: list
        elements: dict
        no_log: true
        description: inventory に宣言する既存モデルの ID・名前・非機密の接続設定
      litellm_managed_keys:
        type: list
        elements: dict
        no_log: true
        description: inventory に宣言する仮想キーの論理名と更新する設定
      litellm_key_material:
        type: dict
        required: true
        no_log: true
        description: Vault から渡すキーの論理名ごとのハッシュ・秘密値・非公開の設定
      litellm_managed_model_fields:
        type: list
        elements: str
        description: 認証情報を含まない、更新を許可するモデル設定のフィールド
      litellm_managed_key_fields:
        type: list
        elements: str
        description: 更新を許可する仮想キー設定のフィールド
  export:
    short_description: 管理 API の取得結果を暗号化して保存する
    options:
      litellm_management_url:
        type: str
        description: 管理 API の URL
      litellm_master_key:
        type: str
        required: true
        no_log: true
        description: 管理 API のマスターキー
      litellm_export_file:
        type: path
        description: 暗号化した取得結果の保存先
      litellm_export_overwrite:
        type: bool
        description: 既存の宣言の置き換えを許可する
  key_lifecycle:
    short_description: 確認したキーだけを発行・利用停止・再開・ローテーションする
    options:
      litellm_master_key:
        type: str
        required: true
        no_log: true
        description: 管理 API のマスターキー
      litellm_management_url:
        type: str
        description: TLS を検証する管理 API URL
      litellm_key_name:
        type: str
        required: true
        description: 操作するキーの論理名
      litellm_key_action:
        type: str
        required: true
        choices: [create, block, unblock, rotate, retire]
        description: 発行・利用停止・再開・新キー準備・旧キー停止のいずれか
      litellm_key_confirm:
        type: str
        description: 実行を確認する「論理名/操作」
      litellm_key_file:
        type: path
        description: キーの識別子と秘密を暗号化して保存するファイル
      litellm_managed_keys:
        type: list
        elements: dict
        description: inventory に宣言するキーの論理名と利用範囲
      litellm_managed_key_fields:
        type: list
        elements: str
        description: 許可する利用範囲の設定項目

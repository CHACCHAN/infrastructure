# 上流Helmチャート、公開経路、任意のSecretを順に収束させる。
---
# Secretを先に収束させる(これを参照するワークロードが待たずに起動できるように)

- name: nextcloud-admin Secretを描画する
  ansible.builtin.set_fact:
    k8s_nextcloud_nextcloud_admin_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: nextcloud-admin
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_nextcloud_admin }}"
  when: k8s_secret_nextcloud_admin is defined
  no_log: true

- name: nextcloud-admin SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_nextcloud_nextcloud_admin_secret_definition }}"
    k8s_apply_no_log: true
  when: k8s_secret_nextcloud_admin is defined

- name: nextcloud-db Secretを描画する
  ansible.builtin.set_fact:
    k8s_nextcloud_nextcloud_db_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: nextcloud-db
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_nextcloud_db }}"
  when: k8s_secret_nextcloud_db is defined
  no_log: true

- name: nextcloud-db SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_nextcloud_nextcloud_db_secret_definition }}"
    k8s_apply_no_log: true
  when: k8s_secret_nextcloud_db is defined

- name: nextcloud-oidc Secretを描画する
  ansible.builtin.set_fact:
    k8s_nextcloud_nextcloud_oidc_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: nextcloud-oidc
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_nextcloud_oidc }}"
  when: k8s_secret_nextcloud_oidc is defined
  no_log: true

- name: nextcloud-oidc SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_nextcloud_nextcloud_oidc_secret_definition }}"
    k8s_apply_no_log: true
  when: k8s_secret_nextcloud_oidc is defined
- name: nextcloud Helmチャートを描画して適用する
  ansible.builtin.import_role:
    name: k8s
    tasks_from: helm
  vars:
    k8s_helm_release: nextcloud
    k8s_helm_chart: nextcloud
    k8s_helm_repo_url: https://nextcloud.github.io/helm/
    k8s_helm_version: "{{ k8s_nextcloud_helm_version }}"
    k8s_helm_namespace: platform
    k8s_helm_values: "{{ k8s_nextcloud_values }}"
    k8s_helm_no_hooks: false
    k8s_helm_include_crds: false
    k8s_helm_inject_namespace: true

- name: 公開Ingressを描画する
  ansible.builtin.set_fact:
    k8s_nextcloud_ingress_definition: "{{ lookup('ansible.builtin.template', 'ingress.yaml.j2') }}"

- name: 公開IngressをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_nextcloud_ingress_definition }}"

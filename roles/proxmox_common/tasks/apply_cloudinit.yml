# cloud-initの設定を対象VMへ適用する。proxmox_template_build(テンプレート構築時)と
# proxmox_vm_cloudinit(既存VMの変更)の両ロールから呼ばれる。
# 呼び出し元は proxmox_cloudinit_vmid に対象VMIDをセットしておくこと。
#
# ssh_user / ssh_password / ssh_pubkey / ipv4(_gw) / ipv6(_gw) / nameserver /
# searchdomain を対応するqmオプションへ渡す。未指定・空文字の項目は変更しない。
# ssh_password はVM内のログインパスワードで、Proxmoxホストへの接続パスワードとは別物。
#
# NICを2枚持つVM向けに、2枚目(net1)のIPは net1_ipv4(_gw) / net1_ipv6(_gw) で
# ipconfig1へ渡す。クラスタ内部だけで使う占有ネットワークのように、ゲートウェイを
# 持たないNICでもアドレスだけを指定できる。
#
# 変更はVM設定に即座に反映されるが、ゲスト内で有効になるのは次回起動時。
---
- name: 適用対象の指定状況を判定する
  ansible.builtin.set_fact:
    proxmox_cloudinit_has_user: "{{ (ssh_user | default('', true)) | length > 0 }}"
    proxmox_cloudinit_has_password: "{{ (ssh_password | default('', true)) | length > 0 }}"
    proxmox_cloudinit_has_pubkey: "{{ (ssh_pubkey | default('', true)) | length > 0 }}"
    proxmox_cloudinit_has_ip: >-
      {{ ((ipv4 | default('', true)) | length > 0) or ((ipv6 | default('', true)) | length > 0) }}
    proxmox_cloudinit_has_net1_ip: >-
      {{ ((net1_ipv4 | default('', true)) | length > 0)
         or ((net1_ipv6 | default('', true)) | length > 0) }}
    proxmox_cloudinit_has_nameserver: "{{ (nameserver | default('', true)) | length > 0 }}"
    proxmox_cloudinit_has_searchdomain: "{{ (searchdomain | default('', true)) | length > 0 }}"
    proxmox_cloudinit_sshkey_file: "/tmp/proxmox_cloudinit_{{ proxmox_cloudinit_vmid }}_sshkey.pub"

- name: Cloud-initのIPアドレス設定文字列を組み立てる
  ansible.builtin.set_fact:
    proxmox_cloudinit_ipconfig0: >-
      {{
        [
          ('ip=' + ipv4) if (ipv4 | default('', true) | length > 0) else '',
          ('gw=' + ipv4_gw) if (ipv4_gw | default('', true) | length > 0) else '',
          ('ip6=' + ipv6) if (ipv6 | default('', true) | length > 0) else '',
          ('gw6=' + ipv6_gw) if (ipv6_gw | default('', true) | length > 0) else ''
        ] | reject('equalto', '') | join(',')
      }}
  when: proxmox_cloudinit_has_ip | bool

- name: 2枚目のNIC(net1)のIPアドレス設定文字列を組み立てる
  ansible.builtin.set_fact:
    proxmox_cloudinit_ipconfig1: >-
      {{
        [
          ('ip=' + net1_ipv4) if (net1_ipv4 | default('', true) | length > 0) else '',
          ('gw=' + net1_ipv4_gw) if (net1_ipv4_gw | default('', true) | length > 0) else '',
          ('ip6=' + net1_ipv6) if (net1_ipv6 | default('', true) | length > 0) else '',
          ('gw6=' + net1_ipv6_gw) if (net1_ipv6_gw | default('', true) | length > 0) else ''
        ] | reject('equalto', '') | join(',')
      }}
  when: proxmox_cloudinit_has_net1_ip | bool

# --sshkeyはファイルパスしか受け付けないため、対象ノード上に一時ファイルとして書き出す
- name: SSH公開鍵を対象ノード上に一時ファイルとして書き出す
  ansible.builtin.copy:
    content: "{{ ssh_pubkey }}\n"
    dest: "{{ proxmox_cloudinit_sshkey_file }}"
    mode: "0600"
  when: proxmox_cloudinit_has_pubkey | bool

- name: VM設定コマンドの引数を組み立てる
  ansible.builtin.set_fact:
    proxmox_cloudinit_argv: >-
      {{
        ['qm', 'set', proxmox_cloudinit_vmid | string]
        + (['--ciuser', ssh_user] if (proxmox_cloudinit_has_user | bool) else [])
        + (['--cipassword', ssh_password] if (proxmox_cloudinit_has_password | bool) else [])
        + (['--sshkey', proxmox_cloudinit_sshkey_file] if (proxmox_cloudinit_has_pubkey | bool) else [])
        + (['--ipconfig0', proxmox_cloudinit_ipconfig0] if (proxmox_cloudinit_has_ip | bool) else [])
        + (['--ipconfig1', proxmox_cloudinit_ipconfig1] if (proxmox_cloudinit_has_net1_ip | bool) else [])
        + (['--nameserver', nameserver] if (proxmox_cloudinit_has_nameserver | bool) else [])
        + (['--searchdomain', searchdomain] if (proxmox_cloudinit_has_searchdomain | bool) else [])
      }}
  no_log: "{{ proxmox_cloudinit_has_password | bool }}"

- name: 適用する項目を表示する
  ansible.builtin.debug:
    msg: >-
      VMID {{ proxmox_cloudinit_vmid }} に適用するcloud-init設定:
      {{
        [
          'ciuser' if (proxmox_cloudinit_has_user | bool) else '',
          'cipassword(値は非表示)' if (proxmox_cloudinit_has_password | bool) else '',
          'sshkey' if (proxmox_cloudinit_has_pubkey | bool) else '',
          'ipconfig0=' + (proxmox_cloudinit_ipconfig0 | default('')) if (proxmox_cloudinit_has_ip | bool) else '',
          'ipconfig1=' + (proxmox_cloudinit_ipconfig1 | default('')) if (proxmox_cloudinit_has_net1_ip | bool) else '',
          'nameserver=' + (nameserver | default('')) if (proxmox_cloudinit_has_nameserver | bool) else '',
          'searchdomain=' + (searchdomain | default('')) if (proxmox_cloudinit_has_searchdomain | bool) else ''
        ] | reject('equalto', '') | join(', ') | default('なし', true)
      }}

# 引数が3つ(qm set <vmid>)のままなら適用対象が1つも無いので実行しない
- name: Cloud-init設定を適用する
  ansible.builtin.command:
    argv: "{{ proxmox_cloudinit_argv }}"
  register: proxmox_cloudinit_result
  changed_when: proxmox_cloudinit_result.rc == 0
  no_log: "{{ proxmox_cloudinit_has_password | bool }}"
  when: proxmox_cloudinit_argv | length > 3

- name: SSH公開鍵の一時ファイルを削除する
  ansible.builtin.file:
    path: "{{ proxmox_cloudinit_sshkey_file }}"
    state: absent
  when: proxmox_cloudinit_has_pubkey | bool

# Hermesのサービスをsystemdで常駐・自動起動させる。
#
# 2つのプロセスがある(上流の設計):
#   web dashboard … 管理UI + ブラウザ内チャット。上流にサービス化コマンドが無いため
#                   このロールがsystem scopeのunitを持つ。Traefikで公開するのはこちら
#   Gateway       … Telegram/Discord/LINE等のメッセージング常駐プロセス。上流の
#                   `hermes gateway install` がユーザースコープのunit(+linger)を作る
#                   (unitの内容は上流が管理する。常駐の有無は hermes_enable_gateway)
---
- name: 認証情報を置くディレクトリを作成する
  ansible.builtin.file:
    path: "{{ hermes_dashboard_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# dashboardの認証情報。HERMES_HOME配下の.envはHermes自身が書き換えるため、
# Ansibleの管理対象はこの環境ファイルに閉じる。root所有・Hermesユーザーのみ読める
- name: dashboardの認証情報を環境ファイルへ配置する
  ansible.builtin.template:
    src: dashboard.env.j2
    dest: "{{ hermes_dashboard_env_file }}"
    owner: root
    group: "{{ ansible_user }}"
    mode: "0640"
  become: true
  no_log: true
  register: hermes_dashboard_env_state

- name: 対話シェル用の環境設定を配置する
  ansible.builtin.template:
    src: hermes-profile.sh.j2
    dest: "{{ hermes_profile_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: dashboardのsystemd unitを配置する
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: "/etc/systemd/system/{{ hermes_dashboard_service_name }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: hermes_dashboard_unit

# unit・認証情報・本体の版・公開設定のいずれかが変わったときだけ restarted にする。
# 条件は中間変数に置かずこの場で組み立てる(変数経由だと真偽判定を誤る経路がある)。
# default({}) はスキップされたタスクの register でも評価できるようにするため。
- name: dashboardのサービスを有効化・起動する
  ansible.builtin.systemd:
    name: "{{ hermes_dashboard_service_name }}"
    enabled: true
    state: >-
      {{ 'restarted'
         if ((hermes_dashboard_unit is changed)
             or (hermes_dashboard_env_state is changed)
             or ((hermes_installer_run | default({}, true)) is changed)
             or ((hermes_web_extras_install | default({}, true)) is changed)
             or (hermes_config_changed | default(false) | bool))
         else 'started' }}
    daemon_reload: "{{ hermes_dashboard_unit is changed }}"
  become: true

- name: メッセージングGatewayを常駐させる
  when: hermes_enable_gateway | bool
  block:
    # ログアウト後もユーザーのsystemdインスタンスを動かし続ける。
    # systemctl --user が使う /run/user/<uid> の常設もこれで担保される。
    - name: ユーザーのlingerを有効にする
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ ansible_user }}
        creates: "{{ hermes_gateway_linger_marker }}"
      become: true

    # system scopeのunitが残っていると同じ:8646を奪い合う。
    - name: system scopeのGatewayのunitを確認する
      ansible.builtin.stat:
        path: "{{ hermes_gateway_system_unit }}"
      become: true
      register: hermes_gateway_system_unit_stat

    - name: system scopeのGatewayを取り除く
      when: hermes_gateway_system_unit_stat.stat.exists
      become: true
      block:
        - name: system scopeのサービスを停止・自動起動解除する
          ansible.builtin.systemd:
            name: "{{ hermes_gateway_service_name }}"
            enabled: false
            state: stopped

        - name: system scopeのunitを削除する
          ansible.builtin.file:
            path: "{{ hermes_gateway_system_unit }}"
            state: absent

        - name: unitの削除をsystemdへ反映する
          ansible.builtin.systemd:
            daemon_reload: true

    # ユーザースコープではrootを介さないため、再起動用のsudoersは要らない。
    - name: Gateway再起動用のsudoersを削除する
      ansible.builtin.file:
        path: "{{ hermes_gateway_sudoers_file }}"
        state: absent
      become: true

    # 呼び出し元ユーザーの導入(HERMES_HOME)を見てunitを組み立てるため、Hermesユーザーで実行する。
    # 起動と自動起動はフラグで明示する(上流CLIは指定が無いとstdinがttyのとき対話プロンプトを出す)。
    # 起動は次のsystemdタスクが行う(unitの内容を検証してから起動する)。
    - name: Gatewayのsystemdサービスをユーザースコープでインストールさせる
      ansible.builtin.command:
        argv:
          - "{{ hermes_bin }}"
          - gateway
          - install
          - --start-on-login
          - --no-start-now
        creates: "{{ hermes_gateway_user_unit }}"
      become: false
      environment:
        HERMES_HOME: "{{ hermes_home }}"
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"

    - name: 生成されたGatewayのunitを読み取る
      ansible.builtin.slurp:
        src: "{{ hermes_gateway_user_unit }}"
      become: false
      register: hermes_gateway_unit_content

    # 別のHERMES_HOMEを見るunitができていると、dashboardから状態が見えなくなる。
    - name: Gatewayが宣言した導入先で動く設定になっていることを確認する
      ansible.builtin.assert:
        that:
          - hermes_install_dir in (hermes_gateway_unit_content.content | b64decode)
        fail_msg: >-
          {{ hermes_gateway_user_unit }} が {{ hermes_install_dir }} を
          指していません。unitを削除(hermes gateway uninstall)してから再実行してください。
        quiet: true

    - name: Gatewayのサービスを有効化・起動する
      ansible.builtin.systemd:
        name: "{{ hermes_gateway_service_name }}"
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"

# 宣言をfalseへ戻したときに常駐したままにしない(unitは残すが停止・自動起動解除)。
- name: 常駐させない宣言のときはGatewayを停止する
  when: not (hermes_enable_gateway | bool)
  block:
    - name: Gatewayのunitの有無を確認する
      ansible.builtin.stat:
        path: "{{ hermes_gateway_user_unit }}"
      become: false
      register: hermes_gateway_unit_stat

    - name: Gatewayのサービスを停止・自動起動解除する
      ansible.builtin.systemd:
        name: "{{ hermes_gateway_service_name }}"
        scope: user
        enabled: false
        state: stopped
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      when: hermes_gateway_unit_stat.stat.exists

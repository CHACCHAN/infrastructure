---
- name: 専用の PostgreSQL を適用する
  ansible.builtin.include_role:
    name: k3s_postgresql
  vars:
    postgresql_namespace: "{{ gravitee_db_namespace }}"
    postgresql_database: "{{ gravitee_db_name }}"
    postgresql_password: "{{ gravitee_db_password }}"

- name: Gravitee APIM を適用する
  ansible.builtin.include_role:
    name: k3s
  vars:
    helm_release_name: "{{ gravitee_release_name }}"
    helm_chart: "{{ gravitee_chart }}"
    helm_chart_repo_url: "{{ gravitee_chart_repo_url }}"
    helm_chart_version: "{{ gravitee_chart_version }}"
    helm_namespace: "{{ gravitee_namespace }}"
    helm_timeout: 15m
    # checksum も秘密値から導出するため、values をログへ出さない。
    helm_no_log: true
    helm_values: "{{ __gravitee_values | combine(gravitee_values, recursive=True) }}"
    helm_secrets: "{{ __gravitee_secrets }}"
    helm_ingress: "{{ __gravitee_ingress }}"
    helm_network_policy: true

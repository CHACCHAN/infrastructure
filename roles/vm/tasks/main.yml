---
- name: cloud-init の完了を待つ
  ansible.builtin.import_tasks: ready.yml

- name: パッケージと定期処理を設定する
  ansible.builtin.import_tasks: install.yml

- name: ルートパーティションとファイルシステムを拡張する
  ansible.builtin.import_tasks: grow_root.yml

- name: ZRAM の swap を設定する
  ansible.builtin.import_tasks: zram.yml
  when: vm_zram_percent > 0

# 上流チャートの固定バージョンと、既存values.yamlから転記した設定。
---
k8s_awx_helm_version: "3.2.1"
k8s_awx_values:
  rbac:
    create: true

  AWX:
    # AWX リソースを一緒に出力する。false だと Operator だけになる。
    enabled: true

    # AWX リソースの名前。子リソースの名前がすべてこれで決まるので、
    # 後から変えると作り直しになる。
    #   Service     awx-service
    #   Secret      awx-admin-password / awx-secret-key
    name: awx

    # チャート側で postgres の StatefulSet を出力させない。
    # DB は platform namespace 共用の PostgreSQL を使う
    # (下の spec.postgres_configuration_secret)。
    postgres:
      enabled: false

    # ここから下が AWX リソースの spec。上流の既定値との差分だけ書く。
    spec:
      admin_user: admin
      # admin のパスワードは書かない。指定しなければ Operator が
      # Secret awx-admin-password を生成する (取り出し方は README.md)。

      # ingress_type: none なので Operator は Ingress を作らない。
      # それでも hostname が要るのは、AWX が自分の URL を組み立てる
      # (通知メールのリンクなど) のに使うため。
      hostname: ansible.{{ k8s_domain }}
      ingress_type: none
      service_type: ClusterIP

      # TLS は Traefik で終端していて、AWX 自身は平文 HTTP で受ける。
      # AWX (Django) はそのままだと POST を Origin 不一致で弾くので、
      # 信頼するオリジンを明示する。値は Python のリテラルとして
      # 評価されるため、文字列として渡す。
      extra_settings:
        - setting: TOWER_URL_BASE
          value: "'https://ansible.{{ k8s_domain }}'"

        # Traefik で HTTPS を終端しているため、
        # Django が Origin 不一致として POST を拒否しないよう
        # 信頼する Origin を登録する。
        - setting: CSRF_TRUSTED_ORIGINS
          value: "['https://ansible.{{ k8s_domain }}']"

        # --- SAML (Authentik) ---------------------------------------------
        - setting: SOCIAL_AUTH_SAML_SP_ENTITY_ID
          value: "'https://ansible.{{ k8s_domain }}'"

        - setting: SOCIAL_AUTH_SAML_ORG_INFO
          value: "{'en-US': {'name': 'authentik', 'url': 'https://auth.{{ k8s_domain }}', 'displayname': 'authentik'}}"

        # SAMLバックエンド(python-social-auth)はSPメタデータ用の連絡先を
        # 必須とする。表示用メタデータで機密ではない。
        - setting: SOCIAL_AUTH_SAML_TECHNICAL_CONTACT
          value: "{'givenName': 'CHACCHAN', 'emailAddress': 'chacchan.info@gmail.com'}"

        - setting: SOCIAL_AUTH_SAML_SUPPORT_CONTACT
          value: "{'givenName': 'CHACCHAN', 'emailAddress': 'chacchan.info@gmail.com'}"

      extra_settings_files:
        secrets:
          - name: awx-saml
            key: saml.py

      # DB は platform namespace 共用の PostgreSQL を使う。
      # (platform/apps/postgresql/。接続先は postgresql.platform.svc:5432)
      #
      # この行があると Operator は postgres の StatefulSet を作らず、
      # Secret に書かれた外部 DB へ接続する。Secret には
      # host / port / database / username / password / sslmode / type の
      # 7 つのキーが要り、type は必ず "unmanaged" にする。
      # 作り方は ../postgresql/README.md にまとめてある。
      #
      # **後から managed <-> unmanaged を切り替えると DB が引き継がれない。**
      # 移行する場合は pg_dump / pg_restore が要る (README.md 参照)。
      postgres_configuration_secret: awx-postgres-configuration

      # 上流の既定 (web 1000m/2Gi, task 500m/1Gi, ee 500m/1Gi) は
      # このクラスタには大きすぎて、requests だけでノードを 1 台占有する。
      # limits は付けない。ジョブ実行中に OOMKill されると
      # 原因が分かりにくい形で失敗するため。
      web_resource_requirements:
        requests:
          cpu: 200m
          memory: 1Gi
      task_resource_requirements:
        requests:
          cpu: 200m
          memory: 1Gi
      ee_resource_requirements:
        requests:
          cpu: 100m
          memory: 256Mi
      # postgres_* の項目は書かない。Operator が DB を管理していないので
      # 効かない。DB 側のリソースは platform/apps/postgresql/values.yaml。

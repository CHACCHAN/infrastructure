---
argument_specs:
  main:
    short_description: Homarr を Helm で入れ、Authentik の OIDC でログインできるようにする
    description:
      - 接続とリリースの適用は k3s ロール(helm_*)に任せる。
      - OIDC のクライアントは k3s_authentik が Blueprint で宣言する。同じ client_secret を両方に渡す。
    options:
      homarr_chart_version:
        type: str
        description: "チャートのバージョン"
      homarr_chart_repo_url:
        type: str
        description: "チャートの配布元の URL"
      homarr_release_name:
        type: str
        description: "Helm のリリース名"
      homarr_namespace:
        type: str
        description: "リリースの namespace"
      homarr_host:
        type: str
        required: true
        description: "Homarr の公開ホスト名(インベントリで宣言する)"
      authentik_host:
        type: str
        required: true
        description: "Authentik の公開ホスト名(OIDC の発行者。インベントリで宣言する)"
      homarr_storage_size:
        type: str
        description: "データ(SQLite の DB)を置くボリュームの大きさ"
      homarr_oidc_client_id:
        type: str
        description: "OIDC の client_id"
      homarr_oidc_client_secret:
        type: str
        required: true
        no_log: true
        description: "OIDC の client_secret(vault/homarr.yml)"
      homarr_db_encryption_key:
        type: str
        required: true
        no_log: true
        description: "DB の暗号化キー(vault/homarr.yml。64桁の16進数。失うとデータが読めない)"
      homarr_values:
        type: dict
        description: "Homarr の Helm values の上書き(基本値へ再帰的に合成する。例: resources、TZ)"

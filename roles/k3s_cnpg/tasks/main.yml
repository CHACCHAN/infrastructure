---
- name: CloudNativePG のオペレーターを適用する
  ansible.builtin.include_role:
    name: k3s
  vars:
    helm_release_name: "{{ cnpg_release_name }}"
    helm_chart: cloudnative-pg
    helm_chart_repo_url: "{{ cnpg_chart_repo_url }}"
    helm_chart_version: "{{ cnpg_chart_version }}"
    helm_namespace: "{{ cnpg_namespace }}"

# 構築内容の表示と、Proxmox操作用のホスト登録を行う。
# 「構築対象を確認する」プレイ(hosts: pv_targets)の最後に呼ぶ
# (先に resolve_target_vars.yml で pv_ 接頭辞のfactが決まっている必要がある)。
#
# 呼び出し側のプレイが vars で渡すもの(いずれも任意):
#   pv_service_summary   : 構築内容の表示に足すサービス固有の情報(ポート・URL等)
#   pv_resize_hint_reason: ディスク拡張の指定漏れ警告に足すサービス固有の説明
#   pv_resize_example    : 警告で案内する vm_hardware の推奨値
#                          (pv_resize_example が無ければ警告自体を出さない)
---
# 同じノードに複数台を同時構築するとVMID重複で衝突するため、
# テンプレート構築はノードごとに先頭の1台だけが担当する
- name: テンプレート構築を担当するホストを決める
  ansible.builtin.set_fact:
    pv_template_host: >-
      {{
        ansible_play_hosts | map('extract', hostvars)
        | selectattr('pv_proxmox_ip', 'equalto', pv_proxmox_ip)
        | map(attribute='inventory_hostname') | first
      }}

- name: 構築内容を表示する
  ansible.builtin.debug:
    msg: >-
      VMID {{ vm_id | default('(未指定)') }} ({{ vm_name | default('(未指定)') }})
      → ノード {{ pv_proxmox_ip | default('(未指定)', true) }}
      / ストレージ {{ pv_target_storage | default('(未指定)', true) }}
      / {{ pv_os_type }} {{ pv_os_version }}
      / IP {{ pv_vm_ipv4 }} gw {{ pv_vm_ipv4_gw | default('(未指定)', true) }}
      / ログイン {{ pv_vm_ssh_user | default('(未指定)', true) }}
      {{ ('/ ' ~ pv_service_summary)
         if ((pv_service_summary | default('', true)) | length > 0) else '' }}
      / テンプレート構築担当: {{ 'はい' if (inventory_hostname == pv_template_host) else 'いいえ' }}

# 大きいテンプレートを使う場合もあるため、停止はせず警告だけ出す
# (実際に足りるかどうかはVM内セットアップの冒頭で空き容量を見て判定する)
- name: ディスク拡張の指定漏れに注意を促す
  ansible.builtin.debug:
    msg: >-
      【注意】vm_hardware に resize の指定がありません。
      テンプレート素のディスク(数GB)のままVMが構築されます。
      {{ pv_resize_hint_reason | default('', true) }}
      インベントリ版の既定値と同じにするには
      {{ pv_resize_example }}
      のように指定してください。
  when:
    - pv_resize_example is defined
    - (vm_hardware | default({})).resize is not defined

# 呼び出し先が処理するproxmoxグループへ、ホスト名のまま登録して接続先だけ向け直す。
# add_hostは1回しか実行されないため、対象ホストをループして1台ずつ登録する。
- name: テンプレート構築担当をProxmox操作用に登録する
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: proxmox
    ansible_host: "{{ hostvars[item].pv_proxmox_ip }}"
    ansible_user: "{{ hostvars[item].proxmox_ssh_user | default('root', true) }}"
    ansible_password: "{{ vault_proxmox_ssh_password }}"
  loop: "{{ ansible_play_hosts }}"
  changed_when: false
  when: item == hostvars[item].pv_template_host

# インベントリのホストを構築対象(pv_targets)に集約する。
# 「インベントリから構築対象を選ぶ」プレイ(hosts: <グループ名>)から呼ぶ。
#
# 呼び出し側のプレイが vars で渡すもの:
#   pv_group : このplaybookが使うインベントリのグループ名
---
- name: インベントリのホストを構築対象に加える
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: pv_targets
  loop: "{{ ansible_play_hosts }}"
  changed_when: false
  when: not (pv_manual_mode | bool)
  vars:
    pv_manual_mode: >-
      {{ manual | default((groups[pv_group] | default([]) | length) == 0) | bool }}

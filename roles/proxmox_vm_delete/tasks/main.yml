# 全タスクは接続先のProxmoxホスト(-e proxmox_ip)上で直接実行される。
# 対象VMの電源がオフの場合のみ削除を許可する。
# 誤削除防止のため、confirm_vm_id に vm_id と同じ値を指定する必要がある。
---
- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

- name: 接続先のノード名を取得する
  ansible.builtin.import_role:
    name: proxmox_common
    tasks_from: detect_proxmox_node

- name: VMの状態を確認する
  ansible.builtin.import_tasks: check_vm_exists.yml

- name: VMを削除する
  ansible.builtin.import_tasks: delete_vm.yml

# qm destroy はドキュメント上、同期/非同期の挙動が明記されていないため、
# 削除コマンド実行後にクラスタ全体のVM一覧を再取得し、対象VMIDが実際に
# 消えたことをポーリングで確認する(remove_existing_on_other_node.ymlと同じ方式)。
---
- name: VMを削除する
  ansible.builtin.command:
    argv: >-
      {{
        ['qm', 'destroy', vm_id | string]
        + (['--purge', '1'] if proxmox_vm_delete_purge else [])
        + (['--destroy-unreferenced-disks', '1'] if proxmox_vm_delete_destroy_unreferenced_disks else [])
      }}
  register: proxmox_vm_delete_result
  changed_when: proxmox_vm_delete_result.rc == 0

- name: 削除が完了するまで待機する
  ansible.builtin.command:
    cmd: pvesh get /cluster/resources --type vm --output-format json
  register: proxmox_vm_delete_verify
  changed_when: false
  failed_when: false
  until: >-
    proxmox_vm_delete_verify.rc == 0 and
    ((proxmox_vm_delete_verify.stdout | from_json)
     | selectattr('vmid', 'equalto', vm_id | int)
     | list | length == 0)
  retries: 30
  delay: 2

- name: VMが実際に削除されたことを確認する
  ansible.builtin.assert:
    that:
      - proxmox_vm_delete_verify.rc == 0
      - >-
        (proxmox_vm_delete_verify.stdout | from_json)
        | selectattr('vmid', 'equalto', vm_id | int)
        | list | length == 0
    fail_msg: >-
      VMID {{ vm_id }} の削除に失敗した可能性があります。
      クラスタ上にまだ存在しています。手動で状態を確認してください。
    quiet: true

- name: 削除完了を表示する
  ansible.builtin.debug:
    msg: "VMID {{ vm_id }} の削除を確認しました。"

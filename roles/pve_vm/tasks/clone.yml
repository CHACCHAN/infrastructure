# 未作成の VM を、同じノードのテンプレートからフルクローンする。
---
- name: 未作成の VM をクローンする
  when: __pve_vm_found | length == 0
  block:
    - name: テンプレートの VMID と名前を解決する
      ansible.builtin.include_role:
        name: pve_template
        tasks_from: resolve
      vars:
        template_node: "{{ pve_vm_node }}"

    - name: テンプレートを検索する
      community.proxmox.proxmox_vm_info:
        vmid: "{{ template_resolved.vmid }}"
      register: __pve_vm_template_info

    - name: テンプレートが期待どおりに存在することを確認する
      ansible.builtin.assert:
        that:
          - __pve_vm_template_info.proxmox_vms | length > 0
          - (__pve_vm_template_info.proxmox_vms | first).template | default(false) | bool
          - (__pve_vm_template_info.proxmox_vms | first).name == template_resolved.name
          - (__pve_vm_template_info.proxmox_vms | first).node == pve_vm_node
        fail_msg: >-
          {{ template_resolved.name }}(VMID {{ template_resolved.vmid }})が
          ノード {{ pve_vm_node }} にテンプレートとして見つかりません。
          先に playbooks/pve/template.yml を実行してください。
        quiet: true

    - name: テンプレートからフルクローンする
      community.proxmox.proxmox_kvm:
        state: present
        clone: "{{ template_resolved.name }}"
        vmid: "{{ template_resolved.vmid }}"
        newid: "{{ vmid }}"
        name: "{{ pve_vm_name }}"
        node: "{{ pve_vm_node }}"
        full: true
        storage: "{{ pve_vm_storage }}"
        timeout: "{{ pve_vm_clone_timeout }}"

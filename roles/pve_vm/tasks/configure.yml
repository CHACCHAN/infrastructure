# VM のデバイス設定と NIC を宣言どおりにする。
# 現在値と宣言値を比べ、差分があるときだけ更新する(proxmox_kvm の update は差分を判定しない)。
---
- name: VM の現在設定を取得する
  community.proxmox.proxmox_vm_info:
    vmid: "{{ vmid }}"
    config: pending
  register: __pve_vm_config_info

# null の項目は宣言していないものとして外す。
- name: 宣言された項目を集める
  ansible.builtin.set_fact:
    __pve_vm_current: "{{ (__pve_vm_config_info.proxmox_vms | first).config }}"
    __pve_vm_declared: >-
      {{ dict(__pve_vm_option_names
              | zip(query('ansible.builtin.vars', *(__pve_vm_option_names | map('regex_replace', '^', 'pve_vm_') | list))))
         | dict2items | rejectattr('value', 'none') | items2dict }}

- name: 現在の設定と違う項目を求める
  ansible.builtin.set_fact:
    __pve_vm_changes: "{{ __pve_vm_current | pve_vm_changes(__pve_vm_declared, __pve_vm_specs, __pve_vm_devices) }}"

- name: VM のデバイス設定を更新する
  community.proxmox.proxmox_kvm:
    state: present
    vmid: "{{ vmid }}"
    node: "{{ pve_vm_node }}"
    name: "{{ pve_vm_name }}"
    update: true
  args: "{{ __pve_vm_changes }}"
  when: __pve_vm_changes | length > 0

# 宣言したキーだけを比べ、宣言にない MAC・MTU などは現在値を保つ。
- name: 宣言した NIC と現在の NIC を比べる
  ansible.builtin.set_fact:
    __pve_vm_nics: "{{ __pve_vm_current | pve_vm_nics(pve_vm_nets) }}"

# ブリッジ・VLAN タグ・モデル・MAC・キュー数・MTU・ファイアウォール・リンク切断 の変更は、起動中の VM の通信を切るおそれがある。
- name: 起動中の VM の NIC を、確認なしに変更しないことを確認する
  ansible.builtin.assert:
    that: >-
      __pve_vm_nics.disruptive | length == 0
      or __pve_vm_found.status | default('stopped') != 'running'
      or pve_vm_allow_nic_change | bool
    fail_msg: >-
      起動中の VM で、{{ __pve_vm_nics.disruptive | join(', ') }} の接続に関わる設定(ブリッジ・VLAN タグ・モデル・MAC・キュー数・MTU・ファイアウォール・リンク切断)が変わります。
      通信が切れるおそれがあります。承知のうえなら pve_vm_allow_nic_change を true にしてください。
    quiet: true

- name: NIC を更新する
  community.proxmox.proxmox_kvm:
    vmid: "{{ vmid }}"
    node: "{{ pve_vm_node }}"
    state: present
    net: "{{ __pve_vm_nics.changes }}"
    update: true
    # proxmox_kvm は NIC の更新を既定で無視するため、差分を確かめたあとだけ許可する。
    update_unsafe: true
  when: __pve_vm_nics.changes | length > 0

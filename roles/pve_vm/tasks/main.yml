---
- name: 変数が既知の項目であることを確認する
  ansible.builtin.import_tasks: validate.yml

- name: 対象の VM を検索する
  ansible.builtin.import_tasks: find.yml

- name: 未作成の VM をテンプレートから作る
  ansible.builtin.import_tasks: clone.yml

- name: VM のデバイス設定を宣言どおりにする
  ansible.builtin.import_tasks: configure.yml

- name: 起動ディスクを拡張する
  ansible.builtin.import_tasks: disk.yml

- name: cloud-init の設定を宣言どおりにする
  ansible.builtin.import_tasks: cloudinit.yml

- name: 再起動が必要な変更を知らせる
  ansible.builtin.import_tasks: pending.yml

- name: VM を起動する
  ansible.builtin.import_tasks: power.yml

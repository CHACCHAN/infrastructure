# SSH 公開鍵と IP を cloud-init へ渡す。差分があるときだけ更新する。
# ユーザー・DNS などの、現在値と比べるだけの項目は configure.yml が扱う。
---
- name: cloud-init の宣言値を組み立てる
  ansible.builtin.set_fact:
    __pve_vm_ci_sshkeys: "{{ pve_vm_ssh_pubkeys | map('trim') | join('\n') }}"
    __pve_vm_ci_ipconfig:
      ipconfig0: "ip={{ ansible_host }}/{{ network_prefix }},gw={{ gateway }}"

- name: cloud-init の現在設定を取得する
  community.proxmox.proxmox_vm_info:
    vmid: "{{ vmid }}"
    config: pending
  register: __pve_vm_ci_info

# Proxmox は sshkeys を URL エンコードして返すことがあるため、両方の形で比べる。
- name: cloud-init を更新する
  community.proxmox.proxmox_kvm:
    state: present
    vmid: "{{ vmid }}"
    node: "{{ pve_vm_node }}"
    sshkeys: "{{ __pve_vm_ci_sshkeys }}"
    ipconfig: "{{ __pve_vm_ci_ipconfig }}"
    update: true
  vars:
    __pve_vm_ci_current: "{{ (__pve_vm_ci_info.proxmox_vms | first).config }}"
  when: >-
    __pve_vm_ci_current.ipconfig0 | default('') != __pve_vm_ci_ipconfig.ipconfig0
    or ((__pve_vm_ci_current.sshkeys | default('') | trim) != __pve_vm_ci_sshkeys | trim
        and (__pve_vm_ci_current.sshkeys | default('') | urldecode | trim) != __pve_vm_ci_sshkeys | trim)

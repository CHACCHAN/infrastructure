# 既存Proxmox VMのユーザー・公開鍵・IP・DNSをcloud-init宣言へ収束させる。
# 各タスクの `# noqa: args[module]` は誤検知の抑止。api_host/api_user等は
# Playbookの module_defaults (group/community.proxmox.proxmox) で供給しているが、
# ansible-lintのargsルールはaction groupを解決せず未指定と判定するため。
---
- name: cloud-initの宣言値を組み立てる
  ansible.builtin.set_fact:
    # 鍵は本文(pve_ssh_pubkey_value)を優先し、無ければファイルから読む
    # (AWXのSurveyなどファイルを置けない経路のため。詳細は docs/vm/ssh_key.md)。
    # どちらも未定義のホスト(役割プロファイルを持たない検証VM等)では
    # ユーザー・鍵の設定をスキップするため空文字にする。
    # noneを使うと、ansible-core 2.19より前では文字列 "None" になり
    # (理由は roles/pve/tasks/find_vm.yml の冒頭コメント)、鍵として
    # そのままcloud-initへ書き込まれてしまう。公開鍵は空にならないため
    # 「空文字=未指定」で取り違えは起きない。
    pve_cloudinit_sshkeys: >-
      {{ pve_ssh_pubkey_value | trim
         if pve_ssh_pubkey_value | default('') | trim | length > 0
         else (lookup('ansible.builtin.file', pve_ssh_pubkey_file | expanduser)
               if pve_ssh_pubkey_file | default('', true) | length > 0 else '') }}
    pve_cloudinit_ipconfig: >-
      {{ {'ipconfig0': 'ip=' ~ ansible_host ~ '/' ~ pve_ipv4_prefix
                         ~ ',gw=' ~ pve_ipv4_gw}
         | combine((cluster_ip | default('', true) | length > 0)
                   | ternary({'ipconfig1':
                                'ip=' ~ (cluster_ip | default(''))}, {})) }}

- name: cloud-initの現在設定を取得する  # noqa: args[module]
  community.proxmox.proxmox_vm_info:
    vmid: "{{ vmid }}"
    # 稼働中VMの再起動待ち設定も収束済みとして比較する。
    config: pending
  register: pve_cloudinit_info

- name: cloud-init設定を収束させる  # noqa: args[module]
  community.proxmox.proxmox_kvm:
    vmid: "{{ vmid }}"
    node: "{{ node }}"
    # ユーザー・鍵が未定義(または空文字)のホストでは既存設定に触れない(omit)
    ciuser: >-
      {{ pve_ssh_user
         if pve_ssh_user | default('', true) | length > 0
         else omit }}
    sshkeys: "{{ pve_cloudinit_sshkeys if pve_cloudinit_sshkeys | length > 0 else omit }}"
    ipconfig: "{{ pve_cloudinit_ipconfig }}"
    # 未定義時はPVEホストのDNS設定を継承し、既存値を意図せず消さない。
    nameservers: "{{ [pve_nameserver] if pve_nameserver is defined else omit }}"
    update: true
  register: pve_cloudinit_update
  vars:
    pve_cloudinit_current: "{{ (pve_cloudinit_info.proxmox_vms | first).config }}"
  when: >-
    (pve_ssh_user | default('', true) | length > 0
     and pve_cloudinit_current.ciuser | default('') != pve_ssh_user)
    or (pve_cloudinit_sshkeys | length > 0
        and (pve_cloudinit_current.sshkeys | default('') | trim)
            != (pve_cloudinit_sshkeys | trim)
        and (pve_cloudinit_current.sshkeys | default('') | urldecode | trim)
            != (pve_cloudinit_sshkeys | trim))
    or pve_cloudinit_current.ipconfig0 | default('')
       != pve_cloudinit_ipconfig.ipconfig0
    or (cluster_ip | default('', true) | length > 0
        and pve_cloudinit_current.ipconfig1 | default('')
            != pve_cloudinit_ipconfig.ipconfig1)
    or (pve_nameserver is defined
        and pve_cloudinit_current.nameserver | default('')
            != pve_nameserver | string)

- name: 稼働中VMのcloud-init変更が再起動待ちになる可能性を表示する
  ansible.builtin.debug:
    msg: >-
      VMID {{ vmid }} は稼働中です。今回のcloud-init変更はPVE上で保留され、
      VMを再起動するまで反映されない可能性があります。
      このロールでは電源操作を追加実行しません。
  when:
    - (pve_cloudinit_info.proxmox_vms | first).status == 'running'
    - pve_cloudinit_update is changed

# cockpitのログインパスワードはcloud-initで設定するため(playbooks/vm/dev/password.yml)、
# このロールでは受け取らない。
---
- name: 必須変数が正しく渡されているか検証する
  ansible.builtin.assert:
    that:
      - ansible_user is defined
      - (ansible_user | default('', true)) | length > 0
    fail_msg: >-
      ansible_user が指定されていません。
      sudo/dockerグループへの追加やcockpitのログインユーザーの既定値に使うため、
      -e "ansible_user=<ユーザ名>" で指定してください。
    quiet: true

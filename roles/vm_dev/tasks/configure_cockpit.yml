# ログインはPAM経由のLinux通常ログインパスワード。
# パスワードはcloud-initで設定するため(playbooks/vm/dev/password.yml)、ここでは扱わない。
---
- name: Cockpitをインストールする
  ansible.builtin.apt:
    name: cockpit
    state: present
  become: true

- name: Cockpitユーザーの既定値を設定する
  ansible.builtin.set_fact:
    development_cockpit_user: "{{ cockpit_user | default(ansible_user) }}"

- name: Cockpitサービスを有効化・起動する
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started
  become: true

# 上流Helmチャート、公開経路、任意のSecretを順に収束させる。
---
- name: portainer Helmチャートを描画して適用する
  ansible.builtin.import_role:
    name: k8s
    tasks_from: helm
  vars:
    k8s_helm_release: portainer
    k8s_helm_chart: portainer
    k8s_helm_repo_url: https://portainer.github.io/k8s/
    k8s_helm_version: "{{ k8s_portainer_helm_version }}"
    k8s_helm_namespace: platform
    k8s_helm_values: "{{ k8s_portainer_values }}"
    k8s_helm_no_hooks: true
    k8s_helm_include_crds: false
    k8s_helm_inject_namespace: false

- name: 公開Ingressを描画する
  ansible.builtin.set_fact:
    k8s_portainer_ingress_definition: "{{ lookup('ansible.builtin.template', 'ingress.yaml.j2') }}"

- name: 公開IngressをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_portainer_ingress_definition }}"

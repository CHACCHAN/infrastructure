# OpenWebUI一式(Deployment/Service/Ingress。DATA_DIRはemptyDir)とOIDC・アプリ・DB Secretを収束させる。
---
# Secretを先に収束させる(これを参照するワークロードが待たずに起動できるように)

- name: 必須Secret変数が定義されていることを確認する
  ansible.builtin.assert:
    that:
      - vars[item] is defined
      - vars[item] | length > 0
    fail_msg: >-
      {{ item }} が未定義または空です。
      ansible-vault edit vault/k8s_secrets.yml で実値を設定してください。
    quiet: true
  loop:
    - k8s_secret_open_webui_oidc
    - k8s_secret_open_webui_app
    - k8s_secret_open_webui_db

- name: OpenWebUI OIDC Secretを描画する
  ansible.builtin.set_fact:
    k8s_open_webui_oidc_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: open-webui-oidc
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_open_webui_oidc }}"
  no_log: true

- name: OpenWebUI OIDC SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_open_webui_oidc_secret_definition }}"
    k8s_apply_no_log: true

- name: OpenWebUIアプリSecretを描画する
  ansible.builtin.set_fact:
    k8s_open_webui_app_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: open-webui-app
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_open_webui_app }}"
  no_log: true

- name: OpenWebUIアプリSecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_open_webui_app_secret_definition }}"
    k8s_apply_no_log: true

- name: OpenWebUI DB Secretを描画する
  ansible.builtin.set_fact:
    k8s_open_webui_db_secret_definition: "{{ lookup('ansible.builtin.template', 'secrets.yaml.j2') }}"
  vars:
    k8s_secret_manifest_name: open-webui-db
    k8s_secret_manifest_namespace: platform
    k8s_secret_manifest_data: "{{ k8s_secret_open_webui_db }}"
  no_log: true

- name: OpenWebUI DB SecretをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_open_webui_db_secret_definition }}"
    k8s_apply_no_log: true

- name: OpenWebUIマニフェストを描画する
  ansible.builtin.set_fact:
    k8s_open_webui_definition: "{{ lookup('ansible.builtin.template', 'open-webui.yaml.j2') }}"

- name: OpenWebUIマニフェストをServer-Side Applyする
  ansible.builtin.import_role:
    name: k8s
    tasks_from: apply
  vars:
    k8s_definition: "{{ k8s_open_webui_definition }}"

- name: OpenWebUI Deploymentのrolloutを待つ
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: open-webui
    namespace: platform
  register: k8s_open_webui_rollout
  until: >-
    k8s_open_webui_rollout.resources | length > 0
    and (k8s_open_webui_rollout.resources[0].status.readyReplicas | default(0) | int)
        >= (k8s_open_webui_rollout.resources[0].spec.replicas | default(1) | int)
  retries: 60
  delay: 5
  when: not ansible_check_mode

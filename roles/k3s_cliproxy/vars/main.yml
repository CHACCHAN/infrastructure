# CLIProxyAPI のマニフェスト。チャートが無いため、k3s ロールへマニフェストとして渡す。
---
# 設定の初期値。設定ファイルが無いときだけ使われ、以降は管理画面で変えた内容がファイルに残る(Ansible は上書きしない)
__cliproxy_seed_config:
  config-version: 8
  server:
    port: "{{ cliproxy_port | int }}"
    trusted-proxies: "{{ cliproxy_trusted_proxies }}"
  access:
    api-keys: "{{ cliproxy_api_keys }}"
  # プラグインを使う(入れるのは、管理画面から公式ストアのもの)
  plugins:
    enabled: true
__cliproxy_env_data:
  MANAGEMENT_PASSWORD: "{{ cliproxy_management_password | b64encode }}"
__cliproxy_secrets:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: cliproxy-env
      namespace: "{{ cliproxy_namespace }}"
    data: "{{ __cliproxy_env_data }}"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: cliproxy-seed
      namespace: "{{ cliproxy_namespace }}"
    data:
      config.yaml: "{{ __cliproxy_seed_config | to_nice_yaml | b64encode }}"
__cliproxy_labels:
  app.kubernetes.io/name: cliproxy
__cliproxy_config_file: /CLIProxyAPI/config/config.yaml
__cliproxy_security_context:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
__cliproxy_manifests:
  # 設定ファイル(config)・プロバイダーの認証情報(auths)・入れたプラグイン(plugins)を、ディレクトリに分けて置く
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: "{{ cliproxy_release_name }}-data"
      namespace: "{{ cliproxy_namespace }}"
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: "{{ cliproxy_storage_size }}"
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: "{{ cliproxy_release_name }}"
      namespace: "{{ cliproxy_namespace }}"
    spec:
      # ボリュームは1つの Pod にしか付かないため、同時に動かすのは1つだけにする
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels: "{{ __cliproxy_labels }}"
      template:
        metadata:
          labels: "{{ __cliproxy_labels }}"
          annotations:
            # 管理画面のパスワードが変わったら、Pod を作り直す
            checksum/env: "{{ __cliproxy_env_data | to_json | hash('sha256') }}"
        spec:
          initContainers:
            # 設定ファイルが無いとき(最初の起動)だけ、初期値を置く。CLIProxyAPI は設定ファイルが無いと起動しない
            - name: seed
              image: "{{ cliproxy_image }}:{{ cliproxy_version }}"
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - test -f /config/config.yaml || install -m 600 /seed/config.yaml /config/config.yaml
              securityContext: "{{ __cliproxy_security_context }}"
              volumeMounts:
                - name: data
                  mountPath: /config
                  subPath: config
                - name: seed
                  mountPath: /seed
                  readOnly: true
          containers:
            - name: cliproxy
              image: "{{ cliproxy_image }}:{{ cliproxy_version }}"
              imagePullPolicy: IfNotPresent
              command:
                - ./CLIProxyAPI
              args:
                - --config
                - "{{ __cliproxy_config_file }}"
              envFrom:
                - secretRef:
                    name: cliproxy-env
              env:
                - name: TZ
                  value: "{{ cliproxy_timezone }}"
                # ログと管理画面のファイルを置く作業用のディレクトリ
                - name: WRITABLE_PATH
                  value: /work
              ports:
                - name: http
                  containerPort: "{{ cliproxy_port | int }}"
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                initialDelaySeconds: 30
              resources: "{{ cliproxy_resources }}"
              securityContext: "{{ __cliproxy_security_context }}"
              volumeMounts:
                - name: data
                  mountPath: /CLIProxyAPI/config
                  subPath: config
                # 認証情報の既定の置き場(auth-dir の既定の ~/.cli-proxy-api)
                - name: data
                  mountPath: /root/.cli-proxy-api
                  subPath: auths
                # プラグインの既定の置き場(plugins.dir の既定の plugins。作業ディレクトリからの相対)
                - name: data
                  mountPath: /CLIProxyAPI/plugins
                  subPath: plugins
                - name: work
                  mountPath: /work
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: "{{ cliproxy_release_name }}-data"
            - name: seed
              secret:
                secretName: cliproxy-seed
            - name: work
              emptyDir:
                sizeLimit: "{{ cliproxy_work_size }}"
  - apiVersion: v1
    kind: Service
    metadata:
      name: "{{ cliproxy_release_name }}"
      namespace: "{{ cliproxy_namespace }}"
    spec:
      type: ClusterIP
      selector: "{{ __cliproxy_labels }}"
      ports:
        - name: http
          protocol: TCP
          port: "{{ cliproxy_port | int }}"
          targetPort: http

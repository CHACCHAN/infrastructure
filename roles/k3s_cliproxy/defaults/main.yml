# CLIProxyAPI(CLI の OAuth の認証情報を、OpenAI 互換などの API として出すプロキシ)を k3s に置くロールの既定値。
# 秘密情報と、公開ホスト名(cliproxy_host)は、既定値を持たない。
---
# イメージのタグ(公式の docker-compose.yml が使うイメージ)
cliproxy_version: "v8.0.38"
cliproxy_image: docker.io/eceasy/cli-proxy-api
cliproxy_release_name: cliproxy
cliproxy_namespace: cliproxy
# API と管理画面を受けるポート
cliproxy_port: 8317
# 転送ヘッダー(X-Forwarded-For)を信頼する送信元。Traefik の Pod のネットワーク。
# k3s の既定の cluster-cidr に合わせている。vm_k3s で cluster-cidr を変えるときは、ここも変える(設定ファイルが無いときだけ使われる初期値)
cliproxy_trusted_proxies:
  - 10.42.0.0/16
# 公開ホスト名のすべてのパスに掛ける、Authentik の認証プロキシのミドルウェア。API はクラスタ内の Service からだけ使う
cliproxy_ingress_middleware: authentik-forward-auth@kubernetescrd
cliproxy_timezone: Asia/Tokyo
# 設定ファイル・プロバイダーの認証情報・プラグインを置くボリューム(Longhorn)の大きさ
cliproxy_storage_size: 1Gi
# ログと管理画面のファイルを置く作業用のディレクトリ(Pod を作り直すと消える)の上限
cliproxy_work_size: 1Gi
cliproxy_resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# CLIProxyAPI(CLI の OAuth の認証情報を、OpenAI 互換などの API として出すプロキシ)を k3s に置くロールの既定値。
# 秘密情報と、公開ホスト名(cliproxy_host)は、既定値を持たない。
---
# イメージのタグ(公式の docker-compose.yml が使うイメージ)
cliproxy_version: "v8.0.38"
cliproxy_image: docker.io/eceasy/cli-proxy-api
cliproxy_release_name: cliproxy
cliproxy_namespace: cliproxy
# API と管理画面を受けるポート
cliproxy_port: 8317
# PostgreSQL への接続(DB とロールは k3s_postgresql が作る)。設定と認証情報は DB に置く
cliproxy_db_host: postgresql-rw.postgresql.svc.cluster.local
cliproxy_db_name: cliproxy
cliproxy_db_user: cliproxy
# 転送ヘッダー(X-Forwarded-For)を信頼する送信元。Traefik の Pod のネットワーク。
# k3s の既定の cluster-cidr に合わせている。vm_k3s で cluster-cidr を変えるときは、ここも変える(DB が空のときだけ使われる初期値)
cliproxy_trusted_proxies:
  - 10.42.0.0/16
# 認証プロキシを通さず、API キーだけで通すパス(文字列の前方一致のため、末尾を / で閉じる)。ほかのパス(管理画面・管理 API・OAuth のコールバック)には、認証プロキシを掛ける
cliproxy_api_paths:
  - /v1/
  - /v1beta/
  - /openai/
  - /backend-api/
# 管理画面と管理 API に掛ける、Authentik の認証プロキシのミドルウェア
cliproxy_ingress_middleware: authentik-forward-auth@kubernetescrd
# Traefik を通さず、クラスタ内の Service(cliproxy.<namespace>.svc)へ直接つなげる namespace
cliproxy_client_namespaces:
  - litellm
cliproxy_timezone: Asia/Tokyo
# DB の内容を書き出す作業用のディレクトリ(メモリ上。プロバイダーの認証情報をノードのディスクに残さない)の上限
cliproxy_spool_size: 64Mi
cliproxy_resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# AWXのInventory定義。手動インベントリではなくProject由来
# (inventory/ をSourceとして同期)にする。group_vars/ の3層が
# そのまま届き、手元実行と同じ宣言で動くため(docs/awx/README.md §1)。
---
awx_inventory_name: lab
awx_inventory_description: inventory/hosts.yml をProjectから同期(3層構造ごと届く)

awx_inventory_source_name: project-inventory
awx_inventory_source_path: inventory/hosts.yml
# Project更新に追従して同期し、削除されたホストはAWX側からも消す。
awx_inventory_source_overwrite: true
awx_inventory_source_update_on_launch: true

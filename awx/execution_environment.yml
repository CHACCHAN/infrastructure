# AWXのExecution Environment(カスタムEE)登録定義。
# イメージ自体のビルドは ee/execution-environment.yml を参照:
#   ansible-builder build --tag ghcr.io/chacchan/awx-ee-custom:latest \
#     --container-runtime docker -f ee/execution-environment.yml
# ビルド後は ghcr.io へpushする(下のawx_ee_imageが参照する実体)。
# プライベートイメージだが、クラスタ内のPodはkubernetes-replicatorが配る
# ghcr-pull-secret(docs/k8s/README.md)でpullできるため、AWX側に
# レジストリ用Credentialの追加は不要。
---
awx_ee_name: awx-ee-custom
awx_ee_description: proxmoxer/kubernetes/docker SDKを含むカスタムEE(ee/で定義)
awx_ee_image: ghcr.io/chacchan/awx-ee-custom:latest
# タグを固定運用しているため、ジョブ起動ごとにpullして最新のビルドを使う。
awx_ee_pull: always

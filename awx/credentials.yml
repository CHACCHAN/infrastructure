# AWXのCredential定義。実値はこのファイルに書かない(実行時に変数で渡す)。
#
# 設計(docs/awx/README.md の運用をコード化):
# - Ansible Vault credential: vault/*.yml の復号用。全Job Templateに付与する。
#   実値は -e awx_vault_password=... または既定で
#   ANSIBLE_VAULT_PASSWORD_FILE の中身を使う(DevContainerでは自動設定)。
# - kubeconfig credential: k8s-deploy 用。カスタムCredential Typeで
#   K8S_AUTH_KUBECONFIG 環境変数として実行環境へファイル注入する
#   (kubernetes.core はkubeconfig未指定時にこの環境変数を参照する)。
#   実値は -e awx_kubeconfig_content="$(cat ~/.kube/config)" のように渡す。
# - Machine credential は作らない: SSH鍵はSurveyの pve_ssh_prikey_value
#   (暗号化質問)→一時ファイル化という既存設計を維持し、鍵の置き場を増やさない。
---
awx_credential_vault_name: infrastructure Vault
awx_credential_vault_description: vault/*.yml の復号パスワード

awx_credential_type_kubeconfig_name: kubeconfig
awx_credential_kubeconfig_name: infrastructure kubeconfig
awx_credential_kubeconfig_description: k8s-deploy が使うkubeconfig(K8S_AUTH_KUBECONFIGへ注入)

# AWXのJob TemplateとSurveyの定義(単一の真実)。
# playbooks/utils/awx/configure.yml が読み込み、awx.awx.job_template へ渡す。
#
# Survey設計の原則(docs/awx/README.md の運用ルールをコード化):
# - 任意項目は required: false かつ default を持たせない
#   (AWXは未回答の任意質問を「変数を送らない」扱いにする。空文字の既定値を
#    持たせると default() で救えない空文字が届いてしまう)
# - 秘密鍵・パスワードは type: password(暗号化され、画面にも残らない)
# - 絞り込みは Limit ではなく target 変数で行う(localhost前処理プレイの保護)
---
# --- 共通Survey: VM構築系(provision.ymlをimportする全playbook)が使う ---
# インベントリ実行では全問未回答でよい(宣言どおりに動く)。
# インベントリ外のVMを作るときだけ target/profile/vmid/node/ip を回答する。
#
# Surveyはスカラー値のみ受け付ける。リスト・辞書の変数
# (pve_vm_nets=NIC任意個 / pve_vm_disks=追加ディスク任意個)は
# Job Templateの「変数」欄(ask_variables_on_launch)へYAMLで渡す。
# 書式は docs/pve/README.md の「ストレージ・NIC・ディスクの宣言」を参照。
awx_survey_common:
  - question_name: 対象(target)
    question_description: >-
      ホスト名かグループ名。未回答なら既定グループ全体。
      インベントリ外のVMを作るときは新しいホスト名を指定(Limitは使わない)
    variable: target
    type: text
    required: false
  - question_name: 役割プロファイル(profile)
    question_description: >-
      インベントリ外のVMを作るときの役割グループ名(継承しないなら lab)。
      インベントリ実行では未回答のまま
    variable: profile
    type: multiplechoice
    # 選択肢はインベントリの役割グループから実行時に生成される(configure.yml
    # 実行時点のスナップショット)。グループを増やしたら configure.yml を再実行
    # して選択肢を更新する。
    choices: >-
      {{ (groups.keys() | reject('in', ['all', 'ungrouped', 'lab'])
          | list | sort) + ['lab'] }}
    required: false
  - question_name: ブートディスクのストレージ(pve_storage)
    question_description: >-
      未回答なら宣言値(group_vars。既定はssd01、役割によりssd02/local-lvm等)。
      対象ノードに存在するストレージ名を指定する
    variable: pve_storage
    type: text
    required: false
  - question_name: VM ID(vmid)
    question_description: インベントリ外のVMを作るときのProxmox VMID(例 799)
    variable: vmid
    type: integer
    required: false
    min: 100
    max: 999999999
  - question_name: Proxmoxノード(node)
    question_description: インベントリ外のVMを作るときの配置先(例 pve07)
    variable: node
    type: text
    required: false
  - question_name: 1枚目NICのIP(ip)
    question_description: インベントリ外のVMを作るときのIPv4(例 172.16.11.99)
    variable: ip
    type: text
    required: false
  - question_name: クラスタ網CIDR(ip2)
    question_description: 2枚目NICを使う役割のみ(例 10.10.20.19/24)
    variable: ip2
    type: text
    required: false
  - question_name: SSHユーザー(pve_ssh_user)
    question_description: プロファイルを継承しない構築(profile=lab)でSSHするとき
    variable: pve_ssh_user
    type: text
    required: false
  - question_name: SSH公開鍵の本文(pve_ssh_pubkey_value)
    question_description: cloud-initへ入れる公開鍵。ファイルパスではなく本文を貼る
    variable: pve_ssh_pubkey_value
    type: textarea
    required: false
  - question_name: SSH秘密鍵の本文(pve_ssh_prikey_value)
    question_description: >-
      接続用秘密鍵の本文。パスフレーズ付きの鍵は使えない
    variable: pve_ssh_prikey_value
    type: password
    required: false
  - question_name: CPUコア数(pve_vm_cores)
    variable: pve_vm_cores
    type: integer
    required: false
    min: 1
    max: 128
  - question_name: メモリMiB(pve_vm_memory)
    variable: pve_vm_memory
    type: integer
    required: false
    min: 512
    max: 262144
  - question_name: ディスクGiB(pve_vm_disk_size)
    question_description: 現在値より小さくはできない(縮小は無視される)
    variable: pve_vm_disk_size
    type: integer
    required: false
    min: 8
    max: 4096
  # --- ハードウェア設定(すべて任意。未回答なら宣言値/既定値) -------------
  # 対応する既定値は roles/pve_vm/defaults/main.yml と group_vars/all/pve.yml。
  - question_name: 1枚目NICのブリッジ(pve_bridge)
    question_description: >-
      例 vmbr0 / vmbr1。対象ノードに存在するブリッジ名。
      NICを複数持たせる場合は変数欄で pve_vm_nets を渡す(docs/pve/README.md)
    variable: pve_bridge
    type: text
    required: false
  - question_name: BIOS(pve_vm_bios)
    variable: pve_vm_bios
    type: multiplechoice
    choices:
      - seabios
      - ovmf
    required: false
  - question_name: マシンタイプ(pve_vm_machine)
    variable: pve_vm_machine
    type: multiplechoice
    choices:
      - q35
      - pc
    required: false
  - question_name: ディスプレイ(pve_vm_vga)
    variable: pve_vm_vga
    type: multiplechoice
    choices:
      - std
      - serial0
      - qxl
      - virtio
    required: false
  - question_name: CPUタイプ(pve_vm_cpu_type)
    question_description: 例 x86-64-v2-AES / x86-64-v3 / host(ホストCPU直通)
    variable: pve_vm_cpu_type
    type: text
    required: false
  - question_name: SSDエミュレーション(pve_vm_disk_ssd)
    question_description: ブートディスクをSSDとしてゲストへ見せるか(1=有効 / 0=無効)
    variable: pve_vm_disk_ssd
    type: multiplechoice
    choices:
      - "1"
      - "0"
    required: false
  - question_name: IO Thread(pve_vm_disk_iothread)
    variable: pve_vm_disk_iothread
    type: multiplechoice
    choices:
      - "1"
      - "0"
    required: false
  - question_name: Discard/TRIM(pve_vm_disk_discard)
    variable: pve_vm_disk_discard
    type: multiplechoice
    choices:
      - "on"
      - ignore
    required: false
  - question_name: ホスト起動時の自動起動(pve_vm_onboot)
    variable: pve_vm_onboot
    type: multiplechoice
    choices:
      - "1"
      - "0"
    required: false
  - question_name: QEMUゲストエージェント(pve_vm_agent)
    question_description: >-
      0にすると正常シャットダウン(power.yml)やパスワード反映が効かなくなるため通常は1
    variable: pve_vm_agent
    type: multiplechoice
    choices:
      - "1"
      - "0"
    required: false
  - question_name: 収束後の電源状態(pve_vm_power)
    variable: pve_vm_power
    type: multiplechoice
    choices:
      - started
      - stopped
    required: false

# --- Job Template一覧 ---
# use_common_survey: 上の共通Surveyを使う(VM構築系)
# survey_extra: そのJT固有の質問(共通の後ろに並ぶ)
# extra_credentials: Vault以外に追加で紐づけるCredential名
awx_job_templates:
  # ① Proxmox操作ドメイン
  - name: pve-provision
    description: テンプレート準備→クローン→設定→cloud-init→起動まで冪等収束
    playbook: playbooks/pve/provision.yml
    use_common_survey: true

  - name: pve-power
    description: VMの電源状態を started/stopped へ冪等収束
    playbook: playbooks/pve/power.yml
    survey_extra:
      - question_name: 対象(target)
        question_description: ホスト名かグループ名。誤操作防止のため必須
        variable: target
        type: text
        required: true
      - question_name: 電源状態(state)
        variable: state
        type: multiplechoice
        choices:
          - started
          - stopped
        required: true
      - question_name: 強制停止(pve_power_force)
        question_description: ゲストが応答しないVMを止めるときだけ true
        variable: pve_power_force
        type: multiplechoice
        choices:
          - "true"
          - "false"
        required: false
      - question_name: タイムアウト秒(pve_power_timeout)
        variable: pve_power_timeout
        type: integer
        required: false
        min: 30
        max: 3600

  - name: pve-destroy
    description: 停止中のVM/テンプレートを削除(vmidの二重入力で誤削除防止)
    playbook: playbooks/pve/destroy.yml
    survey_extra:
      - question_name: 削除するVM ID(vmid)
        variable: vmid
        type: integer
        required: true
        min: 100
        max: 999999999
      - question_name: 確認のためVM IDを再入力(confirm)
        question_description: vmidと同じ値。一致しないと実行されない
        variable: confirm
        type: integer
        required: true
        min: 100
        max: 999999999

  - name: pve-template
    description: (OS, ノード)単位のcloud-imageテンプレートを単体構築
    playbook: playbooks/pve/template.yml
    survey_extra:
      - question_name: OS(os)
        question_description: 対応カタログは docs/pve/README.md(例 debian)
        variable: os
        type: text
        required: true
      - question_name: バージョン(version)
        question_description: 例 13
        variable: version
        type: text
        required: true
      - question_name: 構築先ノード(target_node)
        question_description: 例 pve01
        variable: target_node
        type: text
        required: true

  # ② VMセットアップドメイン(すべてprovisionをimportするため共通Surveyを使う)
  - name: vm-authentik
    description: SSO認証基盤(Authentik)を一気通貫構築
    playbook: playbooks/vm/authentik.yml
    use_common_survey: true

  - name: vm-ddns
    description: Cloudflare DDNS UIを一気通貫構築
    playbook: playbooks/vm/ddns.yml
    use_common_survey: true

  - name: vm-k3s
    description: k3sクラスタを一気通貫構築(コントロールプレーンから順に)
    playbook: playbooks/vm/k3s.yml
    use_common_survey: true
    survey_extra:
      - question_name: k3sの役割(k3s_role)
        question_description: インベントリのk8sグループが無い実行では必須
        variable: k3s_role
        type: multiplechoice
        choices:
          - server
          - agent
        required: false
      - question_name: コントロールプレーンの管理IP(kubernetes_server_ip)
        question_description: agent追加でインベントリのk8sグループが無いとき
        variable: kubernetes_server_ip
        type: text
        required: false
      - question_name: コントロールプレーンのSSHユーザー(kubernetes_server_ssh_user)
        variable: kubernetes_server_ssh_user
        type: text
        required: false
      - question_name: コントロールプレーンのSSH秘密鍵本文(kubernetes_server_ssh_prikey)
        question_description: 通常は接続鍵と同じものを渡す
        variable: kubernetes_server_ssh_prikey
        type: password
        required: false

  - name: vm-pbs
    description: Proxmox Backup Serverを一気通貫構築
    playbook: playbooks/vm/pbs.yml
    use_common_survey: true

  - name: vm-supabase
    description: Supabase(セルフホスト)を一気通貫構築
    playbook: playbooks/vm/supabase.yml
    use_common_survey: true

  - name: vm-technitium
    description: Technitium DNS(内部DNS)を一気通貫構築
    playbook: playbooks/vm/technitium.yml
    use_common_survey: true

  - name: vm-wg-easy
    description: wg-easy(WireGuard VPN)を一気通貫構築
    playbook: playbooks/vm/wg-easy.yml
    use_common_survey: true

  - name: vm-dev-setup
    description: 検証・開発VMを一気通貫構築
    playbook: playbooks/vm/dev/setup.yml
    use_common_survey: true
    survey_extra:
      - question_name: ログインパスワード(pve_ssh_password)
        question_description: 設定するときだけ回答(対象1台のみ・8文字以上)
        variable: pve_ssh_password
        type: password
        required: false

  - name: vm-dev-password
    description: 既存VMのログインパスワードのみ変更
    playbook: playbooks/vm/dev/password.yml
    survey_extra:
      - question_name: 対象ホスト(target)
        question_description: 事故防止のため対象1台のみ
        variable: target
        type: text
        required: true
      - question_name: 新しいパスワード(pve_ssh_password)
        question_description: 8文字以上・空白不可
        variable: pve_ssh_password
        type: password
        required: true

  # ③ Kubernetesドメイン
  - name: k8s-deploy
    description: k8sアプリ群を宣言どおりに収束(app指定で単一アプリのみ)
    playbook: playbooks/k8s/deploy.yml
    extra_credentials:
      - infrastructure kubeconfig
    survey_extra:
      - question_name: 対象アプリ(app)
        question_description: 未回答なら登録簿(k8s_apps)の順に全アプリを適用
        variable: app
        type: multiplechoice
        # choicesは inventory/group_vars/all/k8s.yml の k8s_apps から
        # configure.yml 実行時に解決される(選択肢の二重管理を避ける)
        choices: "{{ k8s_apps }}"
        required: false
      - question_name: 所有権の強制移行(force)
        question_description: Server-Side Applyの所有権衝突の初回移行のみ true
        variable: force
        type: multiplechoice
        choices:
          - "true"
          - "false"
        required: false

  # ④ 単発実行ツール(playbooks/utils/awx/・authentik/。docs/utils/README.md)
  - name: utils-awx-job-launch
    description: AWXのJob Templateを名前指定で起動(既定で完了まで待つ)
    playbook: playbooks/utils/awx/job_launch.yml
    survey_extra:
      - question_name: 起動するJob Template名(job_template)
        question_description: 例 pve-provision。渡す変数(job_extra_vars)は変数欄でYAML/JSON指定
        variable: job_template
        type: text
        required: true
      - question_name: 完了を待つ(awx_job_wait)
        question_description: 未回答なら待つ。起動だけして戻るなら false
        variable: awx_job_wait
        type: multiplechoice
        choices:
          - "true"
          - "false"
        required: false

  - name: utils-awx-job-status
    description: AWXのJobの実行状況を取得(オプションで完了待ち)
    playbook: playbooks/utils/awx/job_status.yml
    survey_extra:
      - question_name: 対象のJob ID(job_id)
        variable: job_id
        type: integer
        required: true
        min: 1
        max: 999999999
      - question_name: 完了を待つ(awx_job_wait)
        question_description: 未回答なら現在状況の表示のみ
        variable: awx_job_wait
        type: multiplechoice
        choices:
          - "true"
          - "false"
        required: false

  - name: utils-awx-inventory-sync
    description: Inventory Source(project-inventory)を同期しProject更新を反映
    playbook: playbooks/utils/awx/inventory_sync.yml

  - name: utils-authentik-users
    description: Authentikのユーザー作成とグループ所属を収束(冪等)
    playbook: playbooks/utils/authentik/users.yml
    survey_extra:
      - question_name: ユーザー名(username)
        question_description: 一括作成はSurveyではなく変数欄の authentik_users で渡す(docs/utils/authentik/users.md)
        variable: username
        type: text
        required: false
      - question_name: 表示名(display_name)
        question_description: 未回答ならユーザー名と同じ
        variable: display_name
        type: text
        required: false
      - question_name: メールアドレス(email)
        variable: email
        type: text
        required: false
      - question_name: 所属グループ(user_groups)
        question_description: カンマ区切り(例 developers,ops)。未回答ならユーザー作成のみ
        variable: user_groups
        type: text
        required: false
      - question_name: 初期パスワード(user_password)
        question_description: 新規作成したユーザーにだけ設定(既存ユーザーは変更しない)
        variable: user_password
        type: password
        required: false

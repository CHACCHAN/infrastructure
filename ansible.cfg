# リポジトリ共通のAnsible設定。
# リポジトリ直下から ansible-playbook を実行する前提
# (AWXでもプロジェクトルートのこのファイルが読み込まれる)。
[defaults]
# ロールはすべて ./roles に集約している(ドメイン別: pve* / vm* / k8s*)
roles_path = ./roles
# 既定のインベントリはlab環境の宣言(単一の真実)。
# 旧方式のインベントリは -i .legacy/inventories/lab で指定する(N6まで)
inventory = ./inventory
localhost_warning = False

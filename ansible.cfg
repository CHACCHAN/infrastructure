# リポジトリ共通のAnsible設定。
# リポジトリ直下から ansible-playbook を実行する前提。
[defaults]
# ロールは ./roles に集約する(ドメイン別の接頭辞: pve* / vm* / k8s*)
roles_path = ./roles
# 既定のインベントリは inventory/ 配下の全ファイル(単一の真実)
inventory = ./inventory
localhost_warning = False
interpreter_python = auto_silent
# ファクトは ansible_facts['…'] で参照する(task の args を変数で渡す書き方の警告を避ける)。
inject_facts_as_vars = False
retry_files_enabled = False

[ssh_connection]
pipelining = True

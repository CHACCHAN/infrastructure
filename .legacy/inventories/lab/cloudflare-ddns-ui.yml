# playbooks/services/cloudflare-ddns-ui.yml 用。1ホスト = 構築するVM1台、ホスト名はVMのIPアドレス。
# ここに書いた値は既定値で、-e で同じ変数を渡すとそちらが優先される。
#
#   全台: ansible-playbook playbooks/services/cloudflare-ddns-ui.yml --ask-vault-pass
#   個別: ansible-playbook playbooks/services/cloudflare-ddns-ui.yml --ask-vault-pass --limit 172.16.11.4
#
# グループ名だけは cloudflare_ddns_ui(アンダースコア)です。
# Ansibleのグループ名にはハイフンを使えないためで、他のファイルと違う点はここだけです。
#
# パスワード類は平文で書かないこと(-e で渡すか ansible-vault encrypt_string を使う)。
---
cloudflare_ddns_ui:
  hosts:
    172.16.11.4:
      vm_id: 504
      vm_name: cloudflare-ddns-ui
      vm_node: 172.16.11.15 # 構築先のProxmoxノード

  vars:
    # --- ネットワーク ---
    vm_ipv4_prefix: 24 # ホスト名(IP)に付けるプレフィックス長
    vm_ipv4_gw: 172.16.11.1

    # 未指定だとProxmoxがホストのDNS設定を引き継ぐ。
    # ホストのDNSがVMから見えない場合は明示すること。
    # vm_nameserver: 192.168.10.1
    # vm_searchdomain: example.local

    # --- Proxmox側 ---
    proxmox_storage: local-lvm

    # --- VMのハードウェア(クローン直後・停止中に適用される) ---
    # 数分おきに公開IPを確認してCloudflare APIを叩くだけなので1コア/512MBでも動く。
    # ディスクは resize で拡張する(disks だと新しい空ディスクに置き換わる)。
    # resize を省くとテンプレート素の約3GBのままになり、Dockerとパッケージ更新で逼迫する。
    vm_hardware:
      cpu:
        cores: 2
        type: x86-64-v2-AES
      memory:
        size: 512
      options:
        bios: seabios
        machine: q35
        vga: std
      # --- ディスクの設定(SSD/HDDの違いをここで明示する) ---
      # ssd     : SSDエミュレーション。ゲストに非回転メディアとして見せる
      #           (HDD上のディスクでは 0 にすること)
      # iothread: ディスクI/Oを専用スレッドに分離する
      #           (SCSIコントローラは既定で virtio-scsi-single になる)
      # discard : ゲストで削除した分の領域をストレージへ返す(TRIM/UNMAP)
      #           (YAMLでは on が真偽値になるため引用符が必要)
      # 省略した場合もすべてオンになるが、載っているストレージが
      # SSDかHDDかは環境ごとに違うため、各インベントリで明記している。
      disk_options:
        - bus: scsi
          index: 0
          ssd: 1 # ⚠ local-lvm がHDD上にある場合は 0 にすること
          iothread: 1
          discard: "on"
      resize:
        - bus: scsi
          index: 0
          size: 8

    # --- VMの動作設定(稼働中でも変更できる) ---
    vm_options:
      agent: 1 # QEMUゲストエージェント(ゲスト側の導入はcloudflare_ddns_uiロールが行う)
      onboot: 1 # 止まっている間は公開IPの変化に追従できないため自動起動

    # --- VMのログイン設定 ---
    vm_ssh_user: ddns
    vm_ssh_pubkey_file: ~/.ssh/id_ed25519_cloudflare_ddns_ui.pub
    vm_ssh_prikey: ~/.ssh/id_ed25519_cloudflare_ddns_ui

    # --- cloudflare-ddns-ui本体の設定 ---
    # 指定できる項目は docs/vms/cloudflare-ddns-ui.md を参照。
    # APIトークンとゾーンIDは vault/cloudflare.yml から自動で渡される
    # (実行には --ask-vault-pass が必要。平文でここに書かないこと)。
    #
    # 更新するレコード(FQDN)。カンマ区切りでもリストでも書ける。
    # ⚠ Cloudflare側に既にAレコードがある必要がある(無ければWeb UIから作成する)
    cloudflare_ddns_ui_records:
      - auth.cc-chacchan.com
      - wg.cc-chacchan.com
    # レコードが属するゾーン(登録可能ドメイン)。ゾーンIDはvaultから渡る
    cloudflare_ddns_ui_zone_domain: cc-chacchan.com

    # cloudflare_ddns_ui_version: v1.0.2
    # cloudflare_ddns_ui_interval: 300      # 公開IPを確認する間隔(秒)
    # ⚠ ダッシュボードには認証が無い。LANに出したくない場合は下を有効にする
    # cloudflare_ddns_ui_http_bind: 127.0.0.1

# playbooks/services/authentik.yml 用。1ホスト = 構築するVM1台、ホスト名はVMのIPアドレス。
# ここに書いた値は既定値で、-e で同じ変数を渡すとそちらが優先される。
#
#   全台: ansible-playbook playbooks/services/authentik.yml --ask-vault-pass
#   個別: ansible-playbook playbooks/services/authentik.yml --ask-vault-pass --limit 192.168.10.60
#
# パスワード類は平文で書かないこと(-e で渡すか ansible-vault encrypt_string を使う)。
---
authentik:
  hosts:
    172.16.11.2:
      vm_id: 502
      vm_name: authentik
      vm_node: 172.16.11.15 # 構築先のProxmoxノード

  vars:
    # --- ネットワーク ---
    vm_ipv4_prefix: 24 # ホスト名(IP)に付けるプレフィックス長
    vm_ipv4_gw: 172.16.11.1

    # 未指定だとProxmoxがホストのDNS設定を引き継ぐ。
    # ホストのDNSがVMから見えない場合は明示すること。
    # vm_nameserver: 192.168.10.1
    # vm_searchdomain: example.local

    # --- Proxmox側 ---
    proxmox_storage: local-lvm

    # --- VMのハードウェア(クローン直後・停止中に適用される) ---
    # Authentik公式の最小構成は2コア/4GB。ここでは余裕を持たせている。
    # ディスクは resize で拡張する(disks だと新しい空ディスクに置き換わる)。
    # resize を省くとテンプレート素の約3GBのままになり、イメージが入らない。
    vm_hardware:
      cpu:
        cores: 2
        type: x86-64-v2-AES
      memory:
        size: 4096
      options:
        bios: seabios
        machine: q35
        vga: std
      # --- ディスクの設定(SSD/HDDの違いをここで明示する) ---
      # ssd     : SSDエミュレーション。ゲストに非回転メディアとして見せる
      #           (HDD上のディスクでは 0 にすること)
      # iothread: ディスクI/Oを専用スレッドに分離する
      #           (SCSIコントローラは既定で virtio-scsi-single になる)
      # discard : ゲストで削除した分の領域をストレージへ返す(TRIM/UNMAP)
      #           (YAMLでは on が真偽値になるため引用符が必要)
      # 省略した場合もすべてオンになるが、載っているストレージが
      # SSDかHDDかは環境ごとに違うため、各インベントリで明記している。
      disk_options:
        - bus: scsi
          index: 0
          ssd: 1 # ⚠ local-lvm がHDD上にある場合は 0 にすること
          iothread: 1
          discard: "on"
      resize:
        - bus: scsi
          index: 0
          size: 16

    # --- VMの動作設定(稼働中でも変更できる) ---
    vm_options:
      agent: 1 # QEMUゲストエージェント(ゲスト側の導入はauthentikロールが行う)
      onboot: 1 # 認証基盤が落ちたままにならないよう自動起動

    # --- VMのログイン設定 ---
    vm_ssh_user: authentik
    vm_ssh_pubkey_file: ~/.ssh/id_ed25519_authentik.pub
    vm_ssh_prikey: ~/.ssh/id_ed25519_authentik

    # --- Authentik本体の設定 ---
    # 指定できる項目は docs/vms/authentik.md を参照。
    # 未指定ならロールの既定値(9000/9443、パスワード類は自動生成)が使われる。
    # authentik_version: "2026.5.6"
    # authentik_http_port: 9000

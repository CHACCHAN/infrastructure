# playbooks/services/wg-easy.yml 用。1ホスト = 構築するVM1台、ホスト名はVMのIPアドレス。
# ここに書いた値は既定値で、-e で同じ変数を渡すとそちらが優先される。
#
#   全台: ansible-playbook playbooks/services/wg-easy.yml --ask-vault-pass
#   個別: ansible-playbook playbooks/services/wg-easy.yml --ask-vault-pass --limit 172.16.11.5
#
# グループ名だけは wg_easy(アンダースコア)です。
# Ansibleのグループ名にはハイフンを使えないためで、他のファイルと違う点はここだけです。
#
# パスワード類は平文で書かないこと(vault/wg-easy.yml か -e を使う)。
---
wg_easy:
  hosts:
    172.16.11.5:
      vm_id: 501
      vm_name: wg-easy
      vm_node: 172.16.11.15 # 構築先のProxmoxノード

  vars:
    # --- ネットワーク ---
    vm_ipv4_prefix: 24 # ホスト名(IP)に付けるプレフィックス長
    vm_ipv4_gw: 172.16.11.1

    # 未指定だとProxmoxがホストのDNS設定を引き継ぐ。
    # ホストのDNSがVMから見えない場合は明示すること。
    # vm_nameserver: 192.168.10.1
    # vm_searchdomain: example.local

    # --- Proxmox側 ---
    proxmox_storage: local-lvm

    # --- VMのハードウェア(クローン直後・停止中に適用される) ---
    # VPNの暗号化処理が中心。回線が太いならコアを増やす。
    # ディスクは resize で拡張する(disks だと新しい空ディスクに置き換わる)。
    # resize を省くとテンプレート素の約3GBのままになり、Dockerとパッケージ更新で逼迫する。
    vm_hardware:
      cpu:
        cores: 2
        type: x86-64-v2-AES
      memory:
        size: 512
      options:
        bios: seabios
        machine: q35
        vga: std
      # --- ディスクの設定(SSD/HDDの違いをここで明示する) ---
      # ssd     : SSDエミュレーション。ゲストに非回転メディアとして見せる
      #           (HDD上のディスクでは 0 にすること)
      # iothread: ディスクI/Oを専用スレッドに分離する
      #           (SCSIコントローラは既定で virtio-scsi-single になる)
      # discard : ゲストで削除した分の領域をストレージへ返す(TRIM/UNMAP)
      #           (YAMLでは on が真偽値になるため引用符が必要)
      # 省略した場合もすべてオンになるが、載っているストレージが
      # SSDかHDDかは環境ごとに違うため、各インベントリで明記している。
      disk_options:
        - bus: scsi
          index: 0
          ssd: 1 # ⚠ local-lvm がHDD上にある場合は 0 にすること
          iothread: 1
          discard: "on"
      resize:
        - bus: scsi
          index: 0
          size: 8

    # --- VMの動作設定(稼働中でも変更できる) ---
    vm_options:
      agent: 1 # QEMUゲストエージェント(ゲスト側の導入はwg_easyロールが行う)
      onboot: 1 # 止まっているとVPNに接続できないため自動起動

    # --- VMのログイン設定 ---
    vm_ssh_user: wg
    vm_ssh_pubkey_file: ~/.ssh/id_ed25519_wg_easy.pub
    vm_ssh_prikey: ~/.ssh/id_ed25519_wg_easy

    # --- wg-easy本体の設定 ---
    # 指定できる項目(コンテナの全環境変数)は docs/vms/wg-easy.md を参照。
    # OIDCのクライアントIDとシークレット、管理者の初期パスワードは
    # vault/wg-easy.yml から渡る(実行には --ask-vault-pass が必要)。
    #
    # クライアントから見た接続先。⚠ VMのLAN内IPではなく外から見たFQDN/グローバルIP。
    # ルーターでUDP 51820をこのVMへ転送すること
    wg_easy_init_host: wg.cc-chacchan.com

    # --- 認証(既定はOIDC) ---
    wg_easy_oauth_providers: oidc
    wg_easy_oauth_oidc_server: https://auth.cc-chacchan.com/application/o/wg-easy/
    wg_easy_oauth_oidc_name: Authentik
    # ログイン画面を開いたら自動でOIDCへ飛ばす場合(?auto_launch=false で通常画面)
    # wg_easy_oauth_auto_launch: oidc
    # OIDCでログインした未登録の利用者を自動作成する
    # ⚠ 管理者権限で作られるため、必ずドメインを絞ること
    # wg_easy_oauth_auto_register: true
    # wg_easy_oauth_allowed_domains: cc-chacchan.com
    # 管理者アカウントとOIDCの紐付けが済んでから有効にすること
    # wg_easy_disable_password_auth: true

    # --- その他 ---
    # ⚠ OIDCは 15.4.0-beta.1 以降でのみ使える(安定版ではOAUTH_*が無視される)。
    # パスワード認証だけで使うなら "15.3.0" などの安定版でよい
    wg_easy_version: "15.4.0-beta.1"
    # wg_easy_wg_port: 51820              # WireGuard(UDP)
    # wg_easy_ui_port: 51821              # Web UI(TCP)
    # wg_easy_ui_bind: 127.0.0.1          # Web UIをLANに出さない場合
    wg_easy_insecure: false # HTTPS(リバースプロキシ)経由にする場合
    wg_easy_init_dns: 172.16.11.3 # クライアントに配るDNS(technitium-dns等)
    # wg_easy_init_allowed_ips: 0.0.0.0/0,::/0

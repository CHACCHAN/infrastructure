# playbooks/services/development.yml 用。1ホスト = 構築するVM1台、ホスト名はVMのIPアドレス。
# ここに書いた値は既定値で、-e で同じ変数を渡すとそちらが優先される。
#
#   全台: ansible-playbook playbooks/services/development.yml --ask-vault-pass
#   個別: ansible-playbook playbooks/services/development.yml --ask-vault-pass --limit 172.16.11.21
#   複数: --limit '172.16.11.21,172.16.11.22'
#
# パスワード類は平文で書かないこと(-e で渡すか ansible-vault encrypt_string を使う)。
---
development:
  hosts:
    172.16.11.21:
      vm_id: 702
      vm_name: yuya-dev
      vm_node: 172.16.11.17 # 構築先のProxmoxノード

    172.16.11.22:
      vm_id: 201
      vm_name: shun-dev
      vm_node: 172.16.11.11

  vars:
    # --- ネットワーク ---
    vm_ipv4_prefix: 24 # ホスト名(IP)に付けるプレフィックス長
    vm_ipv4_gw: 172.16.11.1

    # 未指定だとProxmoxがホストのDNS設定を引き継ぐ。
    # ホストのDNSがVMから見えない場合は明示すること。
    # vm_nameserver: 192.168.10.1
    # vm_searchdomain: example.local

    # --- Proxmox側 ---
    # ノードごとに違う場合は hosts: の各VMの下に書けば個別に上書きできる
    proxmox_storage: ssd01

    # --- VMのハードウェア(クローン直後・停止中に適用される) ---
    # cpu.type=host はホストのCPU機能をそのままゲストへ渡す指定。
    # ディスクは resize で拡張する(disks だと新しい空ディスクに置き換わる)。
    vm_hardware:
      cpu:
        cores: 4
        type: host
      memory:
        size: 4096
      options:
        bios: seabios
        machine: q35
        vga: std
      # --- ディスクの設定(SSD/HDDの違いをここで明示する) ---
      # ssd     : SSDエミュレーション。ゲストに非回転メディアとして見せる
      #           (HDD上のディスクでは 0 にすること)
      # iothread: ディスクI/Oを専用スレッドに分離する
      #           (SCSIコントローラは既定で virtio-scsi-single になる)
      # discard : ゲストで削除した分の領域をストレージへ返す(TRIM/UNMAP)
      #           (YAMLでは on が真偽値になるため引用符が必要)
      # 省略した場合もすべてオンになるが、載っているストレージが
      # SSDかHDDかは環境ごとに違うため、各インベントリで明記している。
      disk_options:
        - bus: scsi
          index: 0
          ssd: 1 # ssd01(SSD)上のディスクのため1
          iothread: 1
          discard: "on"
      resize:
        - bus: scsi
          index: 0
          size: 64

    # --- VMの動作設定(稼働中でも変更できる) ---
    vm_options:
      agent: 1 # QEMUゲストエージェント(ゲスト側の導入はdevelopmentロールが行う)
      onboot: 1 # Proxmoxホスト起動時にVMを自動起動

    # --- VMのログイン設定 ---
    # SSH・cockpit・RDPで共通のログインユーザー
    vm_ssh_user: dev

    # コントロールノード側のパス。公開鍵は内容を直接渡すこともできる
    # (-e "vm_ssh_pubkey='ssh-ed25519 ...'")
    vm_ssh_pubkey_file: ~/.ssh/id_ed25519_test_dev.pub
    vm_ssh_prikey: ~/.ssh/id_ed25519_test_dev

# playbooks/services/supabase.yml 用。1ホスト = 構築するVM1台、ホスト名はVMのIPアドレス。
# ここに書いた値は既定値で、-e で同じ変数を渡すとそちらが優先される。
#
#   全台: ansible-playbook playbooks/services/supabase.yml --ask-vault-pass
#   個別: ansible-playbook playbooks/services/supabase.yml --ask-vault-pass --limit 172.16.11.6
#
# APIキーと大半のパスワードはVM内で自動生成され、VM内の .env に保存される
# (このファイルには秘密情報を置かない)。
# ダッシュボードのログインパスワードだけは vault/supabase.yml の
# vault_supabase_user_password を使う。
---
supabase:
  hosts:
    172.16.11.6:
      vm_id: 402
      vm_name: supabase
      vm_node: 172.16.11.14 # 構築先のProxmoxノード

  vars:
    # --- ネットワーク ---
    vm_ipv4_prefix: 24 # ホスト名(IP)に付けるプレフィックス長
    vm_ipv4_gw: 172.16.11.1

    # 未指定だとProxmoxがホストのDNS設定を引き継ぐ。
    # ホストのDNSがVMから見えない場合は明示すること。
    # vm_nameserver: 172.16.11.3
    # vm_searchdomain: example.local

    # --- Proxmox側 ---
    proxmox_storage: ssd02

    # --- VMのハードウェア(クローン直後・停止中に適用される) ---
    # 11個のコンテナ(Postgres含む)が常駐するため、公式の推奨に沿って余裕を持たせる。
    # ディスクは resize で拡張する(disks だと新しい空ディスクに置き換わる)。
    # イメージだけで数GiB使うため、resize を省くと空き容量チェックで中止する。
    vm_hardware:
      cpu:
        cores: 12
        type: x86-64-v3
      memory:
        size: 8192
      options:
        bios: seabios
        machine: q35
        vga: std
      # --- ディスクの設定(SSD/HDDの違いをここで明示する) ---
      # ssd     : SSDエミュレーション。ゲストに非回転メディアとして見せる
      #           (HDD上のディスクでは 0 にすること)
      # iothread: ディスクI/Oを専用スレッドに分離する
      #           (SCSIコントローラは既定で virtio-scsi-single になる)
      # discard : ゲストで削除した分の領域をストレージへ返す(TRIM/UNMAP)
      #           (YAMLでは on が真偽値になるため引用符が必要)
      # 省略した場合もすべてオンになるが、載っているストレージが
      # SSDかHDDかは環境ごとに違うため、各インベントリで明記している。
      disk_options:
        - bus: scsi
          index: 0
          ssd: 1 # ssd02(SSD)上のディスクのため1
          iothread: 1
          discard: "on"
      resize:
        - bus: scsi
          index: 0
          size: 400

    # --- VMの動作設定(稼働中でも変更できる) ---
    vm_options:
      agent: 1 # QEMUゲストエージェント(ゲスト側の導入はsupabaseロールが行う)
      onboot: 1 # DBを含むため自動起動

    # --- VMのログイン設定 ---
    vm_ssh_user: supabase
    vm_ssh_pubkey_file: ~/.ssh/id_ed25519_supabase.pub
    vm_ssh_prikey: ~/.ssh/id_ed25519_supabase

    # --- Supabase本体の設定 ---
    # .env に入る値はすべて変数で指定できる(一覧は docs/vms/supabase.md)。
    # APIキーとパスワードは未指定なら公式スクリプトで自動生成され、
    # 再実行でも作り直されない(VM内の .env から引き継ぐ)。
    #
    # ダッシュボードのログイン。パスワードは vault/supabase.yml の
    # vault_supabase_user_password が使われる(vaultが空なら自動生成)。
    # ユーザー名を変えたいときだけ次を指定する
    # supabase_dashboard_username: supabase
    #
    # ブラウザやアプリから見たURL。未指定ならVMのIPとKongのポートから組み立てる。
    # リバースプロキシ経由で使う場合は必ず指定すること(認証メールのリンクにも使われる)
    supabase_public_url: https://api.cc-chacchan.com
    supabase_api_external_url: https://api.cc-chacchan.com
    # supabase_site_url: https://app.cc-chacchan.com

    # 取得する公式構成のリビジョン(イメージのタグはこの中で固定されている)。
    # 上げるときは公式のCHANGELOGを確認してから変更すること
    # supabase_ref: master

    # 使うcompose定義(ログ収集やHTTPS化を足す場合)
    # supabase_compose_files:
    #   - docker-compose.yml
    #   - docker-compose.logs.yml

    # --- 公開ポート ---
    # APIとダッシュボードは同じKong(APIゲートウェイ)が同じポートで配信する。
    # ダッシュボードは / 、APIは /auth/v1 や /rest/v1 のようにパスで分かれる。
    # 直接publishすると認証を通らなくなるため、Studioは個別に公開しない。
    supabase_kong_http_port: 8000 # API + ダッシュボード(http://<VMのIP>:8000/)


    # supabase_kong_https_port: 8443      # 公式のTLS設定を有効にした場合のみ使う
    # supabase_postgres_port: 5432        # Postgres(セッションモード)
    # supabase_pooler_proxy_port_transaction: 6543
    # メールを送れない環境では、確認メール無しでユーザーを有効化する
    # supabase_enable_email_autoconfirm: true

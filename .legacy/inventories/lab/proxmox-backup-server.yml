# playbooks/services/proxmox-backup-server.yml 用。1ホスト = 構築するVM1台、
# ホスト名はVMのIPアドレス。
# ここに書いた値は既定値で、-e で同じ変数を渡すとそちらが優先される。
#
#   全台: ansible-playbook playbooks/services/proxmox-backup-server.yml --ask-vault-pass
#   個別: ansible-playbook playbooks/services/proxmox-backup-server.yml --ask-vault-pass --limit 172.16.11.7
#
# グループ名だけは proxmox_backup_server(アンダースコア)です。
# Ansibleのグループ名にはハイフンを使えないためで、他のファイルと違う点はここだけです。
#
# パスワード類は平文で書かないこと(-e で渡すか ansible-vault encrypt_string を使う)。
---
proxmox_backup_server:
  # 構築するVMを1台1ホストで書く。ホスト名は nic0(外からの入口)側のIPアドレス。
  hosts:
    172.16.11.7:
      vm_id: 101
      vm_name: proxmox-backup-server
      vm_node: 172.16.11.11 # 構築先のProxmoxノード
      # nic1(占有回線)に付けるIP。PVEからバックアップ先として接続するのはこちら。
      # ⚠ 環境に合わせて変更すること(下の network の bridge と対で決まります)
      vm_cluster_ipv4: 10.10.10.7/24

  vars:
    # --- ネットワーク ---
    # NICは2枚構成。
    #   nic0: 外からの入口。ホスト名のIP(172.16.11.7)が付き、SSHとWeb UIに使う
    #   nic1: Proxmox間の占有回線。vm_cluster_ipv4 が付き、PVE↔PBSのバックアップ
    #         通信(転送・検証・リストア)をこちらに流す
    # 占有回線は外に出ないため vm_cluster_ipv4_gw は指定しないこと
    # (デフォルトゲートウェイが2つあると通信経路が不安定になる)。
    vm_ipv4_prefix: 24 # ホスト名(IP)に付けるプレフィックス長
    vm_ipv4_gw: 172.16.11.1

    # 未指定だとProxmoxがホストのDNS設定を引き継ぐ。
    # vm_nameserver: 172.16.11.3
    # vm_searchdomain: example.local

    # --- Proxmox側 ---
    # OS用ディスク(scsi0)を置くストレージ。バックアップ用は下の disks で別に指定する
    proxmox_storage: ssd01

    # --- VMのハードウェア(クローン直後・停止中に適用される) ---
    # ディスクは2本構成。
    #   scsi0(resize) : OS用。テンプレートからクローンしたディスクを拡張する
    #   scsi1(disks)  : バックアップの実データ用。別ストレージに新規作成する
    #                   (VM内で /mnt/datastore/backup にマウントされる)
    #
    # ⚠ disks は「新しいディスクを作る」指定です。構築済みVMに対して
    #   playbooks/proxmox/proxmox_vm_hardware.yml を disks 付きで実行すると、
    #   空のディスクに差し替わり、それまでのバックアップが切り離されます。
    #   容量を増やすときは disks ではなく resize を使ってください。
    vm_hardware:
      cpu:
        cores: 12
        type: x86-64-v3
      memory:
        size: 8192
      options:
        bios: seabios
        machine: q35
        vga: std
      network:
        - index: 0
          model: virtio
          bridge: vmbr0 # 外からの入口(⚠ 管理ネットワーク側のブリッジ名に合わせること)
        - index: 1
          model: virtio
          bridge: vmbr1 # Proxmox間の占有回線(⚠ 環境に合わせて変更すること)
      # --- ディスクの設定(SSD/HDDの違いをここで明示する) ---
      # ssd     : SSDエミュレーション。ゲストに非回転メディアとして見せる
      #           (HDD上のディスクでは 0 にすること)
      # iothread: ディスクI/Oを専用スレッドに分離する
      #           (SCSIコントローラは既定で virtio-scsi-single になる)
      # discard : ゲストで削除した分の領域をストレージへ返す(TRIM/UNMAP)
      #           (YAMLでは on が真偽値になるため引用符が必要)
      # 省略した場合もすべてオンになるが、載っているストレージが
      # SSDかHDDかは環境ごとに違うため、各インベントリで明記している。
      disk_options:
        - bus: scsi
          index: 0
          ssd: 1 # OS用。ssd01(SSD)上のディスクのため1
          iothread: 1
          discard: "on"
      resize:
        - bus: scsi
          index: 0
          size: 32 # OS用。PBS本体とログだけなので大きくしなくてよい
      disks:
        - bus: scsi
          index: 1
          storage: hdd01 # ⚠ バックアップを置くストレージ名に合わせること
          size: 920 # バックアップの保存量に合わせる
          # backup: 0 # このディスク自体はPVEのバックアップ対象にしない
          discard: "on" # 削除した分をストレージへ返す(YAMLの真偽値と区別するため引用符が必要)
          ssd: 0 # hdd01(HDD)上のディスクのため0(既定はオンなので明示して打ち消す)
          iothread: 1 # HDDでもI/Oの待ちを他の処理と分離できるためオン

    # --- VMの動作設定(稼働中でも変更できる) ---
    vm_options:
      agent: 1 # QEMUゲストエージェント(ゲスト側の導入はpbsロールが行う)
      onboot: 1 # バックアップ先が落ちているとジョブが失敗するため自動起動

    # --- VMのログイン設定 ---
    vm_ssh_user: pbs
    vm_ssh_pubkey_file: ~/.ssh/id_ed25519_pbs.pub
    vm_ssh_prikey: ~/.ssh/id_ed25519_pbs

    # --- PBS本体の設定 ---
    # 指定できる項目は docs/vms/proxmox-backup-server.md を参照。
    # 未指定ならロールの既定値が使われる
    # (データストア backup:/mnt/datastore/backup、管理者 admin@pbs はパスワード自動生成)。
    # pbs_datastore_name: backup
    # pbs_data_disk_device: /dev/sdb   # 2本目のディスクを自動判別できない場合だけ指定
    # pbs_admin_user: admin

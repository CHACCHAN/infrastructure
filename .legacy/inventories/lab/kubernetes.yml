# playbooks/services/kubernetes.yml 用。1ホスト = 構築するVM1台、ホスト名はVMのIPアドレス。
# ここに書いた値は既定値で、-e で同じ変数を渡すとそちらが優先される。
#
#   全台: ansible-playbook playbooks/services/kubernetes.yml --ask-vault-pass
#   個別: ansible-playbook playbooks/services/kubernetes.yml --ask-vault-pass --limit 192.168.10.71
#   複数: --limit '192.168.10.71,192.168.10.72'
#
# 全台実行のときは「コントロールプレーン → ワーカー」の順に1台ずつ構築される
# (ワーカーは参加先のコントロールプレーンからトークンを自動取得するため)。
#
# パスワード類は平文で書かないこと(-e で渡すか ansible-vault encrypt_string を使う)。
---
kubernetes:
  hosts:
    # --- コントロールプレーン ---
    172.16.12.11:
      vm_id: 202
      vm_name: k3s-master01 # VM名がそのままKubernetesのノード名になる
      vm_node: 172.16.11.12 # 構築先のProxmoxノード
      kubernetes_node_role: server
      vm_cluster_ipv4: 10.10.20.11/24 # nic1(vmbr3)に付けるクラスタ占有ネットワーク

    # --- ワーカー ---
    172.16.12.15:
      vm_id: 301
      vm_name: k3s-worker01
      vm_node: 172.16.11.13
      kubernetes_node_role: agent
      vm_cluster_ipv4: 10.10.20.15/24

    172.16.12.16:
      vm_id: 401
      vm_name: k3s-worker02
      vm_node: 172.16.11.14
      kubernetes_node_role: agent
      vm_cluster_ipv4: 10.10.20.16/24

    172.16.12.17:
      vm_id: 102
      vm_name: k3s-worker03
      vm_node: 172.16.11.11
      kubernetes_node_role: agent
      vm_cluster_ipv4: 10.10.20.17/24

    172.16.12.18:
      vm_id: 701
      vm_name: k3s-worker04
      vm_node: 172.16.11.17
      kubernetes_node_role: agent
      vm_cluster_ipv4: 10.10.20.18/24

  vars:
    # --- k3s ---
    # ワーカーの参加先。コントロールプレーン自身にも渡るが、自分を指す値は
    # 「クラスタの1台目」として扱われるためグループ共通で書ける。
    # 指定できる項目は docs/vms/kubernetes.md を参照。
    kubernetes_server_ip: 10.10.20.11
    # kubernetes_version: v1.34.1+k3s1   # 未指定なら最新安定版
    # kubernetes_disable: [traefik]      # 標準コンポーネントの無効化
    # kubernetes_cluster_init: true      # HA構成にする予定があるなら1台目で有効化

    # --- ネットワーク ---
    # NICは2枚構成。nic0(vmbr2)が外部通信用で、ホスト名のIPが付く。
    # nic1(vmbr3)がクラスタ間の占有ネットワークで、各VMの vm_cluster_ipv4 が付く。
    #
    # 占有ネットワーク側を指定すると、ノード間通信(kubelet・flannel・etcd)と
    # ワーカーの参加先がそちらに寄る(k3sの node-ip / flannel-iface / server)。
    # SSH接続と手元からの kubectl は外部通信用のIPのまま変わらない。
    # 外に出ないネットワークなので vm_cluster_ipv4_gw は指定しないこと
    # (デフォルトゲートウェイが2つあると通信経路が不安定になる)。
    vm_ipv4_prefix: 24 # ホスト名(IP)に付けるプレフィックス長
    vm_ipv4_gw: 172.16.12.1

    # 未指定だとProxmoxがホストのDNS設定を引き継ぐ。
    # ホストのDNSがVMから見えない場合は明示すること。
    # vm_nameserver: 192.168.10.1
    # vm_searchdomain: example.local

    # --- Proxmox側 ---
    proxmox_storage: ssd01

    # --- VMのハードウェア(クローン直後・停止中に適用される) ---
    # ディスクは resize で拡張する(disks だと新しい空ディスクに置き換わる)。
    # resize を省くとテンプレート素の約3GBのままになり、コンテナイメージが入らない。
    # ノードごとに変える場合は hosts: の各VMの下に書けば個別に上書きできる。
    vm_hardware:
      cpu:
        cores: 8
        type: x86-64-v3
      memory:
        size: 8192
      options:
        bios: seabios
        machine: q35
        vga: std
      network:
        - index: 0
          model: virtio
          bridge: vmbr2 # 外部通信用
        - index: 1
          model: virtio
          bridge: vmbr3 # クラスタ間の占有ネットワーク
      # --- ディスクの設定(SSD/HDDの違いをここで明示する) ---
      # ssd     : SSDエミュレーション。ゲストに非回転メディアとして見せる
      #           (HDD上のディスクでは 0 にすること)
      # iothread: ディスクI/Oを専用スレッドに分離する
      #           (SCSIコントローラは既定で virtio-scsi-single になる)
      # discard : ゲストで削除した分の領域をストレージへ返す(TRIM/UNMAP)
      #           (YAMLでは on が真偽値になるため引用符が必要)
      # 省略した場合もすべてオンになるが、載っているストレージが
      # SSDかHDDかは環境ごとに違うため、各インベントリで明記している。
      disk_options:
        - bus: scsi
          index: 0
          ssd: 1 # ssd01(SSD)上のディスクのため1
          iothread: 1
          discard: "on"
      resize:
        - bus: scsi
          index: 0
          size: 128

    # --- VMの動作設定(稼働中でも変更できる) ---
    vm_options:
      agent: 1 # QEMUゲストエージェント(ゲスト側の導入はkubernetesロールが行う)
      onboot: 1 # ノードが落ちたままにならないよう自動起動

    # --- VMのログイン設定 ---
    vm_ssh_user: k3s
    vm_ssh_pubkey_file: ~/.ssh/id_ed25519_k3s.pub
    vm_ssh_prikey: ~/.ssh/id_ed25519_k3s

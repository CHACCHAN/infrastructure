---
- name: 必須変数が正しく渡されているか検証する
  ansible.builtin.assert:
    that:
      - vm_id is defined
    fail_msg: >-
      vm_id が指定されていません。
    quiet: true

# ssh_password はProxmoxホストへのSSH接続パスワードではなく、
# VM内のcloud-initユーザーのログインパスワード。
- name: 変更内容が1つ以上指定されていることを検証する
  ansible.builtin.assert:
    that:
      - ((ssh_user | default('', true)) | length > 0)
        or ((ssh_password | default('', true)) | length > 0)
        or ((ssh_pubkey | default('', true)) | length > 0)
        or ((ipv4 | default('', true)) | length > 0)
        or ((ipv6 | default('', true)) | length > 0)
        or ((net1_ipv4 | default('', true)) | length > 0)
        or ((net1_ipv6 | default('', true)) | length > 0)
        or ((nameserver | default('', true)) | length > 0)
        or ((searchdomain | default('', true)) | length > 0)
    fail_msg: >-
      変更内容が指定されていません。
      ssh_user / ssh_password / ssh_pubkey / ipv4 / ipv6 / net1_ipv4 / net1_ipv6 /
      nameserver / searchdomain のいずれかを指定してください
      (ipv4_gw / ipv6_gw はipv4 / ipv6と併せて指定します)。
    quiet: true

- name: ゲートウェイのみの指定になっていないことを検証する
  ansible.builtin.assert:
    that:
      - ((ipv4_gw | default('', true)) | length == 0) or ((ipv4 | default('', true)) | length > 0)
      - ((ipv6_gw | default('', true)) | length == 0) or ((ipv6 | default('', true)) | length > 0)
      - ((net1_ipv4_gw | default('', true)) | length == 0)
        or ((net1_ipv4 | default('', true)) | length > 0)
      - ((net1_ipv6_gw | default('', true)) | length == 0)
        or ((net1_ipv6 | default('', true)) | length > 0)
    fail_msg: >-
      ipv4_gw / ipv6_gw(net1_ipv4_gw / net1_ipv6_gw)はそれぞれ
      ipv4 / ipv6(net1_ipv4 / net1_ipv6)と併せて指定してください
      (アドレス側が未指定の場合、ipconfig0 / ipconfig1は変更されません)。
    quiet: true

# 既定の経路が2つあると通信先によって使うNICが変わり、切り分けが難しくなる。
# 2枚目のNICを占有ネットワークとして使う場合、ゲートウェイは持たせないのが正しい。
- name: 2枚目のNICにゲートウェイを設定しようとしていないか注意を促す
  ansible.builtin.debug:
    msg: >-
      【注意】net1_ipv4_gw / net1_ipv6_gw が指定されています。
      デフォルトゲートウェイがNIC2枚に分かれると通信経路が不安定になります。
      2枚目がクラスタ内部だけの占有ネットワークであれば、ゲートウェイは指定せず
      アドレス(net1_ipv4 / net1_ipv6)だけを設定してください。
  when: >-
    ((net1_ipv4_gw | default('', true)) | length > 0)
    or ((net1_ipv6_gw | default('', true)) | length > 0)

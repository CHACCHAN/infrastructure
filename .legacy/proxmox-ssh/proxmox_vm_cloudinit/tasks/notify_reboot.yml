# cloud-init設定はVM設定には即座に反映されるが、ゲスト内で有効になるのは
# cloud-initが再実行される次回起動時。稼働中のVMには再起動が必要。
---
- name: 反映に必要な操作を表示する
  ansible.builtin.debug:
    msg: >-
      {{
        'VMID ' + (vm_id | string) + ' は現在稼働中です。cloud-init設定は次回起動時に'
        + '反映されるため、playbooks/proxmox_vm_powerctl.yml などで再起動してください。'
        if proxmox_vm_cloudinit_vm_status == 'running'
        else 'VMID ' + (vm_id | string) + ' は停止中です。次回起動時にcloud-init設定が反映されます。'
      }}

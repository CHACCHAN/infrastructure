---
- name: 現在の電源状態を表示する
  ansible.builtin.debug:
    msg: "VMID {{ vm_id }} の現在の状態: {{ proxmox_target_vm_info[0].status }}"

- name: VMを起動する
  ansible.builtin.command:
    cmd: "qm start {{ vm_id }}"
  register: proxmox_vm_powerctl_start_result
  changed_when: proxmox_vm_powerctl_start_result.rc == 0
  when:
    - power_state == 'on'
    - proxmox_target_vm_info[0].status != 'running'

# --timeout(秒)以内にゲストOSがシャットダウンしない場合、
# shutdown_force=true なら --forceStop 1 を付けて強制停止する。
# false(既定)の場合はタイムアウトしても強制停止せず、コマンドはエラーで終了する。
- name: VMをシャットダウンする
  ansible.builtin.command:
    argv: >-
      {{
        ['qm', 'shutdown', vm_id | string, '--timeout', proxmox_vm_powerctl_shutdown_timeout | string]
        + (['--forceStop', '1'] if proxmox_vm_powerctl_shutdown_force else [])
      }}
  register: proxmox_vm_powerctl_shutdown_result
  changed_when: proxmox_vm_powerctl_shutdown_result.rc == 0
  when:
    - power_state == 'off'
    - proxmox_target_vm_info[0].status != 'stopped'

- name: 既に目的の電源状態であるため何もしない
  ansible.builtin.debug:
    msg: >-
      VMID {{ vm_id }} は既に{{ '起動' if power_state == 'on' else '停止' }}状態です。
      操作は行いません。
  when: >-
    (power_state == 'on' and proxmox_target_vm_info[0].status == 'running')
    or (power_state == 'off' and proxmox_target_vm_info[0].status == 'stopped')

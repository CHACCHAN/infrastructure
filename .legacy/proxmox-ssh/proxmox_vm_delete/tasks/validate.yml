---
- name: 必須変数が正しく渡されているか検証する
  ansible.builtin.assert:
    that:
      - vm_id is defined
    fail_msg: >-
      vm_id が指定されていません。
    quiet: true

# 誤って別のVMIDを削除してしまう事故を防ぐため、confirm_vm_idにvm_idと
# 同じ値を指定することを削除実行の条件とする
- name: 削除確認(confirm_vm_id)がvm_idと一致することを検証する
  ansible.builtin.assert:
    that:
      - confirm_vm_id is defined
      - (confirm_vm_id | string) == (vm_id | string)
    fail_msg: >-
      confirm_vm_id が指定されていないか、vm_id({{ vm_id }})と一致しません。
      誤削除防止のため、確認として -e "confirm_vm_id={{ vm_id }}" を指定してください。
    quiet: true

- name: 削除オプションを正規化する
  ansible.builtin.set_fact:
    proxmox_vm_delete_purge: "{{ purge | default(false) | bool }}"
    proxmox_vm_delete_destroy_unreferenced_disks: "{{ destroy_unreferenced_disks | default(false) | bool }}"

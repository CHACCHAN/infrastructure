# cpu/memory/disks/network に当てはまらない qm set オプションを
# そのまま --オプション名 値 として引数に追加する(汎用の抜け道)。
#
# SCSIコントローラ(scsihw)だけは既定値を持ち、明示しなければ
# virtio-scsi-single が設定される(SCSIディスクのIOスレッドに必要なため)。
---
- name: SCSIコントローラの既定値を補ったオプションを組み立てる
  ansible.builtin.set_fact:
    proxmox_vm_hardware_options_resolved: >-
      {{
        {'scsihw': proxmox_vm_hardware_default_scsihw}
        | combine(proxmox_vm_hardware_options)
      }}

- name: その他のオプションを引数に追加する
  ansible.builtin.set_fact:
    proxmox_vm_hardware_argv: >-
      {{
        proxmox_vm_hardware_argv
        + (proxmox_vm_hardware_options_resolved
            | dict2items
            | map(attribute='key')
            | map('regex_replace', '^(.*)$', '--\1')
            | zip(proxmox_vm_hardware_options_resolved | dict2items | map(attribute='value') | map('string'))
            | map('list') | list | flatten)
      }}
  when: proxmox_vm_hardware_options_resolved | length > 0

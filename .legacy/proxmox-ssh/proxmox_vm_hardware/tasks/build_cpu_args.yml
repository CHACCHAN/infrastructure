# cpu辞書を --cores/--sockets/--numa/--vcpus と、--cpu のプロパティ文字列に変換する。
# cpu.type は --cpu のデフォルトキーである cputype のエイリアスとして扱う。
# それ以外のキー(flags, hidden, hv-vendor-id, level, phys-bits, reported-model等)は
# qmのプロパティ文字列のキー名をそのまま --cpu の中に渡す。
---
- name: CPUコア数を引数に追加する
  ansible.builtin.set_fact:
    proxmox_vm_hardware_argv: "{{ proxmox_vm_hardware_argv + ['--cores', proxmox_vm_hardware_cpu.cores | string] }}"
  when: proxmox_vm_hardware_cpu.cores is defined

- name: CPUソケット数を引数に追加する
  ansible.builtin.set_fact:
    proxmox_vm_hardware_argv: "{{ proxmox_vm_hardware_argv + ['--sockets', proxmox_vm_hardware_cpu.sockets | string] }}"
  when: proxmox_vm_hardware_cpu.sockets is defined

- name: NUMA設定を引数に追加する
  ansible.builtin.set_fact:
    proxmox_vm_hardware_argv: "{{ proxmox_vm_hardware_argv + ['--numa', ('1' if (proxmox_vm_hardware_cpu.numa | bool) else '0')] }}"
  when: proxmox_vm_hardware_cpu.numa is defined

- name: ホットプラグ用vCPU数を引数に追加する
  ansible.builtin.set_fact:
    proxmox_vm_hardware_argv: "{{ proxmox_vm_hardware_argv + ['--vcpus', proxmox_vm_hardware_cpu.vcpus | string] }}"
  when: proxmox_vm_hardware_cpu.vcpus is defined

- name: CPUタイプ等の残りのプロパティを組み立てる
  ansible.builtin.set_fact:
    proxmox_vm_hardware_cpu_props: >-
      {{
        (proxmox_vm_hardware_cpu
          | dict2items
          | rejectattr('key', 'in', ['cores', 'sockets', 'numa', 'vcpus', 'type'])
          | items2dict)
        | combine({'cputype': proxmox_vm_hardware_cpu.type} if proxmox_vm_hardware_cpu.type is defined else {})
      }}

- name: CPUのプロパティ文字列を --cpu として引数に追加する
  ansible.builtin.set_fact:
    proxmox_vm_hardware_argv: >-
      {{
        proxmox_vm_hardware_argv
        + ['--cpu', (proxmox_vm_hardware_cpu_props
                      | dict2items
                      | map(attribute='key')
                      | zip(proxmox_vm_hardware_cpu_props | dict2items | map(attribute='value') | map('string'))
                      | map('join', '=')
                      | join(','))]
      }}
  when: proxmox_vm_hardware_cpu_props | length > 0

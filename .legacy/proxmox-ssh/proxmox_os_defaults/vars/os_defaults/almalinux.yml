# 対応バージョンは最新(10)から9まで。
# versions配下のキーを os_version で1つに解決し、トップレベルの共通キーとマージして
# os_defaults にセットする(tasks/load_os_defaults.yml)。ここに無いバージョンはエラー。
---
os_defaults_almalinux:
  os_type: almalinux
  package_manager: dnf
  cloud_image_checksum_algorithm: sha256

  # os_version省略時に構築するバージョン
  default_version: "10"

  # cloud imageの "latest" は各シリーズの最新ポイントリリースを指す(ファイル名は変わらない)。
  # template_vmidはクラスタ内で一意である必要があるため、バージョンごとに別の値を割り当てている。
  versions:
    "10":
      cloud_image_url: "https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2"
      cloud_image_checksum_url: "https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM"
      cloud_image_filename: "AlmaLinux-10-GenericCloud-latest.x86_64.qcow2"
      template_vmid: 9007
      template_name: "almalinux10-template"

    "9":
      cloud_image_url: "https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
      cloud_image_checksum_url: "https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/CHECKSUM"
      cloud_image_filename: "AlmaLinux-9-GenericCloud-latest.x86_64.qcow2"
      template_vmid: 9008
      template_name: "almalinux9-template"

# 対応バージョンは最新(10)から9まで。
# versions配下のキーを os_version で1つに解決し、トップレベルの共通キーとマージして
# os_defaults にセットする(tasks/load_os_defaults.yml)。ここに無いバージョンはエラー。
---
os_defaults_rocky:
  os_type: rocky
  package_manager: dnf
  cloud_image_checksum_algorithm: sha256

  # os_version省略時に構築するバージョン
  default_version: "10"

  # cloud imageの "latest" は各シリーズの最新ポイントリリースを指す(ファイル名は変わらない)。
  # CHECKSUMはBSD形式(SHA256 (ファイル名) = ハッシュ)で、先頭にファイル名を含む
  # コメント行があるが、ロール側でハッシュを含む行だけを拾うようにしている。
  # template_vmidはクラスタ内で一意である必要があるため、バージョンごとに別の値を割り当てている。
  versions:
    "10":
      cloud_image_url: "https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2"
      cloud_image_checksum_url: "https://dl.rockylinux.org/pub/rocky/10/images/x86_64/CHECKSUM"
      cloud_image_filename: "Rocky-10-GenericCloud-Base.latest.x86_64.qcow2"
      template_vmid: 9005
      template_name: "rocky10-template"

    "9":
      cloud_image_url: "https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2"
      cloud_image_checksum_url: "https://dl.rockylinux.org/pub/rocky/9/images/x86_64/CHECKSUM"
      cloud_image_filename: "Rocky-9-GenericCloud-Base.latest.x86_64.qcow2"
      template_vmid: 9006
      template_name: "rocky9-template"

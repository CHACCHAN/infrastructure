# os_type と os_version から、そのバージョン1つ分の定義を os_defaults にセットする。
# vars/os_defaults/<os_type>.yml のトップレベル(OS共通)と versions配下
# (バージョンごと)をマージして、ロールが参照する平坦な形に組み立てる。
# os_versionを省略した場合は各OSの default_version を使う。
---
- name: Os_type変数を検証する
  ansible.builtin.assert:
    that:
      - os_type is defined
      - (os_type | default('', true)) | length > 0
    fail_msg: >-
      os_type が指定されていません。-e "os_type=debian" のように
      roles/proxmox_os_defaults/vars/os_defaults/ 配下のファイル名(拡張子なし)で指定してください。
    quiet: true

- name: OS定義ファイルを読み込む
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/os_defaults/{{ os_type }}.yml"
    name: os_defaults_loaded

- name: 読み込んだOS定義を取り出す
  ansible.builtin.set_fact:
    os_defaults_all: "{{ os_defaults_loaded['os_defaults_' + os_type] }}"

- name: 構築するバージョンを決定する
  ansible.builtin.set_fact:
    os_defaults_version: >-
      {{ (os_version | default(os_defaults_all.default_version, true)) | string }}

- name: 指定されたバージョンに対応しているか検証する
  ansible.builtin.assert:
    that:
      - os_defaults_version in os_defaults_all.versions
    fail_msg: >-
      os_type={{ os_type }} は os_version={{ os_defaults_version }} に対応していません。
      対応バージョン: {{ os_defaults_all.versions.keys() | list | sort }}
      (os_versionを省略した場合は {{ os_defaults_all.default_version }} が使われます)
    quiet: true

# 制御用のキー(versions/default_version)を除き、指定バージョンの定義を上書きマージする
- name: 指定バージョンの定義をos_defaultsへ展開する
  ansible.builtin.set_fact:
    os_defaults: >-
      {{
        (os_defaults_all | dict2items
         | rejectattr('key', 'in', ['versions', 'default_version'])
         | items2dict)
        | combine(os_defaults_all.versions[os_defaults_version])
        | combine({'os_version': os_defaults_version})
      }}

- name: 構築対象を表示する
  ansible.builtin.debug:
    msg: >-
      対象: {{ os_defaults.os_type }} {{ os_defaults.os_version }} /
      template_vmid: {{ os_defaults.template_vmid }} /
      template_name: {{ os_defaults.template_name }} /
      image: {{ os_defaults.cloud_image_filename }}

---
- name: クラスタ全体のVM一覧を取得する
  ansible.builtin.import_role:
    name: proxmox_common
    tasks_from: get_cluster_vm_info

- name: 該当VMIDのVM情報を抽出する
  ansible.builtin.set_fact:
    proxmox_template_build_matched_vm: >-
      {{
        (proxmox_cluster_vm_info.stdout | from_json)
        | selectattr('vmid', 'equalto', os_defaults.template_vmid)
        | list
      }}

# 判定結果は3パターン:
#   not_found        : クラスタ全体のどこにも存在しない → 接続先ノードで新規構築
#   found_on_target  : 接続先ノードに既に存在する       → 何もしない
#   found_on_other   : 別ノードに存在する               → そちらを削除して接続先ノードで新規構築
- name: 既存VMの状態を判定する
  ansible.builtin.set_fact:
    proxmox_template_build_existing_state: >-
      {{
        'not_found'
        if (proxmox_template_build_matched_vm | length == 0)
        else ('found_on_target'
              if (proxmox_template_build_matched_vm[0].node == proxmox_node)
              else 'found_on_other')
      }}
    proxmox_template_build_existing_node: >-
      {{
        proxmox_template_build_matched_vm[0].node
        if (proxmox_template_build_matched_vm | length > 0)
        else omit
      }}

- name: 判定結果を表示する
  ansible.builtin.debug:
    msg: >-
      VMID {{ os_defaults.template_vmid }} の状態: {{ proxmox_template_build_existing_state }}
      {{ '(既存ノード: ' + proxmox_template_build_existing_node + ')' if proxmox_template_build_existing_node is defined else '' }}

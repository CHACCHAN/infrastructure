---
# SCSIコントローラは virtio-scsi-single にする。
# SCSIディスクでIOスレッドを使うにはこの型である必要があり、
# クローンしたVMもこの設定を引き継ぐ。
- name: 空のVM(テンプレートの器)を作成する
  ansible.builtin.command:
    cmd: >-
      qm create {{ os_defaults.template_vmid }}
      --name {{ os_defaults.template_name }}
      --memory 2048
      --cores 2
      --net0 virtio,bridge=vmbr0
      --scsihw {{ proxmox_template_build_scsihw }}
      --ostype l26
  changed_when: true

- name: Cloud imageをVMのディスクとしてインポートする
  ansible.builtin.command:
    cmd: >-
      qm importdisk {{ os_defaults.template_vmid }}
      {{ proxmox_image_cache_dir }}/{{ os_defaults.cloud_image_filename }}
      {{ proxmox_storage }}
  register: proxmox_template_build_importdisk
  changed_when: >-
    'transferred' in proxmox_template_build_importdisk.stdout or
    'successfully imported' in proxmox_template_build_importdisk.stdout

# IOスレッド・SSDエミュレーション・discardは既定でオン(クローンしたVMが引き継ぐ)。
# HDD上に置くVMでは、インベントリの disk_options で ssd: 0 を指定して打ち消す。
- name: インポートしたディスクをscsi0としてVMにアタッチする
  ansible.builtin.command:
    cmd: >-
      qm set {{ os_defaults.template_vmid }}
      --scsi0 {{ proxmox_storage }}:vm-{{ os_defaults.template_vmid }}-disk-0,iothread={{
        proxmox_template_build_iothread }},ssd={{ proxmox_template_build_ssd }},discard={{
        proxmox_template_build_discard }}
  changed_when: false

- name: Cloud-init用ドライブを追加する
  ansible.builtin.command:
    cmd: >-
      qm set {{ os_defaults.template_vmid }}
      --ide2 {{ proxmox_storage }}:cloudinit
  changed_when: false

# Cloud-init設定はすべて任意。ansible-playbook実行時に -e で
# ssh_user / ssh_password / ssh_pubkey / ipv4 / ipv4_gw / ipv6 / ipv6_gw を
# 指定した場合のみ適用される(未指定ならスキップされ、クローン後に
# 個別設定する運用のまま変わらない)。
# 適用処理は proxmox_vm_cloudinit ロールと共通のタスクを使う。
- name: Cloud-init設定を適用する
  ansible.builtin.import_role:
    name: proxmox_common
    tasks_from: apply_cloudinit
  vars:
    proxmox_cloudinit_vmid: "{{ os_defaults.template_vmid }}"

- name: ブートディスクの順序を設定する
  ansible.builtin.command:
    cmd: "qm set {{ os_defaults.template_vmid }} --boot c --bootdisk scsi0"
  changed_when: false

- name: シリアルコンソールを追加する(ヘッドレスVM向け)
  ansible.builtin.command:
    cmd: "qm set {{ os_defaults.template_vmid }} --serial0 socket --vga serial0"
  changed_when: false

- name: VMをテンプレート化する
  ansible.builtin.command:
    cmd: "qm template {{ os_defaults.template_vmid }}"
  register: proxmox_template_build_vm_template
  changed_when: >-
    proxmox_template_build_vm_template.rc == 0 and
    'already a template' not in proxmox_template_build_vm_template.stdout

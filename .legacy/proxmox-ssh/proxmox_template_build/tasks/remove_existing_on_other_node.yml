# 接続先とは別のノードにテンプレートVMがある場合に削除する(この後 build_template.yml が
# 接続先ノードで新規構築する)。別ノードへSSHせず、Proxmox APIのプロキシ機能で
# pvesh 経由で操作する。pvesh delete は非同期のため実際に消えるまでポーリングする。
---
- name: "既存テンプレートVMの削除を要求する ({{ proxmox_template_build_existing_node | default('unknown') }})"
  ansible.builtin.command:
    cmd: >-
      pvesh delete
      /nodes/{{ proxmox_template_build_existing_node }}/qemu/{{ os_defaults.template_vmid }}
      --purge 1
  register: proxmox_template_build_destroy_result
  changed_when: proxmox_template_build_destroy_result.rc == 0

- name: 削除が完了するまで待機する
  ansible.builtin.command:
    cmd: >-
      pvesh get /nodes/{{ proxmox_template_build_existing_node }}/qemu
      --output-format json
  register: proxmox_template_build_destroy_verify
  changed_when: false
  failed_when: false
  until: >-
    proxmox_template_build_destroy_verify.rc == 0 and
    ((proxmox_template_build_destroy_verify.stdout | from_json)
     | selectattr('vmid', 'equalto', os_defaults.template_vmid)
     | list | length == 0)
  retries: 30
  delay: 5

- name: 削除に失敗していないか検証する
  ansible.builtin.assert:
    that:
      - proxmox_template_build_destroy_verify.rc == 0
      - >-
        (proxmox_template_build_destroy_verify.stdout | from_json)
        | selectattr('vmid', 'equalto', os_defaults.template_vmid)
        | list | length == 0
    fail_msg: >-
      {{ proxmox_template_build_existing_node }} 上のVMID
      {{ os_defaults.template_vmid }} の削除に失敗した可能性があります。
      手動で状態を確認してください。
    quiet: true

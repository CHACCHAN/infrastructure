---
- name: 必須変数が正しく渡されているか検証する
  ansible.builtin.assert:
    that:
      - proxmox_image_cache_dir is defined
      - proxmox_storage is defined
      - os_defaults is defined
      - os_defaults.cloud_image_url is defined
      - os_defaults.cloud_image_checksum_url is defined
      - os_defaults.cloud_image_checksum_algorithm is defined
      - os_defaults.cloud_image_filename is defined
      - os_defaults.template_vmid is defined
      - os_defaults.template_name is defined
    fail_msg: >-
      必須変数が不足しています。呼び出し元のプレイで proxmox_os_defaults ロールを
      実行して os_defaults を組み立てているか確認してください。
    quiet: true

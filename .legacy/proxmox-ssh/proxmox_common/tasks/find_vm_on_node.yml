# proxmox_target_vmid で指定したVM/テンプレートがクラスタ内に存在し、
# かつ接続先ノード(proxmox_node)上にあることを確認する。
# 事前に get_cluster_vm_info.yml と detect_proxmox_node.yml を実行しておくこと。
# 結果は proxmox_target_vm_info(該当VMの情報を1件持つリスト)にセットされる。
---
- name: 指定VMIDの情報を抽出する
  ansible.builtin.set_fact:
    proxmox_target_vm_info: >-
      {{
        (proxmox_cluster_vm_info.stdout | from_json)
        | selectattr('vmid', 'equalto', proxmox_target_vmid | int)
        | list
      }}

- name: 指定VMIDがクラスタ内に存在することを確認する
  ansible.builtin.assert:
    that:
      - proxmox_target_vm_info | length > 0
    fail_msg: >-
      VMID {{ proxmox_target_vmid }} がクラスタ内に見つかりません。
    quiet: true

- name: 指定VMIDが接続先ノードに存在することを確認する
  ansible.builtin.assert:
    that:
      - proxmox_target_vm_info[0].node == proxmox_node
    fail_msg: >-
      VMID {{ proxmox_target_vmid }} はノード {{ proxmox_target_vm_info[0].node }}
      に存在しますが、接続先ノードは {{ proxmox_node }} です。
      proxmox_ip にVMが存在するノードのIPアドレスを指定し直してください。
    quiet: true

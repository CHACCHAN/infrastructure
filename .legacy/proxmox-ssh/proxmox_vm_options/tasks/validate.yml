---
- name: 必須変数が正しく渡されているか検証する
  ansible.builtin.assert:
    that:
      - vm_id is defined
    fail_msg: >-
      vm_id が指定されていません。
    quiet: true

# vm_optionsはスペースを含まないJSON文字列(例: {"agent":1,"onboot":1})、
# または辞書そのものを受け付ける
- name: 指定されたvm_optionsを辞書に正規化する
  ansible.builtin.set_fact:
    proxmox_vm_options_normalized: >-
      {{
        (vm_options | from_yaml)
        if (vm_options is defined and vm_options is string)
        else (vm_options if (vm_options is defined and vm_options is mapping) else {})
      }}

# vm_options_deleteは削除したいqmプロパティ名のリスト
# (スペースを含まない配列文字列、またはリストそのもの)
- name: 指定されたvm_options_deleteをリストに正規化する
  ansible.builtin.set_fact:
    proxmox_vm_options_delete: >-
      {{
        (vm_options_delete | from_yaml)
        if (vm_options_delete is defined and vm_options_delete is string)
        else (vm_options_delete
              if (vm_options_delete is defined and vm_options_delete is sequence and vm_options_delete is not string)
              else [])
      }}

- name: 変更内容が1つ以上指定されていることを検証する
  ansible.builtin.assert:
    that:
      - (proxmox_vm_options_normalized | length > 0) or (proxmox_vm_options_delete | length > 0)
    fail_msg: >-
      vm_options または vm_options_delete に、1つ以上の変更内容を指定してください
      (例: vm_options={"agent":1,"onboot":1})。
    quiet: true

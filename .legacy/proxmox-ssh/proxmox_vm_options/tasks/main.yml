# 全タスクは接続先のProxmoxホスト(-e proxmox_ip)上で直接実行される。
#
# proxmox_vm_hardware との使い分け:
#   proxmox_vm_hardware : CPU/メモリ/ディスク/NIC等のVMの構成そのもの。電源オフが必要
#   proxmox_vm_options  : agent/onboot/description/protection/tags等、稼働中でも変更できる設定
---
- name: 必須変数を検証する
  ansible.builtin.import_tasks: validate.yml

- name: 接続先のノード名を取得する
  ansible.builtin.import_role:
    name: proxmox_common
    tasks_from: detect_proxmox_node

- name: VMの状態を確認する
  ansible.builtin.import_tasks: check_vm_state.yml

- name: VMのオプションを変更する
  ansible.builtin.import_tasks: change_options.yml

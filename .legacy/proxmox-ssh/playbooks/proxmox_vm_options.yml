# 既存VMの動作設定(agent/onboot/description/protection/tags など、稼働中でも
# 変更できるもの)を変更します。CPU/メモリ/ディスク/NICなどVMの構成そのものは
# proxmox_vm_hardware.yml(電源オフが必要)を使用してください。
---
- name: 接続先のProxmoxホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vault/proxmox.yml"

  tasks:
    - name: Proxmoxというグループでホストを追加
      ansible.builtin.import_role:
        name: proxmox_connect

- name: Proxmox VMのオプションを変更する
  hosts: proxmox
  gather_facts: false

  roles:
    - proxmox_vm_options

# このplaybookは利用可能なテンプレートが存在していること前提で動作します
# proxmox_template_buildの実行後の実行を推奨です
---
- name: 接続先のProxmoxホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vault/proxmox.yml"

  tasks:
    - name: Proxmoxというグループでホストを追加
      ansible.builtin.import_role:
        name: proxmox_connect

- name: Proxmox VMを構築する
  hosts: proxmox
  gather_facts: false

  roles:
    - proxmox_vm_build

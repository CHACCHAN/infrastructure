# テンプレート構築 → VM作成 → ハードウェア調整 → 動作設定 → cloud-init設定 →
# 起動 → SSH接続待ち、までの全サービス共通フロー。
# 各サービスのplaybookから import_playbook で呼ばれる前提で、単体では実行しません
# (先に provisionロールの select / resolve / finalize で pv_targets の構築内容が
#  決まっている必要があります)。
#
# 対象は同じホスト名のままグループへ登録し、接続先(ansible_host)だけを切り替えます:
#   手順1〜6(Proxmox操作)     : ansible_host = 構築先ノード
#   手順7以降(VM内セットアップ): ansible_host = VM自身
---
# 1. cloud imageの取得とテンプレート構築(既にあれば何もしない)
- name: テンプレートを構築する
  ansible.builtin.import_playbook: ../proxmox/proxmox_template_build.yml
  vars:
    # proxmox_ip は呼び出し先のlocalhostプレイでも参照されるため、
    # 各ホストでは自分の構築先ノード、localhostでは登録済みホストの先頭を使う
    proxmox_ip: "{{ pv_proxmox_ip | default(groups['proxmox'] | first) }}"
    os_type: "{{ pv_os_type }}"
    os_version: "{{ pv_os_version }}"

- name: 残りの構築対象を登録する
  hosts: pv_targets
  gather_facts: false
  connection: local

  vars_files:
    - ../../vault/proxmox.yml

  tasks:
    - name: テンプレート構築担当以外をProxmox操作用に登録する
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: proxmox
        ansible_host: "{{ hostvars[item].pv_proxmox_ip }}"
        ansible_user: "{{ hostvars[item].proxmox_ssh_user | default('root', true) }}"
        ansible_password: "{{ vault_proxmox_ssh_password }}"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when: item != hostvars[item].pv_template_host

# 2. テンプレートからVMをクローンする
- name: VMを構築する
  ansible.builtin.import_playbook: ../proxmox/proxmox_vm_build.yml
  vars:
    proxmox_ip: "{{ pv_proxmox_ip | default(groups['proxmox'] | first) }}"
    template_vmid: "{{ hostvars[pv_template_host].os_defaults.template_vmid }}"
    target_storage: "{{ pv_target_storage }}"

# 3. ハードウェア調整(クローン直後の停止中に適用される)
- name: ハードウェア設定を変更する
  ansible.builtin.import_playbook: ../proxmox/proxmox_vm_hardware.yml
  when: (vm_hardware is defined) or (vm_hardware_delete is defined)
  vars:
    proxmox_ip: "{{ pv_proxmox_ip | default(groups['proxmox'] | first) }}"

# 4. VMの動作設定(QEMUエージェント・自動起動など)
- name: VMのオプションを変更する
  ansible.builtin.import_playbook: ../proxmox/proxmox_vm_options.yml
  when: (vm_options is defined) or (vm_options_delete is defined)
  vars:
    proxmox_ip: "{{ pv_proxmox_ip | default(groups['proxmox'] | first) }}"

# 5. cloud-init設定(VM個別)
- name: Cloud-initを設定する
  ansible.builtin.import_playbook: ../proxmox/proxmox_vm_cloudinit.yml
  vars:
    proxmox_ip: "{{ pv_proxmox_ip | default(groups['proxmox'] | first) }}"
    ssh_user: "{{ pv_vm_ssh_user }}"
    ssh_password: "{{ pv_vm_ssh_password }}"
    ssh_pubkey: "{{ pv_vm_ssh_pubkey }}"
    ipv4: "{{ pv_vm_ipv4 }}"
    ipv4_gw: "{{ pv_vm_ipv4_gw }}"
    ipv6: "{{ pv_vm_ipv6 }}"
    ipv6_gw: "{{ pv_vm_ipv6_gw }}"
    # 2枚目のNIC(vm_hardware の network index:1)に付けるアドレス(未指定なら空)
    net1_ipv4: "{{ pv_vm_cluster_ipv4 }}"
    net1_ipv4_gw: "{{ pv_vm_cluster_ipv4_gw }}"
    nameserver: "{{ pv_vm_nameserver }}"
    searchdomain: "{{ pv_vm_searchdomain }}"

# 6. VMを起動する(cloud-initはこの初回起動時に適用される)
- name: VMを起動する
  ansible.builtin.import_playbook: ../proxmox/proxmox_vm_powerctl.yml
  vars:
    proxmox_ip: "{{ pv_proxmox_ip | default(groups['proxmox'] | first) }}"
    power_state: "on"

# 7. ここから先は相手がVM自身になるため、接続先をノードからVMへ向け直す
- name: 接続先をVMへ切り替える
  hosts: pv_targets
  gather_facts: false
  connection: local

  tasks:
    # 登録した順にVM内のセットアップが走る(呼び出し先が1台ずつ処理する場合)。
    # 順番に意味があるplaybook(kubernetes)は、事前に pv_vm_setup_order で
    # 登録順を指定できる(未指定ならプレイのホスト順)
    - name: VM内セットアップ用に登録し直す
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: vms
        ansible_host: "{{ hostvars[item].pv_vm_ip }}"
        ansible_user: "{{ hostvars[item].pv_vm_ssh_user }}"
        ansible_password: ""
        ansible_ssh_private_key_file: "{{ hostvars[item].pv_vm_ssh_prikey }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ pv_vm_setup_order | default(ansible_play_hosts) }}"
      changed_when: false

# 起動直後はsshdが動いていてもcloud-initによる鍵の配置が終わっていないことがあるため、
# ポート疎通ではなく実際の接続で待機する
- name: VMにSSH接続できるようになるまで待つ
  hosts: vms
  gather_facts: false

  tasks:
    - name: SSHでログインできるまで待機する
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 10
        timeout: "{{ vm_ssh_wait_timeout | default(600) | int }}"

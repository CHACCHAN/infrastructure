# Kubernetes(k3s)のVMを、テンプレート構築からクラスタへの参加まで一気通貫で構築します。
# 処理は自前で持たず、共通フロー(provisionロールと _provision_vm.yml)を通じて
# playbooks/proxmox/ と playbooks/vms/ のplaybookを順番に呼ぶだけです。
#
# 対象の決め方は2通り(以降の処理は共通で、対象は pv_targets に集約されます):
#   インベントリ版(既定)  : inventories/lab/kubernetes.yml のホスト。--limit で選択
#   手動指定版(manual=true): -e で指定した1台のみ(インベントリが空なら自動でこちら)
#
# 共通フローで使う変数は pv_ 接頭辞(provision)にしています。k3s本体の設定は
# kubernetes_ 接頭辞でそのまま最後の手順へ渡るため、名前が混ざらないよう分けています。
#
# NICは2枚構成が既定です。nic0(vm_ipv4)が外部通信用でSSHとkubectlに使い、
# nic1(vm_cluster_ipv4)はクラスタ間の占有ネットワークとしてノード間通信だけを流します。
# vm_cluster_ipv4 を指定すると、cloud-initのipconfig1・k3sのnode-ip / flannel-iface・
# ワーカーの参加先までまとめて占有ネットワーク側に寄ります。
#
# k3sはノード間に順番の依存があるため、VM内セットアップだけは
# 「コントロールプレーン → ワーカー」の順に1台ずつ実行されます
# (ワーカーは参加先からトークンを取得するため)。
---
- name: インベントリから構築対象を選ぶ
  hosts: kubernetes
  gather_facts: false
  connection: local

  vars:
    pv_group: kubernetes

  tasks:
    - name: インベントリのホストを構築対象に加える
      ansible.builtin.import_role:
        name: provision
        tasks_from: select_inventory_targets

- name: 手動指定の構築対象を追加する
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    pv_group: kubernetes

  tasks:
    - name: 手動指定されたVMを構築対象に加える
      ansible.builtin.import_role:
        name: provision
        tasks_from: select_manual_target

- name: 構築対象を確認する
  hosts: pv_targets
  gather_facts: false
  connection: local

  # 登録するホストにProxmoxへの接続情報を持たせるため、呼び出し先と同じvaultを読む
  vars_files:
    - ../../vault/proxmox.yml

  vars:
    pv_service_summary: >-
      占有ネットワーク {{ pv_vm_cluster_ipv4 | default('(なし。クラスタ通信もnet0)', true) }}
      / k3s {{ 'ワーカー(参加先 ' ~ kubernetes_join_ip ~ ')'
               if (kubernetes_is_agent | bool)
               else 'コントロールプレーン' }}
    pv_resize_hint_reason: >-
      コンテナイメージを置く /var/lib/rancher がすぐ一杯になります。
    pv_resize_example: >-
      vm_hardware={"cpu":{"cores":4,"type":"host"},"memory":{"size":4096},"network":[{"index":0,"model":"virtio","bridge":"vmbr2"},{"index":1,"model":"virtio","bridge":"vmbr3"}],"resize":[{"bus":"scsi","index":0,"size":32}]}

  tasks:
    - name: インベントリと-eの値から構築内容を決定する
      ansible.builtin.import_role:
        name: provision
        tasks_from: resolve_target_vars

    # ノード種別は「ワーカーかどうか」だけをここで判定する(構築の順番を決めるため)。
    # 値の検証と正規化は呼び出し先(kubernetes ロール)が行う。
    - name: ノード種別と参加先を決定する
      ansible.builtin.set_fact:
        kubernetes_is_agent: >-
          {{ (kubernetes_node_role | default('server', true) | lower)
             in ['agent', 'worker', 'node'] }}
        # 自分自身を指している場合(グループ変数で全ノードに同じ値を渡した場合)は
        # 1台目のコントロールプレーンなので参加先を持たない
        kubernetes_join_ip: >-
          {{ kubernetes_server_ip | default('', true)
             if (kubernetes_server_ip | default('', true)) != pv_vm_ip
             else '' }}
        # 参加先へSSH接続するときのユーザー・鍵(未指定なら自分と同じもの)
        kubernetes_join_ssh_user: >-
          {{ kubernetes_server_ssh_user | default(pv_vm_ssh_user, true) }}
        kubernetes_join_ssh_prikey: >-
          {{ kubernetes_server_ssh_prikey | default(pv_vm_ssh_prikey, true) }}

    # NICが2枚ある構成では、ノード間通信(kubelet・flannel・etcd)を占有ネットワーク側に
    # 寄せる。SSH接続先(kubernetes_server_ip)は管理ネットワーク側のまま変えないため、
    # APIサーバーへの接続先だけを kubernetes_server_node_ip として別に渡す。
    #
    # 参加先の占有ネットワーク側IPは、この実行に含まれていればそのホストから取る。
    # 既存クラスタにワーカーだけを足す場合は -e で直接指定する。
    - name: 占有ネットワークを使う場合のクラスタ通信先を決定する
      ansible.builtin.set_fact:
        # 明示指定があればそれを優先する(自分自身の値を参照して既存値を残している)
        kubernetes_node_ip: >-
          {{ kubernetes_node_ip | default(pv_vm_cluster_ip, true) }}
        # 自分が占有ネットワークに繋がっていないなら、参加先もそちら側にはしない
        # (届かないアドレスを指してしまうため)
        kubernetes_server_node_ip: >-
          {{
            kubernetes_server_node_ip
            | default(hostvars[kubernetes_join_ip].pv_vm_cluster_ip
                      if ((pv_vm_cluster_ip | length > 0)
                          and (kubernetes_join_ip in ansible_play_hosts)) else '', true)
          }}
      when: (kubernetes_join_ip | length > 0) or (pv_vm_cluster_ip | length > 0)

    # 共通フローが登録順にVMを登録し、呼び出し先が serial: 1 で登録順に処理するため、
    # コントロールプレーンを先にする(ワーカーは参加先からトークンを取得するため)
    - name: VM内セットアップの順番を決める
      ansible.builtin.set_fact:
        pv_vm_setup_order: >-
          {{ pv_k8s_servers
             + (ansible_play_hosts | reject('in', pv_k8s_servers) | list) }}
      vars:
        pv_k8s_servers: >-
          {{ ansible_play_hosts | map('extract', hostvars)
             | rejectattr('kubernetes_is_agent', 'truthy')
             | map(attribute='inventory_hostname') | list }}

    # 占有ネットワークのIPを指定していても、NICが1枚しか無ければ付ける先が無い。
    # テンプレートは net0 だけを持つため、net1 は vm_hardware で足す必要がある
    - name: 占有ネットワーク用NICの指定漏れで停止する
      ansible.builtin.assert:
        that:
          - 1 in ((vm_hardware | default({})).network | default([]) | map(attribute='index') | map('int'))
        fail_msg: >-
          vm_cluster_ipv4({{ pv_vm_cluster_ipv4 }})を指定していますが、
          vm_hardware に2枚目のNIC(network の index: 1)がありません。
          テンプレートは net0 の1枚しか持たないため、占有ネットワークに繋ぐNICを
          vm_hardware={"network":[{"index":0,"model":"virtio","bridge":"vmbr2"},
          {"index":1,"model":"virtio","bridge":"vmbr3"}]} のように追加してください。
        quiet: true
      when: pv_vm_cluster_ipv4 | length > 0

    - name: 構築内容を表示してProxmox操作用に登録する
      ansible.builtin.import_role:
        name: provision
        tasks_from: finalize_targets

# テンプレート構築 → VM作成 → ハードウェア調整 → 動作設定 → cloud-init → 起動 → SSH待ち
# (VM内セットアップの登録順は pv_vm_setup_order で指定済み)
- name: VMを構築して起動する
  ansible.builtin.import_playbook: _provision_vm.yml

# トークンの取得とReady確認のため、参加先のコントロールプレーンにもSSH接続する。
# このrunで作らない既存クラスタに参加する場合があるため、対象外でも登録しておく
# (このrunで作る場合は共通フローで登録済みなので、接続情報を上書きしない)。
- name: 既存クラスタの参加先を登録する
  hosts: pv_targets
  gather_facts: false
  connection: local

  tasks:
    - name: このrunで構築しない参加先を登録する
      ansible.builtin.add_host:
        name: "{{ hostvars[item].kubernetes_join_ip }}"
        groups: kubernetes_servers
        ansible_user: "{{ hostvars[item].kubernetes_join_ssh_user }}"
        ansible_ssh_private_key_file: "{{ hostvars[item].kubernetes_join_ssh_prikey }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      when:
        - (hostvars[item].kubernetes_join_ip | length) > 0
        - hostvars[item].kubernetes_join_ip not in ansible_play_hosts

# VM内部のセットアップ。コントロールプレーン → ワーカーの順に1台ずつ実行される。
# k3sの設定(kubernetes_node_role等)はインベントリや-eの値がそのまま渡る。
- name: VM内部をセットアップする
  ansible.builtin.import_playbook: ../vms/kubernetes.yml
  vars:
    # 呼び出し先のlocalhostプレイでも参照されるため、
    # 各VMでは自分の値、localhostでは登録済みホストの先頭の値を使う
    vm_ip: "{{ pv_vm_ip | default(hostvars[groups['vms'] | first].pv_vm_ip) }}"
    vm_ssh_user: >-
      {{ pv_vm_ssh_user | default(hostvars[groups['vms'] | first].pv_vm_ssh_user) }}
    vm_ssh_prikey: >-
      {{ pv_vm_ssh_prikey | default(hostvars[groups['vms'] | first].pv_vm_ssh_prikey) }}

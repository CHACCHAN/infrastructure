# Supabase(セルフホスト)のVMを、テンプレート構築からVM内部のセットアップまで
# 一気通貫で構築します。
# 処理は自前で持たず、共通フロー(provisionロールと _provision_vm.yml)を通じて
# playbooks/proxmox/ と playbooks/vms/ のplaybookを順番に呼ぶだけです。
#
# 対象の決め方は2通り(以降の処理は共通で、対象は pv_targets に集約されます):
#   インベントリ版(既定)  : inventories/lab/supabase.yml のホスト。--limit で選択
#   手動指定版(manual=true): -e で指定した1台のみ(インベントリが空なら自動でこちら)
#
# 共通フローで使う変数は pv_ 接頭辞(provision)にしています。Supabase本体の設定は
# supabase_ 接頭辞でそのまま最後の手順へ渡るため、名前が混ざらないよう分けています。
#
# SupabaseのAPIキーと大半のパスワードは公式スクリプトで自動生成され、VM内の .env に保存される。
# 例外はダッシュボードのログインパスワードで、../../vault/supabase.yml の
# vault_supabase_user_password を使う(未設定なら従来どおり自動生成される)。
---
- name: インベントリから構築対象を選ぶ
  hosts: supabase
  gather_facts: false
  connection: local

  vars:
    pv_group: supabase

  tasks:
    - name: インベントリのホストを構築対象に加える
      ansible.builtin.import_role:
        name: provision
        tasks_from: select_inventory_targets

- name: 手動指定の構築対象を追加する
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    pv_group: supabase

  tasks:
    - name: 手動指定されたVMを構築対象に加える
      ansible.builtin.import_role:
        name: provision
        tasks_from: select_manual_target

- name: 構築対象を確認する
  hosts: pv_targets
  gather_facts: false
  connection: local

  # 登録するホストにProxmoxへの接続情報を持たせるため、呼び出し先と同じvaultを読む。
  # ダッシュボードのログインパスワードも同じタイミングで読み込む
  # (どちらも --ask-vault-pass で復号)
  vars_files:
    - ../../vault/proxmox.yml
    - ../../vault/supabase.yml

  vars:
    pv_service_summary: >-
      公開URL {{ supabase_public_url
                 | default('http://' ~ pv_vm_ip ~ ':'
                           ~ (supabase_kong_http_port | default(8000) | string), true) }}
      / Postgres {{ pv_vm_ip }}:{{ supabase_postgres_port | default(5432) }}
      / 取得元 {{ supabase_ref | default('(ロールの既定)', true) }}
    pv_resize_hint_reason: >-
      Supabaseは11個のコンテナで構成され、イメージだけで数GiB必要なため、
      VM内セットアップの空き容量チェックで中止することになります。
    pv_resize_example: >-
      vm_hardware={"cpu":{"cores":4,"type":"host"},"memory":{"size":8192},"resize":[{"bus":"scsi","index":0,"size":48}]}

  tasks:
    - name: インベントリと-eの値から構築内容を決定する
      ansible.builtin.import_role:
        name: provision
        tasks_from: resolve_target_vars

    # vaultの値をアプリの変数へ渡す。
    # vars_filesはこのプレイの中だけの変数で、最後の手順(別プレイ)からは見えないため、
    # ホストのfactにして持ち回る(factは同じホスト名のまま次のプレイへ引き継がれる)。
    # -e で同じ変数を渡した場合はそちらが優先される(extra varsの方が強いため)。
    #
    # ダッシュボード(Studio)のログインパスワード。vaultに無ければロール側で自動生成される。
    # ロール側は「-eやインベントリの指定 > 既存の.env > 自動生成」の順で採用するため、
    # 構築済みのVMでもここで渡した値に更新される。
    - name: Vaultのダッシュボードパスワードをアプリへ渡す
      ansible.builtin.set_fact:
        supabase_dashboard_password: "{{ vault_supabase_user_password }}"
      no_log: true
      when: (vault_supabase_user_password | default('', true)) | length > 0

    # 上のタスクはvaultのキー名が違っても黙って飛ばされ、
    # 「vaultのパスワードで入れない」ことに構築後まで気づけない。
    # 値は出さずに、どちらを使うかだけ表示する
    - name: ダッシュボードパスワードの取得元を表示する
      ansible.builtin.debug:
        msg: >-
          ダッシュボードのログインパスワードは
          {{ 'vault/supabase.yml の vault_supabase_user_password を使います'
             if ((vault_supabase_user_password | default('', true)) | length > 0)
             else 'vaultに vault_supabase_user_password が無いため自動生成します(既存VMは今の値のまま)' }}。

    - name: 構築内容を表示してProxmox操作用に登録する
      ansible.builtin.import_role:
        name: provision
        tasks_from: finalize_targets

# テンプレート構築 → VM作成 → ハードウェア調整 → 動作設定 → cloud-init → 起動 → SSH待ち
- name: VMを構築して起動する
  ansible.builtin.import_playbook: _provision_vm.yml

# VM内部のセットアップ。
# Supabase本体の設定(supabase_public_url等)はインベントリや-eの値がそのまま渡る。
- name: VM内部をセットアップする
  ansible.builtin.import_playbook: ../vms/supabase.yml
  vars:
    # 呼び出し先のlocalhostプレイでも参照されるため、
    # 各VMでは自分の値、localhostでは登録済みホストの先頭の値を使う
    vm_ip: "{{ pv_vm_ip | default(hostvars[groups['vms'] | first].pv_vm_ip) }}"
    vm_ssh_user: >-
      {{ pv_vm_ssh_user | default(hostvars[groups['vms'] | first].pv_vm_ssh_user) }}
    vm_ssh_prikey: >-
      {{ pv_vm_ssh_prikey | default(hostvars[groups['vms'] | first].pv_vm_ssh_prikey) }}

# 起動済みのDebian 13 VMにSSH接続し、k3sでKubernetesのノードを構築します。
# VM内部の設定のみを行い、Proxmoxホスト側の操作は一切行いません。
#
#   コントロールプレーン: -e "kubernetes_node_role=server"
#   ワーカー            : -e "kubernetes_node_role=agent kubernetes_server_ip=<コントロールプレーンのIP>"
#
# ワーカーは参加用トークンをコントロールプレーンから自動取得します。そのため
# 「構築するワーカー」と「参加先のコントロールプレーン」の2台にSSH接続します。
# ログインユーザーや秘密鍵が違う場合は kubernetes_server_ssh_user / kubernetes_server_ssh_prikey
# で参加先の分だけ個別に指定できます。
---
- name: 接続先のVMホストを登録する
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # 参加先のコントロールプレーン。ワーカーでは必須で、コントロールプレーンに
    # 指定した場合は2台目以降(HA構成)として参加する。
    # 自分自身を指している場合は1台目の構築なので接続先には加えない
    kubernetes_join_target: >-
      {{ kubernetes_server_ip | default('', true)
         if (kubernetes_server_ip | default('', true)) != (vm_ip | default('', true))
         else '' }}

  tasks:
    - name: 対象VMをインベントリに登録して疎通を確認する
      ansible.builtin.import_role:
        name: vm_connect

    # トークンの取得(sudoでnode-tokenを読む)と、ワーカーがReadyになったかの確認に使う
    - name: 参加先のコントロールプレーンを登録する
      ansible.builtin.add_host:
        name: "{{ kubernetes_join_target }}"
        groups: kubernetes_servers
        ansible_user: "{{ kubernetes_server_ssh_user | default(vm_ssh_user, true) }}"
        ansible_ssh_private_key_file: "{{ kubernetes_server_ssh_prikey | default(vm_ssh_prikey, true) }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      changed_when: false
      when: kubernetes_join_target | length > 0

    - name: 参加先のコントロールプレーンが起動していることを確認する
      when: kubernetes_join_target | length > 0
      block:
        - name: コントロールプレーンのSSHポート(22)の疎通を確認する
          ansible.builtin.wait_for:
            host: "{{ kubernetes_join_target }}"
            port: 22
            timeout: 10
            state: started
      rescue:
        - name: コントロールプレーン未起動として処理を終了する
          ansible.builtin.fail:
            msg: >-
              参加先のコントロールプレーン {{ kubernetes_join_target }}:22 に接続できませんでした。
              参加用トークンをそのVMから取得するため、構築中はコントロールプレーンが
              起動している必要があります(VMの起動は playbooks/proxmox/ 側の管轄です)。

- name: Kubernetes(k3s)のノードを構築する
  hosts: vms
  gather_facts: true
  # 単体実行では対象は1台だけなので影響はない。proxmox/ からまとめて呼ばれたときに
  # 「コントロールプレーン → ワーカー」の順で1台ずつ構築させるための指定
  # (ワーカーは参加先が出来上がっていないとトークンを取得できないため)。
  serial: 1

  roles:
    - kubernetes

  # カーネル更新の反映とswap無効化後の状態を確かめるため最後に再起動する。
  # k3sはsystemdで自動起動するので、再起動後に復帰することまで確認する。
  post_tasks:
    - name: 構成を反映するためVMを再起動する
      ansible.builtin.import_role:
        name: common
        tasks_from: reboot_vm

    - name: 再起動後にk3sサービスが復帰することを確認する
      ansible.builtin.systemd:
        name: "{{ kubernetes_service_name }}"
      become: true
      register: kubernetes_service_after_reboot
      retries: 30
      delay: 10
      until: kubernetes_service_after_reboot.status.ActiveState == 'active'
      when: vm_reboot_after_setup | default(true) | bool

    - name: 実行元の端末からAPIサーバーに接続できることを確認する
      ansible.builtin.wait_for:
        host: "{{ vm_ip }}"
        port: "{{ kubernetes_server_port }}"
        timeout: 300
        state: started
      delegate_to: localhost
      become: false
      when: kubernetes_role_resolved == 'server'

    - name: 構築結果と次の手順を表示する
      ansible.builtin.debug:
        msg: "{{ kubernetes_summary_server if kubernetes_role_resolved == 'server' else kubernetes_summary_agent }}"
      vars:
        kubernetes_summary_server:
          - "コントロールプレーン {{ kubernetes_node_name_resolved }} ({{ vm_ip }}) を構築しました"
          - "VM内での操作: ssh -i <秘密鍵> {{ vm_ssh_user }}@{{ vm_ip }} 'kubectl get nodes -o wide'"
          - "手元にkubeconfigを持ってくる:
             scp -i <秘密鍵> {{ vm_ssh_user }}@{{ vm_ip }}:.kube/config ~/.kube/config-{{ kubernetes_node_name_resolved }}"
          - "ワーカーを追加する: ansible-playbook playbooks/kubernetes.yml -vv
             -e \"vm_ip=<ワーカーのIP> vm_ssh_user=<SSHユーザ名> vm_ssh_prikey=~/.ssh/<秘密鍵>
             kubernetes_node_role=agent kubernetes_server_ip={{ vm_ip }}\""
        kubernetes_summary_agent:
          - "ワーカー {{ kubernetes_node_name_resolved }} ({{ vm_ip }}) を
             https://{{ kubernetes_server_ip }}:{{ kubernetes_server_port }} のクラスタに参加させました"
          - "確認: コントロールプレーン {{ kubernetes_server_ip }} で kubectl get nodes -o wide"

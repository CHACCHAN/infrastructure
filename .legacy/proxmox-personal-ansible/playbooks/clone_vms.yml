---
- name: テンプレートからクローンしcloud-init/tagsを適用
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/vms.yml
    - ../vars/pve_api_defaults.yml
  module_defaults:
    ansible.builtin.uri: "{{ pve_uri_defaults }}"

  tasks:
    - name: 各VMを作成
      ansible.builtin.include_tasks: tasks/clone_one_vm.yml
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"

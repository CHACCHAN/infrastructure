---
- name: 既にクローン済みか確認
  ansible.builtin.uri:
    url: "{{ proxmox_api_host }}/api2/json/nodes/{{ item.node }}/qemu/{{ item.vmid }}/status/current"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200, 500]
  register: existing_vm

- name: クローン実行
  ansible.builtin.uri:
    url: "{{ proxmox_api_host }}/api2/json/nodes/{{ template_node }}/qemu/{{ template_vmid }}/clone"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    body_format: json
    body:
      newid: "{{ item.vmid }}"
      name: "{{ item.name }}"
      target: "{{ item.node }}"
      full: 1
    validate_certs: "{{ proxmox_validate_certs }}"
  register: clone_task
  when: existing_vm.status != 200

- name: クローン完了待ち
  ansible.builtin.uri:
    url: "{{ proxmox_api_host }}/api2/json/nodes/{{ template_node }}/tasks/{{ clone_task.json.data }}/status"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: clone_status
  until: clone_status.json.data.status == "stopped"
  retries: 60
  delay: 3
  when: existing_vm.status != 200

- name: ネットワーク・cloud-init・tagsを反映
  ansible.builtin.uri:
    url: "{{ proxmox_api_host }}/api2/json/nodes/{{ item.node }}/qemu/{{ item.vmid }}/config"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    body_format: json
    body: >-
      {{
        {
          'ciuser': item.ciuser,
          'sshkeys': item.ssh_public_key | urlencode,
          'ipconfig0': item.ipconfig0,
          'net0': 'virtio,bridge=' ~ item.net0_bridge,
          'tags': item.tags
        }
        | combine({'net1': 'virtio,bridge=' ~ item.net1_bridge} if item.net1_bridge is defined else {})
        | combine({'ipconfig1': item.ipconfig1} if item.ipconfig1 is defined else {})
      }}
    validate_certs: "{{ proxmox_validate_certs }}"
  when: existing_vm.status != 200

- name: VM起動
  ansible.builtin.uri:
    url: "{{ proxmox_api_host }}/api2/json/nodes/{{ item.node }}/qemu/{{ item.vmid }}/status/start"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  when: existing_vm.status != 200

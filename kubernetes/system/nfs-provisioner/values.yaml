# NFS 動的プロビジョナ (TrueNAS の NFS 共有を StorageClass にする)
# chart: nfs-subdir-external-provisioner (バージョンは helmfile.yaml で固定)
#
# 前提: TrueNAS 側で下記のパスが NFS 共有されていること。

nfs:
  server: 10.10.20.10
  path: /mnt/Storage/Kubernetes

storageClass:
  create: true
  name: truenas-nfs

  # 既定 StorageClass は k3s 同梱の local-path のままにする
  defaultClass: false

  # PVC を消しても NFS 上のデータは残す
  reclaimPolicy: Retain
  archiveOnDelete: true

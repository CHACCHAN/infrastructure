# Namespace はここに集約する。アプリ側のディレクトリでは作らない。
#
# どの namespace が存在するかを 1 箇所で見渡せるようにするため。
# kustomize は kind ごとの固定順で適用し、Namespace は最初に来るので、
# 同じ apply の中で namespace とその中身を同時に作れる。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cert-manager.yaml
  - cloudflare.yaml
  - platform.yaml
  - sandbox.yaml
  - storage.yaml

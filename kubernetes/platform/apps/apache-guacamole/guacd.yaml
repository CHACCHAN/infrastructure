# guacd — Guacamole のプロキシデーモン。
#
# RDP / VNC / SSH を実際に喋る側。WebUI (guacamole.yaml) から
# 4822/TCP で呼ばれるだけで、外には出さない (Ingress を持たない)。
#
# **状態を持たない。** 接続定義もユーザも PostgreSQL 側にあるので、
# この Pod は落ちても作り直せばよい (稼働中のセッションは切れる)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: platform
  labels:
    app.kubernetes.io/name: guacd
    app.kubernetes.io/component: workload
    app.kubernetes.io/part-of: apache-guacamole
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  # PVC を持たないのでローリング更新で問題ない。
  # ただし更新中は稼働中のセッションが切れる。
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      # selector は作成後に変更できない。ここは最小限に固定する。
      app.kubernetes.io/name: guacd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guacd
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        # イメージの Dockerfile が uid/gid 1000 の guacd ユーザで動かしている。
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: guacd
          # latest は使わない。**guacamole.yaml のタグと必ず揃えること。**
          # プロトコルは両者の間で互換性が保証されていない。
          image: guacamole/guacd:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: guacd
              containerPort: 4822
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Tokyo
            # debug にすると接続ごとの詳細が出る。切り分けのとき以外は info。
            - name: GUACD_LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            # RDP / VNC のデコードと再エンコードをここでやるので、
            # 同時接続が増えると CPU を使う。上限は緩めにしておく。
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # guacd は HTTP を喋らないので TCP で見る。
          # (イメージの HEALTHCHECK も nc -z 127.0.0.1 4822 相当)
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: platform
  labels:
    app.kubernetes.io/name: guacd
    app.kubernetes.io/component: workload
    app.kubernetes.io/part-of: apache-guacamole
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: guacd
  ports:
    - name: guacd
      protocol: TCP
      port: 4822
      targetPort: guacd

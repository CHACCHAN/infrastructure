# AWX — ansible.cc-chacchan.com
#
# ここで kustomize が扱うのは Ingress だけ。
#
# ワークロード本体は AWX Operator が作る。Operator と AWX リソースは
# 上流 Helm チャート由来で、values.yaml を使って
# helm template -> kubectl apply で入れる。
# 手順は同ディレクトリの README.md を参照。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress.yaml

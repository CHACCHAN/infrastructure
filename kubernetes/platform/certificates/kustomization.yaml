# ClusterIssuer と Certificate。
#
# cert-manager 本体は system/cert-manager/ (上流 Helm チャート) で入れる。
# これらは cert-manager の CRD に依存するので、新規構築時は
# cert-manager が起動しきってから適用すること
# (リポジトリルートの README.md「新規構築」を参照)。
#
# 前提: cert-manager namespace に Secret cloudflare-api-token があること。
#   kubectl -n cert-manager create secret generic cloudflare-api-token \
#     --from-literal=api-token='<トークン>'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - clusterissuer-staging.yaml
  - clusterissuer-production.yaml
  - wildcard-certificate.yaml

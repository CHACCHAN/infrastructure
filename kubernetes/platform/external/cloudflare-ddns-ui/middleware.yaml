# Authentik の outpost 経路に付ける X-Forwarded-* の強制付与。
#
# 本体側 (Ingress cloudflare-ddns-ui) には付けない。
# 本体は forwardAuth Middleware を通すので、そちらが必要なヘッダを面倒見る。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-ddns-ui-authentik-outpost-forwarded-https
  namespace: platform
  labels:
    app.kubernetes.io/name: cloudflare-ddns-ui
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
      X-Forwarded-Port: "443"
      X-Forwarded-Host: ddns.cc-chacchan.com

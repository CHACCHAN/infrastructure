apiVersion: v1
kind: Service
metadata:
  name: cloudflare-ddns-ui-external
  namespace: platform
  labels:
    app.kubernetes.io/name: cloudflare-ddns-ui
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: "http"
spec:
  # selector を書かない。エンドポイントは下の EndpointSlice で手動管理する。
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: cloudflare-ddns-ui-external
  namespace: platform
  labels:
    app.kubernetes.io/name: cloudflare-ddns-ui
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
    # このラベルで上の Service と紐付く。値は Service 名と完全に一致させること。
    kubernetes.io/service-name: cloudflare-ddns-ui-external
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8080
endpoints:
  - addresses:
      - "172.16.11.4"
    # クラスタ外ホストの死活は kube-proxy が判定できないため、常に Ready 扱いにする。
    conditions:
      ready: true

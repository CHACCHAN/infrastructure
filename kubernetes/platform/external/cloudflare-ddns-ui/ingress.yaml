# 本体。Authentik の forwardAuth を通して保護する。
#
# 依存: platform/external/authentik/ の Middleware authentik-forward-auth
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-ddns-ui
  namespace: platform
  labels:
    app.kubernetes.io/name: cloudflare-ddns-ui
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # HTTPS 専用で公開する。平文 HTTP (:80) では 404 になる。
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "platform-authentik-forward-auth@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "ddns.cc-chacchan.com"
      # platform/certificates/ の Certificate が作るワイルドカード証明書
      secretName: cc-chacchan-wildcard-tls
  rules:
    - host: "ddns.cc-chacchan.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: cloudflare-ddns-ui-external
                port:
                  name: http
---
# Authentik の outpost 用コールバック経路。
#
# 同じホスト名だが、こちらは forwardAuth を通さず素通しする
# (認証のリダイレクト先そのものなので、認証をかけるとループする)。
# Traefik はパスが長い方のルータを優先するため、
# /outpost.goauthentik.io へのリクエストはこちらに一致する。
#
# 転送先が cloudflare-ddns-ui ではなく authentik-external である点に注意。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-ddns-ui-authentik-outpost
  namespace: platform
  labels:
    app.kubernetes.io/name: cloudflare-ddns-ui
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "platform-cloudflare-ddns-ui-authentik-outpost-forwarded-https@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "ddns.cc-chacchan.com"
      secretName: cc-chacchan-wildcard-tls
  rules:
    - host: "ddns.cc-chacchan.com"
      http:
        paths:
          - path: "/outpost.goauthentik.io"
            pathType: Prefix
            backend:
              service:
                name: authentik-external
                port:
                  name: http

# クラスタ外 (独立 VM 等) で動いているサービスの Traefik 経路。
#
# authentik は他サービスが参照する forwardAuth Middleware を持つので先頭に置く。
# ただし kustomize は「並び順 = 適用順」ではない (kind ごとの固定順で適用される)ため、
# これは読む人向けの整理であって依存解決ではない。
# 新規構築時の順序についてはリポジトリルートの README.md「新規構築」を参照。
#
# _example/ はひな形なので意図的に含めていない。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - authentik
  - cloudflare-ddns-ui
  - proxmox
  - supabase
  - technitium
  - truenas
  - wg-easy

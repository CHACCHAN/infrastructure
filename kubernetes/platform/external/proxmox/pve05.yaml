# Proxmox VE ノード 05 — 172.16.11.15:8006 (自己署名 HTTPS)
#
# ノードを増やすときはこのファイルをコピーして、
# 名前・IP・ホスト名の 3 か所を書き換え、kustomization.yaml に 1 行足す。
apiVersion: v1
kind: Service
metadata:
  name: pve05-external
  namespace: platform
  labels:
    app.kubernetes.io/name: pve05
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # WebUI は HTTPS (8006) で待ち受けている。
    traefik.ingress.kubernetes.io/service.serversscheme: "https"
    # 証明書が自己署名なので、検証をスキップする ServersTransport を使う。
    traefik.ingress.kubernetes.io/service.serverstransport: "platform-proxmox-transport@kubernetescrd"
spec:
  # selector を書かない。エンドポイントは下の EndpointSlice で手動管理する。
  type: ClusterIP
  ports:
    - name: https
      protocol: TCP
      port: 8006
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pve05-external
  namespace: platform
  labels:
    app.kubernetes.io/name: pve05
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
    # このラベルで上の Service と紐付く。値は Service 名と完全に一致させること。
    kubernetes.io/service-name: pve05-external
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 8006
endpoints:
  - addresses:
      - "172.16.11.15"
    # クラスタ外ホストの死活は kube-proxy が判定できないため、常に Ready 扱いにする。
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pve05
  namespace: platform
  labels:
    app.kubernetes.io/name: pve05
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # HTTPS 専用で公開する。平文 HTTP (:80) では 404 になる。
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "pve05.cc-chacchan.com"
      # platform/certificates/ の Certificate が作るワイルドカード証明書
      secretName: cc-chacchan-wildcard-tls
  rules:
    - host: "pve05.cc-chacchan.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: pve05-external
                port:
                  name: https

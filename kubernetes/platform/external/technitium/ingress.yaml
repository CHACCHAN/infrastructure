# 管理 WebUI — dns.cc-chacchan.com -> 172.16.11.3:5380
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: technitium-dns-web
  namespace: platform
  labels:
    app.kubernetes.io/name: technitium-dns
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # HTTPS 専用で公開する。平文 HTTP (:80) では 404 になる。
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "platform-technitium-dns-web-forwarded-https@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "dns.cc-chacchan.com"
      # platform/certificates/ の Certificate が作るワイルドカード証明書
      secretName: cc-chacchan-wildcard-tls
  rules:
    - host: "dns.cc-chacchan.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: technitium-dns-external
                port:
                  name: web
---
# DNS over HTTPS — doh.cc-chacchan.com -> 172.16.11.3:8053
#
# 同じ Service の別ポート (doh) を指している点に注意。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: technitium-dns-doh
  namespace: platform
  labels:
    app.kubernetes.io/name: technitium-dns
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "doh.cc-chacchan.com"
      secretName: cc-chacchan-wildcard-tls
  rules:
    - host: "doh.cc-chacchan.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: technitium-dns-external
                port:
                  name: doh

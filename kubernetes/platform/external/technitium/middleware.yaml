# WebUI は自身の URL 生成に X-Forwarded-* を使うため付与する。
#
# DoH (doh.cc-chacchan.com) 側にはこの Middleware を付けない。
# DoH は DNS の wire format をそのまま運ぶだけで、ヘッダ書き換えは不要なため。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: technitium-dns-web-forwarded-https
  namespace: platform
  labels:
    app.kubernetes.io/name: technitium-dns
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
      X-Forwarded-Port: "443"
      X-Forwarded-Host: dns.cc-chacchan.com

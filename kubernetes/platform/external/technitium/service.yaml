# Technitium DNS の HTTP 系ポートだけを公開する。
# DNS 本体 (53/UDP) は Traefik を通さず、クライアントが直接 172.16.11.3 を引く。
#
# 1 つの Service に 2 ポート持たせ、Ingress 側でどちらを使うか選ぶ。
apiVersion: v1
kind: Service
metadata:
  name: technitium-dns-external
  namespace: platform
  labels:
    app.kubernetes.io/name: technitium-dns
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: "http"
spec:
  # selector を書かない。エンドポイントは下の EndpointSlice で手動管理する。
  type: ClusterIP
  ports:
    - name: doh
      protocol: TCP
      port: 8053
      targetPort: 8053
    - name: web
      protocol: TCP
      port: 5380
      targetPort: 5380
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: technitium-dns-external
  namespace: platform
  labels:
    app.kubernetes.io/name: technitium-dns
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
    # このラベルで上の Service と紐付く。値は Service 名と完全に一致させること。
    kubernetes.io/service-name: technitium-dns-external
addressType: IPv4
ports:
  - name: doh
    protocol: TCP
    port: 8053
  - name: web
    protocol: TCP
    port: 5380
endpoints:
  - addresses:
      - "172.16.11.3"
    # クラスタ外ホストの死活は kube-proxy が判定できないため、常に Ready 扱いにする。
    conditions:
      ready: true

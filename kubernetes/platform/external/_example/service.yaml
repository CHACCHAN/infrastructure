# クラスタ外で動いているサービスを指す Service + EndpointSlice。
#
# k8s には「クラスタ外の IP を指す Service」を素直に書く方法がないため、
# セレクタなしの Service と、手書きの EndpointSlice を組み合わせる。
apiVersion: v1
kind: Service
metadata:
  name: myapp-external
  namespace: platform
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # Traefik がバックエンドへ繋ぐときのスキーム。
    # 自己署名 HTTPS の場合は "https" にして serverstransport も足す
    # (README.md の「バックエンドが自己署名 HTTPS の場合」を参照)。
    traefik.ingress.kubernetes.io/service.serversscheme: "http"
spec:
  # selector を書かない。エンドポイントは下の EndpointSlice で手動管理する。
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: myapp-external
  namespace: platform
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
    # このラベルで上の Service と紐付く。値は Service 名と完全に一致させること。
    kubernetes.io/service-name: myapp-external
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8080
endpoints:
  - addresses:
      - "172.16.11.99"
    # クラスタ外ホストの死活は kube-proxy が判定できないため、常に Ready 扱いにする。
    # バックエンドが落ちているときは Traefik が 502 を返す。
    conditions:
      ready: true

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp
  namespace: platform
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # HTTPS 専用で公開する。これを消すと平文 HTTP (:80) でも見えてしまう。
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    # Middleware を通す場合はここに書く (カンマ区切りで複数可)。
    # 名前は必ず <namespace>-<Middleware 名>@kubernetescrd の形になる。
    # traefik.ingress.kubernetes.io/router.middlewares: "platform-authentik-forward-auth@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "myapp.cc-chacchan.com"
      # platform/certificates/ の Certificate が作るワイルドカード証明書。
      # platform 以外の namespace で公開する場合は、その namespace 用の
      # Certificate を別途作ること (TLS Secret は namespace をまたげない)。
      secretName: cc-chacchan-wildcard-tls
  rules:
    - host: "myapp.cc-chacchan.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: myapp-external
                port:
                  name: http

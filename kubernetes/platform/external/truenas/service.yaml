apiVersion: v1
kind: Service
metadata:
  name: truenas-external
  namespace: platform
  labels:
    app.kubernetes.io/name: truenas
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: "https"
    traefik.ingress.kubernetes.io/service.serverstransport: "platform-truenas-transport@kubernetescrd"
spec:
  # selector を書かない。エンドポイントは下の EndpointSlice で手動管理する。
  type: ClusterIP
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas-external
  namespace: platform
  labels:
    app.kubernetes.io/name: truenas
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
    # このラベルで上の Service と紐付く。値は Service 名と完全に一致させること。
    kubernetes.io/service-name: truenas-external
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses:
      - "172.16.11.10"
    # クラスタ外ホストの死活は kube-proxy が判定できないため、常に Ready 扱いにする。
    conditions:
      ready: true

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: truenas
  namespace: platform
  labels:
    app.kubernetes.io/name: truenas
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # HTTPS 専用で公開する。平文 HTTP (:80) では 404 になる。
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "nas.cc-chacchan.com"
      # platform/certificates/ の Certificate が作るワイルドカード証明書
      secretName: cc-chacchan-wildcard-tls
  rules:
    - host: "nas.cc-chacchan.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: truenas-external
                port:
                  name: https

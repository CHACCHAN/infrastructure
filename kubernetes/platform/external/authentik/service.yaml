# クラスタ外で動いている Authentik (172.16.11.2) を指す Service。
#
# k8s には「クラスタ外の IP を指す Service」を素直に書く方法がないため、
# セレクタなしの Service と、手書きの EndpointSlice を組み合わせる。
# セレクタがないので kube-proxy は Pod を探さず、EndpointSlice に
# 書いた宛先へそのまま転送する。
apiVersion: v1
kind: Service
metadata:
  name: authentik-external
  namespace: platform
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # Traefik がバックエンドへ繋ぐときのスキーム。Authentik は平文 HTTP で待ち受ける。
    traefik.ingress.kubernetes.io/service.serversscheme: "http"
spec:
  # selector を書かない。エンドポイントは下の EndpointSlice で手動管理する。
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 9000
      targetPort: 9000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: authentik-external
  namespace: platform
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
    # このラベルで上の Service と紐付く。値は Service 名と完全に一致させること。
    kubernetes.io/service-name: authentik-external
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 9000
endpoints:
  - addresses:
      - "172.16.11.2"
    # クラスタ外ホストの死活は kube-proxy が判定できないため、常に Ready 扱いにする。
    # バックエンドが落ちているときは Traefik が 502 を返す。
    conditions:
      ready: true

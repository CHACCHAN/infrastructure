apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik
  namespace: platform
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # web は Cloudflare Tunnel (cloudflared -> :80) 用、
    # websecure は LAN 内から Traefik :443 へ直接アクセスする用。
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "platform-authentik-forwarded-https@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "auth.cc-chacchan.com"
      # platform/certificates/ の Certificate が作るワイルドカード証明書
      secretName: cc-chacchan-wildcard-tls
  rules:
    - host: "auth.cc-chacchan.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: authentik-external
                port:
                  name: http

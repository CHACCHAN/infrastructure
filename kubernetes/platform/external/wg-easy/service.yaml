# WG-Easy の WebUI (51821/TCP) だけを公開する。
# VPN 本体 (UDP 51820) は Traefik を通さず、ルータで直接ポート開放している。
apiVersion: v1
kind: Service
metadata:
  name: wg-easy-external
  namespace: platform
  labels:
    app.kubernetes.io/name: wg-easy
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: "http"
spec:
  # selector を書かない。エンドポイントは下の EndpointSlice で手動管理する。
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 51821
      targetPort: 51821
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: wg-easy-external
  namespace: platform
  labels:
    app.kubernetes.io/name: wg-easy
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
    # このラベルで上の Service と紐付く。値は Service 名と完全に一致させること。
    kubernetes.io/service-name: wg-easy-external
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 51821
endpoints:
  - addresses:
      - "172.16.11.5"
    # クラスタ外ホストの死活は kube-proxy が判定できないため、常に Ready 扱いにする。
    conditions:
      ready: true

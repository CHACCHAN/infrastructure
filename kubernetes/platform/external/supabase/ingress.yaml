# Authentik の outpost 用コールバック経路。
#
# 同じホスト名だが、こちらは forwardAuth を通さず素通しする
# (認証のリダイレクト先そのものなので、認証をかけるとループする)。
# Traefik はパスが長い方のルータを優先するため、
# /outpost.goauthentik.io へのリクエストはこちらに一致する。
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supabase-authentik-outpost
  namespace: platform
  labels:
    app.kubernetes.io/name: supabase
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "platform-supabase-forwarded-https@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "supabase.cc-chacchan.com"
      secretName: cc-chacchan-wildcard-tls
  rules:
    - host: "supabase.cc-chacchan.com"
      http:
        paths:
          - path: "/outpost.goauthentik.io"
            pathType: Prefix
            backend:
              service:
                name: authentik-external # Authentikのサービスに繋ぎに行く
                port:
                  name: http
---
# Supabase Studio ダッシュボード
# Cloudflare Tunnelでは公開せず、LAN/WireGuardからのみ利用する。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supabase-studio
  namespace: platform
  labels:
    app.kubernetes.io/name: supabase
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "platform-authentik-forward-auth@kubernetescrd,platform-supabase-forwarded-https@kubernetescrd"
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - "supabase.cc-chacchan.com"
      # platform/certificates/ の Certificate が作るワイルドカード証明書
      secretName: cc-chacchan-wildcard-tls

  rules:
    - host: "supabase.cc-chacchan.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: supabase-external
                port:
                  name: api
---
# Supabase API
#
# Cloudflare Tunnel:
#   Client -> HTTPS -> Cloudflare -> HTTP -> Traefik(web)
#
# LAN:
#   Client -> HTTPS -> Traefik(websecure)
#
# Kongが内部で各サービスへルーティングする。
#
# Studio("/")は公開せず、APIのみ外部公開する。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supabase-api
  namespace: platform
  labels:
    app.kubernetes.io/name: supabase
    app.kubernetes.io/component: external-service
    app.kubernetes.io/managed-by: kustomize
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "platform-api-forwarded-https@kubernetescrd"
spec:
  ingressClassName: traefik

  rules:
    - host: api.cc-chacchan.com
      http:
        paths:
          - path: /rest/v1
            pathType: Prefix
            backend:
              service:
                name: supabase-external
                port:
                  name: api

          - path: /auth/v1
            pathType: Prefix
            backend:
              service:
                name: supabase-external
                port:
                  name: api

          - path: /storage/v1
            pathType: Prefix
            backend:
              service:
                name: supabase-external
                port:
                  name: api

          - path: /realtime/v1
            pathType: Prefix
            backend:
              service:
                name: supabase-external
                port:
                  name: api

          - path: /functions/v1
            pathType: Prefix
            backend:
              service:
                name: supabase-external
                port:
                  name: api

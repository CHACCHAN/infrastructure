# =============================================================================
# Kustomize で管理する部分のエントリポイント。
#
#   kubectl kustomize .      レンダリング結果を見る (クラスタに触らない)
#   kubectl diff -k .        稼働中との差分を見る (クラスタに触らない)
#   kubectl apply -k .       適用する
#
# !! これだけではクラスタは揃わない !!
#
# 上流 Helm チャートで入れる 3 つ (cert-manager / NFS プロビジョナ / Portainer 本体)
# はここに含まれない。Kustomize にチャートを展開する機能がないため、
# helm template で展開して kubectl に流す形にしてある。
#   -> system/README.md
#
# 新規構築の順序は README.md の「新規構築」を参照。
#
# kustomize は resources の並び順ではなく kind ごとの固定順で適用する。
# ここでの並びは読む人向けの整理であって、依存解決ではない。
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespace は最初に集約して定義する
  - namespaces

  # 公開サービスの経路と証明書
  - platform

  # 外部公開の入口 (Cloudflare Tunnel)
  - cloudflare

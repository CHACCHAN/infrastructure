# VLAN13 172.16.13.0/24: Hermes Agent 用の VM(docs/design/hermes.md)
---
hermes:
  vars:
    vlan: 13
  hosts:
    hermes01:
      id: 1
      node: pve02
      # qemu-guest-agent が入っている VM だけ有効にする(docs/design/pve.md)
      pve_vm_agent: 1
      pve_vm_cores: 2
      pve_vm_disk_size: 32
    hermes02:
      id: 2
      node: pve02
      pve_vm_agent: 1
    hermes03:
      id: 3
      node: pve02
      pve_vm_agent: 1
    hermes04:
      id: 4
      node: pve01
      pve_vm_agent: 1
    hermes05:
      id: 5
      node: pve01
      pve_vm_agent: 1
    hermes06:
      id: 6
      node: pve01
      pve_vm_agent: 1
      pve_vm_cores: 8
      pve_vm_memory: 16384
      pve_vm_disk_size: 128
    hermes07:
      id: 7
      node: pve01
      pve_vm_agent: 1
    hermes08:
      id: 8
      node: pve03
      pve_vm_agent: 1
      # pve03 には ssd03 が無いため、空いている ssd02 に置く
      pve_vm_storage: ssd02

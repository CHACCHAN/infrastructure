# VLAN13 172.16.13.0/24: Hermes Agent 用の VM(docs/design/hermes.md)
---
hermes:
  vars:
    vlan: 13
  hosts:
    # ID 1・2 は hermes-security・hermes-platform が使う(下)
    hermes03:
      id: 3
      node: pve02
      # qemu-guest-agent が入っている VM だけ有効にする(docs/design/pve.md)
      pve_vm_agent: 1
    hermes04:
      id: 4
      node: pve01
      pve_vm_agent: 1
    hermes05:
      id: 5
      node: pve01
      pve_vm_agent: 1
    hermes06:
      id: 6
      node: pve01
      pve_vm_agent: 1
      pve_vm_cores: 8
      pve_vm_memory: 16384
      pve_vm_disk_size: 128
    # hermes-security・hermes-platform は pve03 に置く(pve01 の hermes06 が倒れても残るように、ノードを分ける)
    hermes-security:
      id: 1
      node: pve03
      pve_vm_agent: 1
      pve_vm_memory: 6144
      # pve03 には ssd03 が無いため、空いている ssd02 に置く
      pve_vm_storage: ssd02
    hermes-platform:
      id: 2
      node: pve03
      pve_vm_agent: 1
      pve_vm_memory: 6144
      pve_vm_storage: ssd02

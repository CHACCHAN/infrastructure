# k3s ノードの VM に共通する値(ロールの既定値との差分)。
---
pve_vm_memory: 12288
pve_vm_cores: 4
pve_vm_disk_size: 430
# 各ノードの ssd01(docs/design/pve.md)
pve_vm_storage: ssd01
# 予約済みの ID(docs/design/network.md)。VIP は 172.16.<vlan>.<ID>
k3s_api_vip_id: 6
k3s_ingress_vip_id: 5
# ACMEのEmail
cert_manager_acme_email: chacchan.info@gmail.com
# 証明書の発行者
cert_manager_issuer: letsencrypt-production
# Debian の cloud イメージが作る、sudo できる既定のユーザー
ansible_user: debian
# アプリの公開ホスト名。各 k3s_<app> ロールと、Authentik の OIDC クライアントが同じ値を参照する
authentik_host: "auth.{{ lab_domain }}"
openwebui_host: "ai.{{ lab_domain }}"
litellm_host: "litellm.{{ lab_domain }}"
longhorn_host: "longhorn.{{ lab_domain }}"
hermes_host: "hermes.{{ lab_domain }}"
opnsense_host: "opnsense.{{ lab_domain }}"
cliproxy_host: "cliproxy.{{ lab_domain }}"
nextcloud_host: "nextcloud.{{ lab_domain }}"
# クラスタ内から Traefik へ向ける公開ホスト名(Pod からの OIDC の通信などが、外の DNS に頼らないようにする)
k3s_ingress_hosts:
  - "{{ authentik_host }}"
  - "{{ openwebui_host }}"
  - "{{ litellm_host }}"
  - "{{ nextcloud_host }}"
# Cloudflare Tunnel で外部に公開するホスト名。ここに無いアプリは、LAN と VPN からだけ使う。
cloudflared_hosts:
  - "{{ authentik_host }}"
  - "{{ openwebui_host }}"
  - "{{ nextcloud_host }}"
# OpenWebUI の緊急用の管理者(ログイン名。SSO のユーザーのメールアドレスと重ねない。パスワードは vault/openwebui.yml)
openwebui_admin_email: "admin@{{ lab_domain }}"
# 重いワークロード(各アプリの PostgreSQL・Open WebUI・Authentik・LiteLLM・Nextcloud Hub)を、heavy_workloads のノードへ寄せる。寄せるだけで、そのノードが止まればほかのノードでも動く(docs/design/hardware.md)
heavy_workload_nodes: >-
  {{ groups['k3s'] | map('extract', hostvars) | selectattr('heavy_workloads', 'defined')
     | selectattr('heavy_workloads') | map(attribute='inventory_hostname') | list }}
heavy_workload_node_affinity:
  preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: "{{ heavy_workload_nodes }}"
postgresql_values:
  cluster:
    affinity:
      nodeAffinity: "{{ heavy_workload_node_affinity }}"
openwebui_values:
  affinity:
    nodeAffinity: "{{ heavy_workload_node_affinity }}"
nextcloud_values:
  affinity:
    nodeAffinity: "{{ heavy_workload_node_affinity }}"
litellm_values:
  affinity:
    nodeAffinity: "{{ heavy_workload_node_affinity }}"
# Authentik のチャートは、サーバーとワーカーへ共通のノードの条件を渡す(soft が preferred)
authentik_values:
  global:
    affinity:
      nodeAffinity:
        type: soft
        matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: "{{ heavy_workload_nodes }}"
# Traefik でリバースプロキシする、クラスタの外の画面(Proxmox の管理 UI は k3s_lan_proxy が pve グループから導出する)
lan_proxy_extra_services:
  # Hermes Agent の受付(hermes01)の管理画面。ログインは Hermes 側の OIDC(Authentik のクライアント hermes)
  - name: hermes
    host: "{{ hermes_host }}"
    address: "{{ hostvars['hermes01'].ansible_host }}"
    port: 9119
    scheme: http
  # ルータ(OPNsense)の管理画面。ルータはインベントリに無いため、IP を直接書く。ログインは OPNsense 側の OIDC(Authentik のクライアント opnsense)
  - name: opnsense
    host: "{{ opnsense_host }}"
    address: 172.16.5.254
    port: 443
    scheme: https
    insecure_skip_verify: true
# クラスタ内の通信の許可(NetworkPolicy。docs/design/k3s.md)。キーは NetworkPolicy を置く namespace、値は追加で通す namespace。
# どの namespace の Pod も、同じ namespace と Traefik(Ingress があるとき)からは受ける。外向きの通信は絞らない(cloudflared を除く)。
# 値の namespace は検証されないため、各ロールの *_namespace を変えるときは、ここも合わせる。
# ここに無い namespace(kube-system・MetalLB・cert-manager・CloudNativePG のオペレーターなど)には置かない。送信元の IP では絞らない(ルータで一律に管理する)
helm_network_policies:
  authentik: []
  open-webui: []
  nextcloud: []
  # OpenWebUI が、クラスタ内の Service で LiteLLM を使う
  litellm:
    - open-webui
  # LiteLLM だけが、クラスタ内の Service で CLIProxyAPI を使う(CLIProxyAPI の API は外に出さない)
  cliproxy:
    - litellm
  # 各アプリ専用の PostgreSQL(<アプリの namespace>-db)。オペレーターと、DB を使うアプリだけ
  authentik-db:
    - cnpg-system
    - authentik
  open-webui-db:
    - cnpg-system
    - open-webui
  nextcloud-db:
    - cnpg-system
    - nextcloud
  litellm-db:
    - cnpg-system
    - litellm
  # Tunnel のコネクタ。外向きの通信も、ロール(k3s_cloudflared)で絞る
  cloudflared: []
  # Longhorn の管理 UI の Pod だけ(Longhorn 本体は、チャートの NetworkPolicy が絞る)
  longhorn-system: []

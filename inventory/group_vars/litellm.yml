# router 設定のルーティンググループ。グループ名で識別し、宣言したグループだけを置き換える。
litellm_managed_routing_groups:
  - group_name: cc-medium
    models:
      - gpt-6-luna
      - glm-5.3-flash
    routing_strategy: priority
    model_priorities:
      gpt-6-luna: 1
      glm-5.3-flash: 1
  - group_name: cc-simple
    models:
      - nemotron-3.5-super-vl
    routing_strategy: priority
    model_priorities:
      nemotron-3.5-super-vl: 1
  - group_name: cc-complex
    models:
      - swe-2
      - grok-4.7
      - claude-haiku-5.5
    routing_strategy: priority
    model_priorities:
      swe-2: 1
      grok-4.7: 1
      claude-haiku-5.5: 2
  - group_name: cc-max-complex
    models:
      - gpt-6.1-terra
      - kimi-k3.1-pro
    routing_strategy: priority
    model_priorities:
      gpt-6.1-terra: 1
      kimi-k3.1-pro: 2
  - group_name: cc-max-medium
    models:
      - deepseek-v4.1-flash
      - glm-5.3
      - grok-4.7
    routing_strategy: priority
    model_priorities:
      glm-5.3: 2
      grok-4.7: 1
      deepseek-v4.1-flash: 1
  - group_name: cc-max-simple
    models:
      - glm-5.3-flash
      - gpt-6-luna
    routing_strategy: priority
    model_priorities:
      gpt-6-luna: 1
      glm-5.3-flash: 1
  - group_name: cc-reasoning
    models:
      - gpt-6.1-terra
      - kimi-k3.1-pro
    routing_strategy: priority
    model_priorities:
      gpt-6.1-terra: 1
      kimi-k3.1-pro: 1
  - group_name: cc-max-reasoning
    models:
      - gpt-6.1-sol
      - claude-sonnet-5.5
    routing_strategy: priority
    model_priorities:
      gpt-6.1-sol: 1
      claude-sonnet-5.5: 2
  - group_name: cc-judge
    models:
      - swe-2
      - deepseek-v4.1-flash
      - glm-5.3-flash
    routing_strategy: priority
    model_priorities:
      swe-2: 1
      glm-5.3-flash: 2
      deepseek-v4.1-flash: 2
  - group_name: cc-max-judge
    models:
      - swe-2
      - glm-5.3-flash
      - deepseek-v4.1-flash
    routing_strategy: priority
    model_priorities:
      swe-2: 1
      glm-5.3-flash: 2
      deepseek-v4.1-flash: 2

litellm_host: "litellm.{{ lab_domain }}"

# 管理者(proxy_admin)にするグループ。services は Hermes Agent(HermesAgent)が自動で管理するためのグループ
litellm_admin_groups:
  - admins
  - services

litellm_values:
  proxy_config:
    litellm_settings:
      drop_params: true
      # ストリーミングで最初の応答が届くまで、SSE のコメントを送り続け、Cloudflare などの中継の時間切れを防ぐ
      sse_keepalive_ping_interval_seconds: 15
  affinity:
    nodeAffinity: "{{ heavy_workload_node_affinity }}"

litellm_managed_keys:
  - name: client_01
    settings:
      key_alias: Gravitee
      models:
        - all-proxy-models
  - name: client_02
    settings:
      key_alias: HermesAgent
      models:
        - all-proxy-models
  - name: client_03
    settings:
      key_alias: OpenWebUI
      models:
        - all-proxy-models

# 段階のグループが失敗したときに順に試すグループ。上位の段階を先に試し、無ければ下位へ下げる。判定用(*-judge)には置かない
litellm_managed_fallbacks:
  - cc-simple:
      - cc-medium
  - cc-medium:
      - cc-complex
      - cc-simple
  - cc-complex:
      - cc-reasoning
      - cc-medium
  - cc-reasoning:
      - cc-complex
      - cc-medium
  - cc-max-simple:
      - cc-max-medium
  - cc-max-medium:
      - cc-max-complex
      - cc-max-simple
  - cc-max-complex:
      - cc-max-reasoning
      - cc-max-medium
  - cc-max-reasoning:
      - cc-max-complex
      - cc-max-medium

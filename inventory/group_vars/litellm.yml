# LiteLLM 管理 API で更新する既存モデルの宣言。認証情報は vault/ に置く。
---
litellm_managed_models:
  - model_name: cc-max
    litellm_params:
      allow_client_keepalive_override: false
      use_in_pass_through: false
      use_litellm_proxy: false
      use_xai_oauth: false
      merge_reasoning_content_in_choices: false
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          MEDIUM:
            - cc-max-medium
          SIMPLE:
            - cc-max-simple
          COMPLEX:
            - cc-max-complex
          REASONING:
            - cc-max-reasoning
        default_model: cc-max-medium
        classifier_type: llm
        modality_routing: true
        session_affinity: false
        plan_mode_min_tier: MEDIUM
        classification_mode: user_turn
        deployment_affinity: false
        escalation_keywords:
          - LITELLM ESCALATE
        classifier_llm_config:
          model: cc-max-judge
          timeout_ms: 10000
          classification_rubric: agentic
          reasoning_effort: low
        modality_pin_override: false
        max_tokens_from_tier_model: false
        classifier_context_window_size: 3
        classifier_context_budget_chars: 4000
        enable_context_window_escalation: true
        classifier_context_include_assistant_turns: true
      complexity_router_default_model: cc-max-medium
    model_info:
      id: c18835d2-2200-4dc6-8664-fb0c6b7bd10c
  - model_name: cc
    litellm_params:
      allow_client_keepalive_override: false
      use_in_pass_through: false
      use_litellm_proxy: false
      use_xai_oauth: false
      merge_reasoning_content_in_choices: false
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          MEDIUM:
            - cc-medium
          SIMPLE:
            - cc-simple
          COMPLEX:
            - cc-complex
          REASONING:
            - cc-reasoning
        default_model: cc-medium
        classifier_type: llm
        modality_routing: true
        session_affinity: false
        plan_mode_min_tier: MEDIUM
        classification_mode: user_turn
        deployment_affinity: false
        escalation_keywords:
          - LITELLM ESCALATE
        classifier_llm_config:
          model: cc-judge
          timeout_ms: 10000
          classification_rubric: agentic
          reasoning_effort: low
        modality_pin_override: false
        max_tokens_from_tier_model: false
        classifier_context_window_size: 3
        classifier_context_budget_chars: 4000
        enable_context_window_escalation: true
        classifier_context_include_assistant_turns: true
      complexity_router_default_model: cc-medium
    model_info:
      id: 579b7a9b-7318-4921-bcd9-b1dec0b41152

  # CLIProxy 経由のモデル。Hermes の自動追加(llm-models-autosync)が実際に呼べたものを登録し、
  # この一覧は litellm_inventory_export.py で LiteLLM の現在の状態から書き出す。
  # 公開名は 1 モデル 1 つ(-latest や日付を付けない)。同じモデルを複数の契約先で使える時は同じ名前に
  # 経路を並べ、order の小さい方を先に使う(codex > devin、DeepSeek は OpenCode Go > Mistral > devin)。
  # LiteLLM が先頭の mistral/ を除去しても CLIProxy の接頭辞を残すため、mistral/mistral/ と二重に付ける。

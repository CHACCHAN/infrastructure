# Cloudflare DDNS UI VMのProxmox VMプロファイル。軽量な更新処理向けの旧リソース値を維持する。
---
pve_storage: local-lvm
pve_vm_cores: 2
pve_vm_cpu_type: x86-64-v2-AES
pve_vm_memory: 512
pve_vm_disk_size: 8
pve_ssh_user: ddns
pve_ssh_pubkey_file: ~/.ssh/id_ed25519_cloudflare_ddns_ui.pub
pve_ssh_prikey: ~/.ssh/id_ed25519_cloudflare_ddns_ui

# --- Cloudflare DDNS UIの設定 ---
cloudflare_ddns_ui_records:
  - auth.cc-chacchan.com
  - wg.cc-chacchan.com
cloudflare_ddns_ui_zone_domain: cc-chacchan.com

# Cloudflare DDNS UI VMの役割プロファイル。
---
# --- ① VMプロファイル(pveドメインが使う) ---
pve_storage: local-lvm
pve_vm_cores: 2
pve_vm_memory: 512
pve_vm_disk_size: 8

# --- ② SSH接続(cloud-initが作るユーザーと鍵) ---
pve_ssh_user: ddns
pve_ssh_pubkey_file: ~/.ssh/id_ed25519_cloudflare_ddns_ui.pub
pve_ssh_prikey_file: ~/.ssh/id_ed25519_cloudflare_ddns_ui

# --- ③ サービス設定(vm_ddnsロールが使う) ---
# WireGuardの接続先(wg_easy_init_host)がこのapexなので、WAN IPの変動に追従させる。
# 他のホスト名はCloudflare Tunnel経由かLAN内限定のため、Aレコードの追従は不要。
cloudflare_ddns_ui_records:
  - cc-chacchan.com
cloudflare_ddns_ui_zone_domain: cc-chacchan.com

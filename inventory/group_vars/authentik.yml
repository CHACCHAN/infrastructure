# Authentik のサービス設定・OIDC クライアント・SAML のアプリケーション・認証プロキシの宣言。
---
authentik_host: "auth.{{ lab_domain }}"

authentik_values:
  global:
    affinity:
      nodeAffinity:
        type: soft
        matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values: "{{ heavy_workload_nodes }}"

authentik_oidc_clients:
  - name: OpenWebUI
    slug: openwebui
    redirect_uris:
      - https://{{ openwebui_host }}/oauth/oidc/callback
  - name: Nextcloud
    slug: nextcloud
    redirect_uris:
      - https://{{ nextcloud_host }}/apps/user_oidc/code
      - https://{{ nextcloud_host }}/index.php/apps/user_oidc/code
  - name: LiteLLM
    slug: litellm
    redirect_uris:
      - https://{{ litellm_host }}/sso/callback
  - name: Hermes
    slug: hermes
    redirect_uris: []
    redirect_uri_regex: ^https://{{ hermes_host | regex_escape }}/.*$
  # hermes-security・hermes-platform は、シークレットを共用しないようにクライアントを分ける
  - name: Hermes Security
    slug: hermes-security
    redirect_uris: []
    redirect_uri_regex: ^https://{{ hermes_security_host | regex_escape }}/.*$
  - name: Hermes Platform
    slug: hermes-platform
    redirect_uris: []
    redirect_uri_regex: ^https://{{ hermes_platform_host | regex_escape }}/.*$
  - name: OPNsense
    slug: opnsense
    redirect_uris:
      - https://{{ opnsense_host }}/api/openidconnect/auth/callback/authentik
  - name: Proxmox
    slug: proxmox
    redirect_uris: []
    redirect_uri_regex: ^https://({{ groups['pve'] | default([]) | map('regex_escape') | join('|') }})\.{{ lab_domain | regex_escape
      }}/?$
  - name: Gravitee AM
    slug: gravitee-am
    redirect_uris:
      - https://{{ gravitee_host }}/auth/apim/login/callback
  - name: Touge
    slug: touge
    redirect_uris:
      - https://touge.{{ lab_domain }}/auth/callback

# SAML でログインするアプリケーション(OIDC を持たないアプリ)
authentik_saml_apps:
  # TrueCommand の SAML はグループに対応しないため、使えるグループを Authentik で絞る。属性の名前は TrueCommand の公式の文書に合わせる
  - name: TrueCommand
    slug: truecommand
    acs_url: https://{{ truecommand_host }}/saml/acs
    # TrueCommand の SP のメタデータ(/saml/metadata)の entityID
    audience: truecommand-saml
    access_groups:
      - admins
      - services
    attributes:
      unique_name: username
      display_name: name
      email: email

# 認証プロキシで守る画面を使えるグループ。services は Hermes Agent(HermesAgent)が自動で管理するためのグループ
authentik_proxy_access_groups:
  - admins
  - services

authentik_proxy_apps:
  - name: Longhorn
    slug: longhorn
    host: '{{ longhorn_host }}'
  - name: CLIProxyAPI
    slug: cliproxy
    host: '{{ cliproxy_host }}'
  - name: Gravitee AM Admin
    slug: gravitee-am-admin
    host: '{{ gravitee_am_host }}'
  - name: Gravitee Console
    slug: gravitee-console
    host: '{{ gravitee_console_host }}'

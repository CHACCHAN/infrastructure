# Technitium DNS VMの役割プロファイル。
---
# --- ① VMプロファイル(pveドメインが使う) ---
pve_storage: local-lvm
pve_vm_cores: 2
pve_vm_memory: 1024
pve_vm_disk_size: 16

# --- ② SSH接続(cloud-initが作るユーザーと鍵) ---
pve_ssh_user: technitium
pve_ssh_pubkey_file: ~/.ssh/id_ed25519_technitium_dns.pub
pve_ssh_prikey_file: ~/.ssh/id_ed25519_technitium_dns

# --- ③ サービス設定(vm_technitiumロールが使う) ---
# DNS-over-HTTP(8053)をTraefikの doh. 経路へ公開する(Technitium側でDoHを有効にしておく)
technitium_extra_ports:
  - {port: 8053, proto: tcp}

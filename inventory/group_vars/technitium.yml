# Technitium DNS VMのProxmox VMプロファイル。DNS用途の旧リソース値を維持する。
---
pve_storage: local-lvm
pve_vm_cores: 2
pve_vm_cpu_type: x86-64-v2-AES
pve_vm_memory: 1024
pve_vm_disk_size: 16
pve_ssh_user: technitium
pve_ssh_pubkey_file: ~/.ssh/id_ed25519_technitium_dns.pub
pve_ssh_prikey: ~/.ssh/id_ed25519_technitium_dns

# Kubernetesアプリの共通設定と、適用順を含む宣言登録簿。
---
k8s_domain: cc-chacchan.com
k8s_tls_secret: cc-chacchan-wildcard-tls
# deploy.ymlのpreflightが照合する接続先(k3s APIサーバー=k3s-master01の占有網IP)。
# kubeconfigの取り違えによる別クラスタへの適用を防ぐ
k8s_api_server: https://10.10.20.11:6443

k8s_apps:
  - namespaces
  # ghcr.ioのpull資格情報を全Namespaceへ配る。ghcr.io由来のイメージを使う
  # アプリより前に置くこと(後段のPodがImagePullBackOffにならないように)
  - kubernetes_replicator
  - cert_manager
  - certificates
  - nfs_provisioner
  - postgresql
  - external
  - cloudflared
  - guacamole
  - awx
  - homarr
  - pgadmin
  - nextcloud
  - open_webui

k8s_namespaces_list:
  - cert-manager
  - cloudflare
  - platform
  - sandbox
  - storage

# Traefikが外部HTTPSバックエンドへ接続する際のTLS設定。
k8s_external_transports:
  - name: proxmox-transport
    label_name: proxmox
    insecure_skip_verify: true
  - name: truenas-transport
    label_name: truenas
    server_name: "nas.{{ k8s_domain }}"
    insecure_skip_verify: true

# selectorless ServiceとEndpointSlice、および公開Ingressの宣言。
k8s_external_routes:
  - name: authentik
    backend_ip: 172.16.11.2
    scheme: http
    ports: [{ name: http, port: 9000 }]
    forward_auth: true
    ingresses:
      - name: authentik
        host: "auth.{{ k8s_domain }}"
        port: http
        entrypoints: "web,websecure"
        forwarded_https: true

  - name: cloudflare-ddns-ui
    backend_ip: 172.16.11.4
    scheme: http
    ports: [{ name: http, port: 8080 }]
    ingresses:
      - name: cloudflare-ddns-ui
        host: "ddns.{{ k8s_domain }}"
        port: http
        middlewares: [authentik-forward-auth]
      - name: cloudflare-ddns-ui-authentik-outpost
        host: "ddns.{{ k8s_domain }}"
        port: http
        path: /outpost.goauthentik.io
        backend_service: authentik-external
        forwarded_https: true

  - name: coolify
    backend_ip: 172.16.11.6
    scheme: http
    # すべて内蔵プロキシ(:80)へHostヘッダ付きで渡す。UI(:8000)を直接経由しないのは、
    # リアルタイム通知/Webターミナル(6001/6002)を内蔵プロキシが集約するため
    # (Coolify側の設定: Instance Domain / Wildcard Domain。docs/vm/coolify.md)
    ports: [{ name: http, port: 80 }]
    ingresses:
      # 管理UI(LAN内限定)。X-Forwarded-Proto: https が無いとログインが壊れるため必須
      - name: coolify
        host: "coolify.{{ k8s_domain }}"
        port: http
        forwarded_https: true
      # デプロイしたアプリの公開用ワイルドカード。Cloudflare Tunnel(HTTP :80)からも
      # 到達できるようentrypointsへwebを含める(公開の可否はCloudflare側の経路表で決まる)
      - name: coolify-apps
        host: "*.web.{{ k8s_domain }}"
        port: http
        entrypoints: "web,websecure"
        forwarded_https: true

  - name: hermes
    backend_ip: 172.16.11.31
    scheme: http
    # Hermes Agentのweb dashboard(管理UI + ブラウザ内チャット)。TLS終端はここ
    # (メインクラスタのTraefik)で完結し、VMの:9119へHTTPで転送する。チャットは
    # WebSocket(/api/ws・/api/pty)だがTraefikがUpgradeをそのまま通すため追加設定は不要
    # (VM側のpublic_url・trusted_proxiesはvm_hermesロールが設定する。docs/vm/hermes.md)
    ports: [{ name: http, port: 9119 }]
    ingresses:
      # 管理UI(LAN内限定)。X-Forwarded-Proto: https が無いと、Cookieのsecure属性と
      # OAuthコールバックの組み立てが実際の公開URLとずれる
      - name: hermes
        host: "hermes.{{ k8s_domain }}"
        port: http
        forwarded_https: true

  - name: portainer
    backend_ip: 172.16.11.9
    scheme: http
    # Portainer VM(Docker単体運用)のWeb UI。--http-enabled のHTTP待受(:9000)へ転送する。
    # TLS終端はここ(メインクラスタのTraefik)で完結する(docs/vm/portainer.md)
    ports: [{ name: http, port: 9000 }]
    ingresses:
      - name: portainer
        host: "portainer.{{ k8s_domain }}"
        port: http
        forwarded_https: true

  - name: rancher
    backend_ip: 172.16.11.8
    scheme: http
    # Rancher VM(単体k3s・Traefik無効)のServiceLBが:80で受ける。TLS終端はここ
    # (メインクラスタのTraefik)で完結し、Rancher側は tls=external で
    # X-Forwarded-Proto: https を信頼する(docs/vm/rancher.md)
    ports: [{ name: http, port: 80 }]
    ingresses:
      - name: rancher
        host: "rancher.{{ k8s_domain }}"
        port: http
        forwarded_https: true

  - name: technitium-dns
    backend_ip: 172.16.11.3
    scheme: http
    ports: [{ name: doh, port: 8053 }, { name: web, port: 5380 }]
    ingresses:
      - name: technitium-dns-web
        host: "dns.{{ k8s_domain }}"
        port: web
        forwarded_https: true
      - name: technitium-dns-doh
        host: "doh.{{ k8s_domain }}"
        port: doh

  - name: truenas
    backend_ip: 172.16.11.10
    scheme: https
    transport: truenas-transport
    ports: [{ name: https, port: 443 }]
    ingresses: [{ name: truenas, host: "nas.{{ k8s_domain }}", port: https }]

  - name: wg-easy
    backend_ip: 172.16.11.5
    scheme: http
    ports: [{ name: http, port: 51821 }]
    ingresses:
      - name: wg-easy
        host: "wgui.{{ k8s_domain }}"
        port: http
        forwarded_https: true

  - name: pbs
    backend_ip: 172.16.11.7
    scheme: https
    transport: proxmox-transport
    ports: [{ name: https, port: 8007 }]
    ingresses: [{ name: pbs, host: "pbs.{{ k8s_domain }}", port: https }]

  - name: pve01

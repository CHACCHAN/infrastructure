# Kubernetesアプリの共通設定と、適用順を含む宣言登録簿。
---
k8s_domain: cc-chacchan.com
k8s_tls_secret: cc-chacchan-wildcard-tls
# ACMEアカウントとアプリの管理者連絡先に使うメールアドレス
k8s_admin_email: chacchan.info@gmail.com
# deploy.ymlのpreflightが照合する接続先(k3s APIサーバー=k3s-master01の占有網IP)。
# kubeconfigの取り違えによる別クラスタへの適用を防ぐ
k8s_api_server: https://10.10.20.11:6443
# helm template に渡す対象クラスタのKubernetesマイナーバージョン(描画結果を
# helmバイナリの想定から切り離す)。inventory/group_vars/k8s.yml の
# kubernetes_version と歩調を合わせる
k8s_kube_version: "1.36"

k8s_apps:
  - namespaces
  # ghcr.ioのpull資格情報を全Namespaceへ配る。ghcr.io由来のイメージを使う
  # アプリより前に置くこと(後段のPodがImagePullBackOffにならないように)
  - kubernetes_replicator
  - cert_manager
  - certificates
  - nfs_provisioner
  - postgresql
  - external
  - cloudflared
  - guacamole
  - awx
  - homarr
  - pgadmin
  - nextcloud
  - open_webui

k8s_namespaces_list:
  - cert-manager
  - cloudflare
  - platform
  - sandbox
  - storage

# Traefikが外部HTTPSバックエンドへ接続する際のTLS設定。
k8s_external_transports:
  - name: proxmox-transport
    label_name: proxmox
    insecure_skip_verify: true
  - name: truenas-transport
    label_name: truenas
    server_name: "nas.{{ k8s_domain }}"
    insecure_skip_verify: true

# selectorless ServiceとEndpointSlice、および公開Ingressの宣言。
k8s_external_routes:
  - name: authentik
    backend_ip: 172.16.11.2
    scheme: http
    ports: [{ name: http, port: 9000 }]
    forward_auth: true
    ingresses:
      - name: authentik
        host: "auth.{{ k8s_domain }}"
        port: http
        entrypoints: "web,websecure"
        forwarded_https: true

  - name: cloudflare-ddns-ui
    backend_ip: 172.16.11.4
    scheme: http
    ports: [{ name: http, port: 8080 }]
    ingresses:
      - name: cloudflare-ddns-ui
        host: "ddns.{{ k8s_domain }}"
        port: http
        middlewares: [authentik-forward-auth]
      - name: cloudflare-ddns-ui-authentik-outpost
        host: "ddns.{{ k8s_domain }}"
        port: http
        path: /outpost.goauthentik.io
        backend_service: authentik-external
        forwarded_https: true

  - name: coolify
    backend_ip: 172.16.11.6
    scheme: http
    # 内蔵プロキシ(:80)がUI・通知・Webターミナルを集約するため、UI(:8000)へは直接転送しない(docs/vm/coolify.md)
    ports: [{ name: http, port: 80 }]
    ingresses:
      # 管理UI(LAN内限定)。forwarded_https が無いとログインが壊れる
      - name: coolify
        host: "coolify.{{ k8s_domain }}"
        port: http
        forwarded_https: true
      # デプロイしたアプリの公開用。entrypoint web はCloudflare Tunnel(HTTP :80)からの到達用
      - name: coolify-apps
        host: "*.web.{{ k8s_domain }}"
        port: http
        entrypoints: "web,websecure"
        forwarded_https: true

  - name: hermes
    backend_ip: 172.16.11.31
    scheme: http
    # Hermes Agentのweb dashboard(:9119)とLINE webhook(:8646)。TLS終端はメインクラスタのTraefik(docs/vm/hermes.md)
    ports:
      - { name: http, port: 9119 }
      - { name: line, port: 8646 }
    ingresses:
      # 管理UI。Cloudflare Tunnel(entrypoint web)とLAN(websecure)の両方から到達する。
      # forwarded_https が無いとCookieのsecure属性とOAuthコールバックURLが公開URLとずれる
      - name: hermes
        host: "hermes.{{ k8s_domain }}"
        port: http
        entrypoints: "web,websecure"
        forwarded_https: true
      # LINE webhook(/line/*)。宅外のLINEサーバーから来るため管理UIと同じく web も許可する
      - name: hermes-line
        host: "hermes.{{ k8s_domain }}"
        path: /line
        port: line
        entrypoints: "web,websecure"

  - name: portainer
    backend_ip: 172.16.11.9
    scheme: http
    # Portainer VMのHTTP待受(:9000)。TLS終端はメインクラスタのTraefik(docs/vm/portainer.md)
    ports: [{ name: http, port: 9000 }]
    ingresses:
      - name: portainer
        host: "portainer.{{ k8s_domain }}"
        port: http
        forwarded_https: true

  - name: rancher
    backend_ip: 172.16.11.8
    scheme: http
    # Rancher VMのServiceLB(:80)。TLS終端はメインクラスタのTraefikで、Rancher側は tls=external(docs/vm/rancher.md)
    ports: [{ name: http, port: 80 }]
    ingresses:
      - name: rancher
        host: "rancher.{{ k8s_domain }}"
        port: http
        forwarded_https: true

  - name: technitium-dns
    backend_ip: 172.16.11.3
    scheme: http
    ports: [{ name: doh, port: 8053 }, { name: web, port: 5380 }]
    ingresses:
      - name: technitium-dns-web
        host: "dns.{{ k8s_domain }}"
        port: web
        forwarded_https: true
      - name: technitium-dns-doh
        host: "doh.{{ k8s_domain }}"
        port: doh

  - name: truenas
    backend_ip: 172.16.11.10
    scheme: https
    transport: truenas-transport
    ports: [{ name: https, port: 443 }]
    ingresses: [{ name: truenas, host: "nas.{{ k8s_domain }}", port: https }]

  - name: wg-easy
    backend_ip: 172.16.11.5
    scheme: http
    ports: [{ name: http, port: 51821 }]
    ingresses:
      - name: wg-easy
        host: "wgui.{{ k8s_domain }}"
        port: http
        forwarded_https: true

  - name: pbs
    backend_ip: 172.16.11.7
    scheme: https
    transport: proxmox-transport
    ports: [{ name: https, port: 8007 }]
    ingresses: [{ name: pbs, host: "pbs.{{ k8s_domain }}", port: https }]

  - name: pve01

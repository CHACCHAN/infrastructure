# lab環境のProxmox VMに共通するベース値。役割プロファイルには差分だけを書く。
---
pve_storage: ssd01
pve_bridge: vmbr0

# 旧インベントリはDNSを明示せずPVEホストの設定を継承していたため、pve_nameserverは未指定にする。
pve_ipv4_prefix: 24
pve_ipv4_gw: 172.16.11.1

# playbooks/pve/adhoc.yml が「プロジェクトのインベントリを読めているか」を判定する目印。
# この変数はここ以外で定義しない(手動インベントリや変数指定では渡さないこと)。
# pve_storage等の実変数で判定すると、AWXの手動インベントリ運用(値をextra varsで渡す)
# を誤ってプロジェクト由来と判定してしまうため、専用の変数を置いている。
pve_project_inventory: true

# --- SSH鍵の渡しかた ---
# 基本は役割プロファイルでファイルパス(pve_ssh_pubkey_file / pve_ssh_prikey_file)を宣言する。
# AWXのSurveyのように本文しか渡せない経路では、代わりに pve_ssh_pubkey_value /
# pve_ssh_prikey_value へ鍵本文をそのまま入れる(本文があればファイルより優先される)。
# 秘密鍵はSSHがファイルしか受け付けないため、playbooks/vm/ssh_key.yml が実行時に
# 0600の一時ファイルへ書き出す。鍵の内容から名前を決めるため他の実行と衝突しない。
pve_ssh_prikey_tmpfile: >-
  {{ lookup('ansible.builtin.env', 'HOME') | default('/tmp', true) }}/.ansible/pve_ssh_keys/{{
    pve_ssh_prikey_value | default('') | trim | hash('sha1') }}
pve_ssh_prikey_resolved: >-
  {{ pve_ssh_prikey_tmpfile
     if pve_ssh_prikey_value | default('') | trim | length > 0
     else pve_ssh_prikey_file }}

# 全役割で同一だったVM設定をベースに集約する。
pve_vm_bios: seabios
pve_vm_machine: q35
pve_vm_vga: std
pve_vm_disk_ssd: 1
pve_vm_disk_iothread: 1
pve_vm_disk_discard: "on"
pve_vm_agent: 1
pve_vm_onboot: 1

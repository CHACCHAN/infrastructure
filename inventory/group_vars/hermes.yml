# Hermes Agent の VM に共通する値(ロールの既定値との差分)。サイズの既定は、ブラウザ(Chromium)を使う組織に合わせる(docs/design/hermes.md)
---
# Debian の cloud イメージが作る、sudo できる既定のユーザー
ansible_user: debian
# ZRAM の swap を使う(メモリに対する割合。%)
vm_zram_percent: 50
# VM の中で KVM を使う(入れ子の仮想化)ため、ホストの CPU をそのまま渡す。ほかの CPU のノードへは移せない
pve_vm_cpu: host
pve_vm_cores: 4
pve_vm_memory: 2048
pve_vm_disk_size: 64
pve_vm_storage: ssd03
# hermes に SSH で入れる公開鍵。Hermes の設計のエージェント専用の鍵。debian(sudo)には登録しない(docs/design/hermes.md)
hermes_ssh_pubkeys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIImF+7Qwm0K0WgAydANQU3GRLfFiNhFaHHHLQi0dBa0c hermes-design
# docker は Hermes の隔離環境、kvm は VM の中の KVM(/dev/kvm)を使うため
hermes_groups:
  - docker
  - kvm

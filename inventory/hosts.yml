# lab環境のVM宣言。グループ=役割、1VM=vmid / node / ansible_host(+個体差)。
# ホスト名は役割グループ名と別にする(同名だとAnsibleが警告する)。
# PVE上のVM名をホスト名と別にする場合は pve_vm_name で指定する。
---
lab:
  children:
    k8s:
      hosts:
        # cores/memory/disk はノードの実ハードウェアに合わせた個体値
        k3s-master01:
          k3s_role: server
          vmid: 202
          node: pve02
          ansible_host: 172.16.12.11
          cluster_ip: 10.10.20.11/24
          pve_vm_cores: 4
          pve_vm_memory: 4096
          pve_vm_disk_size: 32
        k3s-worker01:
          k3s_role: agent
          vmid: 301
          node: pve03
          ansible_host: 172.16.12.15
          cluster_ip: 10.10.20.15/24
          pve_vm_cores: 16
          pve_vm_memory: 12288
        k3s-worker02:
          k3s_role: agent
          vmid: 401
          node: pve04
          ansible_host: 172.16.12.16
          cluster_ip: 10.10.20.16/24
          pve_vm_cores: 12
          pve_vm_memory: 16384
        k3s-worker03:
          k3s_role: agent
          vmid: 102
          node: pve01
          ansible_host: 172.16.12.17
          cluster_ip: 10.10.20.17/24
          pve_vm_cores: 12
          pve_vm_memory: 4096
        k3s-worker04:
          k3s_role: agent
          vmid: 701
          node: pve07
          ansible_host: 172.16.12.18
          cluster_ip: 10.10.20.18/24
    dev:
      hosts:
        yuya-dev:
          vmid: 702
          node: pve07
          ansible_host: 172.16.11.21
          pve_vm_memory: 16384
          # 2枚目NICはk8s占有網への足(IPはVM内で手動管理のためcluster_ipは宣言しない)
          pve_vm_nets:
            - bridge: vmbr0
            - bridge: vmbr3
        shun-dev:
          vmid: 201
          node: pve02
          ansible_host: 172.16.11.22
    authentik:
      hosts:
        authentik01:
          vmid: 502
          node: pve05
          ansible_host: 172.16.11.2
          pve_vm_name: authentik
    coolify:
      hosts:
        coolify01:
          vmid: 402
          node: pve04
          ansible_host: 172.16.11.6
          pve_vm_name: coolify
    rancher:
      hosts:
        rancher01:
          vmid: 601
          node: pve06
          ansible_host: 172.16.11.8
          pve_vm_name: rancher
    portainer:
      hosts:
        portainer01:
          vmid: 801
          node: pve08
          ansible_host: 172.16.11.9
          pve_vm_name: portainer
    hermes:
      hosts:
        hermes01:
          vmid: 901
          node: pve09
          ansible_host: 172.16.11.31
          pve_vm_name: hermes
    wg_easy:
      hosts:
        wg-easy:
          vmid: 501
          node: pve05
          ansible_host: 172.16.11.5
    technitium:
      hosts:
        technitium-dns:
          vmid: 503
          node: pve05
          ansible_host: 172.16.11.3
    ddns:
      hosts:
        cloudflare-ddns-ui:
          vmid: 504
          node: pve05
          ansible_host: 172.16.11.4
    pbs:
      hosts:
        proxmox-backup-server:
          vmid: 101
          node: pve01
          ansible_host: 172.16.11.7
          # nic1(vmbr1、PVE↔PBS占有回線)に付けるIP。バックアップ通信をこちらに流す
          cluster_ip: 10.10.10.7/24

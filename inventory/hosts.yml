# lab環境の新しい宣言的VMインベントリ。旧サービス用インベントリとの混在を避けるためlab配下に束ねる。
---
lab:
  children:
    k8s:
      hosts:
        # cores/memory/diskはノードの実ハードウェアに合わせた個体値(プロファイルの既定は8/8192/128)
        k3s-master01:
          vmid: 202
          node: pve02
          ansible_host: 172.16.12.11
          cluster_ip: 10.10.20.11/24
          pve_vm_cores: 4
          pve_vm_memory: 4096
          pve_vm_disk_size: 32
        k3s-worker01:
          vmid: 301
          node: pve03
          ansible_host: 172.16.12.15
          cluster_ip: 10.10.20.15/24
          pve_vm_cores: 16
          pve_vm_memory: 12288
        k3s-worker02:
          vmid: 401
          node: pve04
          ansible_host: 172.16.12.16
          cluster_ip: 10.10.20.16/24
          pve_vm_cores: 12
          pve_vm_memory: 16384
        k3s-worker03:
          vmid: 102
          node: pve01
          ansible_host: 172.16.12.17
          cluster_ip: 10.10.20.17/24
          pve_vm_cores: 12
          pve_vm_memory: 4096
        k3s-worker04:
          vmid: 701
          node: pve07
          ansible_host: 172.16.12.18
          cluster_ip: 10.10.20.18/24
    dev:
      hosts:
        # N8検証に使った一時VM(停止済み)。削除したらこのブロックごと消す:
        #   ansible-playbook playbooks/pve/destroy.yml -e vmid=992 -e confirm=992
        dev-migration:
          vmid: 992
          node: pve01
          ansible_host: 172.16.11.99
          pve_vm_memory: 2048
          pve_vm_disk_size: 24
          pve_ssh_pubkey_file: ~/.ssh/id_ed25519_migration_test.pub
          pve_ssh_prikey: ~/.ssh/id_ed25519_migration_test
        yuya-dev:
          vmid: 702
          node: pve07
          ansible_host: 172.16.11.21
          pve_vm_memory: 16384
          # 2枚目NICはk8s占有網への足(IPはVM内で手動管理のためcluster_ipは宣言しない)
          pve_vm_nets:
            - bridge: vmbr0
            - bridge: vmbr3
        shun-dev:
          vmid: 201
          node: pve02
          ansible_host: 172.16.11.22
    authentik:
      hosts:
        # グループ名(役割)とホスト名(個体)の同名衝突を避けるため01連番にする。
        # PVE上の既存VM名は変えない(pve_vm_nameで固定)
        authentik01:
          vmid: 502
          node: pve05
          ansible_host: 172.16.11.2
          pve_vm_name: authentik
    supabase:
      hosts:
        supabase01:
          vmid: 402
          node: pve04
          ansible_host: 172.16.11.6
          pve_vm_name: supabase
    wg_easy:
      hosts:
        wg-easy:
          vmid: 501
          node: pve05
          ansible_host: 172.16.11.5
    technitium:
      hosts:
        technitium-dns:
          vmid: 503
          node: pve05
          ansible_host: 172.16.11.3
    ddns:
      hosts:
        cloudflare-ddns-ui:
          vmid: 504
          node: pve05
          ansible_host: 172.16.11.4
    pbs:
      hosts:
        proxmox-backup-server:
          vmid: 101
          node: pve01
          ansible_host: 172.16.11.7
          # nic1(vmbr1、PVE↔PBS占有回線)に付けるIP。バックアップ通信をこちらに流す
          cluster_ip: 10.10.10.7/24
    test:
      hosts:
        # 移行検証に使った旧方式のVM。役目は終えており、削除したらこのグループごと消す:
        #   ansible-playbook playbooks/pve/destroy.yml -e vmid=990 -e confirm=990
        migration-test:
          vmid: 990
          node: pve01
          ansible_host: 172.16.19.90

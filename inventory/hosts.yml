          vmid: 501
          node: pve05
          ansible_host: 172.16.11.5
    technitium:
      hosts:
        technitium-dns:
          vmid: 503
          node: pve05
          ansible_host: 172.16.11.3
    ddns:
      hosts:
        cloudflare-ddns-ui:
          vmid: 504
          node: pve05
          ansible_host: 172.16.11.4
    pbs:
      hosts:
        proxmox-backup-server:
          vmid: 101
          node: pve01
          ansible_host: 172.16.11.7
          # nic1(vmbr1、PVE↔PBS占有回線)に付けるIP。バックアップ通信をこちらに流す
          cluster_ip: 10.10.10.7/24
    test:
      hosts:
        migration-test:
          vmid: 990
          node: pve01
          # TODO: N1以降の実機検証前に、未使用の固定IPであることを確認する。
          ansible_host: 172.16.19.90
